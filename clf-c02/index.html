運算延伸到電信商 5G 邊緣網路，跟 AWS 自己的全球邊緣節點是不同概念；E 的 VPC 是區域內的網路環境，不使用邊緣節點。"}, {"id": 322, "question": "某使用者需要一個關聯式資料庫，但沒有資源可以管理硬體、恢復力與複寫。\n哪一種 AWS 服務選項可以滿足這位使用者的需求？", "options": {"A": "在 Amazon Elastic Container Service（Amazon ECS）上執行 MySQL。", "B": "在 Amazon EC2 上執行 MySQL。", "C": "選擇 Amazon RDS for MySQL。", "D": "選擇 Amazon ElastiCache for Redis。"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon RDS for MySQL 是全託管的關聯式資料庫服務，硬體、恢復力、複寫這些都由 AWS 負責處理，使用者不需要自己管理。A、B 都要自己在運算資源上安裝維護 MySQL，管理負擔重；D 的 ElastiCache for Redis 是記憶體內快取服務，不是關聯式資料庫。"}, {"id": 323, "question": "一家公司需要盡快在 AWS 雲端部署應用程式，同時想把管理 AWS 資源的複雜度降到最低。\n公司應該用哪一種 AWS 服務滿足這些需求？", "options": {"A": "AWS Config", "B": "AWS Elastic Beanstalk", "C": "Amazon EC2", "D": "Amazon Personalize"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Elastic Beanstalk 讓開發者只要上傳程式碼，其餘的容量佈建、負載平衡、擴縮、健康監控都自動處理，正好對應「快速部署、降低管理複雜度」的需求。（提醒：ExamTopics 網站標記的正解是 D／Amazon Personalize，但那是推薦系統的機器學習服務，跟「部署應用程式」完全無關，這裡以 B 為準，明顯是標記錯誤。）A 的 Config 是設定追蹤服務；C 的 EC2 需要自己管理更多底層細節，管理複雜度比 Elastic Beanstalk 高。"}, {"id": 324, "question": "哪一種機制，能讓開發者從應用程式的程式碼中存取 AWS 服務？", "options": {"A": "AWS 軟體開發套件（AWS Software Development Kit, SDK）", "B": "AWS Management Console", "C": "AWS CodePipeline", "D": "AWS Config"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS SDK 提供各種程式語言的函式庫，讓開發者可以直接在程式碼裡呼叫 AWS 服務的 API，是應用程式整合 AWS 服務的標準做法。B 的 Management Console 是給人操作的網頁介面，不是寫在程式碼裡呼叫的；C 的 CodePipeline 是 CI/CD 流程服務；D 的 Config 是設定追蹤服務，都不是程式碼存取 AWS 服務的機制。"}, {"id": 325, "question": "一家公司正在遷移到 AWS 雲端，想了解並找出潛在的資安組態設定錯誤或非預期行為，並排定優先順序評估自己需要哪些防護措施。\n哪一項 AWS 雲端採用框架（AWS CAF）「安全」觀點的能力可以滿足這些需求？", "options": {"A": "身分與存取管理", "B": "威脅偵測（Threat detection）", "C": "平台工程", "D": "可用性與持續營運管理"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS CAF 官方文件對「威脅偵測（Threat Detection）」能力的定義，就是「了解並找出潛在的資安組態設定錯誤、威脅或非預期行為」，跟題目描述逐字對應。A 的身分與存取管理是管權限的；C 的平台工程是技術架構相關；D 的可用性與持續營運管理著重的是系統的持續運作，都不是題目描述的重點。"}, {"id": 326, "question": "一家公司想在 AWS 與自己的企業網路之間，建立一條私有的網路連線。\n哪一種 AWS 服務或功能可以滿足這個需求？", "options": {"A": "Amazon Connect", "B": "Amazon Route 53", "C": "AWS Direct Connect", "D": "VPC 對等互連（VPC peering）"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Direct Connect 就是設計來在客戶的企業網路跟 AWS 之間，建立一條專屬的私有網路連線，繞過公開網際網路，提供更穩定的頻寬與延遲。（提醒：ExamTopics 網站標記的正解是 A／Amazon Connect，但那是雲端客服中心服務，跟建立私有網路連線完全無關，這裡以 C 為準，明顯是標記錯誤。）B 的 Route 53 是 DNS 服務；D 的 VPC peering 是連接兩個 VPC 用的，不是連接地端網路跟 AWS 的。"}, {"id": 327, "question": "哪些 AWS 服務或功能，能讓使用者在兩個 VPC 之間建立網路連線？（選擇兩個。）", "options": {"A": "VPC 端點（VPC endpoints）", "B": "Amazon Route 53", "C": "VPC 對等互連（VPC peering）", "D": "AWS Direct Connect", "E": "AWS Transit Gateway"}, "correct_answer": "CE", "explanation": "正確答案是 C、E。VPC 對等互連（VPC Peering）跟 AWS Transit Gateway 都是官方標準的「VPC 對 VPC」連線機制：Peering 適合點對點少量連線，Transit Gateway 適合大量 VPC 集中管理連線。（提醒：ExamTopics 網站標記的正解是 D、E，但 Direct Connect 是連接「地端網路」跟 AWS 的服務，不是拿來連接兩個 VPC 的標準做法，這裡以 C、E 為準，社群留言也一致同意。）A 的 VPC 端點是讓 VPC 內資源私下存取 AWS 服務（如 S3）用的，不是 VPC 對 VPC 連線；B 的 Route 53 是 DNS 服務。"}, {"id": 328, "question": "哪一種 AWS 服務可以把文字轉換成逼真的語音？", "options": {"A": "Amazon Transcribe", "B": "Amazon Rekognition", "C": "Amazon Polly", "D": "Amazon Textract"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon Polly 就是 AWS 的文字轉語音（text-to-speech）服務，能把文字轉換成聽起來自然逼真的語音。（提醒：ExamTopics 網站標記的正解是 A／Transcribe，但 Transcribe 做的是「語音轉文字」，方向剛好相反，這裡以 C 為準，明顯是標記錯誤。）B 的 Rekognition 是影像辨識服務；D 的 Textract 是從文件影像擷取文字的服務，都跟「文字轉語音」無關。"}, {"id": 329, "question": "一家公司想用應用程式堆疊（application stacks）在 AWS 雲端執行工作負載，並想用預先設定好的執行個體。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "Amazon Lightsail", "B": "Amazon Athena", "C": "AWS Outposts", "D": "Amazon EC2"}, "correct_answer": "A", "explanation": "正確答案是 A。Amazon Lightsail 提供多種預先配置好的應用程式堆疊範本（Blueprint，如 WordPress、LAMP 等），選好範本就能直接啟動預先設定好的執行個體，設計理念就是簡化部署。（提醒：ExamTopics 網站標記的正解是 B／Athena，但 Athena 是查詢服務，跟「應用程式堆疊、預先配置執行個體」完全無關，這裡以 A 為準，明顯是標記錯誤。）C 的 Outposts 是把 AWS 服務延伸到地端機房；D 的一般 EC2 執行個體需要自己安裝設定應用程式堆疊，不是「預先配置」的。"}, {"id": 330, "question": "哪些 AWS 服務有支援 Savings Plans？（選擇兩個。）", "options": {"A": "Amazon EC2", "B": "Amazon RDS", "C": "Amazon SageMaker", "D": "Amazon Redshift", "E": "Amazon DynamoDB"}, "correct_answer": "AC", "explanation": "正確答案是 A、C。AWS 官方提供三種 Savings Plans：Compute Savings Plans、EC2 Instance Savings Plans、Amazon SageMaker Savings Plans，涵蓋的服務就是 EC2 跟 SageMaker。（提醒：ExamTopics 網站標記的正解是 D、A，但 D 的 Redshift 走的是自己的 Reserved Nodes 定價方案，不在 Savings Plans 的支援範圍內，這裡以 A、C 為準，社群留言也一致引用官方文件佐證。）B 的 RDS、E 的 DynamoDB 都有各自的預留容量/預留執行個體定價方案，但不屬於 Savings Plans 體系。"}, {"id": 331, "question": "哪一種 AWS 服務或工具，可以免費提供 Amazon EC2 資源的資源調整（rightsizing）建議？", "options": {"A": "AWS Well-Architected Tool", "B": "Amazon CloudWatch", "C": "AWS Cost Explorer", "D": "Amazon S3 analytics"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Cost Explorer 內建「Rightsizing Recommendations」功能，會分析你的 EC2 使用狀況，免費提供資源調整建議，官方文件也明確這樣定位。（提醒：ExamTopics 網站標記的正解是 B／CloudWatch，但 CloudWatch 只提供原始監控指標，不會主動給出「調整規格」的具體建議，這裡以 C 為準，社群留言也一致引用官方文件佐證。）A 的 Well-Architected Tool 是架構自評工具；D 的 S3 analytics 是分析 S3 儲存使用模式的功能，都不是 EC2 資源調整建議工具。"}, {"id": 332, "question": "一家公司經營 PB 等級的資料倉儲來分析資料，公司想要一個不需要手動管理硬體與軟體的解決方案。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "Amazon DocumentDB（相容 MongoDB）", "B": "Amazon Redshift", "C": "Amazon Neptune", "D": "Amazon ElastiCache"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon Redshift 就是 AWS 的資料倉儲服務，能處理 PB 等級的資料分析，其 Serverless 版本更完全不用手動管理底層硬體與軟體。（提醒：ExamTopics 網站標記的正解是 C／Neptune，但那是圖形資料庫，不是資料倉儲服務，這裡以 B 為準，明顯是標記錯誤。）A 的 DocumentDB 是文件型資料庫；D 的 ElastiCache 是記憶體內快取服務，都不是資料倉儲。"}, {"id": 333, "question": "一家圖書館想自動化根據書籍內容，為電子書分類。\n圖書館應該用哪一種 AWS 服務滿足這個需求？", "options": {"A": "Amazon Redshift", "B": "Amazon CloudSearch", "C": "Amazon Comprehend", "D": "Amazon Aurora"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon Comprehend 是 AWS 的自然語言處理（NLP）服務，能分析文字內容並自動做主題分類，正好對應「依內容自動分類電子書」的需求。（提醒：ExamTopics 網站標記的正解是 A／Redshift，但那是資料倉儲服務，不具備文字內容分析與分類的能力，這裡以 C 為準，明顯是標記錯誤。）B 的 CloudSearch 是全文檢索服務；D 的 Aurora 是關聯式資料庫，都不做內容分類分析。"}, {"id": 334, "question": "根據責任共擔模型，以下哪一項工作是 AWS 的責任？", "options": {"A": "應用程式資料的加密", "B": "應用程式使用者的身分驗證", "C": "實體網路基礎設施的保護", "D": "防火牆的組態設定"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS 負責保護自己資料中心的實體基礎設施、硬體、設備與網路裝置，這完全是 AWS 的責任，客戶完全碰不到也不用管。（提醒：ExamTopics 網站標記的正解是 D／防火牆組態設定，但這通常指客戶可自行設定的 Security Groups／NACL，屬於客戶責任，答案不夠明確，這裡以最沒有爭議的 C 為準，社群留言也一致同意。）A 應用程式資料加密、B 應用程式使用者身分驗證，都是客戶自己應用程式層級的責任。"}, {"id": 335, "question": "以下何者是 AWS 雲端採用框架（AWS CAF）雲端轉型旅程的建議階段？（選擇兩個。）", "options": {"A": "願景（Envision）階段", "B": "對齊（Align）階段", "C": "評估（Assess）階段", "D": "動員（Mobilize）階段", "E": "遷移與現代化（Migrate and modernize）階段"}, "correct_answer": "AB", "explanation": "正確答案是 A、B。根據 AWS 官方 CAF 頁面，雲端轉型旅程分為四個階段：願景（Envision）、對齊（Align）、啟動（Launch）、擴展（Scale），選項裡剛好有 A、B 兩個是官方正式階段名稱。（提醒：ExamTopics 網站標記的正解是 B、E，但 E「遷移與現代化」不是官方列出的轉型旅程階段名稱，這裡以 A、B 為準，社群留言也多次引用官方頁面佐證。）C 的評估、D 的動員、E 的遷移與現代化，都不是官方定義的四個轉型旅程階段名稱。"}, {"id": 336, "question": "一家公司想產生一份 IAM 使用者清單，同時想查看跟這些使用者相關的各種憑證狀態，例如密碼、存取金鑰、多重要素驗證（MFA）裝置。\n哪一種 AWS 服務或功能可以滿足這些需求？", "options": {"A": "IAM 憑證報告（IAM credential report）", "B": "AWS IAM Identity Center（AWS Single Sign-On）", "C": "AWS Identity and Access Management Access Analyzer", "D": "AWS 成本與使用報告"}, "correct_answer": "A", "explanation": "正確答案是 A。IAM 憑證報告會列出帳號內所有使用者，以及每個人的密碼、存取金鑰、MFA 啟用狀態等憑證資訊，完全對應題目需求。B 的 IAM Identity Center 是跨帳號單一登入服務；C 的 Access Analyzer 找的是外部共享的資源；D 的成本使用報告是帳務相關，三者都不是產生使用者憑證清單的服務。"}, {"id": 337, "question": "一家公司在設計 AWS 工作負載時，希望元件能定期更新，並且變更能用小規模、可回復的方式進行。\n這種設計對應到 AWS Well-Architected Framework 的哪一個支柱？", "options": {"A": "安全性（Security）", "B": "效能效率（Performance efficiency）", "C": "卓越營運（Operational excellence）", "D": "可靠性（Reliability）"}, "correct_answer": "C", "explanation": "正確答案是 C。「定期更新元件、用小規模且可回復的方式做變更」正是「卓越營運（Operational Excellence）」支柱官方列出的設計原則（Make Frequent, Small, Reversible Changes）。（提醒：ExamTopics 網站標記的正解是 D／可靠性，但這句描述講的是「變更管理的做法」，不是可靠性支柱關注的「故障恢復」，這裡以 C 為準，跟先前 #277 題是同一個知識點。）A 安全性、B 效能效率、D 可靠性都是 WAF 的其他支柱，但都對不上題目描述的重點。"}, {"id": 338, "question": "一家公司想追蹤 Amazon S3 物件的標籤、儲存桶與前綴（prefix）。\n哪一種 S3 功能可以滿足這個需求？", "options": {"A": "S3 清冊報告（S3 Inventory report）", "B": "S3 生命週期（Lifecycle）", "C": "S3 版本控制（Versioning）", "D": "S3 存取控制清單（S3 ACLs）"}, "correct_answer": "A", "explanation": "正確答案是 A。S3 Inventory 會定期產生一份報表，列出儲存桶內物件的清單與中繼資料，包含標籤、所在儲存桶、前綴（prefix）等資訊，正好對應題目需求。（提醒：ExamTopics 網站標記的正解是 D／S3 ACLs，但 ACL 是存取權限控制機制，跟「追蹤標籤、儲存桶、前綴」完全無關，這裡以 A 為準，明顯是標記錯誤。）B 的 Lifecycle 是自動轉移/刪除物件的規則；C 的 Versioning 是版本保留功能，都不是產生物件清冊報表的功能。"}, {"id": 339, "question": "一家公司想讓使用者用「單一組憑證」，就能驗證身分並授權存取多個 AWS 帳號。\n哪一種 AWS 服務或資源可以滿足這個需求？", "options": {"A": "AWS Organizations", "B": "IAM 使用者", "C": "AWS IAM Identity Center（AWS Single Sign-On）", "D": "AWS Control Tower"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS IAM Identity Center（前身是 AWS SSO）就是設計來用單一組憑證，讓使用者能登入並存取多個 AWS 帳號，正好對應題目需求。A 的 Organizations 是多帳號治理框架；B 的 IAM 使用者是綁定在單一帳號內的身分；D 的 Control Tower 是建立與治理多帳號環境的服務，三者都不是「單一登入」機制本身。"}, {"id": 340, "question": "一家公司建立了一個 Amazon EC2 執行個體，想在「執行個體層級」控制進出的網路流量。\n哪一種 AWS 資源或服務可以滿足這個需求？", "options": {"A": "AWS Shield", "B": "安全群組（Security groups）", "C": "Network Access Analyzer", "D": "VPC 端點"}, "correct_answer": "B", "explanation": "正確答案是 B。Security Groups 就是作用在「執行個體層級」的防火牆，用來控制進出該執行個體的流量。（提醒：ExamTopics 網站標記的正解是 A／Shield，但 Shield 是 DDoS 防護服務，不是流量控制機制，這裡以 B 為準，明顯是標記錯誤。）C 的 Network Access Analyzer 是分析網路路徑可達性的工具；D 的 VPC 端點是讓 VPC 內資源私下存取 AWS 服務用的，都不是執行個體層級的流量控制機制。"}, {"id": 341, "question": "一家公司想用 AWS 雲端把應用程式部署到全球。\n公司應該用哪一種架構部署模式滿足這個需求？", "options": {"A": "多區域（Multi-Region）", "B": "單一區域（Single-Region）", "C": "多可用區域（Multi-AZ）", "D": "單一可用區域（Single-AZ）"}, "correct_answer": "A", "explanation": "正確答案是 A。要把應用程式部署到「全球」，需要用到多個 AWS 區域（Multi-Region），讓不同地理位置的使用者都能就近存取。（提醒：ExamTopics 網站標記的正解是 C／Multi-AZ，但 Multi-AZ 講的是「單一區域內」跨多個可用區域做容錯，範圍還是侷限在同一個地理區域，不算「全球部署」，這裡以 A 為準，社群留言也一致同意。）B、D 都只涉及單一區域，範圍更小，都不符合「全球」的需求。"}, {"id": 342, "question": "一家公司想讓一套網頁應用程式能跟多種 AWS 服務互動。\n哪一種 AWS 服務或資源可以滿足這個需求？", "options": {"A": "AWS CloudShell", "B": "AWS Marketplace", "C": "AWS Management Console", "D": "AWS CLI"}, "correct_answer": "D", "explanation": "正確答案是 D（信心度較低，這題的選項設計本身不夠精準，最佳答案應是 AWS SDK，但四個選項裡都沒有 SDK）。應用程式要「用程式的方式」跟多種 AWS 服務互動，四個選項裡最接近「可被程式/腳本呼叫執行」性質的是 AWS CLI；ExamTopics 網站標記的正解是 B／Marketplace，但那是購買第三方軟體的平台，跟「應用程式互動 AWS 服務」完全無關，可以排除。C 的 Management Console 是給人操作的圖形介面，不是應用程式能直接呼叫的機制；A 的 CloudShell 是瀏覽器內的互動式指令列工具，也是給人手動操作用的。這題社群留言本身也有分歧（C 派認為題目在講「人機互動」、D 派認為在講「程式化整合」），如果之後練習到這題答案怪怪的，可以留意一下。"}, {"id": 343, "question": "一家公司正在把應用程式從地端遷移到 AWS 雲端，公司想確保應用程式只被指派執行所有操作所需的最小權限。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS Identity and Access Management（IAM）", "B": "Amazon CloudWatch", "C": "Amazon Macie", "D": "Amazon GuardDuty"}, "correct_answer": "A", "explanation": "正確答案是 A。「只給予完成工作所需的最小權限」就是 IAM 最小權限原則（least privilege）的核心精神，透過 IAM 政策設定精確的權限範圍就能做到。（提醒：ExamTopics 網站標記的正解是 B／CloudWatch，但那是監控服務，跟「指派權限」完全無關，這裡以 A 為準，明顯是標記錯誤。）C 的 Macie 是敏感資料識別；D 的 GuardDuty 是威脅偵測，都不是管理權限的服務。"}, {"id": 344, "question": "以下何者屬於 AWS 雲端採用框架（AWS CAF）「治理」（Governance）觀點下的能力？（選擇兩個。）", "options": {"A": "身分與存取管理", "B": "雲端財務管理（Cloud financial management）", "C": "應用程式組合管理（Application portfolio management）", "D": "創新管理", "E": "產品管理"}, "correct_answer": "BC", "explanation": "正確答案是 B、C。AWS CAF 官方文件列出的「治理（Governance）」觀點能力包含：專案與計畫管理、效益管理、風險管理、雲端財務管理、應用程式組合管理、資料治理等，選項裡剛好對應到 B、C。（提醒：ExamTopics 網站標記的正解是 A、E，但 A「身分與存取管理」屬於「安全（Security）」觀點，E「產品管理」也不是治理觀點的能力項目，這裡以 B、C 為準，社群留言也引用官方能力清單佐證。）A 是安全觀點的能力；D、E 都不屬於官方治理觀點清單。"}, {"id": 345, "question": "哪一種 AWS 服務能提供單一位置，追蹤應用程式遷移的進度？", "options": {"A": "AWS Application Discovery Service", "B": "AWS Application Migration Service", "C": "AWS Service Catalog", "D": "AWS Migration Hub"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Migration Hub 就是設計來在單一儀表板彙整、追蹤所有遷移任務進度的服務，不管你用哪些遷移工具，進度都能集中在這裡查看。A 的 Application Discovery Service 是收集地端環境資料用的；B 的 Application Migration Service 是實際執行搬遷的工具；C 的 Service Catalog 是服務目錄管理，都不是「集中追蹤進度」的儀表板。"}, {"id": 346, "question": "一家公司用最新的 Amazon Linux 2 Amazon Machine Image（AMI）啟動了一個 Amazon EC2 執行個體。\n系統管理員可以用哪些方式連線到這個 EC2 執行個體？（選擇兩個。）", "options": {"A": "使用 Amazon EC2 Instance Connect。", "B": "使用遠端桌面通訊協定（RDP）連線。", "C": "使用 AWS Batch。", "D": "使用 AWS Systems Manager Session Manager。", "E": "使用 Amazon Connect。"}, "correct_answer": "AD", "explanation": "正確答案是 A、D。Amazon EC2 Instance Connect 跟 AWS Systems Manager Session Manager 都是官方文件列出、不需要開放 SSH 連接埠或管理金鑰的連線方式，適合 Linux 執行個體。（提醒：ExamTopics 網站標記的正解是 D、E，但 E 的 Amazon Connect 是雲端客服中心服務，跟連線到 EC2 執行個體完全無關，這裡以 A、D 為準，社群留言也一致指出這個錯誤。）B 的 RDP 是 Windows 執行個體常用的連線方式，Linux 執行個體通常不用 RDP；C 的 AWS Batch 是批次運算服務，也跟連線無關。"}, {"id": 347, "question": "哪一種架構概念，描述的是能依需求部署資源、不需要時就釋放資源的能力？", "options": {"A": "高可用性", "B": "解耦架構（Decoupled architecture）", "C": "復原力（Resilience）", "D": "彈性伸縮（Elasticity）"}, "correct_answer": "D", "explanation": "正確答案是 D。「依需求部署資源、不用時釋放資源」正是「彈性伸縮（Elasticity）」的標準定義。（提醒：ExamTopics 網站標記的正解是 A／高可用性，但高可用性講的是「系統持續可存取、不中斷」，跟「資源隨需增減」是不同概念，這裡以 D 為準，明顯是標記錯誤。）B 的解耦架構講的是元件之間降低相依性；C 的復原力講的是故障後的恢復能力，都不是題目描述的重點。"}, {"id": 348, "question": "哪一項工作，需要使用者以 AWS 帳號根使用者（root user）身分登入才能完成？", "options": {"A": "刪除 IAM 使用者", "B": "刪除 AWS 帳號", "C": "在 AWS Organizations 中建立組織", "D": "刪除 Amazon EC2 執行個體"}, "correct_answer": "B", "explanation": "正確答案是 B。刪除（關閉）整個 AWS 帳號是極少數只有根使用者才能執行的操作，一般 IAM 使用者無論權限多高都無法執行。A、C、D 這些操作只要 IAM 使用者被授予適當權限，就可以執行，不需要用根使用者登入。"}, {"id": 349, "question": "Amazon S3 智慧分層（Intelligent-Tiering）儲存類別提供的是什麼？", "options": {"A": "透過預留儲存容量取得付款彈性", "B": "把資料複製到加密的 Amazon Elastic Block Store（Amazon EBS）卷來做長期保存", "C": "依存取模式變化，自動在不同層級間搬移物件，藉此自動節省成本", "D": "安全、耐久、成本最低的資料歸檔儲存"}, "correct_answer": "C", "explanation": "正確答案是 C。S3 Intelligent-Tiering 的官方定位就是「自動依實際存取模式的變化，把物件在不同存取層級間搬移，自動節省成本」，不需要人工判斷該用哪個儲存類別，社群留言也直接引用官方頁面的這句話。（提醒：ExamTopics 網站標記的正解是 D，但那句描述其實比較接近 S3 Glacier 的定位（資料歸檔、最低成本），不是 Intelligent-Tiering 的核心賣點，這裡以 C 為準。）A、B 的描述都不符合 Intelligent-Tiering 的實際運作方式。"}, {"id": 350, "question": "一家公司需要 Amazon EC2 執行個體來執行一個能容忍中斷的工作負載。\n哪一種 EC2 購買方案，相比 On-Demand 價格能提供「最大」折扣，同時滿足這個需求？", "options": {"A": "Spot 執行個體（Spot Instances）", "B": "可轉換預留執行個體（Convertible Reserved Instances）", "C": "標準預留執行個體（Standard Reserved Instances）", "D": "專用主機（Dedicated Hosts）"}, "correct_answer": "A", "explanation": "正確答案是 A。Spot Instances 用「AWS 目前閒置的運算容量」競標使用，折扣幅度最高可達 90%，是四個選項裡折扣最大的方案，同時也正好適合「能容忍中斷」的工作負載，因為 Spot 隨時可能被 AWS 回收。（提醒：ExamTopics 網站標記的正解是 D／Dedicated Hosts，但那主打的是實體隔離，折扣幅度遠不如 Spot，也不是為「容忍中斷」的工作負載設計的，這裡以 A 為準，明顯是標記錯誤。）B、C 的 Reserved Instances 折扣通常在 40～60% 左右，比不上 Spot。"}, {"id": 351, "question": "一家公司正在規劃遷移到 AWS 雲端，想找出能說明這次遷移決策價值的「可衡量的業務成果」。\n這項活動屬於雲端轉型旅程的哪一個階段？", "options": {"A": "願景（Envision）", "B": "對齊（Align）", "C": "擴展（Scale）", "D": "啟動（Launch）"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS 官方 CAF 文件對「願景（Envision）」階段的說明就寫著：「把轉型計畫跟關鍵利害關係人、可衡量的業務成果連結起來，有助於在轉型過程中證明價值」，跟題目描述逐字對應。（提醒：ExamTopics 網站標記的正解是 C／Scale，但那是轉型旅程較後期、擴大規模的階段，不是「找出可衡量業務成果」這種前期定義價值的活動，這裡以 A 為準，社群留言也引用官方文件連結佐證。）B 對齊、D 啟動都是願景之後的階段，重點不在「定義可衡量的業務成果」。"}, {"id": 352, "question": "哪一種 AWS 服務或元件，能讓來自網際網路的傳入流量存取 VPC？", "options": {"A": "網際網路閘道（Internet gateway）", "B": "NAT 閘道", "C": "AWS WAF", "D": "VPC 對等互連"}, "correct_answer": "A", "explanation": "正確答案是 A。網際網路閘道（Internet Gateway）就是讓 VPC 能跟網際網路互通的元件，官方文件明確定義它「允許 VPC 與網際網路之間的通訊」。（提醒：ExamTopics 網站標記的正解是 C／WAF，但 WAF 是過濾/防護已經進來的網頁流量，本身不負責「讓流量能夠進入 VPC」這個基礎連通性功能，這裡以 A 為準，明顯是標記錯誤。）B 的 NAT 閘道是讓私有子網路「主動對外」連線用的，方向相反；D 的 VPC 對等互連是連接兩個 VPC 用的，都不是題目描述的功能。"}, {"id": 353, "question": "公司可以用哪一種 AWS 服務，用程式碼建立基礎設施？", "options": {"A": "Amazon Elastic Kubernetes Service（Amazon EKS）", "B": "AWS Outposts", "C": "AWS CodePipeline", "D": "AWS CloudFormation"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS CloudFormation 官方定位就是「把基礎設施當作程式碼來建模、佈建與管理」，是 infrastructure as code 的標準服務。（提醒：ExamTopics 網站標記的正解是 A／EKS，但 EKS 是受管的 Kubernetes 容器服務，本身不是用來「以程式碼建立基礎設施」的工具，這裡以 D 為準，明顯是標記錯誤。）B 的 Outposts 是把 AWS 服務延伸到地端；C 的 CodePipeline 是 CI/CD 流程服務，都不是 IaC 工具。"}, {"id": 354, "question": "以下何者是打造雲端應用程式時，Well-Architected 的設計原則？", "options": {"A": "把靜態資料放在離運算資源更近的地方。", "B": "依尖峰容量預先佈建資源。", "C": "設計成故障後能自動恢復。", "D": "使用緊密耦合的元件。"}, "correct_answer": "C", "explanation": "正確答案是 C。「設計成故障後能自動恢復（Design for automated recovery from failure）」是 Well-Architected Framework「可靠性（Reliability）」支柱官方列出的設計原則之一。（提醒：ExamTopics 網站標記的正解是 D，但 WAF 官方原則講的是「鬆散耦合（loosely coupled）」，跟「緊密耦合」方向完全相反，這裡以 C 為準，社群留言也引用官方文件連結佐證。）A、B、D 描述的做法都不符合 Well-Architected 的實際設計原則。"}, {"id": 355, "question": "一家公司需要把 75 PB 的資料，從地端資料中心搬到 AWS。\n哪一種 AWS 服務能用「最划算」的方式滿足這個需求？", "options": {"A": "AWS Snowball Edge 儲存最佳化版", "B": "AWS Snowmobile", "C": "AWS Direct Connect", "D": "AWS Storage Gateway"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Snowmobile 是用貨櫃卡車搬運的實體儲存裝置，專門應付 PB 甚至 EB 級別的超大量資料搬遷，75 PB 這種規模用 Snowmobile 最划算。A 的 Snowball Edge 單台裝置容量遠小於 75 PB，會需要非常多台裝置週轉，不如 Snowmobile 一次到位；C 的 Direct Connect 跟 D 的 Storage Gateway 都要透過網路傳輸，面對這麼大量的資料，時間與頻寬成本都不划算。"}, {"id": 356, "question": "以下何者是 AWS Well-Architected Framework 的支柱？（選擇兩個。）", "options": {"A": "資源可擴充性", "B": "效能效率（Performance efficiency）", "C": "系統彈性", "D": "敏捷開發", "E": "卓越營運（Operational excellence）"}, "correct_answer": "BE", "explanation": "正確答案是 B、E。Well-Architected Framework 官方六大支柱是：卓越營運、安全性、可靠性、效能效率、成本最佳化、永續性，選項裡剛好對應到 B、E。（提醒：ExamTopics 網站標記的正解是 C、E，但 C「系統彈性」不是官方六大支柱之一，這裡以 B、E 為準，社群留言也一致同意並列出完整六大支柱名稱。）A 資源可擴充性、C 系統彈性、D 敏捷開發，都不是官方定義的支柱名稱。"}, {"id": 357, "question": "一家公司需要把地端資料中心連接到 AWS 雲端，需要一條專屬、低延遲、網路效能穩定一致的連線。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "AWS Global Accelerator", "B": "Amazon CloudFront", "C": "AWS Direct Connect", "D": "AWS Managed VPN"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Direct Connect 官方定位就是「建立一條專屬的網路連線到 AWS」，能提供比一般網際網路連線更穩定一致的效能與更低的延遲。（提醒：ExamTopics 網站標記的正解是 B／CloudFront，但那是 CDN 內容加速服務，不是建立地端到 AWS 專屬連線的服務，這裡以 C 為準，明顯是標記錯誤。）A 的 Global Accelerator 是流量導向優化服務；D 的 Managed VPN 雖然也能連接地端與 AWS，但是透過網際網路加密通道，不像 Direct Connect 是實體專屬連線，效能穩定性較低。"}, {"id": 358, "question": "公司應該對 AWS 雲端工作負載套用哪些設計原則，才能最大化永續性、把環境衝擊降到最低？（選擇兩個。）", "options": {"A": "最大化 Amazon EC2 執行個體的使用率。", "B": "最小化 Amazon EC2 執行個體的使用率。", "C": "最小化受管服務的使用。", "D": "強迫使用者頻繁重新安裝應用程式。", "E": "降低使用者需要重新安裝應用程式的頻率。"}, "correct_answer": "AE", "explanation": "正確答案是 A、E。永續性支柱的設計原則之一是「最大化資源使用率」——避免資源閒置浪費，讓每一分運算資源都被有效運用；另一個原則是「降低使用者端的下游影響」，包含減少強迫使用者頻繁升級/重灌軟硬體的需求。B、C、D 的做法都跟永續性的實際做法相反：使用率太低反而浪費資源、多用受管服務其實更有利於永續（AWS 能在規模化層級做效率優化）、強迫頻繁重灌也會增加使用者端的資源消耗。"}, {"id": 359, "question": "AWS 雲端在哪些方面，能提供比地端資料中心更低的運算資源總持有成本（TCO）？（選擇兩個。）", "options": {"A": "AWS 用隨用隨付的費用，取代了前期的資本支出。", "B": "AWS 設計成高可用，能消除使用者停機時間。", "C": "AWS 讓公司不再需要地端 IT 人員。", "D": "AWS 運用規模經濟，持續調降價格。", "E": "AWS 針對 Amazon EC2 執行個體提供單一定價模式。"}, "correct_answer": "AD", "explanation": "正確答案是 A、D。「用隨用隨付取代前期資本支出」跟「規模經濟持續降價」，都是官方文件明確列出、AWS 相比地端資料中心能降低 TCO 的核心原因，社群留言也引用官方部落格文章佐證。（提醒：ExamTopics 網站標記的正解是 C、D，但 C「完全不需要地端 IT 人員」講得太絕對，公司搬上雲端後仍需要雲端維運人力，只是角色改變，不算「消除」，這裡以 A、D 為準。）B「消除使用者停機時間」講得太絕對，高可用不等於零停機；E 說 EC2「單一定價模式」也不成立，EC2 其實有 On-Demand、Reserved、Spot 等多種定價模式。"}, {"id": 360, "question": "一家公司想把部分資源部署在 AWS 雲端，因為法規要求，資料必須留在本地、留在地端。同時 AWS 與公司資源之間，也需要低延遲。\n哪一種 AWS 服務或功能可以滿足這些需求？", "options": {"A": "AWS Local Zones", "B": "可用區域（Availability Zones）", "C": "AWS Outposts", "D": "AWS Wavelength Zones"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Outposts 是把 AWS 的硬體與服務實際安裝在客戶自己的地端機房裡，資料能真正留在客戶自己的場域內，同時因為就在地端、延遲也最低，完全對應「資料必須留在本地端」的法規要求。（提醒：ExamTopics 網站標記的正解是 A／Local Zones，但 Local Zones 仍是 AWS 自己的機房設施（只是地理位置離特定城市較近），資料並不是存放在客戶自己的場域內，不符合「資料留在本地端」的法規要求，這裡以 C 為準，社群留言也點出這個關鍵差異。）B 的可用區域是 AWS 區域內的資料中心，跟客戶地端無關；D 的 Wavelength Zones 是搭配電信商 5G 網路的邊緣運算節點。"}, {"id": 361, "question": "以下哪些 AWS 服務是無伺服器（serverless）的？（選擇兩個。）", "options": {"A": "AWS Outposts", "B": "Amazon EC2", "C": "Amazon Elastic Kubernetes Service（Amazon EKS）", "D": "AWS Fargate", "E": "AWS Lambda"}, "correct_answer": "DE", "explanation": "正確答案是 D、E。AWS Fargate（免管理伺服器的容器運算）跟 AWS Lambda（免管理伺服器的函式運算）都是官方明確定位的無伺服器服務，使用者完全不用管底層伺服器的存在。A 的 Outposts 是把 AWS 硬體延伸到地端；B 的 EC2 是傳統需要自己管理伺服器規格的運算服務；C 的 EKS 雖然是受管的 Kubernetes 控制平面，但底層節點通常還是要自己管理（除非額外用 Fargate 模式），三者都不是無伺服器服務。"}, {"id": 362, "question": "當使用者想在 AWS 上執行 Microsoft Windows 伺服器時，沿用自己既有的「每插槽、每核心、每虛擬機器」軟體授權，需要哪一種 Amazon EC2 執行個體類型？", "options": {"A": "Spot 執行個體（Spot Instances）", "B": "專用執行個體（Dedicated Instances）", "C": "專用主機（Dedicated Hosts）", "D": "預留執行個體（Reserved Instances）"}, "correct_answer": "C", "explanation": "正確答案是 C。專用主機（Dedicated Hosts）能讓使用者看到底層實體伺服器的插槽數與核心數，正好符合「自帶授權（BYOL）」情境下、依插槽/核心/虛擬機器計費的軟體授權要求。B 的專用執行個體雖然也是實體隔離，但看不到底層插槽/核心數等硬體細節，不適合這種授權模式；A 的 Spot、D 的 Reserved 都跟硬體授權沒有直接關係。"}, {"id": 363, "question": "一位解決方案架構師需要維護一組 Amazon EC2 執行個體，讓任何故障的執行個體都能自動被新的執行個體取代。\n解決方案架構師應該用哪一種 AWS 服務？", "options": {"A": "Amazon Elastic Container Service（Amazon ECS）", "B": "Amazon GuardDuty", "C": "AWS Shield", "D": "AWS Auto Scaling"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Auto Scaling（EC2 Auto Scaling）會持續偵測不健康的執行個體，並自動用新的執行個體取代，正好對應題目需求。（提醒：ExamTopics 網站標記的正解是 B／GuardDuty，但那是威脅偵測服務，不負責替換故障的執行個體，這裡以 D 為準，明顯是標記錯誤。）A 的 ECS 是容器編排服務；C 的 Shield 是 DDoS 防護，都不是維護執行個體健康度的服務。"}, {"id": 364, "question": "哪一種 AWS 服務，能讓地端應用程式以低延遲的方式，存取儲存在 AWS 雲端的資料？", "options": {"A": "Amazon CloudFront", "B": "AWS Storage Gateway", "C": "AWS Backup", "D": "AWS DataSync"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Storage Gateway 官方定位就是「讓地端應用程式能存取幾乎無限的雲端儲存空間」，在地端部署虛擬設備當快取層，讓地端應用程式能低延遲存取原本存在雲端的資料。（提醒：ExamTopics 網站標記的正解是 A／CloudFront，但 CloudFront 主要是把內容加速送到「終端使用者」（消費者瀏覽器），不是專門設計給「地端應用程式」存取雲端資料用的，這裡以 B 為準，社群留言也引用官方文件佐證。）C 的 Backup 是備份管理服務；D 的 DataSync 是資料搬遷服務，都不是提供低延遲存取的快取機制。"}, {"id": 365, "question": "Amazon CloudFront 提供的是什麼？", "options": {"A": "用單一整合介面，為應用程式的所有資源提供自動擴充", "B": "以低延遲，向全球使用者安全傳遞資料、影片、應用程式與 API", "C": "能透過多種路由類型（如延遲導向路由、地理 DNS、地理鄰近、加權輪詢）直接在全球管理流量的能力", "D": "自動把傳入的應用程式流量分散到多個目標（如 Amazon EC2 執行個體、容器、IP 位址、AWS Lambda 函式）"}, "correct_answer": "B", "explanation": "正確答案是 B。這是 Amazon CloudFront 官方文件的標準描述：以低延遲、安全地把資料、影片、應用程式、API 傳遞給全球使用者，這正是 CDN（內容傳遞網路）的核心功能。C 描述的是 Route 53 的路由功能；D 描述的是 Elastic Load Balancing 的功能；A 的描述不對應任何特定服務，都不是 CloudFront 的定位。"}, {"id": 366, "question": "哪一種 AWS 服務支援在 AWS 雲端部署與管理應用程式？", "options": {"A": "Amazon CodeGuru", "B": "AWS Fargate", "C": "AWS CodeCommit", "D": "AWS Elastic Beanstalk"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Elastic Beanstalk 官方定位就是幫助開發者部署並管理 AWS 雲端上的應用程式，自動處理容量佈建、負載平衡、擴縮等細節。（提醒：ExamTopics 網站標記的正解是 A／CodeGuru，但那是程式碼審查與效能剖析的機器學習工具，不是部署管理應用程式的服務，這裡以 D 為準，明顯是標記錯誤。）B 的 Fargate 是容器運算服務；C 的 CodeCommit 是原始碼儲存庫服務，都不是「部署與管理應用程式」的整合服務。"}, {"id": 367, "question": "一家公司想把自然語言處理（NLP）整合進商業智慧（BI）儀表板，希望能直接用提問的方式得到答案，並附上相關的視覺化圖表。\n哪一種 AWS 服務或工具可以滿足這些需求？", "options": {"A": "Amazon Macie", "B": "Amazon Rekognition", "C": "Amazon QuickSight Q", "D": "Amazon Lex"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon QuickSight Q 是 QuickSight 內建的自然語言問答功能，使用者可以直接打字提問，系統會自動產生對應的視覺化圖表回答，完全對應題目需求。A 的 Macie 是敏感資料識別；B 的 Rekognition 是影像辨識；D 的 Lex 是打造聊天機器人的服務，三者都不是 BI 儀表板的自然語言問答工具。"}, {"id": 368, "question": "哪一種 Amazon S3 功能或儲存類別，會利用 AWS 骨幹網路與邊緣節點，降低終端使用者到 Amazon S3 之間的延遲？", "options": {"A": "S3 跨區域複寫（Cross-Region Replication）", "B": "S3 傳輸加速（S3 Transfer Acceleration）", "C": "S3 事件通知", "D": "S3 標準不常存取（S3 Standard-IA）"}, "correct_answer": "B", "explanation": "正確答案是 B。S3 Transfer Acceleration 官方文件明確寫著能透過 AWS 邊緣節點，把長距離、大檔案的傳輸速度提升 50～500%，正好對應題目描述。（提醒：ExamTopics 網站標記的正解是 D／Standard-IA，但那只是一種依存取頻率定價的儲存類別，跟「利用骨幹網路/邊緣節點降低延遲」完全無關，這裡以 B 為準，明顯是標記錯誤。）A 的跨區域複寫是把資料複製到另一個區域，不是加速傳輸；C 的事件通知是觸發自動化流程用的，都不是加速機制。"}, {"id": 369, "question": "哪一種 AWS 服務能提供在 AWS 雲端代管 NoSQL 資料庫的能力？", "options": {"A": "Amazon Aurora", "B": "Amazon DynamoDB", "C": "Amazon RDS", "D": "Amazon Redshift"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon DynamoDB 是 AWS 全託管的 NoSQL（鍵值/文件型）資料庫服務。A 的 Aurora、C 的 RDS 都是關聯式資料庫；D 的 Redshift 是資料倉儲，三者都不是 NoSQL 資料庫。"}, {"id": 370, "question": "哪一種 AWS 服務是相容於 MySQL 與 PostgreSQL 的關聯式資料庫？", "options": {"A": "Amazon Redshift", "B": "Amazon DynamoDB", "C": "Amazon Aurora", "D": "Amazon Neptune"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon Aurora 官方文件明確標榜「完全相容 MySQL 與 PostgreSQL」，效能與可用性都優於一般開源資料庫，成本只要商用資料庫的十分之一。（提醒：ExamTopics 網站標記的正解是 A／Redshift，但那是資料倉儲服務，並非通用的 MySQL/PostgreSQL 相容關聯式資料庫，這裡以 C 為準，明顯是標記錯誤。）B 的 DynamoDB 是 NoSQL 資料庫；D 的 Neptune 是圖形資料庫，都不符合題目描述。"}, {"id": 371, "question": "哪一種架構設計原則，描述的是需要「隔離相依元件之間的故障」，避免故障擴散到 AWS 雲端中的其他元件？", "options": {"A": "使用單體式（monolithic）設計。", "B": "為自動化而設計。", "C": "設計成單一故障點。", "D": "鬆散耦合元件。"}, "correct_answer": "D", "explanation": "正確答案是 D。「鬆散耦合（Loosely couple components）」正是官方文件描述能「隔離元件行為、避免故障影響到相依它的其他元件」的設計原則，跟題目描述逐字對應。（提醒：ExamTopics 網站標記的正解是 B／為自動化而設計，但那講的是自動化維運流程，跟「隔離故障」是不同概念，這裡以 D 為準，社群留言也引用官方文件連結佐證。）A 單體式設計、C 單一故障點都是應該避免的反面做法，不是設計原則。"}, {"id": 372, "question": "哪一種雲端運算優勢，讓公司能透過 AWS 區域、可用區域與邊緣節點所組成的網路，把應用程式部署給全世界的使用者？", "options": {"A": "規模經濟", "B": "全球觸及（Global reach）", "C": "靈活性（Agility）", "D": "高可用性"}, "correct_answer": "B", "explanation": "正確答案是 B。「透過 AWS 區域、可用區域、邊緣節點的全球網路把應用程式部署給全世界使用者」正是雲端優勢裡「全球觸及（Global Reach）」的定義。（提醒：ExamTopics 網站標記的正解是 A／規模經濟，但規模經濟講的是「大量採購壓低成本」，跟「透過全球基礎設施網路部署」是不同的優勢面向，這裡以 B 為準，社群留言也引用官方六大優勢頁面佐證。）C 的靈活性、D 的高可用性都跟題目描述的「全球部署基礎設施網路」不是同一個重點。"}, {"id": 373, "question": "哪一種 AWS 服務能讓監控與疑難排解應用程式日誌及雲端資源變得更容易？", "options": {"A": "Amazon EC2", "B": "AWS Identity and Access Management（IAM）", "C": "Amazon CloudWatch", "D": "AWS CloudTrail"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon CloudWatch 官方定位就是協助使用者分析日誌，並即時監控 AWS 資源與應用程式的各項指標，正好對應題目需求。（提醒：ExamTopics 網站標記的正解是 B／IAM，但 IAM 是權限管理服務，跟監控日誌完全無關，這裡以 C 為準，明顯是標記錯誤。）A 的 EC2 是運算執行個體本身；D 的 CloudTrail 記錄的是 API 呼叫軌跡，跟應用程式日誌監控是不同層面的工具。"}, {"id": 374, "question": "AWS Compute Optimizer 會根據工作負載指標，為哪一種 AWS 服務提供資源調整（sizing）建議？", "options": {"A": "Amazon EC2", "B": "Amazon RDS", "C": "Amazon Lightsail", "D": "AWS Step Functions"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS Compute Optimizer 官方文件列出支援的資源類型包含 Amazon EC2 執行個體類型、EBS 卷、Fargate 上的 ECS 服務、Lambda 函式，其中 EC2 是最核心也最經典的分析對象。（提醒：ExamTopics 網站標記的正解是 D／Step Functions，但那是流程協調服務，不在 Compute Optimizer 支援的資源類型範圍內，這裡以 A 為準，明顯是標記錯誤。）B 的 RDS、C 的 Lightsail 都不在 Compute Optimizer 傳統支援的核心資源類型清單中。"}, {"id": 375, "question": "哪一種 AWS 服務，能透過收集地端資料中心的組態、使用量與行為資料，協助公司規劃遷移到 AWS？", "options": {"A": "AWS Resource Groups", "B": "AWS Application Discovery Service", "C": "AWS Service Catalog", "D": "AWS Systems Manager"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Application Discovery Service 官方定位就是透過收集地端伺服器與資料庫的使用量與組態資料，協助公司規劃雲端遷移，跟題目描述逐字對應。（提醒：ExamTopics 網站標記的正解是 C／Service Catalog，但那是核准過的 IT 服務目錄管理工具，跟「收集地端環境資料」完全無關，這裡以 B 為準，明顯是標記錯誤。）A 的 Resource Groups 是整理既有 AWS 資源用的；D 的 Systems Manager 是維運管理工具，都不是收集地端探索資料的服務。"}, {"id": 376, "question": "哪一種 AWS 服務，運用了發布者（publisher）與訂閱者（subscriber）的組合機制？", "options": {"A": "AWS Lambda", "B": "Amazon Simple Notification Service（Amazon SNS）", "C": "Amazon CloudWatch", "D": "AWS CloudFormation"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon SNS 官方定位就是讓使用者能輕鬆用「發布/訂閱（pub/sub）」訊息模型打造應用程式，把訊息從應用程式發送給多個訂閱端（客戶或其他應用程式）。（提醒：ExamTopics 網站標記的正解是 D／CloudFormation，但那是基礎設施即程式碼服務，沒有發布/訂閱的概念，這裡以 B 為準，明顯是標記錯誤。）A 的 Lambda 是函式運算服務；C 的 CloudWatch 是監控服務，都不是以 pub/sub 為核心機制的服務。"}, {"id": 377, "question": "一家公司正處於規劃遷移到 AWS 的早期階段，想取得未來 Amazon EC2 執行個體與相關儲存空間，每月預估的 AWS 總持有成本。\n公司應該用哪一種 AWS 服務或工具滿足這些需求？", "options": {"A": "AWS Pricing Calculator", "B": "AWS Compute Optimizer", "C": "AWS Trusted Advisor", "D": "AWS Application Migration Service"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS Pricing Calculator 就是專門用來預估「還沒佈署」的 AWS 資源未來會產生多少費用的工具，很適合遷移規劃早期階段使用。（提醒：ExamTopics 網站標記的正解是 B／Compute Optimizer，但那是分析「既有」AWS 資源使用狀況、給出規格調整建議的工具，不適用於「還沒建立」的未來資源，這裡以 A 為準，社群留言也點出「早期規劃階段」這個關鍵字對應到 Pricing Calculator。）C 的 Trusted Advisor 是既有帳號的健檢建議；D 的 Application Migration Service 是實際執行搬遷的工具，都不是預估未來成本的工具。"}, {"id": 378, "question": "哪一種 AWS 服務或工具，能即時監控 AWS 資源與應用程式？", "options": {"A": "AWS Trusted Advisor", "B": "Amazon CloudWatch", "C": "AWS CloudTrail", "D": "AWS Cost Explorer"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon CloudWatch 就是 AWS 即時監控 AWS 資源與應用程式指標、日誌、告警的核心服務。A 的 Trusted Advisor 是帳號健檢建議，不是即時監控；C 的 CloudTrail 記錄的是 API 呼叫軌跡；D 的 Cost Explorer 是成本分析工具，都不是即時監控服務。"}, {"id": 379, "question": "哪一項 AWS 雲端採用框架（AWS CAF）能力，屬於「商業」（Business）觀點？", "options": {"A": "專案與計畫管理", "B": "資料科學（Data science）", "C": "可觀測性（Observability）", "D": "變更與版本發布管理"}, "correct_answer": "B", "explanation": "正確答案是 B。根據 AWS CAF 官方文件對各觀點能力的分類，「資料科學（Data Science）」屬於「商業（Business）」觀點下的能力項目，社群留言也引用官方白皮書連結佐證，投票結果 100% 支持 B。（提醒：ExamTopics 網站標記的正解是 A／專案與計畫管理，但那其實是「治理（Governance）」觀點下的能力，不屬於商業觀點，這裡以 B 為準。）C 的可觀測性、D 的變更與版本發布管理，都屬於「維運（Operations）」觀點的能力，不屬於商業觀點。"}, {"id": 380, "question": "公司在使用 Amazon EC2 執行個體時，可以用哪一種 AWS 資源，透過承諾使用量來降低成本？", "options": {"A": "運算節省計劃（Compute Savings Plans）", "B": "Auto Scaling 群組", "C": "隨需執行個體（On-Demand Instance）", "D": "EC2 執行個體儲存體"}, "correct_answer": "A", "explanation": "正確答案是 A。Compute Savings Plans 就是用「承諾一段期間內的運算使用量」來換取折扣的定價方案，適用於 EC2、Fargate、Lambda。B 的 Auto Scaling 群組是自動調整執行個體數量的機制，不是定價方案；C 的 On-Demand 沒有承諾折扣；D 的執行個體儲存體是暫存磁碟，都跟「用承諾換折扣」無關。"}, {"id": 381, "question": "AWS 雲端採用框架（AWS CAF）的哪一個觀點，包含「設計良好的資料與分析架構」這項能力？", "options": {"A": "安全（Security）", "B": "治理（Governance）", "C": "維運（Operations）", "D": "平台（Platform）"}, "correct_answer": "D", "explanation": "正確答案是 D。「平台（Platform）」觀點關注的是技術架構層面的建置能力，資料與分析架構的良好設計正是其中一項能力項目。A 安全、B 治理、C 維運都是 CAF 的其他觀點，關注的重點不同，不涵蓋「資料與分析架構設計」這個項目。"}, {"id": 382, "question": "以下何者屬於 AWS 雲端採用框架（AWS CAF）「人員」（People）觀點下的能力？（選擇兩個。）", "options": {"A": "組織對齊（Organizational alignment）", "B": "投資組合管理", "C": "組織設計（Organization design）", "D": "風險管理", "E": "現代化應用程式開發"}, "correct_answer": "AC", "explanation": "正確答案是 A、C。組織對齊與組織設計都是官方文件列在「人員（People）」觀點下的能力項目，關注的是組織結構與文化面的轉型。B 投資組合管理、D 風險管理屬於「治理（Governance）」觀點；E 現代化應用程式開發屬於「平台（Platform）」觀點，都不屬於人員觀點。"}, {"id": 383, "question": "一家公司需要在技術與業務之間搭起橋樑，協助組織演進成一個持續成長、持續學習的文化。\n哪一個 AWS 雲端採用框架（AWS CAF）觀點扮演這座橋樑的角色？", "options": {"A": "人員（People）", "B": "治理（Governance）", "C": "維運（Operations）", "D": "安全（Security）"}, "correct_answer": "A", "explanation": "正確答案是 A。「人員（People）」觀點官方定位就是在技術與業務之間搭起橋樑，透過組織文化、技能發展、變革管理，協助企業建立持續成長與學習的文化。B、C、D 都是聚焦在特定技術/管理層面的觀點，不是專門處理「文化轉型橋樑」這個角色的觀點。"}, {"id": 384, "question": "根據責任共擔模型，以下何者是 AWS 的責任？", "options": {"A": "應用程式資料的安全性", "B": "執行在 Amazon EC2 執行個體上之應用程式的修補管理", "C": "受管服務底層基礎設施的修補管理", "D": "應用程式的身分與存取管理"}, "correct_answer": "C", "explanation": "正確答案是 C。像 RDS、DynamoDB 這類全託管（受管）服務，其底層基礎設施的修補與更新完全由 AWS 負責，客戶碰不到也不用管。A 應用程式資料安全性、D 應用程式身分與存取管理，都是客戶自己應用程式層級的責任；B 執行在 EC2 上的應用程式修補（如客體作業系統、應用程式本身），因為 EC2 是 IaaS，也是客戶的責任，不是 AWS 的。"}, {"id": 385, "question": "哪一種 AWS 服務或資源，能找出並提供報告，說明某個 AWS 帳號裡的 IAM 資源，被分享給了另一個 AWS 帳號？", "options": {"A": "IAM 憑證報告", "B": "AWS IAM Identity Center（AWS Single Sign-On）", "C": "AWS Identity and Access Management Access Analyzer", "D": "Amazon Cognito 使用者集區"}, "correct_answer": "C", "explanation": "正確答案是 C。IAM Access Analyzer 的核心功能就是掃描並找出帳號內哪些資源（包含 IAM 角色等）被分享給外部帳號，並產生對應的報告。A 的憑證報告是查使用者憑證狀態的；B 的 IAM Identity Center 是跨帳號單一登入服務；D 的 Cognito 使用者集區是終端使用者身分驗證服務，三者都不是找出「跨帳號共享資源」的工具。"}, {"id": 386, "question": "哪一個 AWS Well-Architected Framework 支柱，關注的是有結構、有條理地分配運算資源？", "options": {"A": "可靠性（Reliability）", "B": "卓越營運（Operational excellence）", "C": "效能效率（Performance efficiency）", "D": "永續性（Sustainability）"}, "correct_answer": "C", "explanation": "正確答案是 C。「效能效率（Performance Efficiency）」支柱官方定義的核心就是「有結構、有效率地分配與運用運算資源」，並隨著需求變化持續調整。A 可靠性講的是故障恢復；B 卓越營運講的是維運流程改善；D 永續性講的是環境衝擊，都不是聚焦在「資源分配效率」這個重點。"}, {"id": 387, "question": "以下哪些 AWS 雲端採用框架（AWS CAF）能力，屬於「治理」（Governance）觀點？（選擇兩個。）", "options": {"A": "專案與計畫管理", "B": "產品管理", "C": "投資組合管理", "D": "風險管理", "E": "事件管理"}, "correct_answer": "AD", "explanation": "正確答案是 A、D。專案與計畫管理、風險管理都是官方文件列在「治理（Governance）」觀點下的能力項目。B 產品管理屬於「商業（Business）」觀點；C 投資組合管理雖然名稱相近，但這裡指的「Application Portfolio Management」才是治理觀點的項目（此選項寫的是一般性的投資組合管理，非官方治理觀點用詞）；E 事件管理屬於「維運（Operations）」觀點，都不屬於題目要問的治理觀點分類。"}, {"id": 388, "question": "一家公司想使用 AWS 受管服務（AWS Managed Services, AMS）取得維運支援，並想了解 AMS 的服務範圍。\n哪一項 AMS 功能可以滿足這個需求？", "options": {"A": "登陸區域與網路管理（Landing zone and network management）", "B": "客戶應用程式開發", "C": "DevSecOps 流水線設定", "D": "應用程式日誌監控"}, "correct_answer": "A", "explanation": "正確答案是 A。AMS 的服務範圍核心就包含帳號登陸區域（Landing Zone）建置與網路管理這類基礎維運工作。B 客戶應用程式開發不在 AMS 服務範圍內（AMS 不負責幫客戶開發應用程式）；C、D 雖然跟維運相關，但都不是 AMS 官方定義用來說明其服務範圍的代表性功能。"}, {"id": 389, "question": "一家公司想把地端的 NoSQL 工作負載，遷移到 Amazon DynamoDB。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS Migration Hub", "B": "AWS Database Migration Service（AWS DMS）", "C": "Migration Evaluator", "D": "AWS Application Migration Service"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS DMS 除了支援關聯式資料庫遷移，也支援把地端 NoSQL 工作負載遷移到 DynamoDB。A 的 Migration Hub 是追蹤遷移進度的儀表板；C 的 Migration Evaluator 是評估上雲成本的工具；D 的 Application Migration Service 是搬「整台伺服器」用的，三者都不是實際執行資料庫遷移的工具。"}, {"id": 390, "question": "一家公司正在為了滿足效能與容量需求，尋找正確的 Amazon EC2 執行個體類型與大小，同時想找到最低的成本。\n以下哪個選項最準確描述了這家公司的行動？", "options": {"A": "Auto Scaling", "B": "儲存分層", "C": "資源調整（Rightsizing）", "D": "執行個體排程"}, "correct_answer": "C", "explanation": "正確答案是 C。「找到符合效能/容量需求、同時成本最低的執行個體類型與大小」正是 Rightsizing（資源調整）的標準定義。A 的 Auto Scaling 是依需求自動增減執行個體數量；B 的儲存分層是儲存類別優化；D 的執行個體排程是依時段開關執行個體，三者都不是「挑選正確規格」這個行動的名稱。"}, {"id": 391, "question": "一家公司想管理員工使用者的登入安全，需要建立員工使用者，並在公司所有 AWS 帳號與應用程式之間，集中管理他們的存取權限。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "AWS Audit Manager", "B": "Amazon Cognito", "C": "AWS Security Hub", "D": "AWS IAM Identity Center（AWS Single Sign-On）"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS IAM Identity Center 就是設計來集中建立員工使用者、並跨多個 AWS 帳號與應用程式管理其存取權限的服務。A 的 Audit Manager 是稽核用的；B 的 Cognito 是給終端消費者用的身分驗證服務，不是給員工用的；C 的 Security Hub 是安全狀態儀表板，三者都不是員工集中身分管理的服務。"}, {"id": 392, "question": "一家公司想要一份報告，列出公司 AWS 帳號中所有使用者的多重要素驗證（MFA）裝置狀態。\n哪一種 AWS 功能或服務可以滿足這個需求？", "options": {"A": "AWS 成本與使用報告", "B": "IAM 憑證報告（IAM credential reports）", "C": "詳細帳單報告", "D": "AWS Cost Explorer 報告"}, "correct_answer": "B", "explanation": "正確答案是 B。IAM 憑證報告會列出帳號內每個使用者的憑證狀態，包含是否啟用 MFA 裝置，正好對應題目需求。A、C、D 都是跟帳單/成本相關的報告，都不含使用者 MFA 狀態資訊。"}, {"id": 393, "question": "一家公司想用機器學習能力，分析 Amazon EC2 執行個體的日誌資料，並有效率地進行資安調查。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "Amazon Inspector", "B": "Amazon QuickSight", "C": "Amazon Detective", "D": "Amazon GuardDuty"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon Detective 專門用機器學習與圖形分析技術，整理各種日誌資料，協助資安人員有效率地調查、找出可疑活動的根本原因，正好對應題目需求。A 的 Inspector 是漏洞掃描；B 的 QuickSight 是商業智慧視覺化工具；D 的 GuardDuty 是威脅偵測服務，會產生警示但不是專門做深入調查分析的工具。"}, {"id": 394, "question": "一家公司正在 AWS 雲端推出一款行動應用程式，想讓應用程式的使用者能透過社群媒體身分提供者（IdP）登入。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS Lambda", "B": "Amazon Cognito", "C": "AWS Secrets Manager", "D": "Amazon CloudFront"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon Cognito 內建支援串接 Google、Facebook 等社群媒體身分提供者，讓終端使用者能用社群帳號登入應用程式，正好對應題目需求。A 的 Lambda 是函式運算服務；C 的 Secrets Manager 是密碼管理服務；D 的 CloudFront 是 CDN 服務，三者都不是身分驗證服務。"}, {"id": 395, "question": "哪一種免費（complimentary）的 AWS 服務或工具，能為雲端規劃建立以資料為基礎的商業論證（business case）？", "options": {"A": "Migration Evaluator", "B": "AWS Billing Conductor", "C": "AWS Billing Console", "D": "Amazon Forecast"}, "correct_answer": "A", "explanation": "正確答案是 A。Migration Evaluator 是 AWS 提供的免費工具，會盤點地端環境現況，產生以資料為基礎的商業論證報告，協助企業說服內部決策者上雲。B 的 Billing Conductor 是自訂帳單分攤規則的工具；C 的 Billing Console 是查看帳單的介面；D 的 Forecast 是時間序列預測的機器學習服務，三者都不是產生「上雲商業論證」的工具。"}, {"id": 396, "question": "使用 AWS Cost Explorer 展現的是哪一種雲端概念？", "options": {"A": "資源調整（Rightsizing）", "B": "可靠性", "C": "復原力", "D": "現代化"}, "correct_answer": "A", "explanation": "正確答案是 A。Cost Explorer 內建的 Rightsizing Recommendations 功能，分析既有資源使用狀況並給出規格調整建議，正好體現「資源調整（Rightsizing）」這個概念。B 可靠性、C 復原力、D 現代化，都跟 Cost Explorer 的定位（成本分析與資源調整建議）沒有直接對應關係。"}, {"id": 397, "question": "一家公司想在 AWS 上部署一套非容器化、以 Java 開發的網頁應用程式，想用受管服務快速部署這個應用程式，並希望服務能自動佈建容量、負載平衡、擴縮並監控應用程式健康度。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "Amazon Elastic Container Service（Amazon ECS）", "B": "AWS Lambda", "C": "Amazon Elastic Kubernetes Service（Amazon EKS）", "D": "AWS Elastic Beanstalk"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Elastic Beanstalk 正是為了「快速部署、自動處理容量佈建、負載平衡、擴縮與健康監控」而設計的受管服務，且原生支援非容器化的 Java 應用程式。A 的 ECS、C 的 EKS 都是容器編排服務，題目明確說是「非容器化」應用程式，不適用；B 的 Lambda 是給無伺服器函式用的，不適合部署一般網頁應用程式。"}, {"id": 398, "question": "哪一種 AWS 服務或工具，能讓使用者以「程式化」的方式連接 AWS 並部署資源？", "options": {"A": "Amazon QuickSight", "B": "AWS PrivateLink", "C": "AWS Direct Connect", "D": "AWS SDKs"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS SDK 提供各種程式語言的函式庫，讓開發者能在程式碼中直接呼叫 AWS API，以程式化的方式連接並部署 AWS 資源。A 的 QuickSight 是視覺化工具；B 的 PrivateLink 是私有連線服務；C 的 Direct Connect 是實體專屬網路連線，三者都不是「程式化部署資源」的開發工具。"}, {"id": 399, "question": "一家公司已把網頁應用程式部署在 Amazon EC2 執行個體上，這些 EC2 執行個體的使用率偏低。\n公司應該用哪一種 AWS 服務或功能，來調整這些 EC2 執行個體的規格（rightsize）？", "options": {"A": "AWS Config", "B": "AWS Cost Anomaly Detection", "C": "AWS Budgets", "D": "AWS Compute Optimizer"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Compute Optimizer 正是分析 EC2 執行個體的實際使用狀況，並給出規格調整（rightsizing）建議的服務，正好對應題目「使用率偏低、需要調整規格」的情境。A 的 Config 是設定變更追蹤；B 的 Cost Anomaly Detection 是抓異常花費；C 的 Budgets 是預算警示，三者都不會給出規格調整建議。"}, {"id": 400, "question": "一家公司想定義一套中央化的資料保護政策，能套用在運算、儲存、資料庫等多種 AWS 服務資源上。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS Batch", "B": "AWS Elastic Disaster Recovery", "C": "AWS Backup", "D": "Amazon FSx"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Backup 就是設計來提供中央化的備份/資料保護政策，能一次套用到 EC2、EBS、RDS、DynamoDB 等多種運算、儲存、資料庫資源上。A 的 Batch 是批次運算服務；B 的 Elastic Disaster Recovery 是災難復原服務，聚焦在伺服器復原而非中央化資料保護政策；D 的 FSx 只是特定的檔案系統服務，都不是跨資源類型的中央資料保護政策工具。"}, {"id": 401, "question": "一家公司需要依照業務類別，分類並追蹤 AWS 使用成本。\n公司應該用哪一種 AWS 服務或功能滿足這個需求？", "options": {"A": "成本分配標籤（Cost allocation tags）", "B": "AWS Organizations", "C": "AWS Security Hub", "D": "AWS 成本與使用報告"}, "correct_answer": "A", "explanation": "正確答案是 A。成本分配標籤（Cost Allocation Tags）就是標準做法：先幫資源打上標籤（如部門、專案），啟用成本分配標籤後，帳單就能依標籤維度分類追蹤。B 的 Organizations 是多帳號治理框架；C 的 Security Hub 是安全狀態儀表板，都跟成本分類無關；D 的成本與使用報告雖然資料很細，但要自己額外處理分析，不像標籤那樣直接分類，屬於較繁瑣的替代方案。"}];

const QMAP = Object.fromEntries(QUIZ_DATA.map(q => [q.id, q]));
let wrongIds = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY + "_wrong") || "[]"));

let session = null; // { queue: [id,...], idx, selected: Set, submitted: bool, correctCount, wrongThisRound: Set }

const BATCH_SIZE = 65;

function save() {
  localStorage.setItem(STORAGE_KEY + "_wrong", JSON.stringify([...wrongIds]));
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── 發牌機制：同一輪（把 idPool 全部練過一次）保證不重複，練完整輪才重新洗牌開下一輪 ──
function deckKey(mode) { return STORAGE_KEY + "_deck_" + mode; }

function loadDeckState(mode, idPool) {
  const poolSnapshot = [...idPool].sort((a,b)=>a-b).join(",");
  let deck = JSON.parse(localStorage.getItem(deckKey(mode)) || "null");
  if (!deck || deck.poolSnapshot !== poolSnapshot) {
    deck = { order: shuffle(idPool), cursor: 0, poolSnapshot, round: 1 };
  } else if (deck.cursor >= deck.order.length) {
    deck = { order: shuffle(idPool), cursor: 0, poolSnapshot, round: (deck.round || 1) + 1 };
  }
  return deck;
}
function saveDeckState(mode, deck) {
  localStorage.setItem(deckKey(mode), JSON.stringify(deck));
}
// 取下一批（同一輪內保證跟之前批次不重複）。若該輪剩餘不足 BATCH_SIZE，
// 就直接出剩下的實際題數，不補滿湊數，避免同一輪出現重複題目。
function drawNextBatch(mode, idPool) {
  if (!idPool.length) return { batch: [], round: 1, doneInRound: 0, totalInRound: 0 };
  const deck = loadDeckState(mode, idPool);
  const doneInRoundBefore = deck.cursor;
  const batch = deck.order.slice(deck.cursor, deck.cursor + BATCH_SIZE);
  deck.cursor += batch.length;
  saveDeckState(mode, deck);
  return { batch, round: deck.round, doneInRound: doneInRoundBefore, totalInRound: deck.order.length };
}
function deckProgress(mode, idPool) {
  if (!idPool.length) return null;
  const poolSnapshot = [...idPool].sort((a,b)=>a-b).join(",");
  let deck = JSON.parse(localStorage.getItem(deckKey(mode)) || "null");
  if (!deck || deck.poolSnapshot !== poolSnapshot) return { round: 1, done: 0, total: idPool.length, finished: false };
  return { round: deck.round || 1, done: Math.min(deck.cursor, deck.order.length), total: deck.order.length, finished: deck.cursor >= deck.order.length };
}

function renderStart() {
  const total = QUIZ_DATA.length;
  const wrongCount = wrongIds.size;
  const allIds = QUIZ_DATA.map(q => q.id);
  const prog = deckProgress("all", allIds);
  const nextBatchSize = (prog && !prog.finished) ? Math.min(BATCH_SIZE, prog.total - prog.done) : Math.min(BATCH_SIZE, total);
  const progText = prog
    ? (prog.finished
        ? `第 ${prog.round} 輪已練完，下一次會重新洗牌開始新一輪`
        : `第 ${prog.round} 輪進行中・已練 ${prog.done} / ${prog.total} 題（同一輪不會重複出題）`)
    : `每次出 ${Math.min(BATCH_SIZE, total)} 題，練完一整輪（共 ${total} 題）才會重新洗牌`;
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="badge">AWS 證照題庫</div>
      <div class="title">${escapeHtml(QUIZ_TITLE)}</div>
      <div class="subtitle">${escapeHtml(QUIZ_SUBTITLE)}</div>
      <div class="stat-row">
        <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">總題數</div></div>
        <div class="stat-box"><div class="stat-num" style="color:${wrongCount ? '#e05555' : '#30b86c'}">${wrongCount}</div><div class="stat-label">待複習錯題</div></div>
      </div>
      <div class="q-hint" style="margin-bottom:14px">${escapeHtml(progText)}</div>
      <button class="btn btn-primary" onclick="startQuiz('all')">開始測驗（本次 ${nextBatchSize} 題）</button>
      <button class="btn btn-outline" ${wrongCount ? '' : 'disabled'} onclick="startQuiz('wrong')">只重考錯題（${wrongCount} 題）</button>
      <button class="btn btn-outline" ${wrongCount ? '' : 'disabled'} style="border-color:#f0d060;color:#a07020" onclick="exportWrongQuestions()">📥 匯出錯題（給 Claude 整理概念筆記用）</button>
    </div>
  `;
}

// 把目前答錯的題目（題目/選項/正確答案/詳解）匯出成檔案，下載到瀏覽器預設下載資料夾，
// 檔名固定，方便之後直接請 Claude 讀取分析、整理成概念筆記。
function exportWrongQuestions() {
  const items = [...wrongIds].map(id => QMAP[id]).filter(Boolean);
  if (!items.length) return;
  const payload = {
    quiz: QUIZ_TITLE,
    exportedAt: new Date().toISOString(),
    wrongCount: items.length,
    questions: items.map(q => ({
      id: q.id, question: q.question, options: q.options,
      correct_answer: q.correct_answer, explanation: q.explanation,
    })),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${STORAGE_KEY}_wrong_export.json`;
  a.click();
  URL.revokeObjectURL(url);
}

const PASS_THRESHOLD = 70; // 模擬正式考試及格門檻（百分比）

function startQuiz(mode) {
  const idPool = mode === "wrong" ? [...wrongIds] : QUIZ_DATA.map(q => q.id);
  if (!idPool.length) return;
  const { batch, round, doneInRound, totalInRound } = drawNextBatch(mode, idPool);
  if (!batch.length) return;
  session = { mode, queue: batch, idx: 0, selected: new Set(), submitted: false, correctCount: 0, wrongThisRound: new Set(), round, roundDoneBefore: doneInRound, roundTotal: totalInRound };
  session.optionOrder = buildOptionOrder(currentQ());
  renderQuestion();
}

function currentQ() { return QMAP[session.queue[session.idx]]; }

// 每次進入一題時，把選項內容重新洗牌（顯示標籤仍是 A/B/C/D...，但底下塞的內容順序會變），
// 避免練到後面變成背「答案是第幾個」而不是真的搞懂概念。同一題作答過程中（送出前後）順序不會再變。
function buildOptionOrder(q) {
  const origLetters = Object.keys(q.options);
  const shuffledOrig = shuffle(origLetters);
  return shuffledOrig.map((orig, i) => ({ display: origLetters[i], orig, text: q.options[orig] }));
}

function toggleOption(letter) {
  if (session.submitted) return;
  const q = currentQ();
  const multi = q.correct_answer.length > 1;
  if (multi) {
    if (session.selected.has(letter)) session.selected.delete(letter);
    else session.selected.add(letter);
  } else {
    session.selected = new Set([letter]);
  }
  renderQuestion();
}

function renderQuestion() {
  const q = currentQ();
  const total = session.queue.length;
  const multi = q.correct_answer.length > 1;
  const correctOrigSet = new Set(q.correct_answer.split(""));
  const optionOrder = session.optionOrder; // [{display, orig, text}, ...]（每題洗牌過一次）

  const optsHtml = optionOrder.map(({ display, orig, text }) => {
    const isSelected = session.selected.has(display);
    let cls = "opt";
    let mark = "";
    if (session.submitted) {
      if (correctOrigSet.has(orig)) { cls += " correct"; mark = "✓"; }
      else if (isSelected) { cls += " wrong"; mark = "✗"; }
    } else if (isSelected) {
      cls += " selected";
    }
    const inputType = multi ? "checkbox" : "radio";
    return `<div class="${cls}" onclick="toggleOption('${display}')">
      <input type="${inputType}" ${isSelected ? "checked" : ""} ${session.submitted ? "disabled" : ""} onclick="event.stopPropagation()">
      <span class="opt-letter">${display}.</span>
      <span class="opt-text">${escapeHtml(text)}</span>
      ${mark ? `<span class="opt-mark">${mark}</span>` : ""}
    </div>`;
  }).join("");

  const selectedOrigSorted = [...session.selected].map(d => optionOrder.find(o => o.display === d).orig).sort().join("");
  const wasCorrect = session.submitted && selectedOrigSorted === q.correct_answer.split("").sort().join("");
  const correctDisplayLetters = optionOrder.filter(o => correctOrigSet.has(o.orig)).map(o => o.display).sort().join("、");

  const feedbackHtml = session.submitted ? `
    <div class="feedback-banner ${wasCorrect ? 'correct' : 'wrong'}">
      ${wasCorrect ? '✓ 答對了' : `✗ 答錯了・正確答案：${correctDisplayLetters}`}
    </div>
    ${q.explanation ? `<div class="explanation"><div class="explanation-label">詳解</div>${escapeHtml(q.explanation)}</div>` : ""}
  ` : "";

  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(session.idx / total) * 100}%"></div></div>
        <div class="progress-text">${session.idx + 1} / ${total}</div>
      </div>
      <div class="q-text">${escapeHtml(q.question)}</div>
      ${multi ? `<div class="q-hint">請選擇 ${q.correct_answer.length} 個答案</div>` : ""}
      <div style="margin-top:14px">${optsHtml}</div>
      ${feedbackHtml}
      ${session.submitted
        ? `<button class="btn btn-primary" onclick="nextQuestion()">${session.idx + 1 < total ? "下一題" : "查看結果"}</button>`
        : `<button class="btn btn-primary" ${session.selected.size ? "" : "disabled"} onclick="submitAnswer()">送出答案</button>`
      }
    </div>
  `;
}

function submitAnswer() {
  const q = currentQ();
  const optionOrder = session.optionOrder;
  const correctSet = q.correct_answer.split("").sort().join("");
  const selSet = [...session.selected].map(d => optionOrder.find(o => o.display === d).orig).sort().join("");
  const isCorrect = selSet === correctSet;
  session.submitted = true;
  if (isCorrect) {
    session.correctCount++;
    if (wrongIds.has(q.id)) { wrongIds.delete(q.id); save(); }
  } else {
    session.wrongThisRound.add(q.id);
    wrongIds.add(q.id);
    save();
  }
  renderQuestion();
}

function nextQuestion() {
  if (session.idx + 1 < session.queue.length) {
    session.idx++;
    session.selected = new Set();
    session.submitted = false;
    session.optionOrder = buildOptionOrder(currentQ());
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult() {
  const total = session.queue.length;
  const correct = session.correctCount;
  const pct = Math.round((correct / total) * 100);
  const wrongList = [...session.wrongThisRound].map(id => QMAP[id]);

  const roundDoneAfter = Math.min(session.roundDoneBefore + total, session.roundTotal);
  const roundFinished = roundDoneAfter >= session.roundTotal;
  const roundProgText = session.mode === "all"
    ? (roundFinished
        ? `第 ${session.round} 輪已全部練完（${session.roundTotal} 題），下一次開始新一輪`
        : `第 ${session.round} 輪進度：已練 ${roundDoneAfter} / ${session.roundTotal} 題`)
    : "";
  const nextAllLabel = session.mode === "all"
    ? (roundFinished ? "開始下一輪" : `繼續本輪（下 ${Math.min(BATCH_SIZE, session.roundTotal - roundDoneAfter)} 題）`)
    : "開始測驗";

  const passed = pct >= PASS_THRESHOLD;
  const passBadge = `
    <div style="display:inline-block;margin-top:10px;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:800;background:${passed ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.2)'}">
      ${passed ? '✓ 通過' : '✗ 未通過'}（及格門檻 ${PASS_THRESHOLD} 分）
    </div>`;

  document.getElementById("app").innerHTML = `
    <div class="score-hero">
      <div class="score-big">${correct} / ${total}</div>
      <div class="score-sub">答對率 ${pct} 分${session.mode === 'wrong' ? '（錯題複習模式）' : ''}</div>
      ${passBadge}
    </div>
    ${roundProgText ? `<div class="card center" style="padding:12px 16px;color:#4f7be8;font-weight:600;font-size:13px">${escapeHtml(roundProgText)}</div>` : ""}
    ${wrongList.length ? `
    <div class="card">
      <div class="explanation-label" style="margin-bottom:10px">本輪答錯的題目（${wrongList.length} 題，已加入錯題本）</div>
      ${wrongList.map(q => `<div class="wrong-list-item"><span><span class="wrong-q-num">#${q.id}</span>${escapeHtml(q.question.slice(0, 40))}${q.question.length > 40 ? '…' : ''}</span></div>`).join("")}
    </div>` : `<div class="card center" style="color:#30b86c;font-weight:700">🎉 全對，太強了！</div>`}
    <div class="card">
      <button class="btn btn-primary" onclick="startQuiz('all')">${escapeHtml(nextAllLabel)}</button>
      <button class="btn btn-outline" ${wrongIds.size ? '' : 'disabled'} onclick="startQuiz('wrong')">只考錯題（${wrongIds.size} 題）</button>
      <button class="btn btn-outline" onclick="renderStart()" style="border-color:#e4e8ef;color:#888">回首頁</button>
    </div>
  `;
}

renderStart();
</script>
</body>
</html>
