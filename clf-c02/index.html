業內部網站的服務、Elastic Beanstalk 是應用程式部署平台，都無法解決「串流應用程式給低規格裝置用」這個需求。"}, {"id": 153, "question": "一家公司希望查詢其伺服器日誌以深入瞭解其客戶體驗。哪種AWS 服務能夠以最具成本效益的方式儲存這些資料？", "options": {"A": "亞馬遜極光 (Amazon Aurora)", "B": "亞馬遜彈性檔案系統(Amazon EFS)", "C": "亞馬遜彈性塊儲存（亞馬遜EBS）", "D": "亞馬遜S3"}, "correct_answer": "D", "explanation": "查詢伺服器日誌這種資料量大、存取頻率不固定的場景，用 Amazon S3 儲存最划算，單位儲存成本低，還能搭配 Athena 之類的服務直接查詢，答案是 D。Aurora 是關聯式資料庫，拿來存日誌成本高又不划算；EFS 是共享檔案系統，設計給多台伺服器同時掛載讀寫用；EBS 則是綁定單一 EC2 例項的區塊儲存，三者都不是存放大量日誌檔最省錢的選擇。"}, {"id": 154, "question": "以下哪項是AWS 雲架構的推薦設計原則？", "options": {"A": "設計緊密耦合的元件。", "B": "構建可以處理所有應用程式功能的單個應用程式元件。", "C": "在較少的迭代中進行較大的更改，以減少失敗的機會。", "D": "透過分割工作負載來避免單一架構。"}, "correct_answer": "D", "explanation": "AWS 架構設計原則裡很重要的一條是「避免單一故障點」，做法就是把整個工作負載拆分成多個獨立元件，任何一個環節出問題不會拖垮整個系統，答案是 D。緊密耦合、單一元件扛所有功能、一次做大改動這幾個做法剛好都跟雲端架構「鬆散耦合 (Loose Coupling)、小步快跑、容錯設計」的最佳實踐背道而馳，是刻意設計的錯誤選項。"}, {"id": 155, "question": "哪種AWS 服務可以幫助使用者稽核其AWS 賬戶中的API 活動？", "options": {"A": "AWS 雲跟蹤 (AWS CloudTrail)", "B": "亞馬遜檢查員 (Amazon Inspector)", "C": "AWS 網路應用防火牆 (AWS WAF)", "D": "AWS配置 (AWS Config)"}, "correct_answer": "A", "explanation": "AWS CloudTrail 會記錄帳戶內所有 API 呼叫的軌跡，包含誰在什麼時間、用什麼方式做了什麼操作，非常適合拿來做稽核，答案是 A。Amazon Inspector（題目寫成檢查員）是自動化弱點掃描工具、AWS WAF 是防禦網路攻擊的防火牆、AWS Config 則是追蹤資源設定變化的服務，三者關注的都不是 API 呼叫紀錄本身。"}, {"id": 156, "question": "根據AWS 責任共擔模型，哪項任務是客戶的責任？", "options": {"A": "來賓作業系統的管理", "B": "基礎設施裝置配置維護", "C": "主機作業系統和虛擬化的管理", "D": "維護支援可用區 (Availability Zone)的軟體"}, "correct_answer": "A", "explanation": "客體作業系統（Guest OS，也就是 EC2 例項裡使用者自己安裝的作業系統）的修補與管理是客戶的責任，屬於「雲端內的安全」，答案是 A。基礎設施設備維運、主機作業系統與虛擬化層管理、可用區 (Availability Zone)背後的軟體維護，這些都是實體硬體或虛擬化底層的工作，全部由 AWS 負責，客戶碰不到也不需要管。"}, {"id": 157, "question": "一家公司希望自動新增和刪除Amazon EC2 例項。該公司希望EC2 例項能夠適應不同的工作負載動態地。哪些服務或功能可以滿足這些要求？", "options": {"A": "亞馬遜動態資料庫 (Amazon DynamoDB)", "B": "Amazon EC2 Spot 例項", "C": "AWS 雪系列 (AWS Snow Family)", "D": "亞馬遜EC2 自動縮 (Amazon EC2 Auto Scaling)"}, "correct_answer": "D", "explanation": "Amazon EC2 Auto Scaling 能依照設定的規則，隨著流量或負載變化自動增加或減少例項數量，完全符合「動態適應不同工作負載」的需求，答案是 D。DynamoDB 是資料庫服務、Spot 例項只是一種便宜但可能被收回的購買方式、AWS Snow 系列是實體資料搬遷裝置，這三者都不具備自動增減運算資源的功能。"}, {"id": 158, "question": "使用者希望安全地自動化應用程式之間共享的憑據的管理和輪換，同時在管理任務上花費最少的時間。可以使用哪些AWS 服務或功能來實現此目的？", "options": {"A": "AWS 雲HSM (AWS CloudHSM)", "B": "AWS 金鑰管理服務(AWS KMS)", "C": "AWS 秘密管理器 (AWS Secrets Manager)", "D": "伺服器端加密"}, "correct_answer": "C", "explanation": "AWS Secrets Manager 專門用來集中管理應用程式間共用的密碼、API 金鑰等敏感憑證，還內建自動輪換功能，不需要人工介入就能定期更新憑證，答案是 C。CloudHSM 是給有嚴格合規需求、需要自己掌控硬體加密模組的場景用；KMS 主要負責加密金鑰的建立與管理，不是憑證輪換；伺服器端加密只是資料靜態加密的機制，跟憑證管理是兩回事。"}, {"id": 159, "question": "哪種安全服務可以自動識別AWS 上的敏感資料或智慧財產權並對其進行分類？", "options": {"A": "亞馬遜GuardDuty", "B": "亞馬遜麥西 (Amazon Macie)", "C": "亞馬遜檢查員 (Amazon Inspector)"}, "correct_answer": "B", "explanation": "Amazon Macie 運用機器學習自動掃描 S3 裡的資料，辨識出個資、信用卡號這類敏感資訊或智慧財產，並幫忙分類標記，答案是 B。GuardDuty 是威脅偵測服務，專注找可疑的惡意行為；Inspector 是弱點掃描工具，檢查的是系統或應用程式的安全漏洞，兩者都不是拿來分類辨識敏感資料內容的服務。"}, {"id": 160, "question": "哪些操作是AWS 賬戶根使用者的最佳實踐？（選擇兩個。）", "options": {"A": "與團隊成員共享root 使用者憑據。", "B": "為帳戶建立多個root使用者，並按環境分隔。", "C": "對root 使用者啟用多重身份驗證(MFA)。", "D": "建立具有管理員許可權的IAM 使用者來執行日常管理任務，而不是使用根使用者。", "E": "使用程式設計訪問而不是root 使用者和密碼。"}, "correct_answer": "CD", "explanation": "根使用者（Root User）擁有帳戶最高權限，一旦外洩風險極大，所以最佳實踐是替它開啟多重要素驗證（MFA）加強保護，同時平常的管理工作改用另外建立、權限經過限縮的 IAM 使用者來執行，把根使用者收起來只在必要時才用，答案是 CD。共享根使用者憑證、幫帳戶建立多個根使用者、用程式化存取取代根使用者密碼，這些做法要嘛違反最基本的安全常識，要嘛選項本身邏輯就不成立（根使用者本來就只能有一個，也沒有程式化存取的用法）。"}, {"id": 161, "question": "一家公司正在Amazon RDS 資料庫例項上執行關鍵工作負載。公司要求資料庫例項高可用，恢復時間小於5分鐘。哪種解決方案可以滿足這些要求？", "options": {"A": "建立資料庫例項的只讀副本。", "B": "使用AWS CloudFormation 建立資料庫例項的模板。", "C": "頻繁拍攝資料庫例項快照。將快照儲存在Amazon S3 中。", "D": "將資料庫例項修改為多可用區 (Availability Zone)部署。"}, "correct_answer": "D", "explanation": "把 RDS 資料庫例項改成多可用區（Multi-AZ）部署，AWS 會在背後自動維護一個待命的複本，主節點一旦故障就能自動切換到待命節點，通常在幾十秒到一兩分鐘內完成，遠低於題目要求的 5 分鐘，答案是 D。唯讀複本本身不會自動接手成為主要寫入節點，需要人工介入才能升級；CloudFormation 只是基礎設施部署工具、快照存到 S3 則是備份手段，兩者的復原時間都遠遠超過 5 分鐘，不符合高可用的要求。"}, {"id": 162, "question": "一家公司計劃將其應用程式遷移到AWS 並在Amazon EC2 例項上執行該應用程式。該應用程式可連續使用1 年。哪種EC2 例項購買選項能夠最經濟高效地滿足這些要求？", "options": {"A": "預留例項 (Reserved Instance)", "B": "現貨例項 (Spot Instance)", "C": "按需例項 (On-Demand Instance)", "D": "專用主機 (Dedicated Host)"}, "correct_answer": "A", "explanation": "應用程式確定會連續使用滿 1 年，這種用量穩定、時間長度明確的情境，最適合用預留例項（Reserved Instance）事先承諾使用時長來換取比隨選便宜很多的價格，答案是 A。現貨例項 (Spot Instance)便宜但隨時可能被收回，不適合要求持續運行的正式應用；隨選例項 (On-Demand Instance)雖然彈性但沒有折扣，長期用下來成本最高；專用主機 (Dedicated Host)是為合規或授權限制服務，價格更貴也不是這裡的考量點。"}, {"id": 163, "question": "公司需要在Amazon S3 儲存桶和本地應用程式之間傳輸資料。根據AWS 責任共擔模型，誰負責這些資料的安全？", "options": {"A": "公司", "B": "AWS", "C": "防火牆供應商", "D": "AWS Marketplace 合作伙伴"}, "correct_answer": "A", "explanation": "資料不論是靜態存放在 S3，還是傳輸過程中，「資料本身的安全」都屬於「雲端內的安全」範疇，依照責任共擔模型是由公司（客戶）負責，包含設定正確的加密、存取控制、傳輸協定等，答案是 A。AWS 只負責維護底層基礎設施與服務的安全性，防火牆供應商和 AWS Marketplace 合作夥伴都只是可能被公司選用的第三方工具或通路，不會是責任共擔模型裡定義的責任方。"}, {"id": 164, "question": "AWS 架構完善框架 (AWS Well-Architected Framework)的哪個支柱是指系統從基礎設施或服務中斷中恢復的能力以及動態獲取計算資源以滿足需求？", "options": {"A": "安全", "B": "可靠性", "C": "效能效率 (Performance Efficiency)", "D": "成本最佳化 (Cost Optimization)"}, "correct_answer": "B", "explanation": "可靠性（Reliability）這個支柱講的正是系統能不能從基礎設施或服務中斷中順利恢復，並且能動態取得足夠的運算資源來應付需求變化，答案是 B。安全講的是保護資料與系統、效能效率 (Performance Efficiency)講的是有效率地運用運算資源達成效能目標、成本最佳化 (Cost Optimization)講的是花最少的錢達成目標，四個支柱各自關注的面向不同，題目描述精準對應可靠性。"}, {"id": 165, "question": "一家公司想要識別與另一個AWS 賬戶共享的Amazon S3 儲存桶。哪些AWS 服務或功能可以滿足這些要求？", "options": {"A": "AWS湖組 (AWS Lake Formation)", "B": "IAM 憑證報告 (IAM Credential Report)", "C": "亞馬遜雲觀察 (Amazon CloudWatch)", "D": "IAM 訪問分析器 (IAM Access Analyzer)"}, "correct_answer": "D", "explanation": "IAM Access Analyzer（存取分析器）可以自動掃描並列出哪些資源（包含 S3 儲存桶）被分享給了帳戶外部的實體，例如另一個 AWS 帳戶，正好對應題目需求，答案是 D。AWS Lake Formation（題目寫成湖組）是用來建置資料湖與管理資料存取權限的服務；IAM 憑證報告 (IAM Credential Report)只列出帳戶內使用者憑證的使用狀況；CloudWatch 是監控指標與日誌的服務，三者都不是專門用來找出跨帳戶共享資源的工具。"}, {"id": 166, "question": "哪種AWS 服務使使用者能夠構建包含機器學習見解的互動式商業智慧儀表板？", "options": {"A": "亞馬遜雅典娜 (Amazon Athena)", "B": "亞馬遜肯德拉 (Amazon Kendra)", "C": "亞馬遜QuickSight"}, "correct_answer": "C", "explanation": "Amazon QuickSight 是 AWS 的商業智慧（BI）儀表板服務，內建 ML Insights 功能，能自動偵測資料裡的異常值、做趨勢預測，幫使用者做出包含機器學習洞察的互動式儀表板，答案是 C。Amazon Athena 是用 SQL 查詢 S3 資料的服務、Amazon Kendra 是智慧搜尋服務，兩者都不具備建立互動式 BI 儀表板的能力。"}, {"id": 167, "question": "以下哪一項是描述使用者根據需求擴充套件基礎設施的能力的AWS 價值主張？", "options": {"A": "創新速度", "B": "資源彈性", "C": "解耦架構", "D": "全球部署"}, "correct_answer": "B", "explanation": "資源彈性（Resource Elasticity）指的就是使用者可以隨著需求變化，快速增加或減少基礎設施規模，不用事先預估或囤積硬體，答案是 B。創新速度講的是縮短開發到上市的時間、解耦架構講的是元件互相獨立設計、全球部署講的是能快速在世界各地佈建服務，這三個都是 AWS 的價值主張沒錯，但都不是在講「依需求擴充基礎設施」這件事本身。"}, {"id": 168, "question": "哪種操作是訪問儲存在Amazon S3 儲存桶中的敏感資料的安全最佳實踐？", "options": {"A": "在S3 儲存桶上啟用S3 跨區域複製(CRR)。", "B": "對需要訪問S3 儲存桶的應用程式使用IAM 角色 (IAM Role)。", "C": "配置AWS WAF 以防止未經授權訪問S3 儲存桶。", "D": "配置Amazon GuardDuty 以防止未經授權訪問S3 儲存桶。"}, "correct_answer": "B", "explanation": "存取 S3 裡的敏感資料，安全最佳實踐是讓應用程式透過 IAM 角色（Role）來取得暫時性的憑證存取權限，不需要把長期存取金鑰 (Access Key)寫死在程式碼或設定檔裡，大幅降低金鑰外洩風險，答案是 B。跨區域複製是用來做災難備援跟資料分散，防止未經授權存取只是附帶效果不是主要設計目的；WAF 是防禦網路層攻擊（例如 SQL Injection）的防火牆、GuardDuty 是威脅偵測服務，兩者都不是用來管理誰能存取 S3 儲存桶的機制。"}, {"id": 169, "question": "一家公司希望更多地瞭解雲端計算提供的優勢。該公司希望瞭解運營優勢敏捷。AWS 如何為使用者提供敏捷性 (Agility)？", "options": {"A": "透過將工作負載部署到多個區域來確保高可用性 (High Availability)的能力", "B": "許多服務和資源的即用即付模式", "C": "將基礎設施管理轉移到AWS 雲的能力", "D": "能夠以最小的努力快速配置和取消配置資源"}, "correct_answer": "D", "explanation": "敏捷性（Agility）指的是雲端能讓使用者用很少的力氣，快速把運算資源開起來，不需要用時就快速關掉、釋放資源，大幅縮短從想法到實際部署的時間，答案是 D。多區域部署講的是高可用性 (High Availability)、即用即付模式講的是成本效益、轉移基礎設施管理責任講的是省去維運負擔，這三個雖然都是雲端優點，但都不是「敏捷性 (Agility)」這個特定價值主張想強調的重點。"}, {"id": 170, "question": "公司需要一箇中央使用者門戶，以便使用者可以登入支援安全斷言標記語言(SAML) 2.0 的第三方業務應用程式。哪種AWS 服務可以滿足此要求？", "options": {"A": "AWS 身份和訪問管理(IAM)", "B": "亞馬遜認知 (Amazon Cognito)", "C": "AWS IAM 身份中心（AWS 單點登入 (AWS IAM Identity Center)）", "D": "AWS CLI"}, "correct_answer": "C", "explanation": "AWS IAM Identity Center（原本叫 AWS SSO）提供一個中央入口，讓使用者登入一次就能存取多個支援 SAML 2.0 的第三方商業應用程式，不用每個系統各自登入一次，答案是 C。IAM 是管理 AWS 資源存取權限的服務，不是拿來做第三方應用單一登入入口；Amazon Cognito 主要是給開發者的應用程式提供使用者驗證與註冊功能；AWS CLI 只是命令列操作工具，三者都不符合「中央使用者門戶」的定位。"}, {"id": 171, "question": "使用者應該使用哪種AWS 服務來了解AWS 服務的可用性和操作？", "options": {"A": "亞馬遜事件橋 (Amazon EventBridge)", "B": "AWS 服務目錄 (AWS Service Catalog)", "C": "AWS 控制塔 (AWS Control Tower)", "D": "AWS 健康儀表板 (AWS Health Dashboard)"}, "correct_answer": "D", "explanation": "AWS Health Dashboard 是官方即時公告 AWS 各服務可用性與維運狀態的地方,包含服務中斷、維護通知,搭配帳號等級的 Personal Health Dashboard。Amazon EventBridge 是事件整合工具,AWS Service Catalog 是自助部署目錄,AWS Control Tower 是多帳號治理 (Governance)工具,三者都不是拿來看服務狀態的,所以答案是 D。"}, {"id": 172, "question": "哪些AWS 服務或工具可用於捕獲有關Amazon VPC 中入站和出站流量的資訊？", "options": {"A": "VPC流日誌 (VPC Flow Logs)", "B": "亞馬遜檢查員 (Amazon Inspector)", "C": "VPC端點 (VPC Endpoint)服務", "D": "NAT閘道器 (NAT Gateway)"}, "correct_answer": "A", "explanation": "VPC 流日誌(VPC Flow Logs)專門擷取進出 VPC 網路介面的流量中繼資料,可記錄來源 / 目的地 IP、埠號、協定等,常用於網路除錯與安全稽核。Amazon Inspector 是漏洞掃描服務,VPC 端點服務是私下存取 AWS 服務的機制,NAT 閘道器是對外連線元件,都跟流量記錄無關,答案是 A。"}, {"id": 173, "question": "根據AWS 責任共擔模型，客戶始終負責管理什麼？", "options": {"A": "軟體許可", "B": "聯網", "C": "客戶資料", "D": "加密金鑰"}, "correct_answer": "C", "explanation": "責任共擔模型中,AWS 負責「雲的安全」(硬體、機房、虛擬化層),客戶負責「雲中的安全」。客戶資料不管用哪種服務、部署模式,永遠都是客戶自己要保護、加密與控管存取的項目。軟體授權、聯網責任、加密金鑰管理都可能依情境由 AWS 分擔一部分,只有客戶資料是「永遠」由客戶負責,答案是 C。"}, {"id": 174, "question": "哪種AWS 服務可用於按需檢索合規性報告？", "options": {"A": "AWS 秘密管理器 (AWS Secrets Manager)", "B": "AWS 神器 (AWS Artifact)", "C": "AWS 安全中心 (AWS Security Hub)", "D": "AWS 證書管理器 (AWS Certificate Manager)"}, "correct_answer": "B", "explanation": "AWS Artifact 是隨選下載 AWS 合規性報告與協議文件的入口,例如 SOC 報告、PCI DSS 認證文件,方便企業做稽核佐證。AWS Secrets Manager 存放機敏憑證,AWS Security Hub 彙整安全發現,AWS Certificate Manager 管理 SSL/TLS 憑證,都跟下載合規報告無關,只有 B AWS Artifact 是專門做這件事的服務。"}, {"id": 175, "question": "哪種AWS 服務允許使用者使用預定義的評估模板檢查Amazon EC2 例項上的漏洞？", "options": {"A": "AWS 網路應用防火牆 (AWS WAF)", "B": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "C": "亞馬遜檢查員 (Amazon Inspector)"}, "correct_answer": "C", "explanation": "Amazon Inspector 提供預先定義好的評估範本(Assessment Templates),自動掃描 EC2 執行個體或容器映像找出已知漏洞與偏離最佳實務的設定。AWS WAF 是網頁應用防火牆,擋攻擊流量而非掃描評估;AWS Trusted Advisor 給的是成本、效能、安全等通用健檢建議,沒有針對 EC2 漏洞的專屬評估範本,答案是 C。"}, {"id": 176, "question": "一家公司計劃遷移到AWS 雲。該公司正在收集有關其本地基礎設施的資訊，並需要主機名、IP 地址和MAC 地址等資訊。哪種AWS 服務可以滿足這些要求？", "options": {"A": "AWS 資料同步 (AWS DataSync)", "B": "AWS應用程式遷移服務 (AWS Application Migration Service)", "C": "AWS 應用程式發現服務 (AWS Application Discovery Service)", "D": "AWS 資料庫遷移服務(AWS DMS)"}, "correct_answer": "C", "explanation": "AWS Application Discovery Service 專門用於遷移前盤點,收集地端伺服器與資料庫組態,包括主機名稱、IP 位址、MAC 位址,以及 CPU、記憶體等使用狀況。AWS DataSync 是檔案傳輸服務,AWS Application Migration Service(MGN)是實際搬遷執行工具,AWS DMS 專做資料庫遷移,都不是盤點階段用的,答案是 C。"}, {"id": 177, "question": "哪項操作將有助於提高AWS 雲的安全性？", "options": {"A": "為所有IAM 使用者啟用程式設計訪問。", "B": "使用IAM 使用者而不是IAM 角色 (IAM Role)來委派許可權。", "C": "重複輪換訪問金鑰 (Access Key)。", "D": "使用內聯策略而不是客戶管理的策略。"}, "correct_answer": "C", "explanation": "定期輪換存取金鑰(Access Key)能降低金鑰外洩後被長期濫用的風險,是官方建議的安全實務。幫所有 IAM 使用者開程式化存取反而擴大攻擊面;應優先用 IAM 角色 (IAM Role)而非 IAM 使用者委派權限,選項寫反了;內嵌原則比客戶管理原則更難維護與稽核,方向也錯。唯一真的能提升安全性的做法是 C。"}, {"id": 178, "question": "一家公司正計劃將其應用程式遷移到AWS 雲。公司應使用哪種AWS 工具或資源集來分析和評估其遷移準備情況？", "options": {"A": "AWS 雲採用框架(AWS CAF)", "B": "AWS 定價計算器 (AWS Pricing Calculator)", "C": "AWS 架構完善的框架 (AWS Well-Architected Framework)", "D": "AWS 預算 (AWS Budgets)"}, "correct_answer": "A", "explanation": "AWS 雲採用框架(AWS CAF)專門協助企業評估遷移雲端前的整體準備度,涵蓋商業、人員、治理 (Governance)、平台、安全、營運六大能力面向。AWS 定價計算器 (AWS Pricing Calculator)只是估費工具,AWS Well-Architected Framework 是檢視既有架構品質好壞的框架,AWS 預算 (AWS Budgets)是成本控管工具,都不是遷移準備度評估工具,答案是 A。"}, {"id": 179, "question": "以下哪項描述了Amazon S3 的一些核心功能？", "options": {"A": "Amazon S3 是一種高效能塊儲存服務，專為與Amazon EC2 配合使用而設計。", "B": "Amazon S3 是一種物件儲存服務，可提供高階效能、安全性、可擴充套件性 (Scalability)和資料可用性。", "C": "Amazon S3 是一個完全託管、高度可靠且可擴充套件的檔案儲存系統，可透過行業標準SMB 協議進行訪問。", "D": "Amazon S3 是一種可擴充套件、完全託管的彈性NFS，可與AWS 雲服務和本地資源結合使用。"}, "correct_answer": "B", "explanation": "Amazon S3 的核心定位是物件儲存服務(Object Storage),強調高耐用性、高可用性 (High Availability)、可擴充性,可存放近乎無限量物件。選項 A 描述的是區塊儲存(EBS 的特色),C 描述透過 SMB 存取的檔案系統(FSx 的特色),D 描述可擴充的 NFS(EFS 的特色),都把 S3 跟其他儲存服務搞混了,答案是 B。"}, {"id": 180, "question": "按需技術服務使公司能夠用可變費用取代前期固定費用，這體現了AWS 的哪些優勢？", "options": {"A": "高可用性 (High Availability)", "B": "規模經濟 (Economies of Scale)", "C": "按量付費定價", "D": "全球範圍"}, "correct_answer": "C", "explanation": "這題考的是雲運算優勢之一:「用可變費用取代前期固定投資」,即按量付費(Pay-as-you-go),不用先花大錢買硬體。高可用性 (High Availability)講系統穩定運行,規模經濟 (Economies of Scale)講大量採購壓低單位成本,全球範圍講快速部署到各地資料中心,都不是在講費用模式,精準對應的是 C 按量付費定價。"}, {"id": 181, "question": "哪些AWS 服務或功能允許使用者將本地網路連線到VPC？（選擇兩個。）", "options": {"A": "AWS VPN", "B": "彈性負載均衡 (Elastic Load Balancing)", "C": "AWS 直連 (AWS Direct Connect)", "D": "VPC 對等互連", "E": "亞馬遜雲前 (Amazon CloudFront)"}, "correct_answer": "AC", "explanation": "地端網路連上 VPC 常見兩種做法:AWS VPN(透過網際網路建立加密 IPsec 通道,快、便宜但頻寬延遲較不穩定)與 AWS Direct Connect(專線直接實體連接,穩定但申請耗時)。彈性負載均衡 (Elastic Load Balancing)是分散流量的,VPC 對等互連連的是兩個 VPC,CloudFront 是 CDN 服務,都跟地端連線無關,答案是 A、C。"}, {"id": 182, "question": "使用者需要在AWS上快速部署非關係型資料庫。使用者不想管理底層硬體或資料庫軟體。可以使用哪種AWS 服務來完成此任務？", "options": {"A": "亞馬遜RDS", "B": "亞馬遜動態資料庫 (Amazon DynamoDB)", "C": "亞馬遜極光 (Amazon Aurora)"}, "correct_answer": "B", "explanation": "Amazon DynamoDB 是全託管 NoSQL 資料庫,使用者不用管底層伺服器、作業系統或資料庫軟體,建表即可用,適合快速部署非關聯式資料庫。Amazon RDS 與 Amazon Aurora 雖也是託管服務,但都是關聯式資料庫,不符合「非關聯式」要求,答案是 B。"}, {"id": 183, "question": "哪些行動是公司努力調整其AWS 資源以控制雲成本的示例？（選擇兩個。）", "options": {"A": "從Amazon RDS 切換到Amazon DynamoDB 以適應NoSQL 資料集。", "B": "根據過去的使用模式選擇Amazon EC2 例項型別。", "C": "使用Amazon S3 生命週期策略將使用者不經常訪問的物件移動到成本較低的儲存層。", "D": "對Amazon RDS 使用多可用區 (Availability Zone)部署。", "E": "將現有Amazon EC2 例項替換為AWS Elastic Beanstalk"}, "correct_answer": "BC", "explanation": "成本優化的核心是「依實際需求調整資源規模」。根據過去使用模式選擇合適 EC2 執行個體類型可避免浪費;用 S3 生命週期政策把冷資料移到低成本儲存層也是標準省錢做法。換 DynamoDB 是架構重設計而非省錢,多可用區 (Availability Zone)部署是為了可用性反而增加成本,換 Elastic Beanstalk 只是換部署方式不會自動省錢,答案是 B、C。"}, {"id": 184, "question": "公司可以使用哪些AWS 服務或功能將安全規則應用於特定的Amazon EC2 例項？", "options": {"A": "網路ACL", "B": "安全組 (Security Group)", "C": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "D": "AWS 網路應用防火牆 (AWS WAF)"}, "correct_answer": "B", "explanation": "安全組(Security Group)是掛在個別 EC2 執行個體(網路介面)上的虛擬防火牆,可針對特定執行個體設定進出流量規則。網路 ACL 是子網路層級的規則,AWS Trusted Advisor 是帳號健檢建議工具,AWS WAF 保護的是 Web 應用層,都不是套用到特定 EC2 執行個體的機制,答案是 B。"}, {"id": 185, "question": "哪些設計原則支援AWS 架構完善框架 (AWS Well-Architected Framework)的可靠性支柱？（選擇兩個。）", "options": {"A": "作為程式碼執行操作。", "B": "啟用可追溯性。", "C": "自動擴充套件以滿足需求。", "D": "在全球範圍內部署資源以縮短響應時間。", "E": "自動從故障中恢復。"}, "correct_answer": "CE", "explanation": "Well-Architected Framework 可靠性支柱的設計原則包含「自動擴充以應付需求變化」和「自動從故障中復原」,強調系統自我調節、自我修復。「操作寫成程式碼」和「啟用可追溯性」屬於卓越營運 (Operational Excellence)支柱,「全球部署縮短回應時間」屬於效能效率 (Performance Efficiency)支柱,真正屬於可靠性支柱的是 C、E。"}, {"id": 186, "question": "一家使用AWS 的公司需要傳輸2 TB 的資料。哪種型別的資料傳輸不會給公司帶來任何成本？", "options": {"A": "來自網際網路的入站資料傳輸", "B": "出站資料傳輸到網際網路", "C": "AWS 區域之間的資料傳輸", "D": "可用區 (Availability Zone)之間的資料傳輸"}, "correct_answer": "A", "explanation": "資料傳輸費用的基本規則是「進 AWS 免費、出 AWS 收費」,從網際網路傳資料進來完全不收費,不管傳多少量。資料從 AWS 出去到網際網路要收費,跨 AWS 區域傳輸也會計費,跨可用區 (Availability Zone)傳輸同樣計費(單價通常較低)。只有從網際網路傳入 AWS 這個方向完全免費,答案是 A。"}, {"id": 187, "question": "一家公司希望建立可重複使用的模板來部署多個AWS 資源。公司可以使用哪些AWS 服務或功能來滿足此要求？", "options": {"A": "AWS 市場 (AWS Marketplace)", "B": "亞馬遜機器映像(AMI)", "C": "AWS 雲形成 (AWS CloudFormation)", "D": "AWS OpsWorks"}, "correct_answer": "C", "explanation": "AWS CloudFormation 是基礎設施即程式碼服務,用範本描述一整組 AWS 資源,能重複部署出一模一樣的環境,適合標準化部署多個資源。AWS Marketplace 是購買第三方軟體的市集,AMI 只是單一 EC2 的映像檔範本,AWS OpsWorks 偏向組態管理而非資源部署範本,答案是 C。"}, {"id": 188, "question": "一家公司正在構建一個應用程式，該應用程式需要能夠在應用程式元件之間傳送、儲存和接收訊息。這公司還有另一個要求，即按照先入先出(FIFO) 順序處理訊息。公司應該使用哪種AWS 服務？", "options": {"A": "AWS 步驟函式 (AWS Step Functions)", "B": "Amazon 簡單通知服務(Amazon SNS)", "C": "Amazon Kinesis 資料流", "D": "Amazon 簡單佇列服務(Amazon SQS)"}, "correct_answer": "D", "explanation": "Amazon SQS(Simple Queue Service)是訊息佇列服務,有 FIFO 佇列類型,能保證訊息嚴格按先進先出順序處理並避免重複投遞,對應題目需求。AWS Step Functions 是工作流程協調工具,Amazon SNS 是一對多廣播通知、沒有順序保證,Amazon Kinesis Data Streams 是巨量串流分析用的,答案是 D。"}, {"id": 189, "question": "哪項AWS 服務或功能是基於瀏覽器的預身份驗證服務，可以直接從AWS 管理控制檯 (AWS Management Console)啟動？", "options": {"A": "AWS API", "B": "AWS Lightsail", "C": "AWS Cloud9", "D": "AWS CloudShell"}, "correct_answer": "D", "explanation": "這題描述的是 AWS CloudShell:一個基於瀏覽器、因為已登入 Management Console 而預先驗證身分的殼層環境,可直接執行 AWS CLI 指令,不用另外裝軟體或設定憑證。AWS Lightsail 是簡化版雲端主機,AWS Cloud9 是需另外建立環境的完整雲端 IDE,都不是一鍵啟動的預身份驗證殼層,答案是 D。"}, {"id": 190, "question": "一家公司希望將其資料庫遷移到與PostgreSQL 相容的託管AWS 服務。哪些AWS 服務可以滿足這些要求？（選擇兩個。）", "options": {"A": "亞馬遜雅典娜 (Amazon Athena)", "B": "亞馬遜RDS", "C": "亞馬遜EC2", "D": "亞馬遜動態資料庫 (Amazon DynamoDB)", "E": "Amazon Aurora"}, "correct_answer": "BE", "explanation": "Amazon RDS 與 Amazon Aurora 都支援 PostgreSQL 相容引擎,且都是全託管服務,AWS 處理備份、修補、容錯移轉。RDS 可選 PostgreSQL 引擎,Aurora 有專屬 PostgreSQL 相容版本效能更好。Amazon Athena 是查詢服務不是資料庫,Amazon EC2 要自己裝資料庫軟體,Amazon DynamoDB 是 NoSQL 不支援 PostgreSQL,答案是 B、E。"}, {"id": 191, "question": "一家公司擁有一批貨船。貨船裝有感測器，可在海上收集資料，而海上的網際網路時斷時續或沒有網際網路連線性。該公司需要在海上收集、格式化和處理資料，然後將資料轉移到AWS。公司應該使用哪種AWS 服務來滿足這些要求？", "options": {"A": "AWS 物聯網核心", "B": "亞馬遜光帆", "C": "AWS 儲存閘道器 (AWS Storage Gateway)", "D": "AWS Snowball"}, "correct_answer": "D", "explanation": "離線或網路不穩環境要收集、處理資料再送上雲,正是 AWS Snowball(尤其 Snowball Edge)的強項:實體裝置內建運算能力,能在無網路或網路差的地方就地收集、格式化甚至處理資料,再寄回或透過有限頻寬同步上傳。AWS IoT Core 需要能連網,Amazon Lightsail 本身跑在雲端,AWS Storage Gateway 仍需一定連線品質,答案是 D。"}, {"id": 192, "question": "一家公司在多個Amazon EC2 例項上託管應用程式。該應用程式使用Amazon Simple Noti cation Service (Amazon SNS)傳送資訊。哪些AWS 服務或功能將授予應用程式訪問所需AWS 服務的許可權？", "options": {"A": "AWS 證書管理器(ACM)", "B": "IAM 角色 (IAM Role)", "C": "AWS 安全中心 (AWS Security Hub)", "D": "亞馬遜GuardDuty"}, "correct_answer": "B", "explanation": "IAM 角色(IAM Role)是讓 AWS 資源(如 EC2)取得暫時性憑證去存取其他 AWS 服務的標準做法,把角色附加到 EC2 上,應用程式就能直接呼叫 Amazon SNS,不用在程式碼裡硬寫存取金鑰 (Access Key),更安全好管理。AWS Certificate Manager 管憑證,AWS Security Hub 是安全彙整儀表板,Amazon GuardDuty 是威脅偵測,都不是服務授權機制,答案是 B。"}, {"id": 193, "question": "使用者對AWS 服務的瞭解有限，但希望在AWS 雲中快速部署可擴充套件的Node.js 應用程式。應該使用哪個服務來部署應用程式？", "options": {"A": "AWS 雲形成 (AWS CloudFormation)", "B": "AWS 彈性豆莖 (AWS Elastic Beanstalk)", "C": "亞馬遜EC2", "D": "AWS OpsWorks"}, "correct_answer": "B", "explanation": "AWS Elastic Beanstalk 是 PaaS 部署工具,使用者上傳程式碼後它自動處理容量配置、負載平衡、自動擴展、健康監控,適合對 AWS 不熟又想快速部署可擴充應用的情境。AWS CloudFormation 需自己寫範本、學習門檻較高,Amazon EC2 需自己管理所有底層細節,AWS OpsWorks 需一定設定知識,最符合的是 B。"}, {"id": 194, "question": "公司需要一個內容交付網路，以較低的成本向全球使用者安全交付資料、影片、應用程式和API。延遲和高傳輸速度。哪種AWS 服務滿足這些要求？", "options": {"A": "亞馬遜雲前 (Amazon CloudFront)", "B": "彈性負載均衡 (Elastic Load Balancing)", "C": "亞馬遜S3", "D": "亞馬遜彈性轉碼器 (Amazon Elastic Transcoder)"}, "correct_answer": "A", "explanation": "Amazon CloudFront 是 AWS 的 CDN 服務,透過全球邊緣節點快取內容,讓使用者就近取得資料、影片、應用程式或 API,達到低延遲高傳輸速度,並支援 HTTPS 加密確保安全交付,成本也比自建全球節點低。彈性負載均衡 (Elastic Load Balancing)只在單一區域分散流量,Amazon S3 只是儲存來源不具邊緣快取能力,Elastic Transcoder 是轉檔服務,答案是 A。"}, {"id": 195, "question": "公司需要使用第三方軟體來處理AWS 上的工作負載。公司可以使用哪些AWS 服務或功能來購買軟體？", "options": {"A": "AWS 資源訪問管理器 (AWS Resource Access Manager)", "B": "AWS 託管服務 (AWS Managed Services)", "C": "AWS 許可證管理器 (AWS License Manager)", "D": "AWS 市場 (AWS Marketplace)"}, "correct_answer": "D", "explanation": "AWS Marketplace 是集合大量第三方廠商已驗證軟體(AMI、SaaS、容器映像等)的線上市集,可直接搜尋、購買、部署,費用直接併入 AWS 帳單。AWS Resource Access Manager 是跨帳號共享資源,AWS Managed Services 是委託代管維運,AWS License Manager 是授權合規追蹤,都不是採購第三方軟體的管道,答案是 D。"}, {"id": 196, "question": "公司需要完全託管、高度可靠且可擴充套件的檔案儲存，並且可以透過伺服器訊息塊(SMB) 協議進行訪問。哪種AWS 服務可以滿足這些要求？", "options": {"A": "亞馬遜S3", "B": "亞馬遜彈性檔案系統(Amazon EFS)", "C": "適用於Windows 檔案伺服器的Amazon FSx", "D": "亞馬遜彈性塊儲存（亞馬遜EBS）"}, "correct_answer": "C", "explanation": "Amazon FSx for Windows File Server 是全託管檔案儲存服務,原生支援 SMB 協定,並相容 Windows NTFS 權限與 Active Directory,適合 Windows 環境檔案共享,且完全託管、高可用、可擴充。Amazon S3 走 HTTP API,Amazon EFS 走 NFS 給 Linux 用,Amazon EBS 是掛在單一 EC2 上的區塊儲存,都不支援 SMB,答案是 C。"}, {"id": 197, "question": "公司需要跨AWS 組織 (AWS Organizations)內的多個AWS 賬戶集中配置和管理Amazon VPC 安全組 (Security Group)組織。公司應該使用哪種AWS 服務來滿足這些要求？", "options": {"A": "AWS 防火牆管理器 (AWS Firewall Manager)", "B": "亞馬遜GuardDuty", "C": "亞馬遜偵探 (Amazon Detective)", "D": "AWS 網路應用"}, "correct_answer": "A", "explanation": "AWS Firewall Manager 可在 AWS Organizations 底下跨多個帳號集中設定與管理安全規則,包括 VPC 安全組 (Security Group)、AWS WAF 規則、Shield 防護,一次套用到整個組織。Amazon GuardDuty 是威脅偵測服務,Amazon Detective 是事件根因調查工具,AWS WAF 單獨用只能管單一資源,都沒有跨帳號集中管理安全組 (Security Group)的能力,答案是 A。"}, {"id": 198, "question": "根據AWS 責任共擔模型，哪項任務是AWS 的責任？", "options": {"A": "配置應用程式的身份和訪問管理。", "B": "管理儲存在AWS 上的資料的加密選項。", "C": "為Amazon EC2 例項配置安全組 (Security Group)。", "D": "維護基礎設施的物理硬體。"}, "correct_answer": "D", "explanation": "責任共擔模型中,AWS 負責「雲的安全」,即全球基礎設施本身,包括資料中心實體安全、硬體設備、機房電力空調,這些客戶完全看不到也不用管。設定 IAM 身分存取、管理資料加密選項、幫 EC2 設定安全組 (Security Group)都屬於「雲中的安全」,是客戶要做的事,只有維護實體硬體基礎設施是 AWS 的責任,答案是 D。"}, {"id": 199, "question": "一家公司在私有子網中有一個Amazon EC2 例項。該公司希望啟動與網際網路的連線以獲取作業系統更新，同時防止來自網際網路的流量訪問EC2 例項。哪個AWS 託管服務 (AWS Managed Services)允許這樣做？", "options": {"A": "VPC端點 (VPC Endpoint)", "B": "NAT閘道器 (NAT Gateway)", "C": "亞馬遜私人連結 (AWS PrivateLink)", "D": "VPC 對等互連"}, "correct_answer": "B", "explanation": "NAT 閘道器(NAT Gateway)放在公有子網路,能讓私有子網路的資源(如 EC2)主動對外連線取得系統更新,但網際網路無法主動連進來,因為 NAT 只轉換出站流量來源位址,不會開放對外入口。VPC 端點是連 AWS 服務用的,Amazon PrivateLink 同樣是私下存取服務用的,VPC 對等互連連的是兩個 VPC,都跟連網際網路無關,答案是 B。"}, {"id": 200, "question": "根據AWS 責任共擔模型，哪些操作是AWS 的責任？（選擇兩個。）", "options": {"A": "保護虛擬化層", "B": "修補Amazon EC2 例項上的作業系統", "C": "對IAM 使用者實施嚴格的密碼策略", "D": "修補Amazon RDS 例項上的作業系統", "E": "配置安全組 (Security Group)和網路ACL"}, "correct_answer": "AD", "explanation": "責任共擔模型下,AWS 負責底層基礎設施與部分託管服務內部維運。保護虛擬化層屬於 AWS 全球基礎設施安全的一部分;修補 Amazon RDS 這類全託管服務的作業系統,因客戶碰不到底層系統,由 AWS 負責。修補 EC2 作業系統因 EC2 是 IaaS、客戶可完全控制,屬客戶責任;IAM 密碼政策、安全組 (Security Group)與網路 ACL 設定也都是客戶的事,答案是 A、D。"}, {"id": 201, "question": "一家公司要在 AWS 雲端儲存不常存取的資料。如果之後需要用到，必須能在 12 小時內取回，公司希望每 GB 的儲存成本要划算。\n哪一種 Amazon S3 儲存類別可以滿足這個需求？", "options": {"A": "S3 標準（S3 Standard）", "B": "S3 Glacier 彈性擷取（S3 Glacier Flexible Retrieval）", "C": "S3 單區域不常存取（S3 One Zone-IA）", "D": "S3 標準不常存取（S3 Standard-IA）"}, "correct_answer": "B", "explanation": "正確答案是 B。題目要的是「不常存取、需要在 12 小時內能取回、且每 GB 儲存成本要划算」，這正是 S3 Glacier Flexible Retrieval 的定位：批次取回（Bulk）在 5～12 小時內完成且免費，儲存成本比 S3 Standard-IA 更低，適合長期保存、不常存取的資料。A 選項 Standard 是常態存取用，儲存成本最高，不符合「cost-effective」；C 選項 One Zone-IA 儲存成本雖低，但只存在單一 AZ，可用性較低，題目沒說可以接受資料遺失風險；D 選項 Standard-IA 雖然可以馬上取回，但儲存成本比 Glacier Flexible Retrieval 高，不是最省的方案。記法：需要幾小時內取回、要壓低長期儲存費 → 想到 Glacier Flexible Retrieval。"}, {"id": 202, "question": "哪一種 AWS 服務或資源可以用來找出某個使用者在指定日期範圍內用過哪些服務？", "options": {"A": "Amazon S3 存取控制清單（ACLs）", "B": "AWS Certificate Manager（ACM）", "C": "Network Access Analyzer", "D": "AWS Identity and Access Management Access Analyzer"}, "correct_answer": "D", "explanation": "正確答案是 D。IAM Access Analyzer 除了原本「找出誰能存取你的資源」之外，也有「未使用存取分析」功能，能列出某使用者/角色在指定期間內實際用過哪些服務與動作，用來抓出「授權了但沒在用」的過度授權情況，對應題目「找出使用者在指定日期範圍內用過哪些服務」的需求。A 的 S3 ACL 只管 S3 物件層級權限，跟查使用紀錄無關；B 的 ACM 是憑證管理服務；C 的 Network Access Analyzer 查的是網路路徑可達性，不是使用者服務使用紀錄，三者都答非所問。"}, {"id": 203, "question": "一家公司需要找第三方顧問協助維運、支援 AWS 環境並滿足公司的業務需求。\n哪一種 AWS 服務或資源可以滿足這個需求？", "options": {"A": "AWS Support", "B": "AWS Organizations", "C": "AWS Service Catalog", "D": "AWS 合作夥伴網路（AWS Partner Network, APN）"}, "correct_answer": "D", "explanation": "正確答案是 D。公司要找「第三方顧問」協助維運，AWS Partner Network（APN）就是 AWS 官方的合作夥伴生態系，裡面認證了大量顧問公司/系統整合商，可以媒合適合的第三方夥伴。A 的 AWS Support 是 AWS 自己提供的官方支援方案，不是找外部顧問；B 的 Organizations 是多帳號治理工具；C 的 Service Catalog 是核准過的 IT 服務目錄，三者都不是「找外部顧問」的管道。"}, {"id": 204, "question": "一家公司想用帳單資料，每週建立 Amazon QuickSight 儀表板。\n公司可以用哪一種 AWS 功能或工具滿足這個需求？", "options": {"A": "AWS Budgets", "B": "AWS Cost Explorer", "C": "AWS 成本與使用報告（AWS Cost and Usage Report, CUR）", "D": "AWS Cost Anomaly Detection"}, "correct_answer": "C", "explanation": "正確答案是 C。要拿帳單資料做成 QuickSight 儀表板，需要的是最原始、最細緻的計費資料來源，AWS Cost and Usage Report（CUR）提供每小時、每個資源層級的完整帳單明細，可以匯出到 S3 再串 QuickSight。A 的 Budgets 是設定預算警示用的；B 的 Cost Explorer 本身就有內建圖表，但資料顆粒度與客製化程度不如 CUR，也不是設計來餵給 QuickSight 的資料來源；D 的 Cost Anomaly Detection 是抓異常花費的服務，都不是「原始帳單資料」的來源。"}, {"id": 205, "question": "一家公司計劃把資料備份搬到 AWS 雲端，需要用「雲端儲存、但在地端保留快取」的方式取代地端儲存設備。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS Storage Gateway", "B": "AWS Snowcone", "C": "AWS Backup", "D": "Amazon Elastic File System（Amazon EFS）"}, "correct_answer": "A", "explanation": "正確答案是 A。「雲端儲存，但要在地端保留快取」正是 AWS Storage Gateway 的核心設計：地端部署一台虛擬設備當快取層，常用資料留在本地端快速讀寫，同時資料非同步備份到雲端。B 的 Snowcone 是實體搬遷/邊緣運算裝置，不是持續性儲存架構；C 的 AWS Backup 是備份管理服務，本身不提供地端快取；D 的 EFS 是雲端的檔案系統，沒有「本地快取」的概念，三者都不符合。"}, {"id": 206, "question": "一家公司需要整理資源並在細部層級追蹤 AWS 成本，需要依照業務部門、環境、應用程式分類成本。\n哪一種解決方案可以滿足這個需求？", "options": {"A": "進入 AWS Cost Management 主控台整理資源、設定 AWS 預算，並在有異常用量時收到通知。", "B": "用標籤（tags）整理資源，啟用成本分配標籤（cost allocation tags）在細部層級追蹤 AWS 成本。", "C": "建立 Amazon CloudWatch 儀表板，以視覺化方式個別整理與追蹤成本。", "D": "進入 AWS Billing and Cost Management 儀表板，整理與追蹤細部的資源使用狀況。"}, "correct_answer": "B", "explanation": "正確答案是 B。要依部門、環境、應用程式這種「自訂維度」拆分成本，標準做法是幫資源打標籤（tag），再到 Billing 主控台啟用「成本分配標籤」，帳單就能依標籤維度切分，是官方建議的成本歸類方式。A、D 都只是泛泛地說「進主控台整理」，沒有講到真正能做到自訂維度分類的機制；C 的 CloudWatch 是監控指標服務，不是成本歸類工具，都不夠精準對應需求。"}, {"id": 207, "question": "一家公司需要在 AWS 上規劃、排程並執行數十萬筆運算工作。\n公司可以用哪一種 AWS 服務滿足這個需求？", "options": {"A": "AWS Step Functions", "B": "AWS Service Catalog", "C": "Amazon Simple Queue Service（Amazon SQS）", "D": "AWS Batch"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Batch 就是設計來大量規劃、排程、執行運算工作（batch computing job）的服務，能自動配置運算資源、排隊執行數十萬筆工作，完全對應題目情境。A 的 Step Functions 是流程協調（workflow orchestration）服務，適合協調多個步驟而非大量運算工作排程；B 的 Service Catalog 是 IT 服務目錄管理；C 的 SQS 是訊息佇列，可以配合 Batch 用，但本身不負責排程執行運算工作，三者都不是正解。"}, {"id": 208, "question": "哪些 AWS 服務或功能能透過跨不同 AWS 區域的容錯移轉，提供高可用性與低延遲？（選擇兩個。）", "options": {"A": "Amazon Route 53", "B": "Network Load Balancer", "C": "Amazon S3 Transfer Acceleration", "D": "AWS Global Accelerator", "E": "Application Load Balancer"}, "correct_answer": "AD", "explanation": "正確答案是 A、D。要做到跨區域（Region）容錯移轉、同時兼顧高可用與低延遲，Amazon Route 53 可以用健康檢查搭配 DNS 路由做跨區容錯；AWS Global Accelerator 則是在 AWS 全球網路骨幹層級做流量導向、能更快速地將使用者導到最近且健康的端點，兩者是官方常見的組合。B、E 的 Network/Application Load Balancer 是單一 Region 內的負載平衡器，本身不能跨 Region 做容錯移轉；C 的 S3 Transfer Acceleration 是加速上傳到 S3 的功能，跟高可用性無關。"}, {"id": 209, "question": "以下何者是用 Amazon EC2 Auto Scaling 群組在 AWS 雲端調整容量的方式？", "options": {"A": "依需求自動增加或減少（scale out/in）EC2 執行個體的數量。", "B": "使用無伺服器 EC2 執行個體。", "C": "依需求自動調整 EC2 執行個體的大小（scale up/down）。", "D": "在 EC2 執行個體之間轉移未使用的 CPU 資源。"}, "correct_answer": "A", "explanation": "正確答案是 A。Amazon EC2 Auto Scaling 的核心機制是「水平擴展」（scale out/in）：依照需求自動增加或減少執行個體的數量，而不是改變單一執行個體的規格。C 講的是「垂直擴展」（scale up/down，換規格），這不是 Auto Scaling 的做法；B「無伺服器 EC2」跟 D「轉移 CPU 資源」都不是真實存在的 Auto Scaling 機制，屬於干擾選項。"}, {"id": 210, "question": "AWS 雲端有哪些優勢？（選擇兩個。）", "options": {"A": "用變動支出交換資本支出。", "B": "幾分鐘內完成全球部署。", "C": "在部署前先規劃好容量。", "D": "享受規模經濟帶來的效益。", "E": "降低對網路連線的依賴。"}, "correct_answer": "BD", "explanation": "正確答案是 B、D。AWS 官方講的雲端六大優勢裡，「Go Global in Minutes」（幾分鐘完成全球部署）跟「Benefit from Massive Economies of Scale」（規模經濟）都是明確列出的優勢。A 選項故意把方向講反了——雲端的優勢是用「變動支出」取代「資本支出」，題目寫成「用變動支出換資本支出」剛好倒過來，是錯的；C「事先規劃容量」也講反了，雲端的優勢正是「不用再猜容量」（Stop Guessing Capacity）；E「降低對網路連線的依賴」根本不是雲端的優勢清單項目，反而雲端服務更依賴網路。這題要小心看選項字面方向有沒有被倒著寫。"}, {"id": 211, "question": "哪一種 AWS 安全服務能以「一直啟用」的偵測與自動內嵌緩解，保護應用程式免受分散式阻斷服務（DDoS）攻擊？", "options": {"A": "Amazon Inspector", "B": "AWS Web 應用程式防火牆（AWS WAF）", "C": "彈性負載平衡（Elastic Load Balancing, ELB）", "D": "AWS Shield"}, "correct_answer": "D", "explanation": "正確答案是 D。「always-on 偵測」加「自動內嵌（inline）緩解」是 AWS Shield 官方文件的標準描述，專門用來防禦 DDoS 攻擊。A 的 Inspector 是漏洞掃描服務，跟 DDoS 無關；B 的 WAF 是防禦應用層攻擊（如 SQL injection），雖然常跟 Shield 搭配用，但本身不是「always-on 自動偵測 DDoS」的服務；C 的 ELB 是負載平衡器，不是安全防護服務。"}, {"id": 212, "question": "哪一種 AWS 服務讓使用者可以用常見的程式語言，來建模並佈署 AWS 資源？", "options": {"A": "AWS CloudFormation", "B": "AWS CodePipeline", "C": "AWS 雲端開發套件（AWS Cloud Development Kit, AWS CDK）", "D": "AWS Systems Manager"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS CDK 讓開發者用熟悉的程式語言（如 Python、TypeScript）撰寫程式碼來定義並佈署 AWS 資源，背後其實會轉換成 CloudFormation 範本執行。A 的 CloudFormation 也是 infrastructure as code，但它是用 YAML/JSON 樣板語法，不是「常見程式語言」；B 的 CodePipeline 是 CI/CD 流程服務；D 的 Systems Manager 是維運管理工具，都不是用程式語言建模資源的服務。"}, {"id": 213, "question": "哪一種 Amazon EC2 執行個體定價模式，最高可以提供 90% 的折扣？", "options": {"A": "預留執行個體（Reserved Instances）", "B": "隨需執行個體（On-Demand）", "C": "專用主機（Dedicated Hosts）", "D": "Spot 執行個體（Spot Instances）"}, "correct_answer": "D", "explanation": "正確答案是 D。Spot Instances 是用「AWS 目前多餘的閒置運算容量」競標使用，折扣幅度最大可到 90%，是四個選項裡折扣最高的方案。Reserved Instances 折扣通常落在 40～60% 左右（依付款方式與期長），Dedicated Hosts 和 On-Demand 都沒有這麼大的折扣幅度，所以答案是 D。"}, {"id": 214, "question": "以下何者是在「執行個體層級」運作的防火牆，用來控制進出流量？", "options": {"A": "網路存取控制清單（Network ACL）", "B": "安全群組（Security Groups）", "C": "AWS Trusted Advisor", "D": "虛擬私有閘道（Virtual Private Gateways）"}, "correct_answer": "B", "explanation": "正確答案是 B。Security Groups 是作用在「執行個體層級」的防火牆，控制進出該執行個體的流量。A 的 Network ACL 也是防火牆概念，但作用在「子網路層級」，不是執行個體層級，這是兩者最常被考的差異點；C 的 Trusted Advisor 是帳號健檢建議工具，不是防火牆；D 的虛擬私有閘道是 VPN 連線用的元件，也不是防火牆。"}, {"id": 215, "question": "一家公司必須能快速在 AWS 雲端開發、測試並上線應用程式。\n哪一項雲端運算優勢可以滿足這個需求？", "options": {"A": "不用再猜測容量（Stop guessing capacity）", "B": "用變動支出取代固定支出（Trade fixed expense for variable expense）", "C": "達到規模經濟（Achieve economies of scale）", "D": "提升速度與靈活性（Increase speed and agility）"}, "correct_answer": "D", "explanation": "正確答案是 D。題目強調「快速開發、測試、上線」，對應到雲端優勢裡的「Increase Speed and Agility」（提升速度與靈活性）——資源可以隨需取得，不用等採購硬體，開發節奏自然變快。A、B、C 雖然也都是雲端優勢，但分別對應的是「容量規劃」「成本結構」「規模經濟」，跟題目強調的「開發速度」不是同一件事，屬於同類但答非所問的干擾選項。"}, {"id": 216, "question": "一家公司裡有不同職務角色與責任的團隊，員工經常換組。公司需要管理員工的權限，讓權限符合對應的工作職責。\n公司應該用哪一種 IAM 資源，才能用「最低的維運負擔」滿足這個需求？", "options": {"A": "IAM 使用者群組（IAM user groups）", "B": "IAM 角色（IAM roles）", "C": "IAM 執行個體設定檔（IAM instance profiles）", "D": "針對個別使用者設定的 IAM 政策"}, "correct_answer": "A", "explanation": "正確答案是 A。IAM 使用者群組（user groups）可以把職責相同的人放進同一個群組、統一在群組上掛政策；員工換組時只要把他從舊群組移除、加進新群組，權限就自動跟著換，維運負擔最低，這正是 AWS 官方文件對 IAM Groups 的標準使用情境。（提醒：ExamTopics 網站標記的正解是 B／IAM roles，但社群高票留言與 AWS 官方最佳實踐都指向 A，IAM roles 通常用在「暫時性、跨帳號或給服務使用」的情境，不是拿來管理常態員工的職務權限，這裡以 A 為準。）B 的 IAM roles 較適合暫時性委派或服務之間的權限；C 的執行個體設定檔是給 EC2 用來取得角色權限的機制，跟管理「員工」權限無關；D 每個使用者各自設定政策，換組時要逐一調整，維運負擔最高。"}, {"id": 217, "question": "公司可以用哪一種 AWS 服務，安全地儲存並加密資料庫用的密碼？", "options": {"A": "AWS Shield", "B": "AWS Secrets Manager", "C": "AWS Identity and Access Management（IAM）", "D": "Amazon Cognito"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Secrets Manager 專門用來安全儲存、加密、輪替資料庫密碼等機密資訊，並提供 API 讓應用程式安全讀取，不用把密碼寫死在程式碼裡。A 的 Shield 是 DDoS 防護；C 的 IAM 管的是「誰能做什麼」的權限，不是拿來存密碼的地方；D 的 Cognito 是給終端使用者做身分驗證/註冊登入用的，都不是密碼保管服務。"}, {"id": 218, "question": "雲端從業人員可以用什麼工具，取得 AWS 的資安與合規文件，並提交給稽核員或監管單位作為佐證？", "options": {"A": "AWS Certificate Manager", "B": "AWS Systems Manager", "C": "AWS Artifact", "D": "Amazon Inspector"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Artifact 是 AWS 官方合規文件的自助入口，可以下載 SOC 報告、ISO 認證等稽核用文件，直接對應「取得合規文件交給稽核員」的需求。A 的 Certificate Manager 是管理 SSL/TLS 憑證的；B 的 Systems Manager 是維運管理工具；D 的 Inspector 是漏洞掃描服務，都跟「取得合規文件」無關。"}, {"id": 219, "question": "哪些加密方式可以用來保護 Amazon S3「靜態」物件？（選擇兩個。）", "options": {"A": "伺服器端加密＋Amazon S3 代管金鑰（SSE-S3）", "B": "伺服器端加密＋AWS KMS 代管金鑰（SSE-KMS）", "C": "TLS", "D": "SSL", "E": "透明資料加密（Transparent Data Encryption, TDE）"}, "correct_answer": "AB", "explanation": "正確答案是 A、B。SSE-S3 跟 SSE-KMS 都是 Amazon S3 官方支援、保護「靜態資料」（data at rest）的伺服器端加密方式，差別在金鑰由 S3 自動管理還是交給 KMS 管理。C 的 TLS 跟 D 的 SSL 是保護「傳輸中資料」（data in transit）的加密協定，不是靜態加密；E 的 TDE 是資料庫（如 SQL Server、Oracle）常用的加密技術，不是 S3 原生功能。"}, {"id": 220, "question": "一家公司想讓網路購物網站的登入，串接社群媒體的登入憑證。\n公司可以用哪一種 AWS 服務做這個串接？", "options": {"A": "AWS Directory Service", "B": "AWS Identity and Access Management（IAM）", "C": "Amazon Cognito", "D": "AWS IAM Identity Center（AWS Single Sign-On）"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon Cognito 專門處理終端使用者（consumer）的身分驗證與註冊登入，內建支援 Google、Facebook 等社群登入串接。A 的 Directory Service 是企業內部目錄服務（像 Active Directory）；B 的 IAM 管的是 AWS 資源存取權限，不是給網站終端用戶登入用的；D 的 IAM Identity Center 是給「員工」跨帳號單一登入用的，不是給一般消費者用社群帳號登入，三者都不符合情境。"}, {"id": 221, "question": "哪一種 AWS 服務用來追蹤、記錄並稽核 AWS 資源的設定變化？", "options": {"A": "AWS Shield", "B": "AWS Config", "C": "AWS IAM", "D": "Amazon Inspector"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Config 專門記錄 AWS 資源的設定變化歷史，能查詢某資源在特定時間點的設定內容、並產生變更稽核軌跡。A 的 Shield 是 DDoS 防護；C 的 IAM 是權限管理；D 的 Inspector 是漏洞掃描，都不是設定變更追蹤工具。"}, {"id": 222, "question": "某客戶執行一個隨需（On-Demand）的 Amazon Linux EC2 執行個體，總共執行了 3 小時 5 分 6 秒。\n這位客戶會被收取多長時間的費用？", "options": {"A": "3 小時 5 分", "B": "3 小時 5 分 6 秒", "C": "3 小時 6 分", "D": "4 小時"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS 從 2017 年起，On-Demand 與 Reserved 的 Linux EC2 執行個體改為「以秒計費」（最低計費單位 60 秒），跑多久就算多久，不會整數捨入，所以 3 小時 5 分 6 秒就是精確收費的時間長度。（提醒：ExamTopics 網站標記的正解是 C／3 小時 6 分，屬於 2017 年以前「以分鐘/小時計費」的舊制概念，社群高票留言也引用官方文件指出這是過時答案，這裡以現行的「秒計費」規則、答案 B 為準。）A、C、D 都是套用舊制計費規則捨入後的結果，不符合現行 AWS 計費方式。"}, {"id": 223, "question": "一家公司的網站正遭受 DDoS 攻擊。\n哪一種 AWS 服務可以協助保護公司網站免受這類攻擊？", "options": {"A": "AWS Resource Access Manager", "B": "AWS Amplify", "C": "AWS Shield", "D": "Amazon GuardDuty"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Shield 就是專門防禦 DDoS 攻擊的服務（免費版 Shield Standard 自動保護所有 AWS 客戶）。A 的 Resource Access Manager 是跨帳號共享資源用的；B 的 Amplify 是前端／全端應用開發框架；D 的 GuardDuty 是威脅偵測服務（偵測異常行為，非專門防 DDoS），都不是正解。"}, {"id": 224, "question": "一家公司想針對現有的地端環境，取得客製化的評估，並了解遷移到 AWS 雲端後的預估運行成本。\n哪一種 AWS 服務或工具可以滿足這個需求？", "options": {"A": "AWS Trusted Advisor", "B": "Amazon Inspector", "C": "AWS Control Tower", "D": "Migration Evaluator"}, "correct_answer": "D", "explanation": "正確答案是 D。Migration Evaluator（前身叫 TSO Logic）專門用來評估地端環境現況，產生遷移到 AWS 後的預估費用報告，是官方的遷移評估工具。A 的 Trusted Advisor 是帳號健檢建議；B 的 Inspector 是漏洞掃描；C 的 Control Tower 是多帳號治理服務，都不是「評估上雲成本」的工具。"}, {"id": 225, "question": "一家公司有多個事業單位，想要中央管理並治理其 AWS 雲端環境，同時想自動化建立 AWS 帳號、套用服務控制政策（SCP），並簡化帳單流程。\n公司應該用哪一種 AWS 服務或工具滿足這些需求？", "options": {"A": "AWS Organizations", "B": "Cost Explorer", "C": "AWS Budgets", "D": "AWS Trusted Advisor"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS Organizations 就是設計來做多帳號中央治理的服務：能自動化建立新帳號、套用服務控制政策（SCP）限制帳號能做的事、並用整合帳單（consolidated billing）簡化收費，三個需求全部對應。B、C、D 都只是成本/建議相關的單點工具，沒有「多帳號治理」與「自動建立帳號」的能力。"}, {"id": 226, "question": "一家公司在 AWS 雲端上架設應用程式，想確認底層的 AWS 服務與整體 AWS 基礎設施是否運作正常。\n公司可以用哪些 AWS 服務組合來取得所需資訊？（選擇兩個。）", "options": {"A": "AWS 個人健康儀表板（Personal Health Dashboard）", "B": "AWS Systems Manager", "C": "AWS Trusted Advisor", "D": "AWS 服務健康儀表板（Service Health Dashboard）", "E": "AWS Service Catalog"}, "correct_answer": "AD", "explanation": "正確答案是 A、D。AWS Service Health Dashboard 顯示 AWS 各服務在全球的整體運作狀態；Personal Health Dashboard 則是「個人化」版本，只顯示跟你帳號實際使用資源相關的健康事件與通知，兩者合起來正好對應「確認底層 AWS 服務與基礎設施運作是否正常」。B 的 Systems Manager 是管理自己資源的維運工具；C 的 Trusted Advisor 是帳號設定健檢建議；E 的 Service Catalog 是服務目錄管理，都不是用來看 AWS 基礎設施健康狀態的。"}, {"id": 227, "question": "一家公司需要把地端的 PostgreSQL 資料庫遷移到 Amazon RDS。\n公司應該用哪一種 AWS 服務或工具滿足這個需求？", "options": {"A": "Cloud Adoption Readiness Tool", "B": "AWS Migration Hub", "C": "AWS Database Migration Service（AWS DMS）", "D": "AWS Application Migration Service"}, "correct_answer": "C", "explanation": "正確答案是 C。資料庫遷移（把資料庫內容搬到 RDS）的標準工具就是 AWS DMS，還能在遷移過程中讓來源資料庫持續運作、支援近乎零停機切換。A 的 Cloud Adoption Readiness Tool 是評估組織雲端就緒度的問卷工具；B 的 Migration Hub 是彙整遷移專案進度的儀表板，本身不執行資料搬遷；D 的 Application Migration Service 是用來搬「整台伺服器/應用程式」（lift-and-shift），不是專門搬資料庫內容的工具。"}, {"id": 228, "question": "使用 AWS Compute Optimizer 展現的是哪一種雲端概念？", "options": {"A": "安全驗證", "B": "資源調配最佳化（Rightsizing）", "C": "彈性（Elasticity）", "D": "全球覆蓋"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Compute Optimizer 分析你的資源使用狀況，建議把執行個體換成「大小剛好」的規格（不多不少），這正是 Rightsizing（資源調配最佳化）的定義。C 的 Elasticity 講的是資源能隨需自動增減，跟「調整規格建議」是不同概念；A、D 都跟 Compute Optimizer 的功能無關。"}, {"id": 229, "question": "一家公司在 AWS 上存放大量資料，想確認裡面是否有應該被視為敏感資料的內容。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "Amazon Inspector", "B": "Amazon Macie", "C": "AWS Identity and Access Management（IAM）", "D": "Amazon CloudWatch"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon Macie 專門用機器學習掃描 S3 裡的資料，自動找出個資、信用卡號等敏感資訊。A 的 Inspector 找的是軟體漏洞；C 的 IAM 管的是權限；D 的 CloudWatch 是監控指標與日誌服務，都不做「辨識敏感資料內容」這件事。"}, {"id": 230, "question": "某使用者有一個具狀態（stateful）的工作負載，未來 3 年會持續在 Amazon EC2 上運行。\n哪一種定價模式最划算？", "options": {"A": "隨需執行個體（On-Demand Instances）", "B": "預留執行個體（Reserved Instances）", "C": "專用執行個體（Dedicated Instances）", "D": "Spot 執行個體（Spot Instances）"}, "correct_answer": "B", "explanation": "正確答案是 B。工作負載長期（3 年）且需要穩定運行（stateful，不能隨時被中斷），Reserved Instances 用長期承諾換取折扣，是最划算的選擇。D 的 Spot Instances 雖然折扣更高，但隨時可能被 AWS 回收，不適合 stateful、需要持續運行的工作負載；A 的 On-Demand 沒有長期折扣；C 的 Dedicated Instances 是要求實體伺服器層級隔離的方案，主打合規/授權需求而非省錢。"}, {"id": 231, "question": "由誰負責啟用 Amazon Elastic Block Store（Amazon EBS）的靜態資料加密？", "options": {"A": "AWS Support", "B": "AWS 客戶（AWS customers）", "C": "AWS Key Management Service（AWS KMS）", "D": "AWS Trusted Advisor"}, "correct_answer": "B", "explanation": "正確答案是 B。EBS 加密不是預設開啟的（除非帳號/區域設定了預設加密），需要「客戶自己」在建立 EBS 卷時主動選擇啟用加密，這是責任共擔模型下客戶端的責任。C 的 KMS 是加密時「用來管理金鑰」的服務，但真正決定要不要啟用加密的是客戶自己，不是 KMS 主動去做；A、D 都與啟用加密的動作無關。"}, {"id": 232, "question": "使用者可以用 AWS CloudTrail 完成什麼事？", "options": {"A": "產生 IAM 使用者憑證報告。", "B": "記錄對 AWS 服務發出的 API 呼叫。", "C": "評估 AWS 資源設定是否符合政策與準則。", "D": "確保 Amazon EC2 執行個體都已修補最新安全更新。"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS CloudTrail 的核心功能就是記錄帳號內所有 API 呼叫的軌跡（誰、什麼時候、做了什麼），常用於稽核與資安調查。A 的憑證報告是 IAM 的功能；C 的「評估設定是否符合政策」是 AWS Config 的功能；D 的「確保修補最新安全更新」是 AWS Systems Manager Patch Manager 的功能，三者都不是 CloudTrail 做的事。"}, {"id": 233, "question": "一家公司計劃把工作負載架設在 AWS 上。\n哪一種 AWS 服務會需要公司自己更新並修補「客體作業系統」（guest OS）？", "options": {"A": "Amazon DynamoDB", "B": "Amazon S3", "C": "Amazon EC2", "D": "Amazon Aurora"}, "correct_answer": "C", "explanation": "正確答案是 C。EC2 是 IaaS（基礎設施即服務），作業系統（guest OS）由客戶自己安裝、管理、修補，這也是責任共擔模型下客戶要負責的部分。DynamoDB、S3、Aurora 都是全託管服務（PaaS 等級以上），底層作業系統的修補是 AWS 負責，客戶完全碰不到也不用管。"}, {"id": 234, "question": "哪一種 AWS 服務或功能，可以搜尋並找出被分享給外部的 AWS 資源？", "options": {"A": "Amazon OpenSearch Service", "B": "AWS Control Tower", "C": "AWS IAM Access Analyzer", "D": "AWS Fargate"}, "correct_answer": "C", "explanation": "正確答案是 C。IAM Access Analyzer 的核心功能之一就是掃描並找出「哪些資源被分享給外部帳號/公開存取」，例如 S3 儲存桶、IAM 角色等，正好對應題目需求。A 的 OpenSearch 是搜尋與分析服務；B 的 Control Tower 是多帳號治理；D 的 Fargate 是容器運算服務，都跟「找出外部共享資源」無關。"}, {"id": 235, "question": "一家公司正在把工作負載遷移到 AWS 雲端，必須保留對應用程式所在客體作業系統（guest OS）修補管理的完全控制權。\n公司應該用哪一種 AWS 服務滿足這個需求？", "options": {"A": "Amazon DynamoDB", "B": "Amazon EC2", "C": "AWS Lambda", "D": "Amazon RDS"}, "correct_answer": "B", "explanation": "正確答案是 B。要「完全掌控作業系統的修補」，只有 IaaS 層級的 EC2 能做到，因為只有 EC2 的作業系統是客戶自己管理的。DynamoDB、Lambda、RDS 都是全託管或無伺服器服務，作業系統層級的維護由 AWS 負責，客戶無法（也不需要）自己控制修補時程。"}, {"id": 236, "question": "哪一種支援方案等級，使用者可以獲得「支援禮賓」（support concierge）服務？", "options": {"A": "基本支援（Basic Support）", "B": "開發者支援（Developer Support）", "C": "商業支援（Business Support）", "D": "企業支援（Enterprise Support）"}, "correct_answer": "D", "explanation": "正確答案是 D。「支援禮賓（Support Concierge）」是 AWS Enterprise Support 方案獨有的服務，提供帳務與帳戶層面的專屬協助，其他較低階的支援方案都沒有這項服務。"}, {"id": 237, "question": "公司可以用哪一種 AWS 服務，以視覺化方式設計並建構無伺服器應用程式？", "options": {"A": "AWS Lambda", "B": "AWS Batch", "C": "AWS Application Composer", "D": "AWS App Runner"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Application Composer 是 2022 年推出的視覺化工具，讓使用者用拖拉介面設計、組合無伺服器應用程式的架構（Lambda、DynamoDB、API Gateway 等資源），背後自動產生 IaC 範本。A 的 Lambda 是無伺服器運算服務本身，不是設計工具；B 的 Batch 是批次運算服務；D 的 App Runner 是快速部署容器化網頁應用的服務，都不是「視覺化設計」工具。"}, {"id": 238, "question": "一家公司想遷移到 AWS，並沿用地端使用的資安軟體，該資安軟體廠商在 AWS 上以服務形式提供這套軟體。\n公司可以在哪裡購買這個資安解決方案？", "options": {"A": "AWS Partner Solutions Finder", "B": "AWS Support Center", "C": "AWS Management Console", "D": "AWS Marketplace"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Marketplace 是第三方軟體廠商（含資安廠商）在 AWS 上架、銷售其軟體/服務的平台，客戶可以直接在上面訂閱購買。A 的 Partner Solutions Finder 是用來尋找合作夥伴的目錄，不是購買軟體的地方；B 的 Support Center 是技術支援入口；C 的 Management Console 是管理既有 AWS 資源的地方，都不是購買第三方軟體的管道。"}, {"id": 239, "question": "一家公司已經部署了一個 Amazon EC2 執行個體。\n根據責任共擔模型，以下哪一項是 AWS 的責任？", "options": {"A": "管理並加密應用程式資料", "B": "安裝客體作業系統的更新與安全修補", "C": "基礎設施裝置的組態設定", "D": "為每個執行個體設定安全群組"}, "correct_answer": "C", "explanation": "正確答案是 C。在責任共擔模型下，AWS 負責「雲端本身的安全」（security OF the cloud），包含底層基礎設施裝置（如網路交換器、機房設備）的組態設定與維護。A、B、D 都是客戶要做的事：管理應用程式資料、修補 EC2 客體作業系統、設定安全群組，屬於「雲端內的安全」（security IN the cloud），是客戶端的責任。"}, {"id": 240, "question": "一家公司想把 PostgreSQL 資料庫遷移到 AWS，這個資料庫不常被使用。\n哪一種 AWS 服務或資源可以用「最低的管理負擔」滿足這個需求？", "options": {"A": "在 Amazon EC2 上自建 PostgreSQL", "B": "Amazon RDS for PostgreSQL", "C": "Amazon Aurora PostgreSQL 相容版本", "D": "Amazon Aurora Serverless"}, "correct_answer": "D", "explanation": "正確答案是 D。資料庫不常被使用，用 Aurora Serverless 可以在沒有流量時自動縮到接近零、有需求時再自動擴充，完全不用手動管理容量，管理負擔最低。A 在 EC2 上自架資料庫要自己顧作業系統跟資料庫軟體，管理負擔最重；B、C 雖然是全託管服務，但仍需自行決定並維持執行個體規格，不像 Serverless 版本完全自動依用量調整。"}, {"id": 241, "question": "一家公司用 Amazon DynamoDB 作為應用程式的資料庫。\n根據責任共擔模型，以下哪些工作是 AWS 的責任？（選擇兩個。）", "options": {"A": "分類資料", "B": "設定存取權限", "C": "管理加密選項", "D": "提供公開端點以儲存與取得資料", "E": "管理基礎設施層與作業系統"}, "correct_answer": "DE", "explanation": "正確答案是 D、E。DynamoDB 是全託管的無伺服器資料庫，AWS 負責管理底層基礎設施與作業系統，並提供可直接呼叫的公開端點（endpoint）讓客戶端存取。A 分類資料、B 設定存取權限、C 管理加密選項，這些都需要客戶依照自己的資料內容與需求主動設定，屬於客戶端的責任。"}, {"id": 242, "question": "一家公司想為客戶打造一個全球都能存取的電商平台，需要用高可用、可擴充的 DNS 網頁服務把使用者連接到平台。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "Amazon EC2", "B": "Amazon VPC", "C": "Amazon Route 53", "D": "Amazon RDS"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon Route 53 就是 AWS 的高可用、可擴充 DNS 網頁服務，負責把使用者導向正確的伺服器/端點，完全對應「DNS 服務」的需求。A 的 EC2 是運算執行個體；B 的 VPC 是網路環境；D 的 RDS 是關聯式資料庫服務，三者都不是 DNS 服務。"}, {"id": 243, "question": "根據責任共擔模型，以下哪一項維護工作是客戶的責任？", "options": {"A": "可用區域之間的實體連線", "B": "網路交換器的維護", "C": "硬體更新與韌體修補", "D": "Amazon EC2 的更新與安全修補"}, "correct_answer": "D", "explanation": "正確答案是 D。EC2 的客體作業系統更新與安全修補是客戶的責任（IaaS 層級，AWS 不會幫你動系統內部）。A 可用區域間的實體連線、B 網路交換器維護、C 硬體與韌體更新，這些都屬於底層實體基礎設施，是 AWS 的責任，客戶完全碰不到。"}, {"id": 244, "question": "一家公司想透過檢視 API 呼叫的使用者活動，改善整體資安狀態。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS WAF", "B": "Amazon Detective", "C": "Amazon CloudWatch", "D": "AWS CloudTrail"}, "correct_answer": "D", "explanation": "正確答案是 D。CloudTrail 記錄帳號內所有 API 呼叫的軌跡，是查核「使用者活動」最直接的服務。A 的 WAF 是應用層防火牆；B 的 Detective 是資安調查分析服務，通常要先有 CloudTrail/VPC Flow Logs 等資料才能運作；C 的 CloudWatch 是監控指標與日誌服務，不是專門記錄 API 呼叫的服務。"}, {"id": 245, "question": "一家公司正在遷移到 AWS 雲端，計劃在 AWS 上執行 3 到 6 個月的實驗性工作負載。\n哪一種定價模式可以滿足這個需求？", "options": {"A": "使用 3 年期的 Savings Plans。", "B": "使用專用主機（Dedicated Hosts）。", "C": "購買預留執行個體（Reserved Instances）。", "D": "使用隨需執行個體（On-Demand Instances）。"}, "correct_answer": "D", "explanation": "正確答案是 D。實驗性質、只跑 3～6 個月的短期工作負載，最適合用不需要長期承諾的 On-Demand，用多少付多少，隨時可以停用。A、C 都要簽 1 年以上的長期承諾，不符合短期實驗的情境；B 的 Dedicated Hosts 是要求實體伺服器層級隔離的方案，成本較高也不是為短期實驗設計的。"}, {"id": 246, "question": "一家擁有 AWS Enterprise Support 的公司，將在 2 個月後推出熱門產品的新版本，預期網站流量會大幅增加，該網站架設在 Amazon EC2 執行個體上。\n公司應該採取哪個行動，來評估自己是否已準備好因應這次上線的擴展需求？", "options": {"A": "把 EC2 執行個體換成 AWS Lambda 函式。", "B": "使用 AWS Infrastructure Event Management（IEM）支援。", "C": "在 AWS Marketplace 提交監控該活動的請求。", "D": "查看 AWS Cost Management 主控台裡的涵蓋率報告。"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Infrastructure Event Management（IEM）是 Enterprise Support 客戶專屬的服務，針對即將到來的重大活動（如新品上市）提供架構檢視與擴展就緒度評估，正好對應題目情境。A 直接改架構動作太大且不合理；C、D 都不是「評估擴展就緒度」的正確管道。"}, {"id": 247, "question": "一家公司想在 AWS 上啟動多個工作負載，每個工作負載對應不同的事業單位，公司想把各事業單位的成本分開追蹤。\n哪一種解決方案可以用「最低的維運負擔」滿足這個需求？", "options": {"A": "使用 AWS Organizations，為每個事業單位建立一個帳號。", "B": "用試算表記錄每項資源的擁有者與成本。", "C": "用 Amazon DynamoDB 資料表記錄每個事業單位的成本。", "D": "用 AWS Billing 主控台為資源指定擁有者並追蹤成本。"}, "correct_answer": "A", "explanation": "正確答案是 A。用 AWS Organizations 幫每個事業單位建一個獨立帳號，是官方建議的多帳號策略，帳單天生就會依帳號分開，不用額外手動記錄，維運負擔最低。B、C 都要手動維護記錄，容易出錯又耗人力；D 雖然也能在單一帳號內分類追蹤，但比不上「帳號天生分開」來得省事。"}, {"id": 248, "question": "一家公司想要一個時間序列資料庫服務，能更輕鬆地儲存並分析每天數兆筆事件。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "Amazon Neptune", "B": "Amazon Timestream", "C": "Amazon Forecast", "D": "Amazon DocumentDB（相容 MongoDB）"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon Timestream 是 AWS 專門為時間序列資料設計的資料庫服務，主打能輕鬆儲存並分析每天數兆筆事件。A 的 Neptune 是圖形資料庫；C 的 Forecast 是時間序列「預測」的機器學習服務，不是資料庫；D 的 DocumentDB 是文件型資料庫，都不是時間序列資料庫。"}, {"id": 249, "question": "根據責任共擔模型，以下哪一項是 AWS 與客戶之間的「共同控制項」？", "options": {"A": "組態管理（Configuration management）", "B": "實體與環境控制", "C": "資料完整性驗證", "D": "身分與存取管理（Identity and access management）"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS 官方文件明確列出責任共擔模型下的「共同控制項（Shared Controls）」只有三項：修補管理（Patch Management）、組態管理（Configuration Management）、意識與教育訓練（Awareness and Training）。組態管理是共同控制，因為 AWS 負責自己基礎設施的組態，客戶則負責自己作業系統/應用程式的組態，雙方各自在自己的層級上做。（提醒：ExamTopics 網站標記的正解是 D／身分與存取管理，但 IAM 在官方文件裡是明確歸類為客戶的責任，不是共同控制項，這裡以 A 為準，社群留言也一致指向 A。）B 的實體與環境控制完全是 AWS 的責任；D 的 IAM 完全是客戶的責任；C 不是官方定義的分類項目。"}, {"id": 250, "question": "一家公司常常用不滿目前的 Amazon EC2 容量，用來執行無狀態工作負載。公司想最佳化 EC2 成本。\n哪一種 EC2 執行個體類型可以滿足這個需求？", "options": {"A": "Spot 執行個體（Spot Instances）", "B": "專用執行個體（Dedicated Instances）", "C": "預留執行個體（Reserved Instances）", "D": "隨需執行個體（On-Demand Instances）"}, "correct_answer": "A", "explanation": "正確答案是 A。工作負載是無狀態（stateless）且公司本來就常常用不滿目前的容量，代表可以承受隨時被中斷的風險，這正是 Spot Instances 的適用情境，能用最低成本換取閒置的運算容量。B、C、D 都沒有 Spot 的折扣幅度大，也不是設計來搭配「不介意被中斷」場景的方案。"}, {"id": 251, "question": "一家公司想把資料存進 Amazon S3。這些資料很少被存取，就算遺失了也能重新產生。公司想用最划算的儲存類別來存放這些資料。\n哪一種 S3 儲存類別可以滿足這個需求？", "options": {"A": "S3 標準（S3 Standard）", "B": "S3 智慧分層（S3 Intelligent-Tiering）", "C": "S3 標準不常存取（S3 Standard-IA）", "D": "S3 單區域不常存取（S3 One Zone-IA）"}, "correct_answer": "D", "explanation": "正確答案是 D。資料很少被存取、且遺失了也能重新產生（代表不需要跨多個 AZ 的高持久性保障），選最便宜的 One Zone-IA 最划算，比 Standard-IA 少了跨 AZ 備援成本更低。A 的 Standard 是常態存取用，成本最高；B 的 Intelligent-Tiering 適合存取模式不確定、需要自動判斷搬移層級的情境，但本身有監控費用；C 的 Standard-IA 雖然也便宜，但比 One Zone-IA 貴，因為多了跨 AZ 冗餘，題目情境不需要這層保障。"}, {"id": 252, "question": "一家公司已經把工作負載遷移到 AWS，想大規模採用 AWS 並讓運作更有效率、更安全。\n公司應該用哪一種 AWS 服務或框架來取得維運面的支援？", "options": {"A": "AWS Support", "B": "AWS 雲端採用框架（AWS Cloud Adoption Framework, AWS CAF）", "C": "AWS 受管服務（AWS Managed Services, AMS）", "D": "AWS Well-Architected Framework"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Managed Services（AMS）官方文件明確寫著協助客戶「大規模採用 AWS、更有效率且安全地運作」，並提供維運層面的持續支援，跟題目描述逐字對應。（提醒：ExamTopics 網站標記的正解是 D／Well-Architected Framework，但 Well-Architected 是架構審查與最佳實踐指南，不是「維運支援」服務本身，這裡以 C 為準，也對應官方 AMS 產品頁的描述。）B 的 CAF 是雲端採用「策略規劃」框架，偏早期評估階段，不是持續性的維運支援；A 的 AWS Support 是技術支援方案，沒有 AMS 這種代管維運的深度；D 的 Well-Architected Framework 是自我審查用的架構準則。"}, {"id": 253, "question": "一家公司想用常見的程式語言 TypeScript、Python、Java、.NET，來佈建並管理自己的 AWS 基礎設施。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS CodeBuild", "B": "AWS CloudFormation", "C": "AWS CLI", "D": "AWS 雲端開發套件（AWS Cloud Development Kit, AWS CDK）"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS CDK 就是設計來讓開發者用 TypeScript、Python、Java、.NET 等常見程式語言定義並管理 AWS 基礎設施，背後轉譯成 CloudFormation 範本執行。（提醒：ExamTopics 網站標記的正解是 A／AWS CodeBuild，但 CodeBuild 是編譯建置程式碼、跑測試用的 CI 服務，跟「用程式語言定義基礎設施」完全是兩回事，這裡以 D 為準。）B 的 CloudFormation 雖然也是 IaC，但用的是 YAML/JSON 樣板語法，不是題目講的「常見程式語言」；C 的 CLI 是指令列工具，不是拿來寫程式定義架構的。"}, {"id": 254, "question": "哪一種 Amazon EC2 定價模式，能為一台「規格剛好、全天運行」且會跑滿 1 年的資料庫伺服器，提供最多的成本節省？", "options": {"A": "隨需執行個體（On-Demand Instances）", "B": "可轉換預留執行個體（Convertible Reserved Instances）", "C": "Spot 執行個體（Spot Instances）", "D": "標準預留執行個體（Standard Reserved Instances）"}, "correct_answer": "D", "explanation": "正確答案是 D。伺服器規格已經「剛好」（right-sized）且會持續運行 1 年，不需要之後更換執行個體類型的彈性，這種情況選 Standard Reserved Instances 折扣最深；Convertible RI 雖然多了可以換執行個體家族的彈性，但也因此犧牲了一些折扣幅度，題目情境用不到那個彈性，選 Standard 更省。（提醒：ExamTopics 網站標記的正解是 B／Convertible RI，社群普遍認為應為 D，因為情境完全沒有「未來要換規格」的需求，這裡以 D 為準。）A 的 On-Demand 沒有長期折扣；C 的 Spot 有中斷風險，不適合「always-up」的資料庫伺服器。"}, {"id": 255, "question": "一家公司有一座實體磁帶庫用來存放資料備份，磁帶庫的空間快用完了，公司需要把磁帶庫的容量延伸到 AWS 雲端。\n公司應該用哪一種 AWS 服務滿足這個需求？", "options": {"A": "Amazon Elastic File System（Amazon EFS）", "B": "Amazon Elastic Block Store（Amazon EBS）", "C": "Amazon S3", "D": "AWS Storage Gateway"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Storage Gateway 裡的 Tape Gateway（磁帶閘道）功能，就是設計來把地端的實體磁帶備份流程無縫延伸到雲端，用虛擬磁帶取代實體磁帶、底層用 S3/Glacier 儲存，完全對應題目「延伸磁帶庫容量到雲端」的需求。A 的 EFS 是檔案系統；B 的 EBS 是區塊儲存；C 的 S3 是物件儲存，三者都沒有「模擬磁帶介面」的功能，沒辦法無縫接上既有的磁帶備份軟體/流程。"}, {"id": 256, "question": "一家公司的應用程式使用了好幾項 AWS 服務的免費方案（Free Tier）。\n如果免費方案的使用期限到期，或應用程式的用量超過免費方案的額度，會發生什麼事？", "options": {"A": "公司會被收取超出免費方案用量部分的標準隨用隨付費率。", "B": "AWS Support 會聯繫公司設定標準服務費用。", "C": "公司會被收取免費方案期間所用服務的費用，加上免費方案期滿後額外使用的費用。", "D": "公司的 AWS 帳戶會被凍結，需要建立付款方案後才能重新啟用。"}, "correct_answer": "A", "explanation": "正確答案是 A。免費方案（Free Tier）到期或超過用量額度後，超出的部分會直接按標準隨用隨付（pay-as-you-go）費率自動收費，不需要人工介入。（提醒：ExamTopics 網站標記的正解是 B，但 AWS 完全是自動計費，不會有 Support 主動聯繫設定收費這種流程，社群留言也一致指向 A，這裡以 A 為準。）C 描述聽起來合理但「加上免費方案期間所用服務的費用」講法怪異（免費方案期間本來就不收費，沒有「額外費用」的說法）；D 的凍結帳戶說法不實，超額使用不會自動凍結帳戶。"}, {"id": 257, "question": "一家公司想監控工作負載的效能，並確保雲端服務的交付程度能符合業務需求。\n哪一個 AWS 雲端採用框架（AWS CAF）觀點可以滿足這個需求？", "options": {"A": "商業（Business）", "B": "治理（Governance）", "C": "平台（Platform）", "D": "維運（Operations）"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS CAF 的「商業（Business）」觀點，關注的正是確保雲端服務的交付程度能對齊、滿足實際的業務需求，題目描述完全對應這個觀點的定義。D 的維運（Operations）觀點比較著重在日常維運健康度、事件管理等技術面的持續運作，跟「服務是否符合業務需求」這個角度不同；B 的治理是風險與法遵管理；C 的平台是技術架構標準化，都不是題目描述的重點。"}, {"id": 258, "question": "一家公司想把應用程式遷移到 AWS 雲端，計劃找出並排序各種業務轉型機會，並評估自己的雲端就緒度。\n公司應該用哪一種 AWS 服務或工具滿足這些需求？", "options": {"A": "AWS 雲端採用框架（AWS Cloud Adoption Framework, AWS CAF）", "B": "AWS 受管服務（AWS Managed Services, AMS）", "C": "AWS Well-Architected Framework", "D": "AWS Migration Hub"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS CAF 官方的定位就是幫助企業「找出並排序業務轉型機會、評估雲端就緒度」，題目描述幾乎是 CAF 官網文案的翻版。（提醒：ExamTopics 網站標記的正解是 D／Migration Hub，但 Migration Hub 是追蹤「已在執行的遷移專案」進度的儀表板，不負責前期的業務機會盤點與就緒度評估，這裡以 A 為準。）B 的 AMS 是代管維運服務；C 的 Well-Architected Framework 是架構審查準則，都不是做「業務轉型機會評估」的工具。"}, {"id": 259, "question": "一家公司需要一項 AWS 服務，能清楚盤點公司目前在地端資料中心運行的內容，並算出把這些地端工作負載搬到 AWS 雲端後的預估成本。\n哪一種 AWS 服務或工具可以滿足這些需求？", "options": {"A": "AWS Compute Optimizer", "B": "AWS Cost Explorer", "C": "AWS Systems Manager Agent（SSM Agent）", "D": "Migration Evaluator"}, "correct_answer": "D", "explanation": "正確答案是 D。Migration Evaluator 專門用來盤點地端環境現況、建立基準線，並產生遷移到 AWS 後的預估費用報告，完全對應題目需求。（提醒：ExamTopics 網站標記的正解是 B／Cost Explorer，但 Cost Explorer 分析的是既有 AWS 帳號的花費，不會去盤點地端環境，這裡以 D 為準。）A 的 Compute Optimizer 是針對既有 AWS 資源給規格建議；C 的 SSM Agent 是裝在伺服器上執行維運指令的代理程式，都不是評估地端環境並估算上雲成本的工具。"}, {"id": 260, "question": "一家公司收購了另一家企業，現在公司有兩個 AWS 帳號。\n公司可以用哪一種 AWS 服務或工具，把這兩個帳號的帳單合併起來？", "options": {"A": "AWS Systems Manager", "B": "AWS Organizations", "C": "AWS License Manager", "D": "Cost Explorer"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Organizations 裡的「合併帳單（Consolidated Billing）」功能，正是設計來把多個 AWS 帳號的帳單合併成一張帳單，收購後想合併兩個帳號的帳單就是用這個功能。（提醒：ExamTopics 網站標記的正解是 C／License Manager，但那是用來追蹤軟體授權用量的服務，跟帳單合併完全無關，這裡以 B 為準，社群留言也高票指出這個標記錯誤。）A 的 Systems Manager 是維運管理工具；D 的 Cost Explorer 是分析既有花費的視覺化工具，都不能「合併」兩個帳號的帳單。"}, {"id": 261, "question": "一家公司想讓工作負載能執行預期的功能，並在故障發生後快速恢復。\n這對應到 Well-Architected Framework 的哪一個支柱？", "options": {"A": "效能效率（Performance efficiency）", "B": "永續性（Sustainability）", "C": "可靠性（Reliability）", "D": "安全性（Security）"}, "correct_answer": "C", "explanation": "正確答案是 C。「執行預期功能、並在故障後快速恢復」正是 Well-Architected Framework「可靠性（Reliability）」支柱的官方定義。（提醒：ExamTopics 網站標記的正解是 A／效能效率，但效能效率講的是「有效運用運算資源因應需求變化」，跟「故障恢復」是不同概念，這裡以 C 為準。）A 效能效率、B 永續性、D 安全性都是 WAF 的其他支柱，但定義都對不上題目描述的「故障恢復」。"}, {"id": 262, "question": "以下何者是專門用來做 ETL（擷取、轉換、載入）資料的 AWS 全託管服務？", "options": {"A": "Amazon Athena", "B": "AWS Glue", "C": "Amazon S3", "D": "AWS Snowball Edge"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Glue 是專門設計來做 ETL（擷取、轉換、載入）的全託管服務。A 的 Athena 是直接對 S3 資料做 SQL 查詢分析的服務，不是 ETL 工具；C 的 S3 是儲存服務；D 的 Snowball Edge 是資料搬遷/邊緣運算裝置，都不是 ETL 服務。"}, {"id": 263, "question": "一家公司想把地端資料中心裡數 PB 等級的資料遷移到 AWS，公司不想用網際網路連線來進行這次遷移。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS DataSync", "B": "Amazon Connect", "C": "AWS Snowmobile", "D": "AWS Direct Connect"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Snowmobile 是用貨櫃卡車搬運的實體儲存裝置，專門應付 PB 級別的超大量資料搬遷，完全不需要透過網路連線。A 的 DataSync 跟 D 的 Direct Connect 都還是要透過網路（連線）傳輸資料，不符合「不使用網際網路連線」的條件；B 的 Connect 是雲端客服中心服務，跟資料搬遷無關。"}, {"id": 264, "question": "一家公司想收到警示，以監控其 AWS 公有雲基礎設施的整體營運成本。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "Amazon EventBridge", "B": "運算節省計劃（Compute Savings Plans）", "C": "AWS Budgets", "D": "Migration Evaluator"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Budgets 就是設計來設定花費門檻、並在超過門檻時發送警示通知的服務，直接對應「監控整體營運成本並收到警示」的需求。（提醒：ExamTopics 網站標記的正解是 B／Compute Savings Plans，但那是一種「購買折扣承諾」的定價方案，本身不會發送成本警示，這裡以 C 為準。）A 的 EventBridge 是事件驅動的通用訊息路由服務，沒有內建成本警示的功能；D 的 Migration Evaluator 是遷移評估工具，都不是成本警示服務。"}, {"id": 265, "question": "AWS Enterprise Support 裡的 Concierge（支援禮賓）團隊，是如何協助使用者的？", "options": {"A": "支援應用程式開發", "B": "提供架構指引", "C": "回答帳務與帳戶相關問題", "D": "回答技術支援案件相關問題"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Enterprise Support 裡的「Support Concierge」團隊，官方文件明確定位為專門處理帳務與帳戶層面的問題，跟負責架構指引的 Technical Account Manager（TAM）是不同角色。（提醒：ExamTopics 網站標記的正解是 A／支援應用程式開發，跟官方文件定義不符，這裡以 C 為準，社群留言也指向官方文件連結佐證。）B 的架構指引是 TAM 的職責；D 的技術支援案件是一般 Support 工程師處理的範疇。"}, {"id": 266, "question": "一家公司想跑一個 3 年、不能中斷的模擬運算。\n哪一種 Amazon EC2 購買方案能最划算地滿足這個需求？", "options": {"A": "Spot 執行個體（Spot Instances）", "B": "預留執行個體（Reserved Instances）", "C": "專用主機（Dedicated Hosts）", "D": "隨需執行個體（On-Demand Instances）"}, "correct_answer": "B", "explanation": "正確答案是 B。跑滿 3 年、且不能被中斷的工作負載，用 3 年期 Reserved Instances 換取長期折扣（比 On-Demand 最高可省到 72%），是最划算的選擇，同時 RI 也保證不會像 Spot 那樣被中途回收。（提醒：ExamTopics 網站標記的正解是 D／On-Demand，社群留言引用官方價格比較資料指出應為 B，這裡以 B 為準。）A 的 Spot 隨時可能被中斷，不符合「不能中斷」的要求；C 的 Dedicated Hosts 主打實體隔離，不是為了長期省錢設計的。"}, {"id": 267, "question": "哪一種 AWS 服務或資源，可以用「承諾一定花費」來換取部分 AWS 服務成本的折扣？", "options": {"A": "Amazon Detective", "B": "AWS Pricing Calculator", "C": "Savings Plans", "D": "基本支援（Basic Support）"}, "correct_answer": "C", "explanation": "正確答案是 C。Savings Plans 就是用「承諾一段期間內的固定花費」來換取部分 AWS 服務折扣的定價方案，跟題目描述逐字對應。（提醒：ExamTopics 網站標記的正解是 A／Amazon Detective，但那是資安調查分析服務，跟定價折扣完全無關，這裡以 C 為準，明顯是標記錯誤。）B 的 Pricing Calculator 是預估費用的試算工具，不是實際的折扣方案；D 的 Basic Support 是免費的基礎支援方案，沒有花費承諾換折扣的機制。"}, {"id": 268, "question": "以下何者是 AWS Well-Architected Framework 的支柱？（選擇兩個。）", "options": {"A": "高可用性", "B": "效能效率（Performance efficiency）", "C": "成本最佳化（Cost optimization）", "D": "幾分鐘內完成全球部署", "E": "持續開發"}, "correct_answer": "BC", "explanation": "正確答案是 B、C。Well-Architected Framework 官方六大支柱是：卓越營運、安全性、可靠性、效能效率、成本最佳化、永續性，其中效能效率跟成本最佳化剛好都在選項裡。（提醒：ExamTopics 網站標記的正解只有單一字母 D，但這題是「選兩個」，D「幾分鐘內完成全球部署」根本不是 WAF 的支柱、而是雲端運算的優勢之一，明顯是標記錯誤，這裡以 B、C 為準，社群高票留言也一致同意。）A 的高可用性是「可靠性」支柱底下的子概念，不是獨立的支柱；E 持續開發不是官方六大支柱之一。"}, {"id": 269, "question": "一家公司想用 Amazon EC2 執行個體，為全球使用者提供靜態網站，需要讓使用者的延遲降到最低。\n哪一種解決方案可以滿足這個需求？", "options": {"A": "在多個邊緣節點使用 EC2 執行個體。", "B": "在相同可用區域、但不同 AWS 區域使用 EC2 執行個體。", "C": "用 Amazon CloudFront，並將 EC2 執行個體設定為來源（origin）。", "D": "在相同可用區域、但不同 AWS 帳號使用 EC2 執行個體。"}, "correct_answer": "C", "explanation": "正確答案是 C。要讓全球使用者存取靜態網站時延遲最低，標準做法是用 CloudFront 這個 CDN 服務，把內容快取到全球邊緣節點，EC2 只當作原始內容來源（origin）。（提醒：ExamTopics 網站標記的正解是 D，但「同一個可用區域、換不同帳號」完全沒有地理分散的效果，對降低全球延遲沒有任何幫助，明顯是標記錯誤，這裡以 C 為準。）A、B、D 選項描述的做法都沒有真正做到「把內容快取到離使用者最近的節點」，無法有效降低全球延遲。"}, {"id": 270, "question": "一組研究團隊要在世界各地的偏遠地點蒐集資料，許多地點沒有網路連線。團隊需要先在現場收集資料，之後再把資料傳輸到 AWS 雲端。\n哪一種 AWS 服務可以支援這些需求？", "options": {"A": "AWS Outposts", "B": "AWS Transfer Family", "C": "AWS Snow 系列（AWS Snow Family）", "D": "AWS Migration Hub"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Snow Family（Snowcone、Snowball 等）就是設計來在「沒有網路連線」的現場先把資料存進實體裝置，之後再把裝置寄回或連網同步到 AWS，完全對應「偏遠地區、沒有網路、先在現場收資料再傳輸」的情境。（提醒：ExamTopics 網站標記的正解是 B／Transfer Family，但那是透過 SFTP/FTPS 等網路傳輸協定把檔案送進 AWS，需要網路連線才能運作，跟題目「沒有網路連線」的前提互相矛盾，這裡以 C 為準。）A 的 Outposts 是把 AWS 服務延伸到地端機房，仍需要網路連回 AWS；D 的 Migration Hub 是追蹤遷移進度的儀表板，都不是資料收集裝置。"}, {"id": 271, "question": "一家公司把地端的正式環境工作負載搬到 AWS 後，可以獲得以下哪些效益？（選擇兩個。）", "options": {"A": "AWS 會訓練公司員工使用所有 AWS 服務。", "B": "AWS 管理雲端中的所有安全事項。", "C": "AWS 提供技術客戶經理（TAM）的免費支援。", "D": "AWS 提供高可用性。", "E": "AWS 提供規模經濟效益。"}, "correct_answer": "DE", "explanation": "正確答案是 D、E。高可用性與規模經濟都是把工作負載搬上 AWS 後，客戶能實際獲得的效益。（提醒：ExamTopics 網站標記的正解是 C、E，但 C「TAM 免費支援」不成立——TAM 服務只在 Enterprise Support 等級才有，並非免費，這裡以 D、E 為準，社群留言也一致同意。）A「AWS 訓練員工使用所有服務」不是 AWS 提供的標準保證；B「AWS 管理雲端中所有安全事項」違反責任共擔模型，客戶仍要負責「雲端內」的安全，都是錯誤描述。"}, {"id": 272, "question": "一家公司決定採用 Amazon EC2 基礎設施，想針對多種短期使用的無狀態服務做擴展。\n哪一種 EC2 定價模式最省成本？", "options": {"A": "Spot 執行個體（Spot Instances）", "B": "隨需執行個體（On-Demand Instances）", "C": "預留執行個體（Reserved Instances）", "D": "專用主機（Dedicated Hosts）"}, "correct_answer": "A", "explanation": "正確答案是 A。無狀態（stateless）且只是短期使用，代表可以承受中途被中斷的風險，這正是 Spot Instances 最適合的情境，折扣幅度也最大。C 的 Reserved Instances 是用長期承諾換折扣，不適合短期用途；B 的 On-Demand 沒有 Spot 的折扣力度；D 的 Dedicated Hosts 走的是實體隔離路線，成本較高，都不是「短期、最省錢」的最佳解。"}, {"id": 273, "question": "以下何者是 AWS Trusted Advisor 的效益？（選擇兩個。）", "options": {"A": "存取 Amazon Simple Queue Service（Amazon SQS）", "B": "成本最佳化建議", "C": "每小時重新整理服務限制檢查", "D": "安全性檢查", "E": "AWS Identity and Access Management（IAM）核准管理"}, "correct_answer": "BD", "explanation": "正確答案是 B、D。AWS Trusted Advisor 官方文件列出五大檢查類別：成本最佳化、效能、安全性、容錯能力、服務限制，其中「成本最佳化建議」跟「安全性檢查」都是官方明確列出的核心效益。（提醒：ExamTopics 網站標記的正解是 B、C，但 C「服務限制檢查每小時重新整理」講的是特定檢查項目的更新頻率，不是 Trusted Advisor 的整體效益，這裡以 B、D 為準，社群留言也多數同意。）A 的 SQS 存取跟 E 的 IAM 核准管理都跟 Trusted Advisor 的功能無關，是干擾選項。"}, {"id": 274, "question": "一家公司想把終端使用者不常存取的資料歸檔，藉此節省成本。\n哪一種 Amazon S3 功能可以滿足這個需求？", "options": {"A": "S3 版本控制（Versioning）", "B": "S3 生命週期（Lifecycle）", "C": "S3 物件鎖定（Object Lock）", "D": "S3 清冊（Inventory）"}, "correct_answer": "B", "explanation": "正確答案是 B。S3 Lifecycle 可以設定規則，自動把不常存取的物件轉移到更便宜的儲存類別（甚至封存到 Glacier），或到期自動刪除，正好對應「歸檔省成本」的需求。（提醒：ExamTopics 網站標記的正解是 C／Object Lock，但那是防止物件被刪除／覆寫的合規鎖定功能，跟「歸檔省成本」無關，這裡以 B 為準，明顯是標記錯誤。）A 的 Versioning 是保留物件多個版本的功能，跟成本無關；D 的 Inventory 是產生儲存桶內容清單報表的功能，也不是用來自動歸檔省成本的。"}, {"id": 275, "question": "一家公司用 AWS 區域（Regions）來提升不同國家使用者的應用程式可用性，這是在運用哪一種雲端運算優勢？", "options": {"A": "隨用隨付定價", "B": "容量預測", "C": "規模經濟", "D": "全球觸及（Global reach）"}, "correct_answer": "D", "explanation": "正確答案是 D。用多個 AWS 區域（Regions）讓不同國家的使用者都能就近存取應用程式，對應的正是雲端優勢裡的「Global Reach」（全球觸及）——能快速把服務部署到世界各地離使用者最近的地方。（提醒：ExamTopics 網站標記的正解是 C／規模經濟，但規模經濟講的是「大量採購壓低成本」，跟「地理分佈提升可用性」是不同的優勢面向，這裡以 D 為準，社群留言也一致同意。）A 的隨用隨付是計費模式；B 的容量預測是資源規劃相關，都跟題目描述的重點不同。"}, {"id": 276, "question": "一家公司想用 AWS 服務，在本地收集並處理 10 TB 的資料，再把資料傳輸到 AWS，公司的網路連線是間歇性的（不穩定）。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "AWS Database Migration Service（AWS DMS）", "B": "AWS DataSync", "C": "AWS Backup", "D": "AWS Snowball Edge"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Snowball Edge 是一台實體裝置，可以在網路連線不穩定的現場，先在本地收集並處理資料，之後再把裝置寄回或視連線狀況同步到 AWS，完全對應「間歇性連線」這個限制條件。（提醒：ExamTopics 網站標記的正解是 B／DataSync，但 DataSync 設計上仍仰賴穩定的網路連線持續傳輸，不適合間歇性連線的情境，這裡以 D 為準。）A 的 DMS 是資料庫遷移服務；C 的 AWS Backup 是備份管理服務，都不是為本地收集/處理資料設計的。"}, {"id": 277, "question": "以下何者是 AWS Well-Architected Framework「卓越營運」（Operational Excellence）支柱在 AWS 雲端的設計原則？", "options": {"A": "幾分鐘內完成全球部署。", "B": "頻繁地做小規模、可回復的變更。", "C": "建立紮實的身分與存取管理基礎。", "D": "不再花錢維護資料中心的硬體基礎設施。"}, "correct_answer": "B", "explanation": "正確答案是 B。「Make Frequent, Small, Reversible Changes」是 Well-Architected Framework「卓越營運（Operational Excellence）」支柱官方列出的設計原則之一：把變更拆小、拆頻繁，一旦出錯也容易回復。（提醒：ExamTopics 網站標記的正解是 D，但那句話其實是雲端運算六大優勢之一，不是 Well-Architected 卓越營運支柱的設計原則，這裡以 B 為準，社群留言也引用官方文件連結佐證。）A 是雲端優勢，不是 WAF 設計原則；C「紮實的 IAM 基礎」是「安全性（Security）」支柱的設計原則，不屬於卓越營運。"}, {"id": 278, "question": "使用 AWS 無伺服器運算（serverless computing）的效益是什麼？", "options": {"A": "不需要部署與管理應用程式。", "B": "應用程式安全性完全由 AWS 管理。", "C": "不需要監控與記錄日誌。", "D": "基礎設施的管理工作交給 AWS 負責。"}, "correct_answer": "D", "explanation": "正確答案是 D。無伺服器運算（serverless）的核心價值就是把「基礎設施管理」這件事完全交給 AWS（不用管伺服器容量、修補、擴縮），開發者只需要專注在程式碼本身。（提醒：ExamTopics 網站標記的正解是 A，但無伺服器架構還是需要部署程式碼、管理應用程式邏輯，A 講的「不需要部署與管理應用程式」不成立，這裡以 D 為準，社群留言也一致同意。）B 應用程式層級的安全在責任共擔模型下仍是客戶的責任；C 監控與記錄日誌在 serverless 架構下依然需要（只是換一種方式做），兩者描述都不正確。"}, {"id": 279, "question": "某開發者想讓 AWS 使用者用臨時安全憑證來存取 AWS 服務。\n開發者應該用哪一種 AWS 服務或功能來提供這種憑證？", "options": {"A": "IAM 政策", "B": "IAM 使用者群組", "C": "AWS 安全令牌服務（AWS Security Token Service, AWS STS）", "D": "AWS IAM Identity Center（AWS Single Sign-On）"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS STS 專門用來核發臨時性、限時效的安全憑證，讓使用者能用這組臨時憑證存取 AWS 服務，完全對應「temporary security credentials」的需求。（提醒：ExamTopics 網站標記的正解是 D／IAM Identity Center，但那是給員工做跨帳號單一登入用的服務，核發的是登入身分而非題目描述的臨時安全憑證，這裡以 C 為準，也是社群普遍認同的標準答案。）A 的 IAM 政策是定義權限規則的文件，不會核發憑證；B 的 IAM 使用者群組是組織使用者的方式，也不會核發憑證。"}, {"id": 280, "question": "一家跨國公司想用受管的安全服務保護自己免受 SQL injection 攻擊，這個服務同時要能提供關於電商應用程式存取情況的詳細記錄資訊。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "AWS Network Firewall", "B": "Amazon RDS for SQL Server", "C": "Amazon GuardDuty", "D": "AWS Web 應用程式防火牆（AWS WAF）"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS WAF 是專門保護網頁應用程式的防火牆服務，內建規則可以防禦 SQL injection 等常見攻擊手法，並提供詳細的存取請求記錄。（提醒：ExamTopics 網站標記的正解是 B／Amazon RDS for SQL Server，但那只是一種關聯式資料庫服務，本身不具備防禦 SQL injection 攻擊或記錄應用程式存取的安全防護功能，這裡以 D 為準，明顯是標記錯誤。）A 的 Network Firewall 是網路層防火牆，防的是網路層攻擊，不是應用層的 SQL injection；C 的 GuardDuty 是威脅偵測服務，不是防禦服務。"}, {"id": 281, "question": "一家公司正在把地端伺服器遷移到 Amazon EC2 執行個體，這台伺服器接下來 12 個月必須隨時保持運作。\n哪一種 EC2 定價方案對這個工作負載最划算？", "options": {"A": "隨需執行個體（On-Demand）", "B": "專用主機（Dedicated Hosts）", "C": "Spot 執行個體（Spot Instances）", "D": "預留執行個體（Reserved Instances）"}, "correct_answer": "D", "explanation": "正確答案是 D。伺服器需要在接下來 12 個月「持續在線」，用 1 年期 Reserved Instances 換取長期折扣，是最划算的做法。A 的 On-Demand 沒有長期折扣；C 的 Spot 隨時可能被中斷，跟「持續在線」的需求衝突；B 的 Dedicated Hosts 主打實體隔離，成本較高，不是以省錢為目的的方案。"}, {"id": 282, "question": "根據責任共擔模型，以下何者是客戶的責任？（選擇兩個。）", "options": {"A": "維護基礎設施裝置的組態設定。", "B": "維護硬體基礎設施內的修補與更新。", "C": "維護客體作業系統與應用程式的組態設定。", "D": "管理加密選項相關的決策。", "E": "維護基礎設施硬體。"}, "correct_answer": "CD", "explanation": "正確答案是 C、D。客戶在責任共擔模型下要負責自己的客體作業系統與應用程式組態設定，以及決定要不要啟用加密、用哪把金鑰等加密相關的決策。（提醒：ExamTopics 網站標記的正解是 A、C，但 A「維護基礎設施裝置的組態設定」是 AWS 的責任，不是客戶的責任，這裡以 C、D 為準，社群留言也一致指向 CD。）A 基礎設施裝置組態、B 硬體基礎設施修補、E 維護基礎設施硬體，這三項全都是 AWS 的責任，不屬於客戶端。"}, {"id": 283, "question": "一家公司想確認自己的 AWS 帳號裡所有使用者是否都啟用了多重要素驗證（MFA）。\n哪一種 AWS 服務或資源可以滿足這個需求？", "options": {"A": "AWS 成本與使用報告", "B": "IAM 憑證報告（IAM credential reports）", "C": "AWS Artifact", "D": "Amazon CloudFront 報告"}, "correct_answer": "B", "explanation": "正確答案是 B。IAM 憑證報告會列出帳號內每個使用者的憑證狀態，包含密碼、存取金鑰、MFA 是否啟用等資訊，正好對應「確認所有使用者是否啟用 MFA」的需求。A 的成本使用報告跟帳務有關；C 的 Artifact 是合規文件庫；D 的 CloudFront 報告是 CDN 流量報表，三者都跟 MFA 狀態無關。"}, {"id": 284, "question": "一家公司使用多種 AWS 資安服務與工具，需要一項服務來協助管理安全警示，並把警示整理進單一儀表板。\n公司應該用哪一種 AWS 服務滿足這些需求？", "options": {"A": "Amazon GuardDuty", "B": "Amazon Inspector", "C": "Amazon Macie", "D": "AWS Security Hub"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Security Hub 的核心定位就是彙整 GuardDuty、Inspector、Macie 等多項資安服務產生的發現與警示，統一呈現在單一儀表板上，正好對應「把安全警示整理進單一儀表板」的需求。（提醒：ExamTopics 網站標記的正解是 A／GuardDuty，但 GuardDuty 只是眾多產生警示的來源之一，本身不負責彙整其他服務的警示到單一畫面，這裡以 D 為準。）B 的 Inspector 是漏洞掃描；C 的 Macie 是敏感資料識別，兩者也都只是警示來源，不是彙整儀表板。"}, {"id": 285, "question": "一家公司想有效運行自己在 AWS 雲端的工作負載，降低管理負擔，並改善作業流程。\n哪一個 AWS Well-Architected Framework 支柱代表這些需求？", "options": {"A": "可靠性（Reliability）", "B": "卓越營運（Operational excellence）", "C": "效能效率（Performance efficiency）", "D": "成本最佳化（Cost optimization）"}, "correct_answer": "B", "explanation": "正確答案是 B。「有效運行工作負載、降低管理負擔、改善作業流程」正是「卓越營運（Operational Excellence）」支柱的關鍵字：持續監控系統並改善支援流程與程序。（提醒：ExamTopics 網站標記的正解是 C／效能效率，但效能效率講的是「有效運用運算資源」，跟題目強調的「降低管理負擔、改善流程」不是同一件事，這裡以 B 為準，社群留言的關鍵字比對也支持這個答案。）A 可靠性講的是故障恢復；D 成本最佳化講的是花費管理，都跟題目描述的重點不同。"}, {"id": 286, "question": "一家公司用 Amazon S3 儲存可能包含個人識別資訊（PII）的紀錄，公司想要一個解決方案能監控所有 S3 儲存桶找出 PII，並立即通知相關人員有漏洞風險。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "Amazon GuardDuty", "B": "Amazon Detective", "C": "Amazon Macie", "D": "AWS Shield"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon Macie 專門用機器學習掃描 S3 裡的資料內容，自動找出個資（PII）等敏感資訊並發送警示，完全對應題目需求。（提醒：ExamTopics 網站標記的正解是 A／GuardDuty，但 GuardDuty 偵測的是異常行為模式（如帳號被盜用、惡意 API 呼叫），不會去掃描 S3 物件內容找 PII，這裡以 C 為準。）B 的 Detective 是資安事件調查分析工具；D 的 Shield 是 DDoS 防護，都跟「掃描資料內容找 PII」無關。"}, {"id": 287, "question": "哪一種 AWS 服務可以讓使用者隨需下載關於 AWS 基礎設施的資安與合規報告？", "options": {"A": "Amazon GuardDuty", "B": "AWS Security Hub", "C": "AWS Artifact", "D": "AWS Shield"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Artifact 就是官方合規文件的自助下載入口，可以隨時取得 SOC 報告、ISO 認證等安全與合規文件。（提醒：ExamTopics 網站標記的正解是 A／GuardDuty，這題答錯得很明顯，GuardDuty 是威脅偵測服務，跟下載合規文件完全無關，這裡以 C 為準，社群留言也直接點名這個答案是錯的。）B 的 Security Hub 是安全狀態儀表板；D 的 Shield 是 DDoS 防護，都不是文件下載服務。"}, {"id": 288, "question": "某外部稽核員要求一家公司提供所有 IAM 使用者的清單，包含使用者憑證與存取金鑰的狀態。\n提供這份資訊「最簡單」的方式是什麼？", "options": {"A": "幫稽核員建立一個具管理員權限的 IAM 使用者帳號。", "B": "把每個使用者頁面截圖，再把截圖提供給稽核員。", "C": "下載 IAM 憑證報告，提供給稽核員。", "D": "下載 AWS Trusted Advisor 報告，提供給稽核員。"}, "correct_answer": "C", "explanation": "正確答案是 C。IAM 憑證報告一鍵就能匯出帳號內所有使用者的憑證與存取金鑰狀態，是最簡單直接的做法。（提醒：ExamTopics 網站標記的正解是 B／逐一截圖，這明顯不是「最簡單」的方式，尤其使用者一多會非常沒效率，這裡以 C 為準。）A 給稽核員建管理員帳號權限給太大，也不必要；D 的 Trusted Advisor 報告內容是健檢建議，不是使用者憑證清單。"}, {"id": 289, "question": "公司可以用 AWS 雲端裡的安全群組（security groups）完成什麼工作？", "options": {"A": "只允許透過特定連接埠存取 Amazon EC2 執行個體。", "B": "在子網路層級拒絕惡意 IP 位址存取。", "C": "保護 Amazon CloudFront 快取的資料。", "D": "為 Amazon EC2 執行個體套用無狀態防火牆。"}, "correct_answer": "A", "explanation": "正確答案是 A。Security Groups 是作用在執行個體層級的防火牆，可以設定只開放特定連接埠（如 443）的流量進出，這是它最基本的功能。（提醒：ExamTopics 網站標記的正解是 D，但 Security Groups 其實是「有狀態（stateful）」防火牆，不是無狀態，選項本身的描述就跟事實不符，這裡以 A 為準。）B「在子網路層級拒絕 IP」是 Network ACL 的功能，不是 Security Groups；C 跟 CloudFront 快取保護無關。"}, {"id": 290, "question": "一家公司計劃執行一個使用圖形處理器（GPU）的運算密集型工作負載。\n公司應該用哪一種 Amazon EC2 執行個體類型？", "options": {"A": "加速運算（Accelerated computing）", "B": "運算最佳化（Compute optimized）", "C": "儲存最佳化（Storage optimized）", "D": "通用型（General purpose）"}, "correct_answer": "A", "explanation": "正確答案是 A。需要用到 GPU（圖形處理器）的運算密集型工作負載，對應的是「加速運算（Accelerated Computing）」執行個體家族（如 P、G 系列），這類執行個體才有搭載 GPU。（提醒：ExamTopics 網站標記的正解是 B／運算最佳化，但那個家族主打的是高效能 CPU，並不搭載 GPU，這裡以 A 為準。）C 儲存最佳化主打高速磁碟 I/O；D 通用型是均衡型規格，兩者都不是為 GPU 工作負載設計的。"}, {"id": 291, "question": "以下何者是 AWS 雲端中網路存取控制清單（Network ACL）的特性？（選擇兩個。）", "options": {"A": "它們是無狀態的（stateless）。", "B": "它們是有狀態的（stateful）。", "C": "它們會先評估完所有規則才決定是否放行流量。", "D": "決定是否放行流量時，會依編號由小到大依序處理規則。", "E": "它們運作在執行個體層級。"}, "correct_answer": "AD", "explanation": "正確答案是 A、D。Network ACL（網路存取控制清單）是無狀態的防火牆，運作在子網路層級而非執行個體層級；判斷規則時會依規則編號由小到大依序比對，一旦符合就套用該規則，不會全部規則都評估完才決定。（提醒：ExamTopics 網站標記的正解是 D、E，但 E「運作在執行個體層級」其實是 Security Groups 的特性，Network ACL 是運作在子網路層級，這裡以 A、D 為準，社群留言也一致同意。）B「有狀態」是 Security Groups 的特性，不是 Network ACL；C「評估完所有規則」不符合 NACL 依序比對、符合就套用的實際運作方式。"}, {"id": 292, "question": "以下何者屬於 AWS 雲端採用框架（AWS CAF）「平台」（Platform）觀點下的能力？（選擇兩個。）", "options": {"A": "效能與容量管理", "B": "資料工程（Data engineering）", "C": "持續整合／持續交付（CI/CD）", "D": "基礎設施保護", "E": "變更與版本發布管理"}, "correct_answer": "BC", "explanation": "正確答案是 B、C。AWS CAF「平台（Platform）」觀點關注的是技術架構的建置與交付能力，資料工程（Data engineering）與 CI/CD 都是官方文件列在平台觀點下的能力項目。（提醒：ExamTopics 網站標記的正解是 A、B，但 A「效能與容量管理」其實是「維運（Operations）」觀點的能力項目，不屬於平台觀點，這裡以 B、C 為準，社群留言也引用官方白皮書連結佐證。）D「基礎設施保護」是「安全（Security）」觀點的能力；E「變更與版本發布管理」也屬於「維運」觀點，都不是平台觀點的項目。"}, {"id": 293, "question": "根據責任共擔模型，客戶要負責幫以下哪一項服務套用最新的安全更新與修補？", "options": {"A": "Amazon DynamoDB", "B": "Amazon EC2 執行個體", "C": "Amazon RDS 執行個體", "D": "Amazon S3"}, "correct_answer": "B", "explanation": "正確答案是 B。只有 EC2 是 IaaS 層級，客體作業系統由客戶自己安裝管理，安全更新與修補也是客戶的責任。（提醒：ExamTopics 網站標記的正解是 D／S3，但 S3 是物件儲存服務，根本沒有「客體作業系統」這回事，客戶不需要也無法對 S3 做系統修補，這裡以 B 為準，明顯是標記錯誤。）DynamoDB、RDS 都是全託管服務，作業系統層級的修補由 AWS 負責，客戶完全碰不到。"}, {"id": 294, "question": "對於「存取模式不確定」的資料來說，哪一種 Amazon S3 儲存類別最划算？", "options": {"A": "S3 標準（S3 Standard）", "B": "S3 標準不常存取（S3 Standard-IA）", "C": "S3 單區域不常存取（S3 One Zone-IA）", "D": "S3 智慧分層（S3 Intelligent-Tiering）"}, "correct_answer": "D", "explanation": "正確答案是 D。當存取模式「無法預測」時，S3 Intelligent-Tiering 會自動依照實際存取頻率，把物件在不同層級間搬移，不用人工判斷該選哪個儲存類別，是應付「存取模式未知」情境的官方建議做法。（提醒：ExamTopics 網站標記的正解是 A／S3 Standard，但 Standard 是針對「頻繁存取」設計的，儲存成本最高，不是「不確定存取模式」下最划算的選擇，這裡以 D 為準。）B、C 都是針對「已知不常存取」設計的類別，如果實際存取模式其實很頻繁，會被收取額外的取回費用，風險較高。"}, {"id": 295, "question": "以下何者屬於 AWS 雲端採用框架（AWS CAF）「安全」（Security）觀點下的能力？（選擇兩個。）", "options": {"A": "可觀測性（Observability）", "B": "事件與問題管理", "C": "事故回應（Incident response）", "D": "基礎設施保護（Infrastructure protection）", "E": "可用性與持續營運"}, "correct_answer": "CD", "explanation": "正確答案是 C、D。AWS CAF「安全（Security）」觀點官方文件列出的能力包含事故回應（Incident Response）與基礎設施保護（Infrastructure Protection）等項目。（提醒：ExamTopics 網站標記的正解是 B、C，但 B「事件與問題管理」跟 E「可用性與持續營運」其實都屬於「維運（Operations）」觀點的能力項目，不是安全觀點，這裡以 C、D 為準，多位社群留言引用官方白皮書連結佐證。）A 的可觀測性、B 的事件與問題管理、E 的可用性與持續營運，都是維運觀點底下的能力，不屬於安全觀點。"}, {"id": 296, "question": "一家公司有一個受管的 IAM 政策，但這個政策沒有給予使用者完成必要工作所需的權限。\n可以怎麼解決這個問題？", "options": {"A": "啟用 AWS Shield Advanced。", "B": "建立自訂的 IAM 政策。", "C": "從 AWS Marketplace 使用第三方 Web 應用程式防火牆（WAF）代管規則。", "D": "用 AWS Key Management Service（AWS KMS）建立客戶代管金鑰。"}, "correct_answer": "B", "explanation": "正確答案是 B。如果現成的受管政策權限不夠用，最直接的解法就是自己建立一個自訂 IAM 政策，量身設定所需權限。（提醒：ExamTopics 網站標記的正解是 A／啟用 Shield Advanced，但 Shield Advanced 是 DDoS 防護服務，跟 IAM 權限完全無關，這裡以 B 為準，明顯是標記錯誤。）C 的 WAF 代管規則是防禦網頁攻擊用的；D 的 KMS 金鑰是用來加密資料的，兩者都無法解決「權限不夠」的問題。"}, {"id": 297, "question": "根據責任共擔模型，誰負責輪替 IAM 使用者的存取金鑰與密鑰？", "options": {"A": "IAM 存取金鑰與密鑰是固定不變的，不需要輪替。", "B": "客戶負責輪替金鑰。", "C": "AWS 會在需要時自動輪替金鑰。", "D": "AWS Support 團隊會在客戶要求時輪替金鑰。"}, "correct_answer": "B", "explanation": "正確答案是 B。在責任共擔模型下，IAM 存取金鑰的產生、輪替、撤銷都是客戶自己的責任，AWS 不會主動幫你輪替金鑰。（提醒：ExamTopics 網站標記的正解是 D，但 AWS Support 團隊並不負責幫客戶輪替 IAM 金鑰，這不是 Support 的服務範疇，這裡以 B 為準，社群留言也高票同意。）A 說金鑰不需輪替，是資安上的錯誤觀念，金鑰應該定期輪替降低外洩風險；C 說 AWS 會自動輪替，也不符合實際情況，客戶要自己設定輪替機制（例如搭配 Secrets Manager）。"}, {"id": 298, "question": "一家公司需要在 Amazon EC2 執行個體上執行一套「預先安裝好」的第三方防火牆。\n哪一種 AWS 服務或功能可以提供這個解決方案？", "options": {"A": "網路存取控制清單（Network ACLs）", "B": "安全群組（Security groups）", "C": "AWS Marketplace", "D": "AWS Trusted Advisor"}, "correct_answer": "C", "explanation": "正確答案是 C。要在 EC2 執行個體上跑預先安裝好的第三方防火牆軟體，可以直接到 AWS Marketplace 選購已經包裝成 AMI（映像檔）的解決方案，開機即用。A 的 Network ACL、B 的 Security Groups 是 AWS 原生的網路層防火牆機制，不是第三方防火牆軟體；D 的 Trusted Advisor 是帳號健檢建議工具，都不是取得第三方防火牆的管道。"}, {"id": 299, "question": "哪一種 AWS 雲端優勢，讓公司能在幾分鐘內快速部署雲端資源，取得運算、儲存與資料庫等基礎設施？", "options": {"A": "彈性伸縮（Elasticity）", "B": "節省成本", "C": "靈活性（Agility）", "D": "可靠性"}, "correct_answer": "C", "explanation": "正確答案是 C。「幾分鐘內快速部署雲端資源」對應的正是雲端優勢裡的「Agility（靈活性）」——不用等採購硬體，需要什麼資源馬上就能取得。A 的 Elasticity 講的是資源能隨負載自動增減，跟「部署速度快」是不同概念；B、D 也都跟「快速部署」的重點不同。"}, {"id": 300, "question": "根據責任共擔模型，以下何者「完全」是 AWS 的責任？", "options": {"A": "資安意識與教育訓練", "B": "制定 IAM 密碼政策", "C": "客體作業系統的修補", "D": "實體與環境控制"}, "correct_answer": "D", "explanation": "正確答案是 D。實體機房的安全與環境控制（門禁、電力、空調、消防等）完全是 AWS 的責任，客戶完全接觸不到也不用管。A 的資安意識訓練是雙方共同控制項；B 制定密碼政策、C 修補客體作業系統都是客戶的責任，只有 D 是「完全」屬於 AWS 的責任。"}, {"id": 301, "question": "以下何者是 AWS 帳號根使用者（root user）的特性？", "options": {"A": "根使用者是唯一可以設定多重要素驗證（MFA）的使用者。", "B": "根使用者是唯一能存取 AWS Management Console 的使用者。", "C": "根使用者是建立 AWS 帳號時，第一個可用的登入身分。", "D": "根使用者的密碼無法變更。"}, "correct_answer": "C", "explanation": "正確答案是 C。建立 AWS 帳號時，根使用者（root user）就是系統自動產生的第一個登入身分，之後才能用它去建立其他 IAM 使用者。（提醒：ExamTopics 網站標記的正解是 B，但 IAM 使用者只要有適當權限，一樣可以登入 Management Console，並非只有根使用者能存取，這裡以 C 為準。）A 說法錯誤，IAM 使用者一樣可以設定 MFA；D 說法錯誤，根使用者的密碼可以變更。"}, {"id": 302, "question": "一台先前用於開發的 Amazon EC2 執行個體無法存取，也不再顯示於 AWS Management Console 中。\n應該用哪一種 AWS 服務來判斷是哪個操作導致這台 EC2 執行個體無法存取？", "options": {"A": "Amazon CloudWatch Logs", "B": "AWS Security Hub", "C": "Amazon Inspector", "D": "AWS CloudTrail"}, "correct_answer": "D", "explanation": "正確答案是 D。CloudTrail 記錄了帳號內所有 API 呼叫（誰、什麼時候、做了什麼動作），要回溯是哪個操作讓這台執行個體消失/無法存取，查 CloudTrail 的事件歷史紀錄就對了。A 的 CloudWatch Logs 是應用程式/系統日誌；B 的 Security Hub 是安全狀態彙整儀表板；C 的 Inspector 是漏洞掃描服務，三者都不是用來追蹤「誰做了什麼操作」的服務。"}, {"id": 303, "question": "一家公司的應用程式開發者，需要用腳本快速佈建並管理 AWS 服務。\n開發者應該使用哪一種 AWS 服務來滿足這些需求？", "options": {"A": "AWS CLI", "B": "AWS CodeBuild", "C": "AWS 雲端採用框架（AWS Cloud Adoption Framework, AWS CAF）", "D": "AWS Systems Manager Session Manager"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS CLI（命令列介面）讓開發者可以直接用腳本呼叫 AWS API，快速佈建與管理各項 AWS 服務，是最直接對應「用腳本」需求的工具。（提醒：ExamTopics 網站標記的正解是 B／CodeBuild，但那是編譯建置程式碼、跑測試的 CI 服務，不是拿來用腳本佈建管理 AWS 服務的工具，這裡以 A 為準。）C 的 CAF 是雲端採用策略框架；D 的 Session Manager 是連線到伺服器執行維運指令的工具，都不是題目描述的情境。"}, {"id": 304, "question": "一家公司想把非結構化資料遷移到 AWS，資料需要用傳輸中加密（inflight encryption）與端對端資料驗證的方式安全搬遷。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "AWS Application Migration Service", "B": "Amazon Elastic File System（Amazon EFS）", "C": "AWS DataSync", "D": "AWS Migration Hub"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS DataSync 官方文件明確標榜傳輸過程有加密保護，並會做端對端的資料驗證，確保搬過去的資料完整無誤，完全對應題目需求。（提醒：ExamTopics 網站標記的正解是 A／Application Migration Service，但那是用來搬「整台伺服器」做 lift-and-shift 遷移的工具，不是針對非結構化資料搬遷設計的，這裡以 C 為準。）B 的 EFS 是雲端檔案系統（搬遷的目的地，不是搬遷工具本身）；D 的 Migration Hub 是追蹤遷移進度的儀表板，不執行實際的資料搬遷。"}, {"id": 305, "question": "一個開發團隊想用快速、可重複的方式，為某應用程式部署多個測試環境。\n團隊應該使用哪一種 AWS 服務？", "options": {"A": "Amazon EC2", "B": "AWS CloudFormation", "C": "Amazon QuickSight", "D": "Amazon Elastic Container Service（Amazon ECS）"}, "correct_answer": "B", "explanation": "正確答案是 B。CloudFormation 用範本描述整套環境的架構，之後只要重複套用範本，就能快速、一致地建立出多個一模一樣的測試環境，完全對應「快速、可重複」的需求。（提醒：ExamTopics 網站標記的正解是 D／ECS，但 ECS 是容器編排服務，本身不是設計來做「整套環境快速複製部署」的工具，這裡以 B 為準，社群留言也一致同意。）A 的 EC2 只是運算執行個體本身，沒有範本化重複部署的能力；C 的 QuickSight 是商業智慧視覺化工具，跟部署環境無關。"}, {"id": 306, "question": "一家公司想快速建立一套持續整合／持續交付（CI/CD）流水線。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "AWS Config", "B": "Amazon Cognito", "C": "AWS DataSync", "D": "AWS CodeStar"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS CodeStar 官方定位就是能快速建立 CI/CD 流水線的整合工具，一次幫你把 CodeCommit、CodeBuild、CodeDeploy、CodePipeline 串在一起。（提醒：ExamTopics 網站標記的正解是 B／Amazon Cognito，但 Cognito 是終端使用者身分驗證服務，跟 CI/CD 完全無關，這裡以 D 為準，明顯是標記錯誤——雖然 AWS 已在 2024 年 7 月起停止讓新專案建立 CodeStar，但以考試知識點來說，CodeStar 仍是對應「快速建立 CI/CD」的正解。）A 的 Config 是設定變更追蹤服務；C 的 DataSync 是資料搬遷服務，都跟 CI/CD 無關。"}, {"id": 307, "question": "哪一種 AWS 雲端部署模式，會用 AWS Outposts 作為應用程式部署基礎設施的一部分？", "options": {"A": "地端（On-premises）", "B": "無伺服器（Serverless）", "C": "雲端原生（Cloud-native）", "D": "混合式（Hybrid）"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS Outposts 是把 AWS 的基礎設施與服務延伸到客戶自己的地端機房，讓地端環境跟雲端用同一套 API/工具管理，這正是「混合雲（Hybrid）」部署模式的定義。（提醒：ExamTopics 網站標記的正解是 B／Serverless，但 Outposts 跟無伺服器架構是完全不同的概念，這裡以 D 為準，明顯是標記錯誤。）A 的地端模式指的是完全不用雲端服務；C 的雲端原生指的是完全建置在公有雲上，兩者都跟「用 Outposts 混合地端與雲端」的情境不符。"}, {"id": 308, "question": "以下何者是 AWS 上全託管的圖形資料庫服務？", "options": {"A": "Amazon Aurora", "B": "Amazon FSx", "C": "Amazon DynamoDB", "D": "Amazon Neptune"}, "correct_answer": "D", "explanation": "正確答案是 D。Amazon Neptune 是 AWS 專門設計的全託管圖形資料庫服務，適合處理高度連結、著重關聯性的資料（如社交網路、推薦引擎）。A 的 Aurora 是關聯式資料庫；B 的 FSx 是檔案系統服務；C 的 DynamoDB 是 NoSQL 鍵值/文件資料庫，三者都不是圖形資料庫。"}, {"id": 309, "question": "系統管理員可以用哪一種 AWS 服務，為多位員工提供桌面環境？", "options": {"A": "AWS Organizations", "B": "AWS Fargate", "C": "AWS WAF", "D": "AWS WorkSpaces"}, "correct_answer": "D", "explanation": "正確答案是 D。Amazon WorkSpaces 是 AWS 的雲端桌面（DaaS，Desktop as a Service）服務，可以幫多位員工提供隨開即用的虛擬桌面環境。（提醒：ExamTopics 網站標記的正解是 A／Organizations，但那是多帳號治理服務，跟提供桌面環境完全無關，這裡以 D 為準，明顯是標記錯誤。）B 的 Fargate 是無伺服器容器運算服務；C 的 WAF 是網頁應用程式防火牆，都跟「提供桌面環境」無關。"}, {"id": 310, "question": "哪一種 AWS 服務或功能，能讓使用者擷取 VPC 內網路流量的相關資訊？", "options": {"A": "VPC 流量日誌（VPC Flow Logs）", "B": "Amazon Inspector", "C": "VPC 路由表", "D": "AWS CloudTrail"}, "correct_answer": "A", "explanation": "正確答案是 A。VPC Flow Logs 專門用來擷取進出 VPC 網路介面的流量中繼資料（來源、目的地、連接埠等），正好對應題目需求。B 的 Inspector 是漏洞掃描服務；C 的路由表是決定流量走向的設定，本身不記錄流量內容；D 的 CloudTrail 記錄的是 API 呼叫，不是網路流量，三者都不符合。"}, {"id": 311, "question": "哪一種 AWS 儲存類型是暫存性的，會在 Amazon EC2 執行個體停止或終止時被刪除？", "options": {"A": "Amazon Elastic Block Store（Amazon EBS）", "B": "Amazon EC2 執行個體儲存體（instance store）", "C": "Amazon Elastic File System（Amazon EFS）", "D": "Amazon S3"}, "correct_answer": "B", "explanation": "正確答案是 B。EC2 執行個體儲存體（instance store）是掛載在實體主機上的暫存磁碟，跟執行個體的生命週期綁在一起，執行個體停止或終止時資料就會消失。（提醒：ExamTopics 網站標記的正解是 D／S3，但 S3 是獨立的物件儲存服務，資料不會因為某台 EC2 執行個體停止就被刪除，這裡以 B 為準，明顯是標記錯誤。）A 的 EBS 是持久性的區塊儲存，執行個體終止後（若設定保留）資料仍會保留；C 的 EFS 也是持久性的檔案系統，都不是「暫存性」的儲存。"}, {"id": 312, "question": "一家公司想從地端工作負載存取 AWS 上的 Windows 檔案共用資源，公司不想在資料中心額外佈建基礎設施或應用程式。\n哪一種 AWS 服務可以滿足這些需求？", "options": {"A": "Amazon FSx File Gateway", "B": "AWS DataSync", "C": "Amazon S3", "D": "AWS Snow 系列（AWS Snow Family）"}, "correct_answer": "A", "explanation": "正確答案是 A。Amazon FSx File Gateway 官方文件明確定位為讓地端能低延遲存取雲端 FSx for Windows File Server 檔案共用的解決方案，客戶不需要自建 Windows 檔案伺服器等額外基礎設施，社群留言也引用官方文件佐證這個答案。（提醒：ExamTopics 網站標記的正解是 C／S3，但 S3 不支援 SMB 協定，地端無法直接把它當作 Windows 檔案共用使用，這裡以 A 為準。）B 的 DataSync 是資料搬遷服務；D 的 Snow Family 是實體資料搬遷裝置，都不是提供檔案共用存取的服務。"}, {"id": 313, "question": "一家公司想要耐久的靜態內容儲存空間，並用最低成本取得可無限擴充的資料儲存基礎設施。\n公司應該選擇哪一種 AWS 服務？", "options": {"A": "Amazon Elastic Block Store（Amazon EBS）", "B": "Amazon S3", "C": "AWS Storage Gateway", "D": "Amazon Elastic File System（Amazon EFS）"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon S3 正是設計來提供耐久、可無限擴充、且成本低廉的物件儲存服務，特別適合存放靜態內容（如網站素材、備份檔案）。（提醒：ExamTopics 網站標記的正解是 A／EBS，但 EBS 是綁定單一 EC2 執行個體的區塊儲存，容量有上限、也不是為靜態內容設計的，這裡以 B 為準，明顯是標記錯誤。）C 的 Storage Gateway 是地端到雲端的儲存橋接服務；D 的 EFS 是共用檔案系統，成本都比 S3 高，不符合「最低成本」的條件。"}, {"id": 314, "question": "一家電商公司想用 Amazon EC2 Auto Scaling，依 CPU 使用率自動增減 EC2 執行個體。\n哪一種 AWS 服務或功能可以觸發 Auto Scaling 的擴縮動作，達成這個目標？", "options": {"A": "Amazon Simple Queue Service（Amazon SQS）", "B": "Amazon Simple Notification Service（Amazon SNS）", "C": "AWS Systems Manager", "D": "Amazon CloudWatch 警報（alarm）"}, "correct_answer": "D", "explanation": "正確答案是 D。Auto Scaling 的擴縮政策標準做法是搭配 CloudWatch 警報：當 CPU 使用率超過或低於設定的門檻時，CloudWatch 警報就會觸發 Auto Scaling 執行增加或減少執行個體的動作。（提醒：ExamTopics 網站標記的正解是 C／Systems Manager，但那是維運管理工具，本身不負責監控指標並觸發擴縮，這裡以 D 為準。）A 的 SQS 是訊息佇列；B 的 SNS 是通知服務，都不是用來監控 CPU 使用率並觸發擴縮的機制。"}, {"id": 315, "question": "一家公司想轉型自己的人力，吸引並培養具備數位素養的高績效團隊，同時想吸引兼具技術與非技術技能、多元共融的人才。\n哪一個 AWS 雲端採用框架（AWS CAF）觀點可以滿足這些需求？", "options": {"A": "商業（Business）", "B": "人員（People）", "C": "平台（Platform）", "D": "維運（Operations）"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS CAF 的「人員（People）」觀點，關注的正是組織文化轉型、人才招募與培育、技能發展，題目描述的「吸引並培養數位人才、多元共融」完全對應這個觀點。A 的商業觀點著重業務策略對齊；C 的平台觀點是技術架構；D 的維運觀點是日常維運管理，都不是聚焦在「人才與組織文化」的觀點。"}, {"id": 316, "question": "一家公司想用簡化的遷移流程，把地端資料庫搬到受管的雲端資料庫服務。\n哪一種 AWS 服務或工具可以協助公司滿足這個需求？", "options": {"A": "AWS Storage Gateway", "B": "AWS Application Migration Service", "C": "AWS DataSync", "D": "AWS Database Migration Service（AWS DMS）"}, "correct_answer": "D", "explanation": "正確答案是 D。AWS DMS 就是專門設計來把資料庫遷移到受管雲端資料庫服務（如 RDS）的工具，能簡化整個遷移流程，還支援來源資料庫在遷移期間持續運作。A 的 Storage Gateway 是儲存橋接服務；B 的 Application Migration Service 是搬「整台伺服器」用的；C 的 DataSync 是搬一般檔案資料的服務，三者都不是專門的資料庫遷移工具。"}, {"id": 317, "question": "一家公司需要一台全託管的檔案伺服器，原生支援 Microsoft 工作負載與檔案系統，這台檔案伺服器也必須支援 SMB 協定。\n公司應該用哪一種 AWS 服務滿足這些需求？", "options": {"A": "Amazon Elastic File System（Amazon EFS）", "B": "Amazon FSx for Lustre", "C": "Amazon FSx for Windows File Server", "D": "Amazon Elastic Block Store（Amazon EBS）"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon FSx for Windows File Server 就是專門為 Microsoft 工作負載打造的全託管檔案伺服器，原生支援 SMB 協定與 Windows 檔案系統功能。A 的 EFS 是給 Linux 環境用的檔案系統；B 的 FSx for Lustre 是給高效能運算設計的檔案系統；D 的 EBS 是區塊儲存，都不是原生支援 Microsoft/SMB 的檔案伺服器。"}, {"id": 318, "question": "一家公司一直把每月報表存進 Amazon S3 儲存桶，報表資料會匯出成逗號分隔值（.csv）檔案。有位開發者想寫一個簡單查詢，讀取所有這些檔案並產生摘要報表。\n開發者應該用哪一種 AWS 服務或功能，以「最低的維運負擔」滿足這個需求？", "options": {"A": "Amazon S3 Select", "B": "Amazon Athena", "C": "Amazon Redshift", "D": "Amazon EC2"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon Athena 是無伺服器的查詢服務，可以直接對 S3 裡的 CSV 檔案跑 SQL 查詢、產生摘要，完全不用建置或管理任何運算基礎設施，維運負擔最低。（提醒：ExamTopics 網站標記的正解是 D／EC2，但用 EC2 代表要自己架設、管理查詢用的伺服器，維運負擔反而是四個選項裡最高的，跟題目要求正好相反，這裡以 B 為準。）A 的 S3 Select 只能查詢單一物件內的內容，沒辦法跨多個檔案彙整摘要；C 的 Redshift 是資料倉儲，建置與管理的負擔都比 Athena 高上不少。"}, {"id": 319, "question": "哪一種 AWS 功能，提供 AWS 使用者免費加入社群群組、提問、找答案，並閱讀社群撰寫的最佳實踐文章的平台？", "options": {"A": "AWS Knowledge Center", "B": "AWS re:Post", "C": "AWS IQ", "D": "AWS Enterprise Support"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS re:Post 就是 AWS 官方的免費社群問答平台，使用者可以在上面提問、回答、閱讀社群文章。（提醒：ExamTopics 網站標記的正解是 D／Enterprise Support，但那是付費的企業支援方案，不是「免費」的社群平台，這裡以 B 為準，明顯是標記錯誤。）A 的 Knowledge Center 是官方知識庫文章；C 的 AWS IQ 是媒合專家接案的付費諮詢平台，都不是免費社群討論平台。"}, {"id": 320, "question": "一家公司需要在存放於 Amazon S3 的文件中搜尋文字內容。\n哪一種 AWS 服務可以滿足這個需求？", "options": {"A": "Amazon Kendra", "B": "Amazon Rekognition", "C": "Amazon Polly", "D": "Amazon Lex"}, "correct_answer": "A", "explanation": "正確答案是 A。Amazon Kendra 是 AWS 的智慧型搜尋服務，專門設計來對文件內容做語意搜尋，正好對應「在文件中搜尋文字」的需求。（提醒：ExamTopics 網站標記的正解是 C／Polly，但 Polly 是文字轉語音服務，跟「搜尋文字」完全無關，這裡以 A 為準，明顯是標記錯誤。）B 的 Rekognition 是影像/影片辨識服務；D 的 Lex 是打造聊天機器人的服務，都不是文件搜尋工具。"}, {"id": 321, "question": "哪些 AWS 服務會用到全球邊緣節點（edge locations）？（選擇兩個。）", "options": {"A": "AWS Fargate", "B": "Amazon CloudFront", "C": "AWS Global Accelerator", "D": "AWS Wavelength", "E": "Amazon VPC"}, "correct_answer": "BC", "explanation": "正確答案是 B、C。Amazon CloudFront（CDN 服務）跟 AWS Global Accelerator 都是建立在 AWS 全球邊緣節點網路之上，把內容或流量導向離使用者最近的節點。（提醒：ExamTopics 網站標記的正解是 C、A，但 A 的 Fargate 是無伺服器容器運算服務，運作在 Region 內，不使用邊緣節點，這裡以 B、C 為準，社群留言也一致同意並附上官方文件連結。）D 的 Wavelength 是把
