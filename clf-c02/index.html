<!DOCTYPE html>

<head>

<title>AWS Certified Cloud Practitioner (CLF-C02) 測驗</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; min-height: 100vh; }
  .container { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; }

  .card { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 14px; }
  .title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 18px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; transition: all 0.15s; font-family: inherit; width: 100%; margin-bottom: 10px; }
  .btn-primary { background: #4f7be8; color: white; }
  .btn-primary:hover { background: #3d67d0; }
  .btn-primary:disabled { background: #c3d0f5; cursor: not-allowed; }
  .btn-outline { background: white; color: #4f7be8; border: 1.5px solid #4f7be8; }
  .btn-outline:hover { background: #f0f4ff; }
  .btn-outline:disabled { color: #bbb; border-color: #e4e8ef; cursor: not-allowed; }
  .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; margin-bottom: 0; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat-box { flex: 1; background: #f8f9fe; border-radius: 10px; padding: 14px 10px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 800; color: #4f7be8; }
  .stat-label { font-size: 11px; color: #888; margin-top: 2px; }

  .progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .progress-bar-bg { flex: 1; height: 6px; background: #e4e8ef; border-radius: 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #4f7be8; transition: width 0.25s; }
  .progress-text { font-size: 12px; color: #888; white-space: nowrap; }

  .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 4px; }
  .q-hint { font-size: 12px; color: #4f7be8; font-weight: 600; margin-bottom: 14px; }

  .opt { display: flex; align-items: flex-start; gap: 10px; border: 1.5px solid #e4e8ef; border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .opt:hover { border-color: #c3d0f5; }
  .opt.selected { border-color: #4f7be8; background: #f0f4ff; }
  .opt.correct { border-color: #30b86c; background: #f6fdf9; }
  .opt.wrong { border-color: #e05555; background: #fff5f5; }
  .opt input { margin-top: 3px; flex-shrink: 0; width: 16px; height: 16px; accent-color: #4f7be8; }
  .opt-letter { font-weight: 800; color: #4f7be8; flex-shrink: 0; }
  .opt.correct .opt-letter { color: #30b86c; }
  .opt.wrong .opt-letter { color: #e05555; }
  .opt-text { font-size: 14.5px; line-height: 1.5; }
  .opt-mark { margin-left: auto; font-weight: 800; flex-shrink: 0; }

  .feedback-banner { border-radius: 10px; padding: 14px 16px; margin: 14px 0; font-size: 14px; font-weight: 700; }
  .feedback-banner.correct { background: #e6f4ec; color: #1e8f52; }
  .feedback-banner.wrong { background: #fdeaea; color: #c0392b; }
  .explanation { background: #f8f9fe; border-radius: 10px; padding: 14px 16px; font-size: 13.5px; line-height: 1.7; color: #444; margin-bottom: 14px; white-space: pre-wrap; }
  .explanation-label { font-size: 11px; font-weight: 700; color: #888; margin-bottom: 6px; letter-spacing: 0.03em; }

  .empty-state { text-align: center; color: #bbb; padding: 30px 0; font-size: 14px; line-height: 1.8; }
  .hidden { display: none !important; }
  .center { text-align: center; }
  .badge { display: inline-block; background: #eef2ff; color: #4f7be8; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; margin-bottom: 10px; }

  .score-hero { text-align: center; padding: 26px 20px; border-radius: 12px; background: linear-gradient(135deg, #4f7be8, #7b5ce8); color: white; margin-bottom: 16px; }
  .score-big { font-size: 40px; font-weight: 800; }
  .score-sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .wrong-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13.5px; }
  .wrong-list-item:last-child { border-bottom: none; }
  .wrong-q-num { color: #888; flex-shrink: 0; margin-right: 10px; }
</style>
</head>

<div class="container" id="app"></div>

<script>
const QUIZ_TITLE = "AWS Certified Cloud Practitioner (CLF-C02) 測驗";
const QUIZ_SUBTITLE = "200 題全真考古題．專有名詞附英文原文．每輪 65 題，70 分通過．選項每次隨機排列．可匯出錯題";
const STORAGE_KEY = "aws_clf_c02_quiz";
const QUIZ_DATA = [{"id": 1, "question": "一家公司計劃使用Amazon Snowball Edge 裝置將檔案傳輸到AWS 雲。公司可以免費獲得哪些與Snowball Edge 裝置相關的活動？", "options": {"A": "使用Snowball Edge 裝置10 天", "B": "將資料從Amazon S3 傳輸到Snowball Edge 裝置", "C": "將資料從Snowball Edge 裝置傳輸到Amazon S3", "D": "10 天后每日使用Snowball Edge 裝置"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS 對於資料「搬進」雲端不收費，把資料從 Snowball Edge 裝置匯入 Amazon S3 這段屬於免費項目，這是 AWS 鼓勵企業上雲的常見定價設計。A 跟 D 講的是裝置使用天數，超過免費的 10 天後每天要付租借費，不算免費；B 選項「把資料從 S3 傳到 Snowball Edge」是匯出到裝置的情境，不符合題意。記法：資料進 AWS 免費，裝置租用天數要付費。"}, {"id": 2, "question": "一家公司已在Amazon EC2 例項上部署應用程式。公司需要評估應用程式漏洞，並且必須識別不符合最佳實踐的基礎設施部署。公司可以使用哪種AWS 服務來滿足這些要求？", "options": {"A": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "B": "亞馬遜檢查員 (Amazon Inspector)", "C": "AWS配置 (AWS Config)", "D": "亞馬遜GuardDuty"}, "correct_answer": "B", "explanation": "正確答案是 B，Amazon Inspector。它自動掃描 EC2 例項、容器映像和 Lambda 函式找出已知軟體漏洞，也做網路可達性分析找出不符合最佳實踐的設定，對應「評估漏洞」加「找出不符合最佳實踐部署」兩個需求。A 的 Trusted Advisor 是整體帳號健檢建議，非專門漏洞掃描；C 的 AWS Config 負責追蹤設定變化；D 的 GuardDuty 是威脅偵測服務，看的是異常行為。"}, {"id": 3, "question": "一家公司擁有一組集中的使用者，其檔案儲存需求超出了本地可用空間。該公司希望為該群體擴充套件其檔案儲存功能，同時保留本地共享內容的效能優勢。對於這種情況，最高效的AWS 解決方案是什麼？", "options": {"A": "為每個使用者建立一個Amazon S3 儲存桶。使用S3 le 系統安裝實用程式安裝每個剷鬥。", "B": "配置並部署AWS Storage Gateway 檔案閘道器。將每個使用者的工作站連線到le 閘道器。", "C": "將每個使用者的工作環境移至Amazon WorkSpaces。為每個使用者設定一個Amazon WorkDocs 賬戶。", "D": "部署Amazon EC2 例項並附加Amazon Elastic Block Store (Amazon EBS) 預置IOPS 卷。直接與使用者共享EBS 卷。"}, "correct_answer": "B", "explanation": "正確答案是 B。公司要延伸本地端檔案儲存，又想保留本地存取速度，這正是 AWS Storage Gateway 檔案閘道器的定位：地端放虛擬機器當快取層，用熟悉的 SMB/NFS 協定連線，常用檔案本地快速讀寫，資料同步備份到雲端 S3。A 直接掛載 S3 儲存桶操作複雜且效能較差；C 把工作環境搬上 WorkSpaces 動作太大；D 用 EBS 卷直接分享，EBS 本質是給單一 EC2 例項用的區塊儲存，不適合集中共享。"}, {"id": 4, "question": "根據安全最佳實踐，應如何授予Amazon EC2 例項訪問Amazon S3 儲存桶的許可權？", "options": {"A": "直接在應用程式中對IAM 使用者的金鑰和訪問金鑰 (Access Key)進行硬編碼，然後上傳檔案。", "B": "將IAM 使用者的金鑰和訪問金鑰 (Access Key)儲存在EC2 例項上的文字檔案中，讀取金鑰，然後上傳該檔案。", "C": "讓EC2 例項承擔一個角色以獲得上傳檔案的許可權。", "D": "修改S3儲存桶策略，以便任何服務都可以隨時上傳到其中。"}, "correct_answer": "C", "explanation": "正確答案是 C。安全最佳實踐是讓 EC2 例項「扮演」一個 IAM 角色 (IAM Role)取得暫時憑證去存取 S3，不需把金鑰寫死在程式碼或機器上，AWS 也會自動輪替憑證。A 和 B 都是把 IAM 使用者金鑰硬編碼或存成檔案，一旦程式碼外洩金鑰就跟著外流，明確違反最佳實踐；D 選項把儲存桶策略開放給任何服務隨時上傳，完全喪失存取控制。"}, {"id": 5, "question": "在AWS 責任共擔模型下使用Amazon DynamoDB 時，哪個選項是客戶的責任？", "options": {"A": "DynamoDB 的物理安全", "B": "DynamoDB 的修補", "C": "訪問DynamoDB 表", "D": "DynamoDB 中靜態資料的加密"}, "correct_answer": "C", "explanation": "正確答案是 C。DynamoDB 屬於 AWS 完全託管的服務，機房實體安全（A）、伺服器修補（B）、靜態資料加密的底層機制（D）都是 AWS 負責的雲端本身安全；客戶要負責的是雲端內的安全，也就是誰能存取這張表、設定哪些 IAM 權限和資料表存取控制，這完全掌握在客戶手上，AWS 不會替你決定誰可以讀寫資料。"}, {"id": 6, "question": "哪個選項是包含AWS 雲採用框架(AWS CAF) 基本功能的視角？", "options": {"A": "可持續發展 (Sustainability)", "B": "效能效率 (Performance Efficiency)", "C": "治理 (Governance)", "D": "可靠性"}, "correct_answer": "C", "explanation": "正確答案是 C，治理（Governance）。AWS CAF 把組織能力分成六大視角：業務、人員、治理 (Governance)、平台、安全、營運，治理 (Governance)視角談的是政策管理、風險管理、法遵這類跨組織機制。要注意 CAF 跟 Well-Architected Framework 是兩個框架：後者講六大支柱用來評估架構設計；CAF 是評估組織雲採用成熟度，題目問的是 CAF 視角，答案就是治理 (Governance)。"}, {"id": 7, "question": "一家公司正在Amazon EC2 例項上執行和管理自己的Docker 環境。該公司希望有一個替代方案來幫助管理叢集規模、排程和環境維護。哪種AWS 服務滿足這些要求？", "options": {"A": "AWS Lambda", "B": "亞馬遜RDS", "C": "AWS 法門 (AWS Fargate)", "D": "亞馬遜雅典娜 (Amazon Athena)"}, "correct_answer": "C", "explanation": "正確答案是 C，AWS Fargate。公司自己在 EC2 上管理 Docker，代表要自己處理叢集擴縮、排程、底層維運；Fargate 是無伺服器容器執行環境，可搭配 ECS 或 EKS 使用，不用管理伺服器叢集，AWS 自動處理擴縮與排程。A 的 Lambda 是給事件驅動短函式用；B 的 RDS 是關聯式資料庫服務；D 的 Athena 是查詢 S3 資料的分析服務，三者都跟容器管理無關。"}, {"id": 8, "question": "一家公司希望在Amazon EC2 例項上執行NoSQL 資料庫。在這種情況下，AWS 負責哪項任務？", "options": {"A": "更新EC2 例項的來賓作業系統。", "B": "保持資料庫層的高可用性 (High Availability)。", "C": "修補託管EC2 例項的物理基礎設施。", "D": "配置安全組 (Security Group)防火牆。"}, "correct_answer": "C", "explanation": "正確答案是 C。這題考「在 EC2 上自架資料庫」的責任分界：EC2 例項本身（作業系統、資料庫軟體、防火牆設定）都是客戶要自己管理的，因為是公司自己選擇在 EC2 上跑 NoSQL 資料庫，所以 A、B、D 全都是客戶責任。唯獨「修補託管 EC2 例項的物理基礎設施」這個機房硬體層級，永遠是 AWS 的責任，客戶完全碰不到，這條分界線不會因應用內容改變。"}, {"id": 9, "question": "哪些AWS 服務或工具可以識別Amazon EC2 例項的規模調整 (Right Sizing)機會？（選擇兩個。）", "options": {"A": "AWS 成本管理器 (AWS Cost Explorer)", "B": "AWS 計費指揮 (AWS Billing Conductor)", "C": "亞馬遜程式碼大師 (Amazon CodeGuru)", "D": "亞馬遜SageMaker", "E": "AWS 計算最佳化器 (AWS Compute Optimizer)"}, "correct_answer": "AE", "explanation": "正確答案是 AE。要找 EC2 規模調整 (Right Sizing)空間，AWS 有兩個工具直接給建議：AWS Cost Explorer（A）內建 Rightsizing Recommendations，靠歷史使用量找出可降規格省錢的例項；AWS Compute Optimizer（E）用機器學習分析 CPU、記憶體使用率給精準建議。B 是帳單工具、C 類似程式碼分析、D 的 SageMaker 是機器學習開發平台，都跟規模調整 (Right Sizing)無關。"}, {"id": 10, "question": "使用AWS Trusted Advisor 具有以下哪些優勢？（選擇兩個。）", "options": {"A": "提供高效能容器編排", "B": "建立和輪換加密金鑰", "C": "檢測未充分利用的資源以節省成本", "D": "透過主動監控AWS 環境來提高安全性", "E": "跨AWS 資源實施強制標記"}, "correct_answer": "CD", "explanation": "正確答案是 CD。Trusted Advisor 從五大面向健檢帳號：成本最佳化 (Cost Optimization)、效能、安全性、容錯能力、服務配額。選項 C「找出未充分利用資源省錢」對應成本最佳化 (Cost Optimization)，D「主動監控環境提升安全性」對應安全性面向。A 容器編排是 ECS/EKS 的事、B 建立輪換金鑰是 KMS 或憑證報告的事、E 強制標記資源是 Organizations 或標籤政策的事，都不屬於 Trusted Advisor 範圍。"}, {"id": 11, "question": "以下哪一項是使用者將本地工作負載遷移到AWS 雲時體驗到的優勢？", "options": {"A": "消除執行和維護資料中心的費用", "B": "價格折扣與硬體提供商的折扣相同", "C": "將所有運營控制權分配給AWS", "D": "消除運營費用"}, "correct_answer": "A", "explanation": "正確答案是 A。企業把工作負載搬上雲後，最直接的好處是不用再花錢蓋機房、買硬體、請人維運機房，固定成本直接省下來，正是雲端用按用量付費取代自建固定資產的核心價值。B 選項把雲端折扣講成跟硬體廠商折扣一樣，定價機制不同；C 選項說把所有運營控制權交給 AWS 太絕對；D 選項說完全消除營運費用不準確，上雲後仍有雲端資源使用費，只是把資本支出換成營運支出。"}, {"id": 12, "question": "一家公司希望管理已部署的IT 服務並管理其基礎設施即程式碼(IaC) 模板。哪種AWS 服務可以滿足此要求？", "options": {"A": "AWS 資源瀏覽器 (AWS Resource Explorer)", "B": "AWS 服務目錄 (AWS Service Catalog)", "C": "AWS 組織 (AWS Organizations)", "D": "AWS 系統經理 (AWS Systems Manager)"}, "correct_answer": "B", "explanation": "正確答案是 B，AWS Service Catalog。它讓公司集中管理已核准的 IT 服務目錄，同時對用 CloudFormation 或 Terraform 寫成的 IaC 樣板做治理 (Governance)，員工只能從目錄選擇公司允許的服務部署。A 的 Resource Explorer 用來搜尋跨區域資源；C 的 Organizations 管理多帳號架構；D 的 Systems Manager 做例項維運管理，都不是 IaC 樣板治理 (Governance)工具。"}, {"id": 13, "question": "哪種AWS 服務或工具可以幫助使用者視覺化、瞭解和管理一段時間內的支出和使用情況？", "options": {"A": "AWS 組織 (AWS Organizations)", "B": "AWS 定價計算器 (AWS Pricing Calculator)", "C": "AWS 成本管理器 (AWS Cost Explorer)", "D": "AWS 服務目錄 (AWS Service Catalog)"}, "correct_answer": "C", "explanation": "正確答案是 C，AWS Cost Explorer。它把過去到現在的花費和使用量畫成圖表，用視覺化方式看出花費趨勢、找出異常增長，對應題目「視覺化、瞭解、管理支出」。B 選項的定價計算器是拿來事前估算還沒發生的成本，跟事後檢視性質不同；A 的 Organizations 是多帳號治理 (Governance)工具；D 的 Service Catalog 是 IaC 樣板治理 (Governance)工具，都跟支出視覺化無關。"}, {"id": 14, "question": "一家公司正在使用中央資料平臺為其客戶管理多種型別的資料。該公司希望使用AWS 服務來發現、轉換和視覺化資料。公司應使用哪種AWS 服務組合來滿足這些要求？（選擇兩個。）", "options": {"A": "AWS膠水 (AWS Glue)", "B": "亞馬遜彈性檔案系統(Amazon EFS)", "C": "亞馬遜紅移 (Amazon Redshift)", "D": "亞馬遜QuickSight", "E": "Amazon 量子賬本資料庫(Amazon QLDB)"}, "correct_answer": "AD", "explanation": "正確答案是 AD。公司要「發現、轉換、視覺化」分別對應不同工具：AWS Glue（A）是無伺服器資料整合服務，負責發現資料來源、清理轉換；Amazon QuickSight（D）是 BI 視覺化工具，負責做成互動式儀表板。B 的 EFS 是檔案儲存服務，跟資料處理無關；C 的 Redshift 是資料倉儲，負責存放與查詢，但不是發現與視覺化角色；E 的 QLDB 是不可竄改帳本資料庫，用途完全不同。"}, {"id": 15, "question": "一家跨國公司希望將其第三方應用程式遷移到AWS 雲。該公司希望獲得全球專家團隊的幫助，以便根據AWS 內部最佳實踐更快、更可靠地完成遷移。哪些AWS 服務或資源可以滿足這些要求？", "options": {"A": "AWS 支援", "B": "AWS 專業服務 (AWS Professional Services)", "C": "AWS 啟動向導 (AWS Launch Wizard)", "D": "AWS 託管服務(AMS)"}, "correct_answer": "B", "explanation": "正確答案是 B，AWS 專業服務 (AWS Professional Services)。這是 AWS 全球專家團隊，專門協助企業依照內部最佳實踐規劃、執行遷移專案，讓遷移更快更可靠，對應「全球專家團隊」加「內部最佳實踐」關鍵字。A 的 AWS Support 是技術支援方案，偏向被動答問題；C 的啟動向導是簡化單一應用部署的引導工具，規模太小；D 的 AMS 是遷移完成後持續代管維運用的，屬於遷移之後的服務。"}, {"id": 16, "question": "電子學習平臺每年需要執行應用程式2 個月。該應用程式將部署在Amazon EC2 例項上。必須避免這2 個月內出現任何應用程式停機。哪種EC2 購買選項能夠最經濟高效地滿足這些要求？", "options": {"A": "預留例項 (Reserved Instance)", "B": "專用主機 (Dedicated Host)", "C": "現貨例項 (Spot Instance)", "D": "按需例項 (On-Demand Instance)"}, "correct_answer": "D", "explanation": "正確答案是 D，按需例項 (On-Demand Instance)。應用一年只跑 2 個月，屬於短期使用情境，預留例項（A）要簽 1 年或 3 年合約，短期用划不來；專用主機（B）成本高又缺乏彈性；現貨例項（C）雖便宜但隨時可能被 AWS 收回中斷，跟「不能停機」直接衝突。按需例項 (On-Demand Instance)不用長期承諾，用多少算多少，符合「短期、不能中斷、又要划算」三個條件，是最經濟的選擇。"}, {"id": 17, "question": "開發人員希望在AWS 上快速部署應用程式，而無需手動建立所需的資源。哪種AWS 服務可以滿足這些要求？", "options": {"A": "亞馬遜EC2", "B": "AWS 彈性豆莖 (AWS Elastic Beanstalk)", "C": "AWS 程式碼構建 (AWS CodeBuild)", "D": "亞馬遜個性化 (Amazon Personalize)"}, "correct_answer": "B", "explanation": "正確答案是 B，AWS Elastic Beanstalk。它是 PaaS 服務，開發者上傳程式碼後，Beanstalk 自動建立 EC2、負載平衡器、Auto Scaling、監控等所需資源，不用手動建置，符合「快速部署、不用手動建立資源」。A 的 EC2 是底層虛擬機服務，什麼都要自己建立；C 的 CodeBuild 只負責編譯程式碼；D 的 Personalize 是機器學習推薦系統，跟部署無關。"}, {"id": 18, "question": "一家公司將敏感的客戶資料儲存在Amazon S3 儲存桶中。該公司希望保護資料免遭意外刪除或覆蓋。公司應該使用哪種S3 功能來滿足這些要求？", "options": {"A": "S3 生命週期規則", "B": "S3 版本控制", "C": "S3 儲存桶策略", "D": "S3伺服器端加密"}, "correct_answer": "B", "explanation": "正確答案是 B，S3 版本控制。開啟後 S3 會保留物件每個歷史版本，就算不小心刪除或覆蓋，也只是加上刪除標記或產生新版本，舊版本還在可以救回，正好解決「防止意外刪除或覆蓋」的需求。A 的生命週期規則是自動轉存或刪除舊資料省成本，跟防誤刪無關；C 的儲存桶政策是存取權限規則；D 的伺服器端加密是保護資料不被未授權讀取，兩者都無法救回已刪除或覆蓋的物件。"}, {"id": 19, "question": "哪種AWS 服務提供了管理基礎設施即程式碼的能力？", "options": {"A": "AWS 程式碼管道 (AWS CodePipeline)", "B": "AWS 程式碼部署 (AWS CodeDeploy)", "C": "AWS 直連 (AWS Direct Connect)", "D": "AWS 雲形成 (AWS CloudFormation)"}, "correct_answer": "D", "explanation": "正確答案是 D，AWS CloudFormation。它讓你用 JSON 或 YAML 樣板把整個基礎設施寫成程式碼，一鍵建立、更新或刪除整組資源，是 AWS 最核心的 IaC 服務。A 的 CodePipeline 是 CI/CD 流程自動化工具；B 的 CodeDeploy 負責把程式碼部署到伺服器；C 的 Direct Connect 是實體專線網路連線服務，三者都跟「把基礎設施寫成程式碼」無關。"}, {"id": 20, "question": "一家線上遊戲公司需要選擇一個購買選項來執行其Amazon EC2 例項1 年。網路流量是一致的，流量的任何增長都是可以預測的。EC2 例項必須全年線上且可用，不能出現任何中斷。哪種 EC2 例項購買選項能最經濟高效地滿足這些要求？", "options": {"A": "按需例項 (On-Demand Instance)", "B": "預留例項 (Reserved Instance)", "C": "現貨例項 (Spot Instance)", "D": "現貨船隊 (Spot Fleet)"}, "correct_answer": "B", "explanation": "正確答案是 B，預留例項 (Reserved Instance)。線上遊戲公司要跑 EC2 一整年，流量穩定、成長可預期，且要求全年不能中斷，這種長期穩定可預測的模式正是預留例項 (Reserved Instance)最省錢的場景，透過預付或簽約承諾一年用量，換取比按需例項 (On-Demand Instance)便宜最多 75% 的價格，例項也不會被中斷。A 按需例項 (On-Demand Instance)長期跑單價最貴；C 現貨例項 (Spot Instance)和 D 現貨船隊 (Spot Fleet)都可能被隨時收回中斷，跟「不能中斷」牴觸。"}, {"id": 21, "question": "哪些AWS 服務或功能允許使用者在公司的本地資料中心和AWS 雲之間建立專用網路連線？", "options": {"A": "AWS 直連 (AWS Direct Connect)", "B": "VPC 對等互連", "C": "AWS VPN", "D": "亞馬遜53 號公路 (Amazon Route 53)"}, "correct_answer": "A", "explanation": "正確答案是 A，AWS Direct Connect。它提供一條實體專線，直接從企業機房拉到 AWS，不經過公用網際網路，頻寬穩定、延遲低也更安全，對應「專用網路連線」需求。B 的 VPC 對等互連是連接兩個 VPC 之間的，不是連地端跟雲端；C 的 AWS VPN 是透過公用網際網路建立加密通道，不算專用實體線路；D 的 Route 53 是 DNS 服務，跟網路連線架設無關。"}, {"id": 22, "question": "哪個選項是AWS 全球基礎設施的物理位置？", "options": {"A": "AWS 資料同步 (AWS DataSync)", "B": "AWS 區域", "C": "亞馬遜連線 (Amazon Connect)", "D": "AWS 組織 (AWS Organizations)"}, "correct_answer": "B", "explanation": "正確答案是 B，AWS 區域（Region）。四個選項裡，Region 是唯一代表 AWS 全球基礎設施實體地理位置的概念，每個區域底下再由多個可用區 (Availability Zone)組成。A 的 AWS DataSync 是資料搬遷服務；C 的 Amazon Connect 是雲端聯絡中心服務；D 的 AWS Organizations 是多帳號治理 (Governance)服務，三者都是功能性服務，不是實體地理位置概念，只有 B 符合題意。"}, {"id": 23, "question": "一家公司希望在執行風險評估和緩解任務時保護其AWS 雲資訊、系統和資產。這些目標支援AWS 架構完善框架 (AWS Well-Architected Framework)的哪一個支柱？", "options": {"A": "可靠性", "B": "安全", "C": "卓越運營 (Operational Excellence)", "D": "效能效率 (Performance Efficiency)"}, "correct_answer": "B", "explanation": "正確答案是 B，安全（Security）支柱。Well-Architected Framework 的安全支柱談的正是「保護資訊、系統、資產」，並透過風險評估與緩解機制持續強化防護，跟題目描述完全對應。A 可靠性支柱談系統故障恢復；C 卓越營運 (Operational Excellence)支柱談持續監控改善營運流程；D 效能效率 (Performance Efficiency)支柱談資源使用效率，三者都不是聚焦在保護資產、做風險評估與緩解這個核心動作上。"}, {"id": 24, "question": "在VPC 內設定網際網路閘道器 (Internet Gateway)的目的是什麼？", "options": {"A": "建立與VPC 的VPN 連線", "B": "允許VPC 和網際網路之間的通訊", "C": "對網際網路流量施加頻寬限制", "D": "跨Amazon EC2 例項對來自Internet 的流量進行負載平衡"}, "correct_answer": "B", "explanation": "正確答案是 B。網際網路閘道器 (Internet Gateway)是掛在 VPC 上的元件，作用是讓 VPC 內部資源可以跟公用網際網路互相通訊，沒有它 VPC 就是完全對外封閉的私有網路。A 選項講的是 VPN 連線，那是 Virtual Private Gateway 的工作；C 選項頻寬限制和 D 選項負載平衡都不是它的功能，負載平衡是 ELB 的工作，它單純只負責打通對外連線的通道。"}, {"id": 25, "question": "一家公司正在執行一個單一的本地應用程式，該應用程式無法擴充套件且難以維護。該公司計劃將應用程式遷移到AWS，並將應用程式劃分為微服務。公司在此計劃中遵循AWS 架構完善框架 (AWS Well-Architected Framework)的哪種最佳實踐？", "options": {"A": "將功能測試整合到AWS 部署中。", "B": "使用自動化來部署變更。", "C": "將應用程式部署到多個位置。", "D": "實現鬆散耦合 (Loose Coupling)的依賴關係。"}, "correct_answer": "D", "explanation": "正確答案是 D，實現鬆散耦合 (Loose Coupling)的依賴關係。把單體應用拆成微服務，本質上是把原本緊密綁在一起、牽一髮動全身的元件拆開，改用佇列、事件流讓元件互相獨立運作，這正是 Well-Architected Framework 可靠性支柱下鬆散耦合 (Loose Coupling)的最佳實踐，能提高彈性跟敏捷性 (Agility)。A 整合測試、B 自動化部署、C 部署到多個位置都是好實踐，但都不是拆分單體成微服務對應的核心概念。"}, {"id": 26, "question": "一家公司擁有一個AWS 賬戶。該公司希望稽核其密碼並訪問金鑰 (Access Key)輪換詳細資訊以確保合規性。哪種AWS 服務或工具可以滿足此要求？", "options": {"A": "IAM 訪問分析器 (IAM Access Analyzer)", "B": "AWS 神器 (AWS Artifact)", "C": "IAM 憑證報告 (IAM Credential Report)", "D": "AWS 審計經理 (AWS Audit Manager)"}, "correct_answer": "C", "explanation": "正確答案是 C，IAM 憑證報告 (IAM Credential Report)。這份報告列出帳號底下所有使用者的密碼使用狀態和存取金鑰 (Access Key)的建立、輪換時間，是稽核密碼與金鑰輪換合規性最直接的工具。A 的 IAM Access Analyzer 是找出哪些資源分享給外部帳號的；B 的 AWS Artifact 是下載合規報告文件的；D 的 Audit Manager 是持續評估法規合規風險的，三者功能定位都跟這個具體需求對不上。"}, {"id": 27, "question": "公司希望在達到特定AWS 成本閾值時收到通知。公司可以使用哪些AWS 服務或工具來滿足此要求？（選擇兩個。）", "options": {"A": "Amazon 簡單佇列服務(Amazon SQS)", "B": "AWS 預算 (AWS Budgets)", "C": "成本管理器 (AWS Cost Explorer)", "D": "亞馬遜雲觀察 (Amazon CloudWatch)", "E": "AWS 成本和使用情況報告"}, "correct_answer": "BD", "explanation": "正確答案是 BD。AWS Budgets 讓你設定自訂成本或使用量門檻，一旦超過就觸發通知；Amazon CloudWatch 可針對估計費用指標設定警報，達門檻也會發通知，兩者搭配覆蓋「達到成本門檻時通知」需求。A 的 SQS 只是訊息佇列服務，不會主動偵測成本；C 的 Cost Explorer 是分析檢視花費趨勢，不是設定警報通知；E 的成本與使用報告只是產出帳單明細，不具通知功能。"}, {"id": 28, "question": "哪些AWS 服務或資源可以回答AWS 從其使用者那裡收到的最常見的安全相關問題？", "options": {"A": "AWS 神器 (AWS Artifact)", "B": "亞馬遜連線 (Amazon Connect)", "C": "AWS 聊天機器人 (AWS Chatbot)", "D": "AWS 知識中心"}, "correct_answer": "A", "explanation": "正確答案是 A，AWS Artifact。它是 AWS 提供的自助入口網站，除了讓客戶下載 SOC、PCI DSS 這類合規報告，也整理了 AWS 針對客戶最常提出的安全相關問題所做的說明文件，等於官方版安全常見問題彙整入口。容易被誤導選 D「AWS 知識中心」，但知識中心是涵蓋所有 AWS 服務的通用支援知識庫，不是專門針對安全合規問題設計的資源；B 是聯絡中心服務，C 是聊天平台通知工具，都跟回答安全問題無關。"}, {"id": 29, "question": "根據AWS 責任共擔模型，哪些任務是客戶的責任？（選擇兩個。）", "options": {"A": "配置AWS提供的安全組 (Security Group)防火牆。", "B": "對AWS 雲中的公司資產進行分類。", "C": "確定要用於Amazon S3 儲存桶的可用區 (Availability Zone)。", "D": "修補或升級Amazon DynamoDB。", "E": "選擇要在其上執行AWS Lambda 的Amazon EC2 例項。"}, "correct_answer": "AB", "explanation": "正確答案是 AB。責任共擔模型下，「配置安全組 (Security Group)防火牆」（A）跟「為雲端中的公司資產分類」（B）都屬於客戶在應用層、資料層要自己做的事，AWS 不會替你決定資源重要性或設定防火牆規則。C 選項不成立，因為 S3 儲存桶本身就跨可用區 (Availability Zone)自動高可用，客戶不需指定可用區 (Availability Zone)；D 選項 DynamoDB 修補、E 選項 Lambda 底層例項選擇，都是託管服務底層維運，由 AWS 負責，客戶碰不到。"}, {"id": 30, "question": "以下哪些是AWS 架構完善的框架 (AWS Well-Architected Framework)的支柱？（選擇兩個。）", "options": {"A": "可用性", "B": "可靠性", "C": "可擴充套件性 (Scalability)", "D": "響應式設計", "E": "卓越運營 (Operational Excellence)"}, "correct_answer": "BE", "explanation": "正確答案是 BE，可靠性和卓越營運 (Operational Excellence)。AWS Well-Architected Framework 目前共有六大支柱：卓越營運 (Operational Excellence)、安全、可靠性、效能效率 (Performance Efficiency)、成本最佳化 (Cost Optimization)、永續性，B 可靠性和 E 卓越營運 (Operational Excellence)都是正式支柱名稱。A 可用性、C 可擴充套件性 (Scalability)、D 響應式設計聽起來像架構相關概念，但都不是六大支柱裡的正式名稱，是干擾選項，容易混淆架構「特性」跟框架「支柱」這兩個層次。"}, {"id": 31, "question": "哪種AWS 服務或功能用於從分散式應用程式傳送文字和電子郵件？", "options": {"A": "Amazon 簡單通知服務(Amazon SNS)", "B": "亞馬遜簡單電子郵件服務(Amazon SES)", "C": "Amazon CloudWatch 警報", "D": "Amazon 簡單佇列服務(Amazon SQS)"}, "correct_answer": "A", "explanation": "正確答案是 A，Amazon SNS。這是發布/訂閱模式的通知服務，支援把訊息同時發送到簡訊、電子郵件、行動推播等多種管道，適合分散式系統廣播通知。B 的 Amazon SES 只能處理電子郵件發送，沒辦法發簡訊；C 的 CloudWatch 警報是監控指標、觸發動作用的，本身不是通知管道；D 的 Amazon SQS 是訊息佇列服務，負責系統間非同步傳遞訊息，不是對使用者發簡訊或 email 的服務。"}, {"id": 32, "question": "使用者需要透過AWS CLI 或AWS API 以程式設計方式訪問AWS 資源。哪個選項將為使用者提供適當的訪問許可權？", "options": {"A": "亞馬遜檢查員 (Amazon Inspector)", "B": "訪問鍵 (Access Key)", "C": "SSH 公鑰", "D": "AWS Key Management Service (AWS KMS) 金鑰"}, "correct_answer": "B", "explanation": "正確答案是 B，存取金鑰 (Access Key)。存取金鑰 (Access Key)是給 IAM 使用者或根使用者用來對 AWS CLI 或 API 請求做簽章驗證的長期憑證，正是題目要的「以程式設計方式訪問」所需的東西。A 的 Amazon Inspector 是漏洞掃描服務，跟身分驗證無關；C 的 SSH 公鑰是拿來登入 EC2 例項用的；D 的 KMS 金鑰是用來加解密資料的，不是身分驗證憑證，只有存取金鑰 (Access Key)符合程式化存取用途。"}, {"id": 33, "question": "一家公司使用AWS Batch 執行數千個同步模擬。每個模擬都是無狀態的、容錯的，並且執行時間長達3 小時。哪種定價模式使公司能夠最佳化成本並滿足這些要求？", "options": {"A": "預留例項 (Reserved Instance)", "B": "現貨例項 (Spot Instance)", "C": "按需例項 (On-Demand Instance)", "D": "專用例項 (Dedicated Instance)"}, "correct_answer": "B", "explanation": "正確答案是 B，現貨例項 (Spot Instance)。題目關鍵字是「無狀態、容錯、可以中斷、執行時間在 3 小時內」，正是現貨例項 (Spot Instance)最理想的場景：現貨例項 (Spot Instance)比按需例項 (On-Demand Instance)便宜最多 90%，代價是可能隨時被收回，但工作本身無狀態又容錯，被中斷 AWS Batch 也能重新排程繼續跑，換取大幅省錢。A 預留例項 (Reserved Instance)適合長期穩定負載；C 按需例項 (On-Demand Instance)沒有價格優勢；D 專用例項 (Dedicated Instance)成本最高，都不是這種短時大量批次運算最划算的選擇。"}, {"id": 34, "question": "敏捷性 (Agility)概念在AWS雲端計算中意味著什麼？（選擇兩個。）", "options": {"A": "AWS資源的實施速度", "B": "AWS 建立新AWS 區域的速度", "C": "快速實驗的能力", "D": "消除浪費的產能", "E": "進入雲端計算的成本低廉"}, "correct_answer": "CD", "explanation": "正確答案是 CD。AWS 講的敏捷性 (Agility)核心價值在於：企業能用很低成本快速嘗試新點子（C，快速實驗的能力），失敗也能很快喊停不浪費資源；同時雲端資源可隨用隨調，不用先預估未來容量一次買足設備，等於消除猜錯容量、資源閒置浪費的問題（D）。A 講的是資源建立速度，偏向彈性概念一環；B 講的是 AWS 建新區域的速度，跟客戶端敏捷性 (Agility)無關；E 進入雲端成本低廉屬於另一個雲端優勢，不是敏捷性 (Agility)的重點。"}, {"id": 35, "question": "一家公司需要阻止SQL 注入攻擊。哪些AWS 服務或功能可以滿足此要求？", "options": {"A": "AWS 網路應用防火牆 (AWS WAF)", "B": "AWS 盾 (AWS Shield)", "C": "網路ACL", "D": "安全組 (Security Group)"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS WAF 是應用層防火牆，可以針對 HTTP/HTTPS 請求內容設規則，包括內建的 SQL injection 過濾規則，直接擋掉惡意查詢字串，還能掛在 CloudFront、ALB 或 API Gateway 前面用。AWS Shield 專門防禦 DDoS 流量攻擊，不會檢查請求內容，所以擋不了注入攻擊。網路 ACL 和安全組 (Security Group)都是在網路層依 IP、埠號做流量控管，看不到封包裡的 SQL 語法，自然也無法辨識注入攻擊，這題要選能看懂內容的防護才對。"}, {"id": 36, "question": "哪些AWS 服務或功能可識別Amazon S3 儲存桶或IAM 角色 (IAM Role)是否已與外部實體共享？", "options": {"A": "AWS 服務目錄 (AWS Service Catalog)", "B": "AWS 系統經理 (AWS Systems Manager)", "C": "AWS IAM 訪問分析器 (IAM Access Analyzer)", "D": "AWS 組織 (AWS Organizations)"}, "correct_answer": "C", "explanation": "正確答案是 C。IAM Access Analyzer 專門分析資源政策，例如 S3 儲存桶政策、IAM 角色 (IAM Role)信任政策，找出哪些資源被分享給帳戶外部的實體，正是這題要的答案。AWS Service Catalog 是用來管理公司內部可佈建的產品清單，跟外部分享偵測無關。AWS Systems Manager 專注在維運管理，例如修補、參數儲存。AWS Organizations 是用來做多帳戶治理 (Governance)與合併帳單，這兩個都不會主動掃描資源是否外洩給外部帳戶，所以都不是答案。"}, {"id": 37, "question": "雲從業者在將環境遷移到AWS 雲之前需要獲取AWS 合規性報告。如何生成這些報告？", "options": {"A": "聯絡AWS 合規團隊。", "B": "從AWS Artifact 下載報告。", "C": "向AWS Support 開立案例。", "D": "使用Amazon Macie 生成報告。"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS Artifact 是自助式入口網站，公司可以直接下載 AWS 的各種合規報告與認證文件，像是 ISO、SOC、PCI DSS 相關文件，不用額外聯絡任何人。聯絡合規團隊或開 Support 案例都要人工來回，速度慢也沒必要，AWS Artifact 本來就是設計來讓客戶自己查、自己下載。Amazon Macie 是用來掃描 S3 裡的敏感資料，跟取得合規報告完全是兩回事，這題容易被服務名稱誤導，要記得 Macie 是資料分類服務。"}, {"id": 38, "question": "一家電子商務公司已將其IT 基礎設施從本地資料中心遷移到AWS 雲。哪些成本是公司的直接責任？", "options": {"A": "應用軟體許可成本", "B": "AWS 上的硬體基礎設施成本", "C": "AWS 伺服器的電力成本", "D": "AWS 資料中心的物理安全成本"}, "correct_answer": "A", "explanation": "正確答案是 A。根據責任共擔模型，客戶負責雲端內的一切，包括自己安裝的應用程式軟體授權費用，這是公司要直接付的錢。AWS 負責雲端本身，也就是硬體基礎設施成本、伺服器用電、資料中心的實體保全，這些都已經內含在 AWS 服務的計費裡，客戶不用另外負擔，也不會直接看到這些帳單項目。這題重點在分辨客戶自己買單，跟 AWS 已經幫你付掉、藏在服務費用裡的差異。"}, {"id": 39, "question": "一家公司正在AWS 賬戶上設定AWS Identity and Access Management (IAM)。哪項建議符合IAM 安全最佳實踐？", "options": {"A": "使用帳戶root 使用者訪問金鑰 (Access Key)來執行管理任務。", "B": "授予廣泛的許可權，以便所有公司員工都可以訪問他們所需的資源。", "C": "開啟多重身份驗證(MFA) 以提高登入過程中的安全性。", "D": "避免輪換憑證以防止生產應用程式中出現問題。"}, "correct_answer": "C", "explanation": "正確答案是 C。開啟 MFA 是 IAM 最基本也最重要的安全實踐之一，能大幅降低帳號密碼外洩後被盜用的風險。root 使用者的存取金鑰 (Access Key)本來就不建議建立，日常管理任務更不該用 root 執行，應該改用具備適當權限的 IAM 角色 (IAM Role)。授予員工所需資源聽起來合理，但選項寫的是廣泛的許可權，違反最小權限原則。憑證要定期輪換才能降低外洩風險，避免輪換是明顯錯誤的做法，這幾個錯誤選項都是常見的誤導陷阱。"}, {"id": 40, "question": "AWS 雲中的彈性指的是以下哪一項？（選擇兩個。）", "options": {"A": "Amazon EC2 例項重啟的速度有多快", "B": "隨著需求變化調整資源規模的能力", "C": "Amazon EC2 例項可以使用的最大RAM 量", "D": "按量付費的計費模式", "E": "在需要時如何輕鬆地獲取資源"}, "correct_answer": "BE", "explanation": "正確答案是 B 和 E。彈性（elasticity）指的是資源能隨著需求自動增加或釋放，以及需要用的時候能很快拿到資源，這兩點都跟量的伸縮有關。EC2 例項重啟速度是效能面的議題，跟彈性定義無關。EC2 能用的最大 RAM 量是規格上限，屬於固定屬性，不會隨需求變動。按量付費是定價模式，講的是怎麼收費，跟資源能不能彈性伸縮是兩件事，不要把彈性跟成本效益混為一談，這是這題常見的誤區。"}, {"id": 41, "question": "哪種服務允許客戶稽核其AWS 賬戶中的API 呼叫？", "options": {"A": "AWS 雲跟蹤 (AWS CloudTrail)", "B": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "C": "亞馬遜檢查員 (Amazon Inspector)", "D": "AWS X射線 (AWS X-Ray)"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS CloudTrail 會記錄帳戶內每一次 API 呼叫，包含誰呼叫、呼叫了什麼操作、從哪個 IP 來，是稽核 API 活動最直接的工具。AWS Trusted Advisor 提供的是成本、效能、安全面的最佳實踐建議，不是逐筆記錄 API 呼叫。Amazon Inspector 是掃描運算資源的漏洞跟弱點，跟 API 稽核無關。AWS X-Ray 是用來追蹤應用程式內部呼叫鏈，做效能除錯用的，也不是設計來給客戶稽核帳戶層級 API 活動的工具。"}, {"id": 42, "question": "根據AWS 責任共擔模型，使用AWS Lambda 時客戶的責任是什麼？", "options": {"A": "管理Lambda 函式中的程式碼", "B": "確認資料中心的硬體正常工作", "C": "修補作業系統", "D": "當不再使用Lambda 函式時將其關閉"}, "correct_answer": "A", "explanation": "正確答案是 A。使用 Lambda 時，AWS 負責底層伺服器、作業系統修補、擴展等基礎設施工作，客戶只需要專心寫好、管好自己的函式程式碼，這正是無伺服器架構的價值所在。確認資料中心硬體正常、修補作業系統都屬於 AWS 的責任範圍，客戶完全碰不到也不需要管。至於不用時把函式關掉，Lambda 本來就是用多少算多少、沒呼叫就不計費，不需要手動關閉，這個選項邏輯上也不成立。"}, {"id": 43, "question": "一家公司在Amazon S3 中儲存了5 TB 的資料。該公司計劃偶爾對資料進行查詢以進行分析。公司應使用哪種AWS 服務以最具成本效益的方式執行這些查詢？", "options": {"A": "亞馬遜紅移 (Amazon Redshift)", "B": "亞馬遜雅典娜 (Amazon Athena)", "C": "亞馬遜運動", "D": "亞馬遜RDS"}, "correct_answer": "B", "explanation": "正確答案是 B。Amazon Athena 是無伺服器的互動式查詢服務，直接對 S3 上的資料用 SQL 查詢，用多少查詢量算多少錢，完全不用架設或維護任何運算叢集，很適合偶爾查一下這種低頻率分析需求。Amazon Redshift 要先建立並持續運行資料倉儲叢集，即使沒在查詢也要付叢集費用，不划算。Amazon Kinesis 是處理即時串流資料，不是拿來查詢已經放在 S3 的靜態資料。Amazon RDS 是關聯式資料庫服務，本來就不是設計來直接查 S3 檔案的工具。"}, {"id": 44, "question": "哪些AWS 服務可以免費使用？", "options": {"A": "亞馬遜SageMaker", "B": "AWS配置 (AWS Config)", "C": "AWS 組織 (AWS Organizations)", "D": "亞馬遜雲觀察 (Amazon CloudWatch)"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Organizations 這個服務本身完全免費，公司只需要為成員帳戶底下實際使用的資源，例如 EC2、S3 付費，開通、管理多帳戶架構不會額外收費。Amazon SageMaker 是依訓練與推論資源使用量計費的機器學習服務。AWS Config 依記錄的設定項目數量與規則評估次數計費。Amazon CloudWatch 的基本監控免費額度有限，超過用量一樣要付費，這三個都不是完全免費的服務。"}, {"id": 45, "question": "哪些AWS 雲採用框架(AWS CAF) 功能屬於人員視角？", "options": {"A": "資料架構", "B": "事件管理", "C": "雲流暢度 (Cloud Fluency)", "D": "戰略合作伙伴關係"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS CAF 把雲採用能力拆成六大視角，雲流暢度（Cloud Fluency）屬於人員視角，講的是組織裡的人有沒有足夠的雲端知識與技能、有沒有做好教育訓練與人才培養。資料架構屬於平台視角，講系統與資料怎麼設計。事件管理屬於維運視角，講的是日常營運怎麼處理突發狀況。策略合作夥伴關係屬於業務視角，講的是商業面的外部合作，四個視角容易搞混，記口訣是解這類題最快的方法。"}, {"id": 46, "question": "一家公司希望預先承諾繼續使用其生產Amazon EC2 例項，以換取總體成本的降低。哪些定價選項能夠以最低的成本滿足這些要求？（選擇兩個。）", "options": {"A": "現貨例項 (Spot Instance)", "B": "按需例項 (On-Demand Instance)", "C": "預留例項 (Reserved Instance)", "D": "儲蓄計劃 (Savings Plans)", "E": "專用主機 (Dedicated Host)"}, "correct_answer": "CD", "explanation": "正確答案是 C 和 D。預留執行個體（Reserved Instances）和 Savings Plans 都是用預先承諾使用量換取折扣，折扣幅度可達 72% 到 75%，很適合生產環境這種長期穩定運行、可預期用量的場景。Spot 執行個體 (Spot Instance)雖然便宜，但隨時可能被 AWS 收回，不適合放正式環境的生產工作負載。按需執行個體 (On-Demand Instance)沒有任何折扣，不符合降低整體成本的要求。專用主機 (Dedicated Host)主要是為了授權或合規需求而存在，不是以省錢為主要訴求，這題的關鍵字是預先承諾。"}, {"id": 47, "question": "一家公司希望將其本地關聯式資料庫遷移到AWS 雲。該公司希望使用儘可能靠近其當前地理位置的基礎設施。公司應使用哪種AWS 服務或資源來選擇其Amazon RDS 部署區域？", "options": {"A": "亞馬遜連線 (Amazon Connect)", "B": "AWS波長", "C": "AWS 區域", "D": "AWS 直連 (AWS Direct Connect)"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS 區域（Regions）是 AWS 全球各地的實體資料中心群組，公司要決定資料庫部署在哪個地理位置、想找離自己最近的位置，就是在選擇 Region，這樣能兼顧延遲與資料主權考量。Amazon Connect 是雲端聯絡中心服務，跟選擇部署地點無關。AWS Wavelength 是把運算資源部署到電信商 5G 網路邊緣，服務對象是行動裝置低延遲應用。AWS Direct Connect 提供的是專屬網路連線，處理的是怎麼連進 AWS，而不是選哪個地區。"}, {"id": 48, "question": "一家公司正在探索AWS 雲的使用，並且需要在預置基礎設施之前為專案建立成本估算。哪些AWS 服務或功能可用於在部署前估算成本？", "options": {"A": "AWS 免費套餐", "B": "AWS 定價計算器 (AWS Pricing Calculator)", "C": "AWS 計費和成本管理", "D": "AWS 成本和使用情況報告"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS 定價計算器（Pricing Calculator）就是設計來讓客戶在還沒真的建立任何資源之前，先試算不同服務組合、不同用量下的預估費用，很適合上雲前做成本評估。AWS 免費套餐只是特定服務的免費額度優惠，不是估價工具。AWS 計費和成本管理、AWS 成本和使用情況報告，這兩個都是拿來看已經花掉的實際費用跟使用紀錄，是部署之後才能派上用場的工具，跟部署前的預估完全是不同階段的需求。"}, {"id": 49, "question": "一家公司正在構建一個應用程式，需要以最小的延遲在全球範圍內傳送影象和影片。公司可以使用哪種方法以具有成本效益的方式實現這一目標？", "options": {"A": "透過Amazon CloudFront 交付內容。", "B": "將內容儲存在Amazon S3 上並啟用S3 跨區域複製。", "C": "跨多個AWS 區域實施VPN。", "D": "透過AWS PrivateLink 交付內容。"}, "correct_answer": "A", "explanation": "正確答案是 A。Amazon CloudFront 是 CDN 服務，會把影像、影片快取到全球各地的邊緣節點，使用者就近取得內容，延遲低、成本也比較划算，正好符合全球傳送、低延遲、具成本效益的需求。把內容放 S3 再開跨區域複製，等於在多個地區各存一份，儲存成本會墊高，而且使用者還是要連回某個區域的 S3，延遲改善有限。跨區域架 VPN、用 AWS PrivateLink 都是處理私有連線安全性的做法，不是拿來加速內容分發的工具，方向就選錯了。"}, {"id": 50, "question": "哪種選擇更有利於基於雲端計算優勢的規模經濟 (Economies of Scale)？", "options": {"A": "將可變費用換成固定費用的能力", "B": "提高速度和敏捷性 (Agility)", "C": "可變成本低於固定成本", "D": "整個資料中心的運營成本增加"}, "correct_answer": "C", "explanation": "正確答案是 C。規模經濟 (Economies of Scale)的核心概念是：當使用量越大，因為固定成本被更多人分攤、AWS 整體維運效率提升，客戶能享受到的可變成本，也就是使用量計費部分，會越來越低，這正是雲端規模經濟 (Economies of Scale)的優勢所在。把可變費用換成固定費用，其實是雲端計算反過來的特性，不是規模經濟 (Economies of Scale)的重點。速度和敏捷性 (Agility)提升是雲端的另一項好處，跟成本結構沒有直接關聯。整個資料中心運營成本增加更是完全講反了，規模經濟 (Economies of Scale)講的是成本下降，不是上升。"}, {"id": 51, "question": "以下哪項是公司可以用來將雲資源定義為程式碼並透過AWS CloudFormation 預置資源的軟體開發框架？", "options": {"A": "AWS CLI", "B": "AWS 開發人員中心", "C": "AWS 雲開發套件(AWS CDK)", "D": "AWS 程式碼之星"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS CDK（Cloud Development Kit）是一套軟體開發框架，讓工程師用 TypeScript、Python、Java 這類熟悉的程式語言定義雲端資源與它們之間的關係，再由 CDK 自動生成 CloudFormation 樣板去佈建資源，是題目描述用程式碼定義資源、透過 CloudFormation 佈建最直接對應的服務。AWS CLI 只是命令列工具，用來下指令操作 AWS，不是定義基礎設施即程式碼的框架。AWS CodeStar 是專案管理與 CI/CD 整合工具，跟定義基礎設施完全是不同用途。"}, {"id": 52, "question": "一家公司正在開發一個使用多個AWS 服務的應用程式。應用程式需要使用臨時的、有限許可權的憑證來與其他AWS API 進行身份驗證。公司應使用哪種AWS 服務或功能來滿足這些身份驗證要求？", "options": {"A": "亞馬遜API 閘道器", "B": "IAM使用者", "C": "AWS 安全令牌服務(AWS STS)", "D": "IAM 例項配置檔案"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS STS（Security Token Service）就是專門用來核發臨時性、範圍受限的憑證，應用程式可以透過扮演角色（AssumeRole）拿到短期憑證去呼叫其他 AWS API，用完就過期，符合題目要的臨時、有限許可權需求。Amazon API Gateway 是拿來建立與管理 API 的服務，本身不核發身分驗證憑證。IAM 使用者用的是長期存在的存取金鑰 (Access Key)，不是臨時憑證，安全風險較高。IAM 執行個體設定檔則是專門給 EC2 例項掛載角色用的機制，適用範圍比較侷限，不是廣義的臨時憑證服務。"}, {"id": 53, "question": "哪項AWS 服務是雲安全態勢管理(CSPM) 服務，它以標準化格式聚合來自各種AWS 服務和合作伙伴產品的警報？", "options": {"A": "AWS 安全中心 (AWS Security Hub)", "B": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "C": "亞馬遜事件橋 (Amazon EventBridge)", "D": "亞馬遜GuardDuty"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS Security Hub 就是雲安全態勢管理（CSPM）服務，它會把 Amazon GuardDuty、Amazon Inspector、Amazon Macie 以及第三方合作夥伴工具產生的安全發現，統一用標準化格式彙整在同一個儀表板，方便集中檢視與處理。AWS Trusted Advisor 提供的是全面向的最佳實踐建議，不限於安全，也不做跨服務發現彙整。Amazon EventBridge 是事件路由服務，負責傳遞事件不負責彙整安全警報。Amazon GuardDuty 本身只是眾多資料來源之一，不是彙整平台，這題容易把來源跟彙整者搞混。"}, {"id": 54, "question": "哪項AWS 服務始終免費提供？", "options": {"A": "亞馬遜S3", "B": "AWS 身份和訪問管理(IAM)", "C": "彈性負載均衡 (Elastic Load Balancing)器", "D": "AWS 網路應用防火牆 (AWS WAF)"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS IAM 完全免費，公司不用為建立使用者、角色、政策這些身分與權限管理功能額外付費，只需要為底下實際用到的資源付費。Amazon S3 依儲存量、請求次數、資料傳輸量計費。Elastic Load Balancer 依運行時數和處理的流量計費。AWS WAF 依規則數量與請求量計費，這三個服務都會實際產生費用，只有 IAM 是無論用量多寡都不收費的服務，這也是很多考題喜歡考的重點。"}, {"id": 55, "question": "為了降低成本，一家公司計劃將NoSQL 資料庫遷移到AWS。哪種AWS 服務是完全託管的並且可以自動擴充套件吞吐量以滿足資料庫工作負載需求？", "options": {"A": "亞馬遜紅移 (Amazon Redshift)", "B": "亞馬遜極光 (Amazon Aurora)", "C": "亞馬遜動態資料庫 (Amazon DynamoDB)", "D": "亞馬遜RDS"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon DynamoDB 是完全託管的 NoSQL 資料庫，支援依需求自動擴展讀寫吞吐量，也就是 On-Demand 模式，完全符合 NoSQL、免管理、自動擴充的需求。Amazon Redshift 是關聯式的資料倉儲服務，適合大規模分析查詢，不是 NoSQL。Amazon Aurora 和 Amazon RDS 都是關聯式資料庫服務，資料結構與擴展方式跟 NoSQL 完全不同，這題只要抓住 NoSQL 這個關鍵字，就能直接鎖定 DynamoDB。"}, {"id": 56, "question": "一家公司正在使用Amazon DynamoDB。根據AWS 責任共擔模型，哪項任務是公司的責任？", "options": {"A": "修補作業系統。", "B": "配置主機。", "C": "管理資料庫訪問許可權。", "D": "保護作業系統。"}, "correct_answer": "C", "explanation": "正確答案是 C。DynamoDB 是完全託管服務，AWS 負責修補作業系統、配置主機、保護底層作業系統這些基礎設施層面的工作，客戶完全不用碰。客戶要負責的是雲端內的部分，也就是誰能存取這個資料庫、要開放哪些操作權限，這屬於資料庫存取權限管理，是客戶自己用 IAM 政策去設定的。其他三個選項都是實體基礎設施或作業系統層級的工作，全都落在 AWS 那一側，不是客戶的責任。"}, {"id": 57, "question": "某公司有一個測試AWS環境。一家公司正計劃在AWS 中測試應用程式。應用程式測試可以中斷，不需要連續執行。哪種Amazon EC2 購買選項能夠最經濟高效地滿足這些要求？", "options": {"A": "按需例項 (On-Demand Instance)", "B": "專用例項 (Dedicated Instance)", "C": "現貨例項 (Spot Instance)", "D": "預留例項 (Reserved Instance)"}, "correct_answer": "C", "explanation": "正確答案是 C。Spot 執行個體 (Spot Instance)用未使用的閒置運算容量，價格比按需執行個體 (On-Demand Instance)便宜非常多，代價是 AWS 隨時可能收回容量、中斷執行，這正好符合測試環境、可以中斷、不需要連續執行的情境，是最划算的選擇。按需執行個體 (On-Demand Instance)沒有折扣，成本較高。專用執行個體主要是為了合規或授權需求而存在，價格反而更貴。預留執行個體 (Reserved Instance)要先承諾長期使用量才有折扣，跟這題非連續執行的測試情境不搭，硬選反而不划算。"}, {"id": 58, "question": "哪種AWS 服務使使用者能夠發現和保護儲存在Amazon S3 儲存桶中的敏感資料？", "options": {"A": "亞馬遜麥西 (Amazon Macie)", "B": "亞馬遜偵探 (Amazon Detective)", "C": "亞馬遜GuardDuty", "D": "AWS IAM 訪問分析器 (IAM Access Analyzer)"}, "correct_answer": "A", "explanation": "正確答案是 A。Amazon Macie 是專門用機器學習技術掃描 S3 儲存桶內容，自動找出裡面的個資、信用卡卡號這類敏感資料，並協助分類與保護，完全對應題目發現並保護 S3 敏感資料的需求。Amazon Detective 是拿來調查已經發生的安全事件、找出根本原因，不是主動掃描資料內容。Amazon GuardDuty 監控的是帳戶與網路層級的異常行為，不會深入檢查檔案內容。IAM Access Analyzer 分析的是資源存取政策，也不涉及資料內容本身，四個服務名稱容易搞混但用途差很多。"}, {"id": 59, "question": "以下哪些服務可用於阻止例項的網路流量？（選擇兩個。）", "options": {"A": "安全組 (Security Group)", "B": "Amazon Virtual Private Cloud (Amazon VPC) 流日誌", "C": "網路ACL", "D": "亞馬遜雲觀察 (Amazon CloudWatch)", "E": "AWS 雲跟蹤 (AWS CloudTrail)"}, "correct_answer": "AC", "explanation": "正確答案是 A 和 C。安全組 (Security Group)是掛在例項層級的狀態防火牆，網路 ACL 是掛在子網層級的無狀態防火牆，兩者都能依 IP、埠號、協定設規則來允許或擋掉流量，是題目要的阻擋網路流量工具。Amazon VPC 流日誌 (VPC Flow Logs)只是記錄流量進出的紀錄，用來事後分析，本身不會主動擋流量。Amazon CloudWatch 是監控指標與日誌的服務。AWS CloudTrail 記錄的是 API 呼叫，這兩個都是觀察用的工具，不具備阻擋流量的能力，跟真正能擋流量的防火牆功能是不同層次的東西。"}, {"id": 60, "question": "哪種AWS 服務可以識別Amazon EC2 例項何時終止？", "options": {"A": "AWS 身份和訪問管理(IAM)", "B": "AWS 雲跟蹤 (AWS CloudTrail)", "C": "AWS 計算最佳化器 (AWS Compute Optimizer)", "D": "亞馬遜事件橋 (Amazon EventBridge)"}, "correct_answer": "B", "explanation": "正確答案是 B。AWS CloudTrail 會記錄帳戶內所有 API 呼叫，包括 TerminateInstances 這類操作，所以要確認 EC2 例項什麼時候被終止、是誰執行的，CloudTrail 的事件紀錄就是最直接的證據來源。AWS IAM 管的是身分與權限，不記錄操作事件。AWS Compute Optimizer 是提供資源規格建議，跟例項狀態變化紀錄無關。Amazon EventBridge 雖然也能訂閱 EC2 狀態變化事件做即時通知，但題目問的是識別，也就是查詢歷史紀錄的能力，CloudTrail 才是最直接對應的稽核工具。"}, {"id": 61, "question": "以下哪一個是完全託管的MySQL 相容資料庫？", "options": {"A": "亞馬遜S3", "B": "亞馬遜動態資料庫 (Amazon DynamoDB)", "C": "亞馬遜紅移 (Amazon Redshift)", "D": "亞馬遜極光 (Amazon Aurora)"}, "correct_answer": "D", "explanation": "正確答案是 D。Amazon Aurora 有 MySQL 相容版本，是 AWS 完全託管的關聯式資料庫，效能比原生 MySQL 更好，同時保留完全託管、自動備份、自動擴展這些管理上的便利性，正好符合完全託管、MySQL 相容的描述。Amazon S3 是物件儲存服務，不是資料庫。Amazon DynamoDB 是 NoSQL 資料庫，跟 MySQL 語法不相容。Amazon Redshift 雖然查詢語法跟 PostgreSQL 類似，是用來做大規模資料分析的資料倉儲，也不是 MySQL 相容的資料庫，這幾個選項用途都跟題目要求不同。"}, {"id": 62, "question": "哪種AWS 服務支援混合架構，使使用者能夠將AWS 基礎設施、AWS 服務、API 和工具擴充套件到資料中心、主機託管環境或本地設施？", "options": {"A": "AWS 雪地車 (AWS Snowmobile)", "B": "AWS 本地區域 (AWS Local Zones)", "C": "AWS 前哨站 (AWS Outposts)", "D": "AWS 法門 (AWS Fargate)"}, "correct_answer": "C", "explanation": "正確答案是 C。AWS Outposts 是把 AWS 的實體機櫃直接部署到客戶自己的資料中心、機房代管環境或其他本地設施，讓客戶能在自己的場地用同一套 AWS API 與工具，同時無縫連回 AWS 雲端，是唯一真正延伸到客戶自有場地的混合架構方案。AWS Snowmobile 是拿來做超大量資料搬遷的卡車服務，跟長期混合架構無關。AWS Local Zones 是 AWS 自己在特定城市佈建的基礎設施，場地仍屬於 AWS，不是客戶自己的機房。AWS Wavelength 則是嵌入電信商 5G 網路邊緣，服務對象是行動應用低延遲情境，跟題目描述的場景不同。"}, {"id": 63, "question": "哪種AWS 服務可以執行提供線上事務處理(OLTP) 的託管PostgreSQL 資料庫？", "options": {"A": "亞馬遜動態資料庫 (Amazon DynamoDB)", "B": "亞馬遜雅典娜 (Amazon Athena)", "C": "亞馬遜RDS", "D": "亞馬遜電子病歷 (Amazon EMR)"}, "correct_answer": "C", "explanation": "正確答案是 C。Amazon RDS 支援多種資料庫引擎，其中就包含 PostgreSQL，是完全託管的關聯式資料庫服務，很適合 OLTP，也就是線上交易處理這種需要頻繁讀寫、講求交易一致性的工作負載，客戶不用自己管理底層基礎設施。Amazon DynamoDB 是 NoSQL 資料庫，不是 PostgreSQL。Amazon Athena 是查詢 S3 資料用的無伺服器分析工具，不是資料庫引擎。Amazon EMR 是大數據處理框架，用來跑 Hadoop、Spark 這類分散式運算，跟託管 PostgreSQL 資料庫完全是不同類型的服務。"}, {"id": 64, "question": "一家公司希望透過安全的網路連線為其遠端員工提供託管的Windows 虛擬桌面和應用程式。公司可以使用哪些AWS 服務來滿足這些要求？（選擇兩個。）", "options": {"A": "亞馬遜連線 (Amazon Connect)", "B": "亞馬遜應用程式流2.0 (Amazon AppStream 2.0)", "C": "亞馬遜工作空間 (Amazon WorkSpaces)", "D": "AWS 站點到站點VPN (AWS Site-to-Site VPN)", "E": "亞馬遜彈性容器服務（Amazon ECS）"}, "correct_answer": "BC", "explanation": "正確答案是 B 和 C。Amazon WorkSpaces 提供完全託管的虛擬桌面即服務，能讓遠端員工透過安全連線使用完整的 Windows 桌面環境。Amazon AppStream 2.0 則是把個別應用程式透過瀏覽器串流給使用者，不用配置整台虛擬桌面，兩者都能滿足安全交付 Windows 桌面與應用程式的需求。Amazon Connect 是雲端客服聯絡中心服務，跟虛擬桌面無關。AWS Site-to-Site VPN 只是建立網路連線的工具，本身不提供桌面或應用程式交付。Amazon ECS 是容器服務，用途也完全不同，這幾個都不是答案。"}, {"id": 65, "question": "一家公司希望監控配置錯誤的安全組 (Security Group)，這些安全組 (Security Group)允許不受限制地訪問特定埠。哪種AWS 服務可以滿足此要求？", "options": {"A": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "B": "亞馬遜雲觀察 (Amazon CloudWatch)", "C": "亞馬遜GuardDuty", "D": "AWS 健康儀表板 (AWS Health Dashboard)"}, "correct_answer": "A", "explanation": "正確答案是 A。AWS Trusted Advisor 內建安全類別檢查項目，會主動掃描帳戶內的安全組 (Security Group)設定，找出對外開放特定高風險埠，例如 0.0.0.0/0 全開的配置錯誤，直接對應題目的需求。Amazon CloudWatch 是監控指標和日誌的平台，不會主動檢查安全組 (Security Group)設定是否合規。Amazon GuardDuty 專注在偵測異常行為與威脅，例如可疑 API 呼叫或惡意 IP 通訊，並不是專門用來檢查安全組 (Security Group)規則本身。AWS Health Dashboard 顯示的是 AWS 服務健康狀態與帳戶層級事件通知，跟安全組 (Security Group)配置檢查也是兩回事。"}, {"id": 66, "question": "哪種AWS 服務是大規模提供亞毫秒級延遲的鍵值資料庫？", "options": {"A": "亞馬遜動態資料庫 (Amazon DynamoDB)", "B": "亞馬遜極光 (Amazon Aurora)", "C": "Amazon DocumentDB（與MongoDB 相容）", "D": "亞馬遜海王星 (Amazon Neptune)"}, "correct_answer": "A", "explanation": "正確答案是 A。Amazon DynamoDB 是專為大規模、鍵值資料存取設計的 NoSQL 資料庫，單表可以撐到近乎無限的規模，搭配 DAX 這類快取層還能做到微秒等級延遲，本身標準延遲也在個位數毫秒範圍，是題目描述大規模、極低延遲鍵值資料庫最對應的服務。Amazon Aurora 是關聯式資料庫，不是鍵值型態。Amazon DocumentDB 是文件型資料庫，相容 MongoDB。Amazon Neptune 是圖形資料庫，用來處理關聯性很強的資料，這三個資料模型都跟鍵值不同，方向就不對。"}, {"id": 67, "question": "一家公司正在部署一個機器學習(ML) 研究專案，該專案需要幾個月的大量計算能力。ML 處理作業不需要在特定時間執行。哪種Amazon EC2 例項購買選項能夠以最低的成本滿足這些要求？", "options": {"A": "按需例項 (On-Demand Instance)", "B": "現貨例項 (Spot Instance)", "C": "預留例項 (Reserved Instance)", "D": "專用例項 (Dedicated Instance)"}, "correct_answer": "B", "explanation": "這題要提醒一下：資料集標記的正確答案是 A（按需執行個體 (On-Demand Instance)），但查證 AWS 官方文件與原始考題出處，比較合理的答案其實是 B（Spot 執行個體 (Spot Instance)），這裡的標記很可能是整理資料時誤植，以下用自己的判斷寫給大家參考。題目關鍵字是不需要在特定時間執行，這正是 Spot 執行個體 (Spot Instance)最典型的應用情境：工作能容忍中斷、時程有彈性，用 Spot 換取最高可達 90% 的折扣，才是幾個月大量運算需求下最省錢的做法。按需執行個體 (On-Demand Instance)穩定但沒有折扣，不符合最低成本的要求。預留執行個體 (Reserved Instance)要先承諾一年或三年固定用量，跟研究專案彈性、非連續的需求對不上。專用執行個體是為了授權或合規而存在，價格更高，也不是答案。"}, {"id": 68, "question": "哪些AWS 服務或功能為Amazon EC2 例項提供災難恢復解決方案？（選擇兩個。）", "options": {"A": "EC2 預留例項 (Reserved Instance)", "B": "EC2 Amazon 系統映像(AMI)", "C": "Amazon Elastic Block Store (Amazon EBS) 快照", "D": "AWS 盾 (AWS Shield)", "E": "亞馬遜GuardDuty"}, "correct_answer": "BC", "explanation": "正確答案是 B 和 C。Amazon Machine Image（AMI）可以把 EC2 例項的完整設定與資料打包成映像檔，一旦發生災難就能用同一份 AMI 快速在其他可用區 (Availability Zone)域重新啟動替代例項。Amazon EBS 快照則是對儲存磁碟區做時間點備份，可以用來還原資料或建立新的磁碟區，兩者合起來就是 EC2 常見的災難復原機制。EC2 預留執行個體 (Reserved Instance)只是一種定價方案，跟資料或例項的備份還原完全無關。AWS Shield 是防禦 DDoS 攻擊的服務，Amazon GuardDuty 是威脅偵測服務，這兩個都是安全防護工具，不是用來做災難復原的。"}, {"id": 69, "question": "哪種AWS 服務提供直接從Web 瀏覽器對AWS 工具和資源進行命令列訪問的功能？", "options": {"A": "AWS 雲HSM (AWS CloudHSM)", "B": "AWS 雲外殼 (AWS CloudShell)", "C": "亞馬遜工作空間 (Amazon WorkSpaces)", "D": "AWS 雲地圖 (AWS Cloud Map)"}, "correct_answer": "B", "explanation": "AWS CloudShell 是瀏覽器內建的命令列環境,登入 Console 後直接開啟就能跑 AWS CLI,不用另外裝設或設憑證,所以答案是 B。A 的 CloudHSM 是硬體安全模組,管加密金鑰用;C 的 Amazon WorkSpaces 是雲端虛擬桌面,給的是完整作業系統畫面;D 的 Cloud Map 是服務探索工具,三者都跟瀏覽器命令列存取無關。"}, {"id": 70, "question": "網路工程師需要構建一個混合雲架構，使用AWS Direct Connect 將本地網路連線到AWS 雲。該公司在單個AWS 區域中擁有幾個VPC，預計隨著時間的推移，VPC 的數量將增加到數百個。隨著VPC 數量的增加，工程師應使用哪種AWS 服務或功能來簡化和擴充套件此連線？", "options": {"A": "VPC 終端節點 (VPC Endpoint)", "B": "AWS 傳輸閘道器 (AWS Transit Gateway)", "C": "亞馬遜53 號公路 (Amazon Route 53)", "D": "AWS 秘密管理器 (AWS Secrets Manager)"}, "correct_answer": "B", "explanation": "VPC 會成長到數百個,又要接 Direct Connect,若每個 VPC 各自拉線會很難管理。AWS Transit Gateway 提供中央樞紐,所有 VPC 跟地端網路都接到這個樞紐,新增 VPC 只要接上樞紐即可,大幅簡化並可擴充套件連線架構,所以答案是 B。A 的 VPC 端點是私下存取特定服務用;C 的 Route 53 是 DNS;D 的 Secrets Manager 管密鑰,都跟串接多個 VPC 無關。"}, {"id": 71, "question": "一家公司想要評估其運營準備情況。它還希望在新產品推出之前識別並減輕任何運營風險。哪種AWS Support 計劃可以免費為此類活動提供指導和支援？", "options": {"A": "AWS 業務支援", "B": "AWS 基本支援", "C": "AWS 開發人員支援", "D": "AWS 企業支援"}, "correct_answer": "D", "explanation": "本題問的是『免費』提供上線前風險評估與準備指導的方案,關鍵是 AWS Infrastructure Event Management(IEM)。IEM 只有在 AWS 企業支援(Enterprise Support)才是無額外費用內含項目,業務支援(Business Support)客戶要用通常得額外付費,所以正確答案應該是 D,而非題目標示的 A。基本支援跟開發人員支援都只有文件、論壇或上班時間信件支援,沒有活動前的架構與風險評估指導。"}, {"id": 72, "question": "一家公司想要制定輪換資料庫使用者憑據的時間表。哪種AWS 服務能夠以最少的運營開銷支援這一要求？", "options": {"A": "AWS 系統經理 (AWS Systems Manager)", "B": "AWS 秘密管理器 (AWS Secrets Manager)", "C": "AWS 許可證管理器 (AWS License Manager)", "D": "AWS 託管服務 (AWS Managed Services)"}, "correct_answer": "B", "explanation": "公司要排程自動輪換資料庫使用者憑證,還要求營運負擔最低,這正是 AWS Secrets Manager 的設計目的:管理、取得資料庫憑證等機密資訊,並原生支援自動輪換,不用自己寫排程或輪換邏輯,所以答案是 B。A 的 Systems Manager 沒有專門的憑證輪換機制;C 的 License Manager 管軟體授權;D 的 AWS Managed Services 是代管維運服務,都不是為此設計。"}, {"id": 73, "question": "哪些AWS 服務或功能可用於在本地工作負載和AWS 雲工作負載之間建立私有連線？", "options": {"A": "亞馬遜53 號公路 (Amazon Route 53)", "B": "亞馬遜麥西 (Amazon Macie)", "C": "AWS 直連 (AWS Direct Connect)", "D": "AWS 私有連結 (AWS PrivateLink)"}, "correct_answer": "C", "explanation": "題目要的是『本地工作負載』跟『AWS 雲工作負載』間的私有連線,這正是 AWS Direct Connect 的標準定義:用專用實體線路把公司網路直接私下接到 AWS,不必經過公開網際網路,延遲跟品質也比一般 VPN 穩定,所以正確答案應該是 C。選項 D 的 AWS PrivateLink 主要讓 VPC 內部或跟特定 AWS 服務私下互通,情境是雲端資源之間,不是地端直接接進 AWS;A 的 Route 53 是 DNS,B 的 Amazon Macie 是資料安全防護服務,都跟建立私有連線無關。"}, {"id": 74, "question": "哪種AWS 服務用於為Amazon EBS 提供加密？", "options": {"A": "AWS 證書管理器 (AWS Certificate Manager)", "B": "AWS 系統經理 (AWS Systems Manager)", "C": "AWS 金鑰管理服務 (AWS KMS)", "D": "AWS配置 (AWS Config)"}, "correct_answer": "C", "explanation": "這題問 Amazon EBS 加密要靠哪個服務,答案是 AWS KMS(Key Management Service,金鑰管理服務,即選項 C)。EBS 加密背後就是呼叫 KMS 產生、管理加密金鑰,幫磁碟區與快照做靜態加密,所以答案是 C。A 的 Certificate Manager 管 SSL/TLS 憑證;B 的 Systems Manager 是維運自動化工具;D 的 AWS Config 是稽核資源設定變化的服務,都跟磁碟加密無關。"}, {"id": 75, "question": "一家公司希望透過Web 介面管理其AWS 雲資源。哪種AWS 服務可以滿足此要求？", "options": {"A": "AWS 管理控制檯 (AWS Management Console)", "B": "AWS CLI", "C": "AWS軟體開發工具包 (AWS SDK)", "D": "AWS雲9 (AWS Cloud9)"}, "correct_answer": "A", "explanation": "公司想透過『網頁介面』管理 AWS 資源,這正是 AWS Management Console 的功能:用瀏覽器登入,以圖形化介面管理幾乎所有服務,不用寫指令或程式,所以答案是 A。B 的 AWS CLI 要在終端機打指令;C 的 AWS SDK 是給開發者寫程式呼叫 API 用的函式庫;D 的 AWS Cloud9 是雲端程式碼編輯器,主要用來寫程式除錯,都不是管理雲資源的網頁介面。"}, {"id": 76, "question": "以下哪些是AWS 雲的優勢？（選擇兩個。）", "options": {"A": "用變動支出換成資本支出", "B": "高規模經濟 (Economies of Scale)", "C": "只需幾分鐘即可在全球推出", "D": "專注於管理硬體基礎設施", "E": "超額配置以確保容量"}, "correct_answer": "BC", "explanation": "AWS 雲優勢中，「高規模經濟」(B) 是因為 AWS 集合大量客戶用量，成本比單一公司自建機房低，再反映到價格上；「幾分鐘內就能在全球推出」(C) 則是雲端資源隨開即用，不必像實體機房花數月採購建置，這兩點是本題答案。A「用變動支出換成資本支出」方向寫反了——AWS 真正的優勢是反過來，用資本支出換成變動支出（不用先砸大錢買硬體、蓋機房，改成像水電費一樣用多少付多少），這題故意把方向倒過來考你有沒有看清楚，不能只看到關鍵字「資本支出」「變動支出」就直覺選；D「專注管理硬體基礎設施」講反了，雲端就是要讓公司不用自己管硬體；E「超額配置以確保容量」是傳統地端思維，雲端強調彈性調整、不必囤積產能，三者都不成立。"}, {"id": 77, "question": "架構能夠以最短的停機時間承受故障的能力體現了AWS 雲的哪些優勢？", "options": {"A": "敏捷", "B": "彈性", "C": "可擴充套件性 (Scalability)", "D": "高可用性 (High Availability)"}, "correct_answer": "D", "explanation": "題目描述『元件故障時仍能以最短停機時間繼續運作』,這是『高可用性 (High Availability)』(High Availability)的定義,通常靠跨可用區 (Availability Zone)部署、自動容錯移轉達成,所以正確答案應該是 D。選項 C 的『可擴充套件性 (Scalability)』(Scalability)講的是資源能隨負載成長而增加,跟耐不耐故障是兩回事;A 的『敏捷』是快速開發上線的能力;B 的『彈性』(Elasticity)是資源隨需求自動增減,同樣不等於耐故障能力。"}, {"id": 78, "question": "開發人員需要以可重複的方式維護開發環境基礎設施和生產環境基礎設施。開發人員應該使用哪種AWS 服務來滿足這些要求？", "options": {"A": "AWS地面站 (AWS Ground Station)", "B": "AWS 盾 (AWS Shield)", "C": "AWS IoT 裝置防禦者 (AWS IoT Device Defender)", "D": "AWS 雲形成 (AWS CloudFormation)"}, "correct_answer": "D", "explanation": "開發人員要用『可重複』的方式建立開發與正式環境基礎設施,這是 Infrastructure as Code(IaC)的典型需求,AWS CloudFormation 讓你用範本描述所有資源設定,不管建立幾次、在哪個帳戶或區域都一致,所以答案是 D。A 的 Ground Station 是衛星地面站服務;B 的 AWS Shield 是 DDoS 防護;C 的 IoT Device Defender 是物聯網裝置防護,三者都跟建立管理基礎設施無關。"}, {"id": 79, "question": "根據AWS 責任共擔模型，哪項任務是客戶的責任？", "options": {"A": "維護AWS 雲的安全。", "B": "配置防火牆和網路。", "C": "修補Amazon RDS 例項的作業系統。", "D": "實施物理和環境控制。"}, "correct_answer": "B", "explanation": "依 AWS 責任共擔模型,AWS 負責『雲端本身』的安全(security OF the cloud),如機房、硬體、網路基礎設施;客戶負責『雲端裡面』的安全(security IN the cloud),包含自己設定防火牆與網路架構,所以配置防火牆和網路(B)是客戶責任。A 維護雲的安全本身就是 AWS 的工作;D 物理環境控制也是 AWS 負責;C 修補 RDS 例項作業系統,因為 RDS 是代管服務,連底層 OS 修補都由 AWS 處理,不用客戶動手。"}, {"id": 80, "question": "哪種AWS 服務有助於為多區域和多可用區 (Availability Zone)架構提供具有快速故障轉移的高度可用的應用程式？", "options": {"A": "AWS 網路應用防火牆 (AWS WAF)", "B": "AWS 全球加速器 (AWS Global Accelerator)", "C": "AWS 盾 (AWS Shield)", "D": "AWS 直連 (AWS Direct Connect)"}, "correct_answer": "B", "explanation": "AWS Global Accelerator 設計就是幫應用程式在多區域、多可用區 (Availability Zone)間調度流量,一旦某端點出問題就快速把流量導到健康端點,達到高可用性 (High Availability)與快速容錯移轉,所以答案是 B。A 的 AWS WAF 是防護 Web 應用常見攻擊的防火牆;C 的 AWS Shield 是 DDoS 防護;D 的 Direct Connect 是地端到 AWS 的專用連線,三者都不是專門處理跨區域容錯移轉的服務。"}, {"id": 81, "question": "一家公司擁有一套電子商務應用程式。應用程式需要能夠相互傳送訊息。哪種AWS 服務滿足此要求？", "options": {"A": "AWS 自動擴充套件", "B": "彈性負載均衡 (Elastic Load Balancing)", "C": "Amazon 簡單佇列服務(Amazon SQS)", "D": "Amazon Kinesis 資料流"}, "correct_answer": "C", "explanation": "多個電商應用要互相傳訊息,又不需要即時同步溝通,這正是 Amazon SQS 訊息佇列的典型情境:一個應用把訊息丟進佇列,另一個再取出處理,兩邊可各自獨立運作、互不卡住,所以答案是 C。A 的 Auto Scaling 是自動調整資源數量;B 的 Elastic Load Balancing 是分散流量的負載平衡;D 的 Kinesis Data Streams 是處理大量即時串流資料,三者都不是設計來讓應用互傳訊息的。"}, {"id": 82, "question": "AWS 雲服務整合計費有哪些好處？（選擇兩個。）", "options": {"A": "批次折扣", "B": "最低限度的額外使用費", "C": "一張賬單多個賬戶", "D": "分期付款選項", "E": "建立自定義成本和使用預算"}, "correct_answer": "AC", "explanation": "AWS 整合計費兩個主要好處:『一張帳單管多個帳戶』(C),不管開幾個帳戶都匯總到一張帳單方便對帳;『批次折扣』(A),因為整合計費把各帳戶用量加總,更容易達到量大折扣門檻(如 S3、EC2 保留執行個體的折扣級距),所以答案是 AC。B 最低額外使用費不是整合計費效果;D AWS 沒有分期付款機制;E 自訂成本預算其實是 AWS Budgets 的功能,不是整合計費的好處。"}, {"id": 83, "question": "使用者想要在S3 控制檯中檢視具有ACL 和S3 儲存桶策略的所有Amazon S3 儲存桶。哪種AWS 服務或資源可以滿足此要求？", "options": {"A": "S3 多區域接入點 (S3 Multi-Region Access Points)", "B": "S3儲存鏡頭 (S3 Storage Lens)", "C": "AWS IAM 身份中心（AWS 單點登入 (AWS IAM Identity Center)）", "D": "S3 訪問分析器 (S3 Access Analyzer)"}, "correct_answer": "D", "explanation": "題目要的是能在 S3 控制檯一次檢視所有儲存桶 ACL 跟策略狀態,這正是 S3 主控台內建的 Access Analyzer for S3:逐一檢查每個桶的存取原則,直接在列表標示哪些桶因 ACL 或 policy 而可被公開存取,方便快速盤點風險,所以正確答案應該是 D。選項 A 的 S3 多區域接入點 (S3 Multi-Region Access Points)是建立跨區域統一存取端點,跟檢視權限無關;B 的 S3 Storage Lens 是組織層級儲存用量報表;C 的 IAM Identity Center 是身分與單一登入服務,都不是盤點 ACL 與桶策略的工具。"}, {"id": 84, "question": "使用者查詢有關AWS 的合規性相關資訊和報告的最佳資源是什麼？", "options": {"A": "AWS 神器 (AWS Artifact)", "B": "AWS 市場 (AWS Marketplace)", "C": "亞馬遜檢查員 (Amazon Inspector)", "D": "AWS 支援"}, "correct_answer": "A", "explanation": "使用者要查 AWS 合規性相關文件與報告,例如 SOC、ISO 稽核報告,AWS Artifact(選項 A,原文誤譯為『AWS 神器 (AWS Artifact)』)正是提供這些合規文件的自助入口網站,登入就能下載,所以答案是 A。B 的 AWS Marketplace 是購買第三方軟體的商店;C 的 Amazon Inspector 是自動化弱點掃描服務;D 的 AWS Support 是技術支援服務,三者都不是專門提供合規報告的資源。"}, {"id": 85, "question": "哪種AWS 服務使公司能夠部署靠近終端使用者的應用程式？", "options": {"A": "亞馬遜雲前 (Amazon CloudFront)", "B": "AWS 自動擴充套件", "C": "AWS 應用程式同步 (AWS AppSync)", "D": "亞馬遜53 號公路 (Amazon Route 53)"}, "correct_answer": "A", "explanation": "公司想把應用程式部署得『靠近終端使用者』,這是 Amazon CloudFront(選項 A,原文誤譯為『亞馬遜雲前 (Amazon CloudFront)』)的核心價值:透過全球分布的邊緣節點快取內容,使用者不用跨半個地球取資料,大幅降低延遲、加快載入,所以答案是 A。B 的 Auto Scaling 是調整資源數量;C 的 AppSync 是管理 GraphQL API;D 的 Route 53 是 DNS 服務,三者都不是專門就近部署內容的服務。"}, {"id": 86, "question": "哪些AWS 服務或功能透過AWS 全球網路基礎設施傳送流量來提高網路效能？", "options": {"A": "路由表", "B": "AWS 傳輸閘道器 (AWS Transit Gateway)", "C": "AWS 全球加速器 (AWS Global Accelerator)", "D": "亞馬遜專有網路 (Amazon VPC)"}, "correct_answer": "C", "explanation": "本題問哪個服務能『透過 AWS 全球網路骨幹傳送流量』提升效能,AWS Global Accelerator 讓使用者流量一進入就走 AWS 自家全球骨幹,而不繞公開網際網路,藉此降低延遲、提升穩定度,所以答案是 C。A 的路由表只是 VPC 內部封包規則,不牽涉全球骨幹;B 的 Transit Gateway 是串接多個 VPC 與地端網路的樞紐;D 的 Amazon VPC 只是虛擬私有雲環境本身,都不是專門加速全球流量的服務。"}, {"id": 87, "question": "哪種AWS 服務提供高度持久的物件儲存？", "options": {"A": "亞馬遜S3", "B": "亞馬遜彈性檔案系統(Amazon EFS)", "C": "亞馬遜彈性塊儲存（亞馬遜EBS）", "D": "亞馬遜FSx"}, "correct_answer": "A", "explanation": "AWS 裡以『高耐用性物件儲存』聞名的是 Amazon S3,官方耐用性達 99.999999999%(11 個 9),資料會自動在同區域多個可用區 (Availability Zone)備份,所以答案是 A。B 的 Amazon EFS 是給多台 EC2 共用掛載的檔案系統;C 的 Amazon EBS 是給單一 EC2 例項用的區塊儲存;D 的 Amazon FSx 是給 Windows 或高效能運算場景用的代管檔案系統,三者都不是以物件儲存與高耐用性為主打。"}, {"id": 88, "question": "當公司將其資料庫託管在Amazon EC2 例項上時，AWS 承擔哪些責任？", "options": {"A": "資料庫備份", "B": "資料庫軟體補丁", "C": "作業系統補丁", "D": "作業系統安裝"}, "correct_answer": "D", "explanation": "公司把資料庫架在 Amazon EC2 上,依責任共擔模型,EC2 屬於 IaaS,AWS 負責底層基礎設施跟提供可開機的 Amazon 系統映像(AMI),也就是『作業系統安裝』(D)這層——AWS 確保這些預裝好 OS 的 AMI 可用可靠。至於資料庫備份(A)、資料庫軟體修補(B)、作業系統後續修補(C),因為客戶自己管理 EC2 主機,這些都要客戶動手維護,所以答案是 D。"}, {"id": 89, "question": "以下哪些是遷移到AWS 雲的優勢？（選擇兩個。）", "options": {"A": "能夠將所有安全責任移交給AWS。", "B": "能夠使用現收現付模式。", "C": "完全控制物理基礎設施的能力。", "D": "不再需要猜測需要什麼容量。", "E": "不再擔心使用者訪問控制。"}, "correct_answer": "BD", "explanation": "遷移到 AWS 雲的好處,『隨用隨付模式』(B)讓公司不用一次砸大錢買硬體,改成用多少付多少;『不用再猜測容量』(D)則是資源可隨時彈性增減,不必提前預估未來尖峰容量,這兩點是本題答案。A『把所有安全責任交給 AWS』錯了,責任共擔下客戶仍要負責雲端裡面的安全;C『完全掌控實體基礎設施』是地端機房的特性;E『不用擔心使用者存取控制』也不對,IAM 管理仍是客戶的工作。"}, {"id": 90, "question": "哪項AWS 服務是混合雲端儲存服務，可以讓本地使用者訪問幾乎無限的雲端儲存？", "options": {"A": "AWS 資料同步 (AWS DataSync)", "B": "亞馬遜S3 冰川", "C": "AWS 儲存閘道器 (AWS Storage Gateway)", "D": "亞馬遜彈性塊儲存（亞馬遜EBS）"}, "correct_answer": "C", "explanation": "AWS Storage Gateway 是專為『混合雲儲存』設計的服務,讓地端伺服器透過標準協定(NFS、SMB、iSCSI)存取幾乎無上限的雲端儲存,同時在地端保留快取加速常用資料存取,所以答案是 C。A 的 AWS DataSync 是大量搬遷資料到雲端的工具,不是持續性混合儲存介面;B 的 S3 Glacier 是低成本長期封存儲存;D 的 Amazon EBS 是掛載給 EC2 的區塊儲存,都沒有地端到雲端的混合存取能力。"}, {"id": 91, "question": "一家公司計劃遷移到AWS，並希望為其AWS 使用案例建立成本估算。公司可以使用哪些AWS 服務或工具來滿足這些要求？", "options": {"A": "AWS 定價計算器 (AWS Pricing Calculator)", "B": "亞馬遜雲觀察 (Amazon CloudWatch)", "C": "AWS 成本管理器 (AWS Cost Explorer)", "D": "AWS 預算 (AWS Budgets)"}, "correct_answer": "A", "explanation": "公司要遷移 AWS 前想先估算成本,AWS Pricing Calculator 正是為此設計的工具,依預計使用的服務與規模模擬出預估月費年費,方便做預算規劃,所以答案是 A。B 的 Amazon CloudWatch 是監控服務,看系統運作狀態跟指標;C『AWS 成本管理器 (AWS Cost Explorer)』不是正式服務名稱;D 的 AWS Budgets 是對已在用的資源設定預算跟告警,是上線後的成本控管工具,不是遷移前的估算工具。"}, {"id": 92, "question": "開發人員應該使用哪種工具將AWS 服務功能直接整合到應用程式中？", "options": {"A": "AWS 軟體開發套件 (AWS SDK)", "B": "AWS 程式碼部署 (AWS CodeDeploy)", "C": "AWS Lambda", "D": "AWS 批處理"}, "correct_answer": "A", "explanation": "開發人員想把 AWS 服務功能『直接整合進應用程式碼裡』,AWS SDK 提供各種程式語言(Python、Java、Node.js)的函式庫,讓開發者直接在程式裡呼叫 AWS 服務,不用自己處理底層 API 細節,所以答案是 A。B 的 CodeDeploy 是自動部署程式碼的服務;C 的 AWS Lambda 是執行無伺服器程式碼的運算服務本身;D 的 AWS Batch 是執行批次運算工作的服務,三者都不是整合進應用程式碼的開發工具。"}, {"id": 93, "question": "以下哪項是AWS 架構完善框架 (AWS Well-Architected Framework)的推薦設計原則？", "options": {"A": "透過不頻繁地大規模更改基礎設施來減少停機時間。", "B": "投入時間手動配置基礎設施。", "C": "從運營失敗中學習改進。", "D": "使用整體應用程式設計來實現集中化。"}, "correct_answer": "C", "explanation": "AWS Well-Architected Framework 強調持續學習、從錯誤中改進的文化,例如用 game day 模擬故障、事後檢討優化架構,所以『從運營失敗中學習改進』(C)是正確設計原則。其餘選項都跟框架精神相反:A『不頻繁地大規模變更』框架其實鼓勵頻繁、小步、可逆的變更;B『投入時間手動配置』框架提倡自動化;D『用整體式設計來集中化』框架建議鬆散耦合 (Loose Coupling)、可獨立擴充套件的架構,而非單體式設計。"}, {"id": 94, "question": "使用AWS Identity and Access Management (IAM) 僅授予對執行任務所需資源的訪問許可權，這一概念稱為：", "options": {"A": "禁止進入。", "B": "根據需要訪問。", "C": "最小許可權訪問 (Least Privilege Access)。", "D": "令牌訪問。"}, "correct_answer": "C", "explanation": "題目問的觀念是『只給執行任務所需的最小權限』,這正是資安領域『最小許可權訪問 (Least Privilege Access)』(Least Privilege Access)的標準定義,也是 IAM 權限設計最核心的原則,目的是降低帳號被盜用或誤操作時的損害範圍,所以答案是 C。A『禁止進入』是預設值概念,不是這個原則的名稱;B『根據需要訪問』常用在資料揭露情境;D『令牌訪問』不是標準 IAM 概念,都不是題目描述的正確用詞。"}, {"id": 95, "question": "哪些AWS 服務或工具可用於設定防火牆來控制進出Amazon VPC 子網的流量？", "options": {"A": "保安組 (Security Group)", "B": "AWS 網路應用防火牆 (AWS WAF)", "C": "AWS 防火牆管理器 (AWS Firewall Manager)", "D": "網路訪問控制列表 (Network ACL)"}, "correct_answer": "D", "explanation": "題目問的是能設定防火牆、控管『VPC 子網路』進出流量的服務或工具,答案應該是網路訪問控制列表(Network ACL,選項 D):在子網路層級運作的無狀態防火牆規則,可針對整個子網路統一設定允許或拒絕流量,正好對應『子網路』流量控管。選項 A 的安全群組是掛在個別執行個體層級的防火牆;C 的 AWS Firewall Manager 本身不是防火牆,而是集中管理 WAF 規則、安全群組等既有設定的管理服務;B 的 AWS WAF 是 Web 應用層防護,都不是子網路層級的流量控管,所以正確答案是 D。"}, {"id": 96, "question": "一家公司希望運營資料倉儲來分析資料，而無需管理資料倉儲基礎設施。哪種AWS 服務可以滿足此要求？", "options": {"A": "亞馬遜極光 (Amazon Aurora)", "B": "Amazon Redshift 無伺服器", "C": "AWS Lambda", "D": "亞馬遜RDS"}, "correct_answer": "B", "explanation": "公司想跑資料倉儲做分析,但不想自己管理底層基礎設施(如叢集節點擴縮、維運),這正是 Amazon Redshift Serverless 的設計目的:自動依查詢負載調整運算資源,不用事先規劃或手動管理叢集,所以答案是 B。A 的 Amazon Aurora 跟 D 的 Amazon RDS 都是關聯式資料庫,設計用途是交易型應用(OLTP)而非資料倉儲分析(OLAP);C 的 AWS Lambda 是通用無伺服器運算服務,並非資料倉儲產品。"}, {"id": 97, "question": "AWS雲端計算如何幫助企業降低成本？（選擇兩個。）", "options": {"A": "AWS 在每個AWS 區域對服務收取相同的價格。", "B": "AWS 可以按需調整容量。", "C": "AWS 為閒置時間超過1 周的Amazon EC2 例項提供折扣。", "D": "AWS 不會對從AWS 雲傳送到網際網路的資料收費。", "E": "AWS 消除了構建和維護本地資料中心的許多成本。"}, "correct_answer": "BE", "explanation": "雲端運算幫企業省錢的兩個關鍵原因:『可隨需求調整容量』(B),不用為應付尖峰而長期閒置多餘設備;『省下自建維護機房成本』(E),包含硬體、電力、冷卻、場地跟人力等固定成本都打包進服務費,所以答案是 BE。A『每區域收費一樣』不成立,不同區域定價本來就有差異;C『閒置超過一週有折扣』不是 AWS 正式機制;D『不對流出網際網路資料收費』也不對,資料傳出本來就是常見計費項目。"}, {"id": 98, "question": "一家公司希望授予一個AWS 賬戶中的使用者訪問另一AWS 賬戶中的資源的許可權。使用者當前沒有訪問資源的許可權。哪種AWS 服務可以滿足此要求？", "options": {"A": "IAM集團 (IAM Group)", "B": "IAM 角色 (IAM Role)", "C": "IAM標籤 (IAM Tag)", "D": "IAM 訪問分析器 (IAM Access Analyzer)"}, "correct_answer": "B", "explanation": "要讓一個 AWS 帳戶的使用者存取『另一個』帳戶的資源,且原本完全沒有權限,標準做法是用 IAM 角色 (IAM Role):在目標帳戶建立角色,授權來源帳戶使用者可以『擔任』(assume)這個角色取得暫時性存取憑證,所以答案是 B。A 的 IAM 群組只能綁定同一帳戶內的使用者跟權限;C 的 IAM 標籤是分類篩選資源用的中繼資料;D 的 IAM Access Analyzer 是分析資源是否過度開放存取的稽核工具,都無法直接達成跨帳戶授權。"}, {"id": 99, "question": "使用AWS服務時AWS負責哪些任務？", "options": {"A": "IAM使用者許可權管理", "B": "建立出站訪問的安全組 (Security Group)規則", "C": "物理和環境控制的維護", "D": "Amazon EC2作業系統補丁的應用"}, "correct_answer": "C", "explanation": "依 AWS 責任共擔模型,AWS 負責的是『雲端本身』的安全,包含資料中心實體門禁、電力、消防、環境控制,這些客戶完全看不到也管不到,所以『物理和環境控制的維護』(C)才是 AWS 的責任,正確答案應該是 C。選項 A 的『IAM 使用者權限管理』、B 的『建立出站安全群組規則』,以及 D 的『EC2 作業系統補丁』,這三項都屬於『雲端裡面』的安全,是客戶自己要設定維護的範圍,不是 AWS 的責任。"}, {"id": 100, "question": "一家公司希望透過使用基礎設施即程式碼(IaC) 來自動化基礎設施部署。該公司希望擴充套件生產堆疊，以便堆疊可以部署在多個AWS區域中。哪種AWS 服務可以滿足這些要求？", "options": {"A": "亞馬遜雲觀察 (Amazon CloudWatch)", "B": "AWS配置 (AWS Config)", "C": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "D": "AWS 雲形成 (AWS CloudFormation)"}, "correct_answer": "D", "explanation": "公司想用 IaC 自動化部署,還要把正式環境堆疊擴充套件到『多個 AWS 區域』,AWS CloudFormation 支援用同一份範本跨多個帳戶跟區域建立、更新、刪除一致的資源堆疊,所以答案是 D。A 的 Amazon CloudWatch 是監控服務;B 的 AWS Config 是記錄設定變化與合規稽核的服務;C 的 AWS Trusted Advisor 是提供成本、安全、效能最佳實務建議的顧問工具,三者都不是做基礎設施部署自動化的服務。"}, {"id": 101, "question": "哪個選項是AWS 雲採用框架(AWS CAF) 平臺視角功能？", "options": {"A": "資料架構", "B": "資料保護", "C": "資料治理 (Governance)", "D": "資料科學"}, "correct_answer": "A", "explanation": "AWS 雲採用框架(AWS CAF)把能力拆成商業面(業務、人員、治理 (Governance))跟技術面(平台、安全、維運)六大視角。『資料架構』(Data Architecture)屬於『平台視角』(Platform Perspective)底下的能力,負責規劃資料在雲端的結構與整合方式,所以正確答案應該是 A。選項 C 的『資料治理 (Governance)』其實歸類在『治理 (Governance)視角』(Governance Perspective);B 的『資料保護』屬於『安全視角』;D 的『資料科學』不是 AWS CAF 正式定義的能力項目,都不符合題目問的『平台視角』。"}, {"id": 102, "question": "一家公司正在AWS 雲中執行工作負載。哪種AWS 最佳實踐可確保為工作負載提供最具成本效益的架構？", "options": {"A": "松耦合 (Loose Coupling)", "B": "規模調整 (Right Sizing)", "C": "快取", "D": "冗餘"}, "correct_answer": "B", "explanation": "要讓 AWS 上的工作負載維持『最具成本效益』的架構,AWS 推薦的最佳實務是『規模調整 (Right Sizing)』(Right Sizing):持續檢視實際效能與用量需求,把執行個體類型跟大小調整到剛好符合需求,不多花錢買用不到的算力,所以答案是 B。A 的『鬆耦合』主要提升彈性與可靠度,不是直接針對成本;C 的『快取』是提升效能、降低重複運算負擔;D 的『冗餘』是為提高容錯與可用性,通常反而會增加成本,都不是專門針對成本效益設計的最佳實務。"}, {"id": 103, "question": "一家公司正在使用第三方服務將10 TB 的資料備份到磁帶庫。本地備份伺服器空間不足。該公司希望在不改變現有備份工作流程的情況下使用AWS 服務進行備份。公司應該使用哪種AWS 服務來滿足這些要求？", "options": {"A": "亞馬遜彈性塊儲存（亞馬遜EBS）", "B": "AWS 儲存閘道器 (AWS Storage Gateway)", "C": "亞馬遜彈性容器服務（Amazon ECS）", "D": "AWS Lambda"}, "correct_answer": "B", "explanation": "這題的重點是「不改變現有備份流程」還要解決「本地空間不足」。AWS 儲存閘道器 (AWS Storage Gateway)的磁帶閘道(Tape Gateway)能模擬出虛擬磁帶庫,讓原本的備份軟體以為還在寫磁帶,實際上資料存進 Amazon S3 與 S3 Glacier,完全不用改動既有工作流程。Amazon EBS 是 EC2 用的區塊儲存;Amazon ECS 是容器服務;AWS Lambda 是無伺服器運算,三者都跟磁帶備份無關,不適用。"}, {"id": 104, "question": "哪種AWS 工具使使用者能夠規劃其服務使用情況、服務成本和例項預留，並允許他們在成本或使用量超過既定閾值時設定自定義警報？", "options": {"A": "成本管理器 (AWS Cost Explorer)", "B": "AWS 預算 (AWS Budgets)", "C": "AWS 成本和使用情況報告", "D": "預留例項 (Reserved Instance)報告"}, "correct_answer": "B", "explanation": "能規劃用量、成本、例項預留,又能在超過門檻時發自訂警報的工具,對應到的是 AWS Budgets(AWS 預算 (AWS Budgets))——它可以針對成本、用量、RI/Savings Plans 使用率設定預算,超標就觸發通知,完全符合題目描述。題目標記的正解「成本管理器 (AWS Cost Explorer)」並非實際存在的 AWS 服務名稱,較可能是資料誤植,判斷正解應為 AWS 預算 (AWS Budgets)。成本和使用情況報告只產出用量資料供分析,不會主動發警報;預留例項 (Reserved Instance)報告單純顯示 RI 使用狀況,同樣沒有警報功能。"}, {"id": 105, "question": "根據AWS 責任共擔模型，哪些任務是客戶的責任？（選擇兩個。）", "options": {"A": "建立全球基礎設施。", "B": "執行客戶端資料加密。", "C": "配置IAM 憑證。", "D": "保護邊緣位置 (Edge Location)。", "E": "修補Amazon RDS 資料庫例項。"}, "correct_answer": "BC", "explanation": "責任共擔模型的核心是:AWS 負責「雲的安全」(基礎設施、硬體、全球網路),客戶負責「雲中的安全」(資料、身分權限、應用層設定)。選項 B 客戶端資料加密和 C 配置 IAM 憑證都是客戶自己要動手做的事,所以正確。建立全球基礎設施、保護邊緣位置 (Edge Location)都是 AWS 的責任;修補 Amazon RDS 例項則是受管服務裡 AWS 會處理的維運工作,客戶只要管好資料和存取權限,三者都不是客戶責任。"}, {"id": 106, "question": "一位開發人員已被一家大公司聘用，並且需要AWS 憑證。應遵循哪些安全最佳實踐？（選擇兩個。）", "options": {"A": "僅授予開發人員訪問執行作業所需的AWS 資源的許可權。", "B": "與開發人員共享AWS 賬戶根使用者憑證。", "C": "將開發人員新增到AWS IAM 中的管理員組。", "D": "配置密碼策略，確保開發者的密碼無法更改。", "E": "確保帳戶密碼策略要求最小長度。"}, "correct_answer": "AE", "explanation": "帳號安全最佳實踐圍繞「最小權限」與「強密碼政策」兩大原則。選項 A 只給開發人員完成工作所需的最小權限,避免過度授權;選項 E 要求密碼有最小長度,是基本密碼強度控管,兩者都是標準做法。共用 root 帳號憑證(B)是大忌;直接丟進 Admin 群組(C)違反最小權限;鎖死密碼不能更改(D)反而讓憑證外洩後無法換密碼,降低安全性,三者都不該做。"}, {"id": 107, "question": "一家公司擁有多個AWS 賬戶，其中包含無法中斷的計算工作負載。該公司希望根據公司對AWS 服務的使用情況獲得賬單折扣。哪些AWS 功能或購買選項可以滿足這些要求？", "options": {"A": "資源標記", "B": "合併計費 (Consolidated Billing)", "C": "按量付費定價", "D": "現貨例項 (Spot Instance)"}, "correct_answer": "B", "explanation": "題目情境是多個 AWS 帳號、有不可中斷的運算負載,想根據整體用量拿到帳單折扣,這其實是合併計費(Consolidated Billing)的典型情境:把多個帳號用量彙總,更快達到用量折扣門檻,也能共享 Savings Plans 和 RI 折扣。題目標記的正解「按量付費定價」本身只是標準計費方式,不會產生任何折扣,邏輯上答不出「怎麼拿到折扣」,判斷資料標記有誤,正解應為合併計費 (Consolidated Billing)。資源標記只用於成本歸類,現貨例項 (Spot Instance)是另一種購買選項,都跟「多帳號彙總拿折扣」無關。"}, {"id": 108, "question": "使用者希望允許在Amazon EC2 例項上執行的應用程式呼叫其他AWS 服務。授予的訪問許可權必須是安全的。應使用哪種AWS 服務或功能？", "options": {"A": "安全組 (Security Group)", "B": "AWS 防火牆管理器 (AWS Firewall Manager)", "C": "IAM 角色 (IAM Role)", "D": "IAM 使用者SSH 金鑰"}, "correct_answer": "C", "explanation": "EC2 例項上的應用程式要安全呼叫其他 AWS 服務,標準做法是幫例項掛上 IAM 角色(IAM Role),讓應用程式透過角色取得暫時憑證呼叫 API,不用在程式碼裡寫死長期金鑰,是 AWS 最推薦的安全模式。題目標記的正解「安全組 (Security Group)」其實是控制網路流量進出的防火牆規則,管的是連線層級存取,跟「授權應用程式呼叫 AWS API」是兩回事,判斷資料標記有誤,正確答案應為 IAM 角色 (IAM Role)。防火牆管理器管多帳號防火牆規則,SSH 金鑰是登入例項用的,同樣答非所問。"}, {"id": 109, "question": "一家公司想要為其基於Windows 的應用程式提供完全託管的Windows 檔案伺服器。哪種AWS 服務可以滿足此要求？", "options": {"A": "亞馬遜FSx", "B": "Amazon Elastic Kubernetes 服務(Amazon EKS)", "C": "亞馬遜彈性容器服務（Amazon ECS）", "D": "亞馬遜電子病歷 (Amazon EMR)"}, "correct_answer": "A", "explanation": "題目要的是「完全託管」又要相容 Windows 應用程式的檔案伺服器,這正是 Amazon FSx for Windows File Server 的定位——原生支援 SMB 協定、Active Directory 整合,專為 Windows 工作負載設計。Amazon EKS 和 Amazon ECS 都是容器編排服務,跟檔案伺服器無關;Amazon EMR(選項誤植成「電子病歷」)是大數據分析平台,同樣不是檔案儲存服務,都不符合需求。"}, {"id": 110, "question": "一家公司希望將其NFS 本地工作負載遷移到AWS。公司應使用哪種AWS Storage Gateway 型別來滿足此要求？", "options": {"A": "磁帶閘道器 (Tape Gateway)", "B": "卷閘道器 (Volume Gateway)", "C": "Amazon FSx 檔案閘道器 (Amazon FSx File Gateway)", "D": "Amazon S3 檔案閘道器 (Amazon S3 File Gateway)"}, "correct_answer": "D", "explanation": "本地端用 NFS 協定的檔案型工作負載搬上雲端,對應的是 Amazon S3 File Gateway——應用程式繼續用 NFS(或 SMB)這類標準檔案協定讀寫,底層實際上把資料存進 Amazon S3,遷移完全不用改應用邏輯。磁帶閘道是給備份軟體用虛擬磁帶庫的;卷閘道提供的是區塊儲存卷(iSCSI),不是檔案協定;FSx 檔案閘道對接的是 FSx for Windows File Server,走 SMB 而非 NFS,都不是最貼合的選擇。"}, {"id": 111, "question": "公司需要跟蹤其AWS 賬戶中的活動，並且需要了解何時對其AWS 資源進行API 呼叫。哪些AWS 工具或服務可用於滿足這些要求？", "options": {"A": "亞馬遜雲觀察 (Amazon CloudWatch)", "B": "亞馬遜檢查員 (Amazon Inspector)", "C": "AWS 雲跟蹤 (AWS CloudTrail)", "D": "AWS IAM"}, "correct_answer": "C", "explanation": "要追蹤帳號活動、知道什麼時候有人對 AWS 資源打了 API 呼叫,這是 AWS CloudTrail 的核心功能——記錄帳號內幾乎所有 API 呼叫的稽核軌跡(誰、什麼時候、做了什麼),常用在安全稽核和問題追查。Amazon CloudWatch 負責監控指標和日誌收集,不是專門記錄 API 呼叫;Amazon Inspector 是漏洞掃描服務;IAM 是身分與權限管理工具本身,不會記錄呼叫歷史,三者都不符合需求。"}, {"id": 112, "question": "一家公司有一個在Amazon EC2 例項上執行的不間斷應用程式。該應用程式不斷處理Amazon Simple Queue Service (AmazonSQS) 佇列中積壓的檔案。預計這種使用量將持續增長數年。滿足這些要求的最具成本效益的EC2 例項購買模式是什麼？", "options": {"A": "現貨例項 (Spot Instance)", "B": "按需例項 (On-Demand Instance)", "C": "儲蓄計劃 (Savings Plans)", "D": "專用主機 (Dedicated Host)"}, "correct_answer": "A", "explanation": "這題的關鍵是應用程式在處理 Amazon SQS 佇列裡的檔案——SQS 搭配 worker 的架構天生具容錯性,就算某台 EC2 例項被中斷,沒處理完的訊息會留在佇列裡等下一台例項接手,資料不會遺失。這種「可容忍中斷」的架構正是現貨例項 (Spot Instance)的最佳應用場景,能拿到最多折扣。按需例項 (On-Demand Instance)雖穩定但成本較高;儲蓄計劃 (Savings Plans)要綁長期承諾,用量還在成長、規模不確定時風險較高;專用主機 (Dedicated Host)是為合規或授權需求而生,成本最貴,都不是最具成本效益的選項。"}, {"id": 113, "question": "一家公司希望AWS 服務能夠根據其客戶資料提供產品推薦。哪種AWS 服務可以滿足此要求？", "options": {"A": "亞馬遜波莉 (Amazon Polly)", "B": "亞馬遜個性化 (Amazon Personalize)", "C": "亞馬遜理解 (Amazon Comprehend)", "D": "亞馬遜重新識別 (Amazon Rekognition)"}, "correct_answer": "B", "explanation": "根據客戶資料提供個人化產品推薦,對應的是 Amazon Personalize——AWS 的機器學習服務,專門用來做即時個人化推薦(像電商網站的「你可能也喜歡」)。Amazon Polly 是文字轉語音服務;Amazon Comprehend(選項誤植成「理解」)是自然語言處理服務,用來分析文字情緒或萃取關鍵資訊;Amazon Rekognition(誤植成「重新識別」)是影像辨識服務,三者用途都對不上「產品推薦」。"}, {"id": 114, "question": "一家公司正在計劃遷移到AWS 雲。該公司正在使用AWS 雲採用框架(AWS CAF) 視角來確定其能力差距。雲轉型之旅的哪個階段包括這些識別活動？", "options": {"A": "預見 (Envision)", "B": "對齊 (Align)", "C": "規模", "D": "發射 (Launch)"}, "correct_answer": "B", "explanation": "AWS CAF 把雲轉型旅程分成 Envision(預見 (Envision))、Align(對齊 (Align))、Launch(啟動)、Scale(規模)四個階段。「識別六大視角之間的能力差距」正是 Align 階段的重點,要盤點組織現況、找出跨部門依賴關係,為後續規劃打底。Envision 階段偏重定義商業成果與優先專案;Launch 階段是把試點專案正式落地;Scale 階段是把成功經驗擴大規模,三者重點都不是「找差距」,答案是對齊 (Align)。"}, {"id": 115, "question": "一家社交媒體公司希望保護其Web 應用程式免受SQL 注入和跨站點指令碼等常見Web 攻擊。哪種AWS 服務可以滿足這些要求？", "options": {"A": "亞馬遜檢查員 (Amazon Inspector)", "B": "AWS 網路應用防火牆 (AWS WAF)", "C": "亞馬遜GuardDuty", "D": "亞馬遜雲觀察 (Amazon CloudWatch)"}, "correct_answer": "B", "explanation": "要防禦 SQL 注入、跨站指令碼(XSS)這類常見 Web 層攻擊,標準解法是 AWS WAF(Web Application Firewall)——可掛在 CloudFront、ALB 前面,用規則過濾惡意 HTTP 請求,直接針對應用層攻擊設計。Amazon Inspector 做的是主機和容器層級漏洞掃描,不是即時攔截 Web 請求;Amazon GuardDuty 是威脅偵測服務,偏重偵測異常行為;CloudWatch 是監控與日誌服務,三者都不具攔截 Web 攻擊的能力。"}, {"id": 116, "question": "哪項完全託管的AWS 服務可協助建立、測試和管理自定義Amazon EC2 映像？", "options": {"A": "EC2 映像生成器 (EC2 Image Builder)", "B": "亞馬遜機器映像(AMI)", "C": "AWS 啟動向導 (AWS Launch Wizard)", "D": "AWS 彈性豆莖 (AWS Elastic Beanstalk)"}, "correct_answer": "A", "explanation": "要「完全託管」地建立、測試、管理自訂 EC2 映像,對應的是 EC2 Image Builder——能自動化整條映像製作流程(安裝軟體、套用設定、測試、發布),省去手動維護 AMI 的麻煩。Amazon Machine Image(AMI)本身只是映像檔案的格式概念,不是一個服務;AWS Launch Wizard 是用來快速部署應用架構的;AWS Elastic Beanstalk 是應用程式部署平台,三者都不是專門做映像建置管理的服務。"}, {"id": 117, "question": "一家公司希望有一個自動化流程來持續掃描其Amazon EC2 例項是否存在軟體漏洞。哪種AWS 服務可以滿足這些要求？", "options": {"A": "亞馬遜GuardDuty", "B": "亞馬遜檢查員 (Amazon Inspector)", "C": "亞馬遜偵探 (Amazon Detective)"}, "correct_answer": "B", "explanation": "要「持續」自動掃描 EC2 例項有沒有軟體漏洞,答案是 Amazon Inspector——自動、持續評估 EC2 例項(以及容器映像、Lambda 函式)的已知漏洞(CVE)和網路可達性問題,產生風險評分報告。Amazon GuardDuty 偵測的是帳號和網路層的異常行為,不是掃漏洞;Amazon Detective 是用來做資安事件的根因調查與視覺化分析,通常在 GuardDuty 發現問題後才用上,兩者都不是「持續漏洞掃描」工具。"}, {"id": 118, "question": "公司需要每週執行一次資料處理，通常需要大約5 個小時才能完成。公司應使用哪種AWS 服務來處理此工作負載？", "options": {"A": "AWS Lambda", "B": "亞馬遜EC2", "C": "AWS 程式碼部署 (AWS CodeDeploy)", "D": "AWS波長"}, "correct_answer": "B", "explanation": "每週跑一次、大約要跑 5 小時的資料處理工作,答案是 Amazon EC2。關鍵限制是 AWS Lambda 單次執行時間上限只有 15 分鐘,5 小時的工作根本跑不完,先被排除;EC2 沒有執行時間限制,很適合這種長時間批次處理,跑完可以直接關機省錢。AWS CodeDeploy 是程式碼部署工具,不是拿來跑運算工作;AWS Wavelength 是把運算資源部署到電信商邊緣網路給低延遲場景用的,都跟批次處理需求無關。"}, {"id": 119, "question": "哪些AWS 服務或功能提供VPC 中網路介面上的入站和出站流量的日誌資訊？", "options": {"A": "亞馬遜CloudWatch 日誌", "B": "AWS 雲跟蹤 (AWS CloudTrail)", "C": "VPC流日誌 (VPC Flow Logs)", "D": "AWS 身份和訪問管理(IAM)"}, "correct_answer": "C", "explanation": "要看 VPC 裡網路介面進出流量的日誌紀錄,答案是 VPC 流日誌(VPC Flow Logs)——可以在網路介面、子網路或整個 VPC 層級開啟,記錄每筆 IP 流量的來源、目的、埠號、是否放行,常用來查網路連線問題或抓異常流量。Amazon CloudWatch Logs 只是流日誌資料存放的其中一個目的地,本身不產生流量紀錄;AWS CloudTrail 記錄的是 API 呼叫不是網路封包;IAM 是身分權限管理,三者都答非所問。"}, {"id": 120, "question": "一家公司想要設計一個集中式儲存系統來管理其關鍵業務應用程式的配置資料和密碼。哪種AWS 服務或功能能夠最經濟高效地滿足這些要求？", "options": {"A": "AWS Systems Manager 引數儲存 (AWS Systems Manager Parameter Store)", "B": "AWS 秘密管理器 (AWS Secrets Manager)", "C": "AWS配置 (AWS Config)", "D": "亞馬遜S3"}, "correct_answer": "A", "explanation": "這題的重點字是「經濟高效」加上「配置資料」。AWS Systems Manager Parameter Store 可集中存放配置資料和密碼(支援加密的 SecureString 類型),標準參數免費使用,對這種以配置資料為主的集中管理需求最划算。AWS Secrets Manager 功能更完整(如自動輪替密碼),但按每組密鑰計費,成本較高,更適合對輪替有硬性需求的機密;AWS Config 是資源設定稽核工具;Amazon S3 沒有針對機密管理做加密和存取控管的專門設計,都不是最合適選擇。"}, {"id": 121, "question": "一家公司計劃在AWS 上部署容器。該公司希望完全控制託管容器的計算資源。哪種AWS 服務可以滿足這些要求？", "options": {"A": "Amazon Elastic Kubernetes 服務(Amazon EKS)", "B": "AWS 法門 (AWS Fargate)", "C": "亞馬遜EC2", "D": "亞馬遜彈性容器服務（Amazon ECS）"}, "correct_answer": "C", "explanation": "題目要的是「完全控制託管容器的運算資源」,對應的是 Amazon EC2——自己管理底層 EC2 例項來跑容器時,可以完全掌控作業系統、規格、修補時機等所有細節。AWS Fargate 是無伺服器容器運算,底層機器由 AWS 全權代管,使用者碰不到也管不了;Amazon EKS 和 Amazon ECS 本身是容器編排服務,控制的是容器怎麼排程,不等於掌控運算資源本身,都不符合「完全控制運算資源」這個核心要求。"}, {"id": 122, "question": "哪些AWS 服務或功能允許使用者建立新的AWS 賬戶、對多個賬戶進行分組以組織工作流程以及將策略應用於賬戶組？", "options": {"A": "AWS 身份和訪問管理(IAM)", "B": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "C": "AWS 雲形成 (AWS CloudFormation)", "D": "AWS 組織 (AWS Organizations)"}, "correct_answer": "D", "explanation": "要新建多個 AWS 帳號、把帳號分組管理、並對整組帳號套用治理 (Governance)政策,對應的是 AWS Organizations——用 OU(組織單位)把帳號分組,再套用 SCP(服務控制政策)統一管理權限邊界,是多帳號治理 (Governance)的標準工具。IAM 只能管單一帳號內的身分和權限,無法跨帳號分組;AWS Trusted Advisor 提供的是最佳實踐建議;AWS CloudFormation 是基礎設施即程式碼工具,三者都不具備「建帳號、分組、套政策」這整套能力。"}, {"id": 123, "question": "一家公司希望使用行業標準檔案系統協議在Amazon S3 中為其現有本地應用程式儲存和檢索檔案。哪種AWS 服務可以滿足這些要求？", "options": {"A": "AWS 資料同步 (AWS DataSync)", "B": "AWS Snowball 邊緣 (AWS Snowball Edge)", "C": "Amazon S3 檔案閘道器 (Amazon S3 File Gateway)", "D": "AWS 傳輸系列 (AWS Transfer Family)"}, "correct_answer": "C", "explanation": "本地應用程式要用業界標準的檔案系統協定(像 NFS、SMB)去 Amazon S3 存取檔案,答案是 Amazon S3 File Gateway——應用程式端維持原本熟悉的檔案存取方式,底層悄悄把資料寫進 S3,很適合不想改應用邏輯、只想換儲存底層的情境。AWS DataSync 是大量資料排程搬移工具,不是即時檔案介面;AWS Snowball Edge 是實體搬遷裝置;AWS Transfer Family 提供的是 SFTP/FTPS 傳輸協定,不是通用檔案系統掛載,都不是這題要的即時檔案存取。"}, {"id": 124, "question": "一家公司想要阻止SQL 注入攻擊。公司應使用哪種AWS 服務或功能來滿足此要求？", "options": {"A": "AWS 網路應用防火牆 (AWS WAF)", "B": "網路ACL", "C": "安全組 (Security Group)", "D": "AWS 證書管理器(ACM)"}, "correct_answer": "A", "explanation": "要防堵 SQL 注入攻擊,答案是 AWS WAF——可針對 HTTP 請求內容設規則(如偵測 SQL 語法特徵),在請求打到後端應用程式前先攔下來,是專門對付這類應用層攻擊的工具。網路 ACL 和安全組 (Security Group)都只能根據 IP、埠號做網路層流量過濾,看不懂請求內容裡藏的惡意語法;AWS Certificate Manager 是管理 SSL/TLS 憑證的,跟攔截攻擊無關,三者都無法真正防禦 SQL 注入。"}, {"id": 125, "question": "一家公司希望有一個統一的工具來提供與AWS 服務互動的一致方法。哪種AWS 服務或工具可以滿足此要求？", "options": {"A": "AWS CLI", "B": "亞馬遜彈性容器服務（Amazon ECS）", "C": "AWS雲9 (AWS Cloud9)", "D": "AWS 虛擬專用網路(AWS VPN)"}, "correct_answer": "A", "explanation": "想要一套統一、一致的方式跟所有 AWS 服務互動,答案是 AWS CLI(命令列介面)——用同一套指令語法就能操作幾乎所有 AWS 服務,不用切換不同操作介面,很適合自動化腳本和跨服務操作。Amazon ECS 是容器服務本身,不是互動工具;AWS Cloud9 是雲端整合開發環境,雖然內建 CLI,但本身定位是開發環境;AWS VPN 是網路連線服務,三者都答非所問。"}, {"id": 126, "question": "公司需要評估其AWS 環境並提供五個類別的最佳實踐建議：成本、效能、服務限制、容錯和安全性。公司可以使用哪種AWS 服務來滿足這些要求？", "options": {"A": "AWS 盾 (AWS Shield)", "B": "AWS 網路應用防火牆 (AWS WAF)", "C": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "D": "AWS 服務目錄 (AWS Service Catalog)"}, "correct_answer": "C", "explanation": "能針對成本、效能、服務限制、容錯、安全性這五大類別提供最佳實踐建議的服務,答案是 AWS Trusted Advisor——自動檢查帳號的資源配置,對照這五個固定檢查類別給出具體建議(如找出閒置資源省錢、抓出安全設定漏洞)。AWS Shield 是 DDoS 防護服務;AWS WAF 是 Web 應用防火牆;AWS Service Catalog 是讓企業統一發布標準化 IT 服務目錄的工具,三者都沒有「五大類別最佳實踐建議」這個功能。"}, {"id": 127, "question": "AWS 雲採用框架(AWS CAF) 中的哪個視角包含配置管理和補丁管理功能？", "options": {"A": "平臺", "B": "運營", "C": "安全", "D": "治理 (Governance)"}, "correct_answer": "B", "explanation": "AWS CAF 有六大視角:商業、人員、治理 (Governance)、平台、安全、維運。配置管理(Configuration Management)和修補程式管理(Patch Management)明確被列在維運視角(Operations Perspective)底下,因為這些都是系統上線後日常維運要做的事。平台視角關注架構設計與技術選型;治理 (Governance)視角管政策、風險與合規框架;安全視角處理身分、偵測、資料保護等控制,三者範疇都不涵蓋日常配置與修補作業,答案是維運視角。"}, {"id": 128, "question": "公司擁有穩定、可預測且不間斷的計算工作負載。哪些Amazon EC2 例項購買選項最經濟高效地滿足這些要求？（選擇兩個。）", "options": {"A": "按需例項 (On-Demand Instance)", "B": "預留例項 (Reserved Instance)", "C": "現貨例項 (Spot Instance)", "D": "儲蓄計劃 (Savings Plans)", "E": "專用主機 (Dedicated Host)"}, "correct_answer": "BD", "explanation": "「穩定、可預測、不間斷」是這題的關鍵字,代表用量幾乎固定、長期都會用到,最適合用長期承諾換折扣。預留例項 (Reserved Instance)和儲蓄計劃 (Savings Plans)都是用 1 年或 3 年使用承諾換取比按需例項 (On-Demand Instance)更低的價格,很適合這種穩定負載。按需例項 (On-Demand Instance)雖靈活但沒折扣,長期用下來最貴;現貨例項 (Spot Instance)價格低但隨時可能被中斷,不適合「不間斷」需求;專用主機 (Dedicated Host)主要為合規或既有授權需求而生,成本也最高,三者都不是最經濟的選擇。"}, {"id": 129, "question": "對於每年執行一次、持續24 小時的不間斷工作負載，哪種Amazon EC2 定價模型最具成本效益？", "options": {"A": "按需例項 (On-Demand Instance)", "B": "預留例項 (Reserved Instance)", "C": "現貨例項 (Spot Instance)", "D": "專用例項 (Dedicated Instance)"}, "correct_answer": "A", "explanation": "這題的關鍵字是「不間斷」加上「一年只跑一次」。因為工作負載不能被中斷,現貨例項 (Spot Instance)天生有被 AWS 隨時回收容量、中斷例項的風險,跟「不間斷」這個前提直接衝突,邏輯上不該選;預留例項 (Reserved Instance)需要至少 1 年使用承諾,拿來應付一年只用 24 小時的工作反而浪費。真正符合「不常態、不能中斷」情境的答案是按需例項 (On-Demand Instance)——不用長期綁約,用多久算多久,判斷資料標記的現貨例項 (Spot Instance)有誤,正解應為按需例項 (On-Demand Instance)。"}, {"id": 130, "question": "在AWS 責任共擔模型下，哪一個選項是AWS 與其客戶之間的共同責任？", "options": {"A": "Amazon EC2 例項作業系統的配置", "B": "應用檔案系統伺服器端加密", "C": "補丁管理", "D": "物理基礎設施的安全"}, "correct_answer": "C", "explanation": "責任共擔模型裡有一類叫「共同控制項」(Shared Controls),AWS 官方文件明確把修補程式管理(Patch Management)列為共同責任的例子——像 EC2 這類 IaaS,客戶要修補自己的作業系統,但底層虛擬化層、硬體由 AWS 負責修補,兩邊都有份。EC2 例項作業系統的配置和應用層加密都是純客戶端責任;物理基礎設施安全完全是 AWS 的責任,三者都不是雙方共同項目,只有修補程式管理橫跨兩邊。"}, {"id": 131, "question": "一家公司希望將其本地工作負載遷移到AWS 雲。該公司希望將費用分攤給不同部門的工作負載。哪些AWS 服務或功能可以滿足這些要求？（選擇兩個。）", "options": {"A": "歸置組 (Placement Group)", "B": "合併計費 (Consolidated Billing)", "C": "邊緣位置 (Edge Location)", "D": "AWS配置 (AWS Config)", "E": "多個AWS 賬戶"}, "correct_answer": "BE", "explanation": "想把費用依部門拆分歸屬,標準做法是「多個 AWS 帳號」搭配「合併計費 (Consolidated Billing)」——先讓每個部門用獨立帳號方便追蹤各自用量與花費,再透過合併計費 (Consolidated Billing)把所有帳號帳單彙整到同一張主帳單,同時保留各帳號用量明細可拆帳。放置群組是控制 EC2 例項實體擺放位置以優化網路效能的功能;邊緣位置 (Edge Location)是 CloudFront 的節點概念;AWS Config 是資源設定稽核工具,三者都跟費用分攤無關。"}, {"id": 132, "question": "根據AWS 責任共擔模型，哪項任務是AWS 的責任？", "options": {"A": "為Amazon S3 中儲存的物件啟用客戶端加密。", "B": "配置IAM 安全策略以遵守最小許可權原則。", "C": "修補Amazon EC2 例項上的來賓作業系統。", "D": "將更新應用到Nitro Hypervisor。"}, "correct_answer": "D", "explanation": "Nitro Hypervisor 是 AWS 用來支撐 EC2 虛擬化的底層基礎設施,屬於「雲的安全」範疇,不管客戶用什麼服務,這一層永遠由 AWS 負責維護與更新,客戶完全碰不到也不需要管。相對地,啟用 S3 物件的客戶端加密、設定 IAM 最小權限政策、修補 EC2 例項的作業系統,這三項都屬於「雲中的安全」,是客戶自己要動手做的事,答案是更新 Nitro Hypervisor。"}, {"id": 133, "question": "使用AWS 進行雲端計算有什麼好處？", "options": {"A": "將可變費用換成固定費用", "B": "按量付費定價", "C": "速度和敏捷性 (Agility)下降", "D": "花錢執行和維護資料中心"}, "correct_answer": "B", "explanation": "AWS 官方列出的雲端運算六大優勢裡,第一項就是「用可變費用取代固定費用」——不用再砸大錢預先買硬體、蓋機房(固定資本支出),改成用多少付多少(可變支出)。題目標記的正解選項寫的是「將可變費用換成固定費用」,方向剛好講反了,屬於資料誤植;四個選項裡唯一敘述正確、又對應這項優勢的是「按量付費定價」,正是可變費用精神的具體實踐,判斷正解應為按量付費定價。速度與敏捷性 (Agility)應是「提升」而非「下降」;雲端運算的價值正是讓公司「不用」花錢自建維護資料中心,C、D 方向都是錯的。"}, {"id": 134, "question": "哪個選項是AWS 雲採用框架(AWS CAF) 業務視角功能？", "options": {"A": "文化演變", "B": "事件管理", "C": "資料貨幣化 (Data Monetization)", "D": "平臺架構"}, "correct_answer": "C", "explanation": "AWS CAF 的商業視角(Business Perspective)聚焦在 IT 投資如何轉化成商業成果,資料貨幣化(Data Monetization,把資料轉換成商業價值的能力)正是列在商業視角底下的能力項目。題目標記的正解「文化演變」實際屬於人員視角(People Perspective);事件管理屬於維運視角;平台架構屬於平台視角,三者分別對應不同視角,判斷資料標記有誤,正確答案應為資料貨幣化 (Data Monetization)。準備考試時可把六大視角各自的招牌關鍵字對起來記,遇到配對題會快很多。"}, {"id": 135, "question": "一家公司正在評估其AWS 業務支援計劃，以確定該計劃是否仍然滿足公司的需求。該公司正在考慮轉向AWS EnterpriseSupport。公司將透過AWS Enterprise Support 獲得哪些額外好處？", "options": {"A": "全套AWS Trusted Advisor 檢查", "B": "每週7 天、每天24 小時透過電話、電子郵件和聊天方式聯絡雲支援工程師", "C": "指定的技術客戶經理(TAM) 協助監控和最佳化", "D": "針對公司應用程式的諮詢審查和架構指南"}, "correct_answer": "C", "explanation": "AWS Business Support 方案本來就已包含完整的 Trusted Advisor 檢查、以及一般性架構諮詢與操作指引,所以選項 A 和 D 描述的內容升級前就享有,不算「額外」拿到的好處。Enterprise Support 真正獨有的核心差異,是配有一位指定技術客戶經理(TAM),長期跟進協助監控用量、做架構優化,提供更貼身的服務,這是低階方案完全沒有的,答案是選項 C。24 小時全天候聯繫雲支援工程師則是 Business Support 就已有的服務等級,不算 Enterprise 專屬的新增好處。"}, {"id": 136, "question": "如果容量暫時不可用，哪種定價模型會中斷正在執行的Amazon EC2 例項？", "options": {"A": "按需例項 (On-Demand Instance)", "B": "標準預留例項 (Reserved Instance)", "C": "現貨例項 (Spot Instance)", "D": "可轉換預留例項 (Reserved Instance)"}, "correct_answer": "C", "explanation": "現貨例項(Spot Instance)的價格比按需例項 (On-Demand Instance)便宜很多,交換條件是 AWS 保留隨時回收這批容量的權利——當 AWS 需要把容量挪去滿足按需或預留例項 (Reserved Instance)需求時,現貨例項 (Spot Instance)會被中斷(通常提前約 2 分鐘通知),正對應題目說的「容量暫時不可用時例項被中斷」。按需例項 (On-Demand Instance)一旦啟動就會持續執行,不會因容量問題被強制中斷;標準預留例項 (Reserved Instance)和可轉換預留例項 (Reserved Instance)都是靠承諾使用時間換取折扣,同樣享有穩定執行保障,不會被這樣中斷,答案是現貨例項 (Spot Instance)。"}, {"id": 137, "question": "哪些選項是AWS 雲採用框架(AWS CAF) 安全視角功能？（選擇兩個。）", "options": {"A": "可觀察性", "B": "事件和問題管理", "C": "事件響應", "D": "基礎設施保護", "E": "可用性和連續性"}, "correct_answer": "CD", "explanation": "AWS CAF 安全視角（Security Perspective）的核心能力包含身分與存取管理、威脅偵測、漏洞管理、基礎設施保護、資料保護、應用程式安全、事件回應這幾大塊，所以答案是 C（事件回應）和 D（基礎設施保護）。至於可觀察性、事件和問題管理、可用性和連續性，這些其實屬於維運視角（Operations Perspective）在管的範圍，跟安全視角是不同軸線，很容易搞混但要分清楚。"}, {"id": 138, "question": "一家公司希望在Amazon EC2 例項上執行其工作負載超過1 年。該工作負載將持續執行。與按需例項 (On-Demand Instance)的每小時費率相比，哪個選項提供每小時費率折扣？", "options": {"A": "AWS Graviton 處理器", "B": "專用主機 (Dedicated Host)", "C": "EC2 例項節省計劃", "D": "Amazon EC2 Auto Scaling 例項"}, "correct_answer": "C", "explanation": "題目強調工作負載會「持續執行超過 1 年」，這種穩定、可預期的用量最適合用 EC2 Instance Savings Plans（例項節省計劃），只要承諾一定運算量就能拿到比隨選（On-Demand）划算的每小時折扣，答案是 C。Graviton 處理器只是省成本的處理器架構選擇，不是計費折扣機制；專用主機 (Dedicated Host)是給有合規或授權需求時用，價格通常更貴；Auto Scaling 只是自動調整數量的功能，跟折扣無關。"}, {"id": 139, "question": "AWS 雲的哪些特性可以幫助使用者消除未充分利用的CPU 容量？", "options": {"A": "敏捷", "B": "彈性", "C": "可靠性", "D": "耐"}, "correct_answer": "B", "explanation": "彈性（Elasticity）指的是資源可以隨著需求自動放大或縮小，用多少算多少，這正是解決「CPU 容量閒置浪費」問題的關鍵特性，答案是 B。敏捷講的是加快開發部署速度、可靠性講系統穩定不中斷、耐久性講資料長期保存不遺失，這三個都跟「消除未充分利用的容量」沒有直接關係，是常見的混淆選項。"}, {"id": 140, "question": "公司可以使用哪些AWS 服務來實現鬆散耦合 (Loose Coupling)的架構？（選擇兩個。）", "options": {"A": "亞馬遜工作空間 (Amazon WorkSpaces)", "B": "Amazon 簡單佇列服務(Amazon SQS)", "C": "亞馬遜連線 (Amazon Connect)", "D": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "E": "AWS 步驟函式 (AWS Step Functions)"}, "correct_answer": "BD", "explanation": "鬆散耦合 (Loose Coupling)架構的重點在於元件之間互相獨立、不會因為某一環出問題就整條線卡住，Amazon SQS（訊息佇列）可以讓元件用非同步方式溝通，AWS Step Functions 則能協調多個獨立服務組成工作流程，兩者都是實現鬆散耦合 (Loose Coupling)的典型工具，答案是 BD。WorkSpaces 是虛擬桌面、Amazon Connect 是客服中心服務、Trusted Advisor 是帳戶健檢建議工具，都跟架構耦合設計無關。"}, {"id": 141, "question": "如果超過自定義支出閾值，哪種AWS 雲服務可以向客戶傳送警報？", "options": {"A": "AWS 預算 (AWS Budgets)", "B": "AWS 成本管理器 (AWS Cost Explorer)", "C": "AWS 成本分配標籤", "D": "AWS 組織 (AWS Organizations)"}, "correct_answer": "A", "explanation": "AWS Budgets 讓使用者設定自訂的支出門檻，一旦實際或預估費用超過就會自動發送警報通知，答案是 A。選項裡的「AWS 成本管理器 (AWS Cost Explorer)」並非 AWS 實際存在的服務名稱，屬於混淆選項；成本分配標籤（Cost Allocation Tags）只是用來標記、分類費用來源方便追蹤，本身不會主動發警報；AWS Organizations 是管理多帳戶架構的服務，同樣沒有預算警報功能。"}, {"id": 142, "question": "一家公司計劃遷移到AWS 雲。該公司希望使用AWS 雲採用框架(AWS CAF) 來定義和跟蹤業務成果，作為其雲轉型之旅的一部分。哪種AWS CAF 治理 (Governance)視角功能可以滿足這些要求？", "options": {"A": "福利管理 (Benefits Realization Management)", "B": "風險管理", "C": "應用程式組合管理", "D": "雲財務管理"}, "correct_answer": "A", "explanation": "AWS CAF 治理 (Governance)視角（Governance Perspective）底下的「收益管理」（Benefits Realization Management），核心工作就是設定量化指標、追蹤雲端投資是否真的帶來預期的商業效益，跟題目「定義並追蹤業務成果」完全對應，答案是 A。風險管理著重辨識與降低轉型風險、應用程式組合管理著重盤點現有系統該遷移或汰換、雲財務管理著重成本控管與預算，三者方向都不是「追蹤業務成果」這件事本身。"}, {"id": 143, "question": "公司需要在客戶端和Amazon S3 儲存桶之間快速、安全地長距離移動檔案。哪個S3 功能可以滿足此要求？", "options": {"A": "S3 版本控制", "B": "S3傳輸加速 (S3 Transfer Acceleration)", "C": "S3ACL", "D": "S3智慧分層 (S3 Intelligent-Tiering)"}, "correct_answer": "B", "explanation": "S3 傳輸加速（S3 Transfer Acceleration）利用 CloudFront 的全球邊緣節點，把檔案先送到離使用者最近的節點再透過 AWS 骨幹網路傳到 S3，能大幅縮短長距離、跨國傳輸的時間，同時維持傳輸過程的安全性，完全符合題目需求，答案是 B。版本控制是管理物件歷史版本、ACL 是存取權限控制、智慧分層是自動依存取頻率搬移儲存層級省成本，三者都跟傳輸速度無關。"}, {"id": 144, "question": "一家公司需要在Amazon EC2 例項上持續執行實驗工作負載，並在12 小時後停止該例項。哪種例項購買選項能夠最經濟高效地滿足此要求？", "options": {"A": "按需例項 (On-Demand Instance)", "B": "預留例項 (Reserved Instance)", "C": "現貨例項 (Spot Instance)", "D": "專用例項 (Dedicated Instance)"}, "correct_answer": "A", "explanation": "題目重點是「實驗性工作負載」加上「只跑 12 小時就停」，用量短暫且無法預先承諾，這種情境最划算的就是隨選（On-Demand）例項，用多少付多少、隨時可以說停就停，答案是 A。預留例項 (Reserved Instance)需要 1 年或 3 年長期承諾不適合短期任務；現貨例項 (Spot Instance)雖然便宜但 AWS 隨時可能收回資源造成中斷，不符合「持續執行」的要求；專用例項 (Dedicated Instance)是為了合規或授權限制用的獨立硬體，價格更高也不是這裡的重點。"}, {"id": 145, "question": "AWS 雲採用框架(AWS CAF) 的雲轉型之旅的哪個階段側重於展示雲如何幫助加速實現業務成果？", "options": {"A": "規模", "B": "預見 (Envision)", "C": "對齊 (Align)", "D": "發射 (Launch)"}, "correct_answer": "B", "explanation": "AWS CAF 轉型旅程分成預見（Envision）、對齊（Align）、發射（Launch）、規模化（Scale）四個階段，其中預見 (Envision)階段的重點就是找出雲端能加速實現哪些具體業務成果，常會透過幾個快速見效的案例來證明價值、爭取內部支持，答案是 B。對齊 (Align)階段在盤點組織能力缺口、發射 (Launch)階段在執行試點專案、規模化階段則是把成功經驗擴大到整個組織，都是後面才發生的事。"}, {"id": 146, "question": "在AWS 責任共擔模型下，哪個選項是客戶責任？", "options": {"A": "Amazon EC2例項底層硬體維護", "B": "應用資料安全", "C": "資料中心的物理安全", "D": "VPC元件維護"}, "correct_answer": "B", "explanation": "在 AWS 責任共擔模型下，「雲端內的安全」（Security in the Cloud）由客戶負責，包含應用程式資料的加密、存取控制、備份等，答案是 B。EC2 底層硬體維護、資料中心實體安全、VPC 元件（如網路設備）維護，這些都屬於「雲端本身的安全」（Security of the Cloud），是 AWS 該負責的部分，客戶完全不需要也無法插手。"}, {"id": 147, "question": "一家公司希望其Amazon EC2 例項能夠在高度可用的環境中執行，即使特定地理區域發生自然災害也是如此。哪種方法可以實現這一目標？", "options": {"A": "在多個AWS 區域中使用EC2 例項。", "B": "在多個Amazon CloudFront 位置使用EC2 例項。", "C": "在多個邊緣位置 (Edge Location)使用EC2 例項。", "D": "在AWS 本地擴充套件區中使用EC2 例項。"}, "correct_answer": "A", "explanation": "單一 AWS 區域即使跨了多個可用區 (Availability Zone)，遇到區域級的天災（例如整個城市停電或淹水）還是可能全部受影響，所以要跨越「特定地理區域」的天災風險，必須把例項分散到多個不同的 AWS 區域，答案是 A。CloudFront 位置和邊緣位置 (Edge Location)是用來加速內容傳遞的節點，並不能直接執行 EC2 例項；本地擴充套件區（Local Zones）雖然能讓運算更靠近使用者，但通常還是依附在同一個地理區域，無法解決區域級災害的問題。"}, {"id": 148, "question": "一家公司希望對單體應用程式進行現代化改造並將其轉換為微服務。該公司希望將應用程式遷移到AWS。公司應該使用哪種遷移策略？", "options": {"A": "重新託管", "B": "平臺重構", "C": "回購", "D": "重構"}, "correct_answer": "D", "explanation": "單體應用要現代化改造成微服務，屬於「6R」遷移策略裡的重構（Refactor / Re-architect），意思是趁遷移的機會重新設計架構，充分利用雲端原生的彈性與服務，答案是 D。重新託管（Rehost）只是原封不動搬上雲、平臺重構（Replatform）是做局部調整但架構不變、回購（Repurchase）是換成 SaaS 現成方案，這三者都不涉及把架構拆解成微服務的深度改造。"}, {"id": 149, "question": "系統管理員為開發人員建立了一個新的IAM 使用者，併為該使用者分配了訪問金鑰 (Access Key)，而不是使用者名稱和密碼。什麼訪問金鑰 (Access Key)的用途是什麼？", "options": {"A": "以AWS 賬戶根使用者身份訪問AWS 賬戶", "B": "透過AWS 管理控制檯 (AWS Management Console)訪問AWS 賬戶", "C": "透過CLI 訪問AWS 賬戶", "D": "訪問公司的所有AWS 賬戶"}, "correct_answer": "C", "explanation": "存取金鑰（Access Key）是給程式化存取用的，搭配 AWS CLI 或 SDK 呼叫 API 時用來驗證身分，答案是 C。透過管理控制台登入要用的是使用者名稱加密碼，不是存取金鑰 (Access Key)；根使用者（Root User）有自己專屬的登入方式，一般 IAM 使用者的金鑰不能拿來冒充根使用者；存取金鑰 (Access Key)也是綁定在單一帳號底下，不能拿去存取公司其他 AWS 帳戶。"}, {"id": 150, "question": "哪一個選項是由一個或多個資料中心組成的環境？", "options": {"A": "亞馬遜雲前 (Amazon CloudFront)", "B": "可用區 (Availability Zone)", "C": "專有網路", "D": "AWS 前哨站 (AWS Outposts)"}, "correct_answer": "B", "explanation": "可用區（Availability Zone, AZ）的定義就是一個或多個實體資料中心組成的獨立設施，擁有自己的電力、冷卻、網路，答案是 B。CloudFront（題目寫成亞馬遜雲前 (Amazon CloudFront)）指的是全球邊緣節點的內容傳遞網路；VPC（題目寫成專有網路）是邏輯上的虛擬網路，不是實體設施；AWS Outposts（前哨站）則是把 AWS 基礎設施延伸到客戶自己機房的硬體方案，三者定義都跟「資料中心組成的環境」不同。"}, {"id": 151, "question": "一家公司正在將本地資料中心遷移到AWS 雲。該公司必須以儘可能少的運營開銷將50 PB 的檔案儲存資料遷移到AWS。公司應使用哪種AWS 服務或資源來滿足這些要求？", "options": {"A": "AWS 雪地車 (AWS Snowmobile)", "B": "AWS Snowball 邊緣 (AWS Snowball Edge)", "C": "AWS資料交換", "D": "AWS 資料庫遷移服務(AWS DMS)"}, "correct_answer": "A", "explanation": "50 PB 是極為龐大的資料量，AWS Snowmobile 是專門為這種艾位元組（Exabyte）等級的超大規模遷移設計的卡車型移動資料中心，一次就能裝載大量資料，運營上遠比拆成大量 Snowball Edge 裝置逐一寄送、拆封、匯入來得省事，答案是 A。Snowball Edge 單台容量只有幾十 TB，50 PB 需要動用非常多台，操作負擔明顯更高；Data Exchange 是資料集訂閱交易平台、DMS 是資料庫遷移服務，都不適合處理檔案儲存的大量搬遷。"}, {"id": 152, "question": "一家公司的應用程式具有嚴格的硬體要求。該應用程式必須由使用輕便、低成本膝上型電腦的學生訪問。哪種AWS 服務可以幫助公司部署應用程式，而無需投資後端基礎設施或高階客戶端硬體？", "options": {"A": "亞馬遜應用程式流2.0 (Amazon AppStream 2.0)", "B": "AWS 應用程式同步 (AWS AppSync)", "C": "亞馬遜工作連結 (Amazon WorkLink)", "D": "AWS 彈性豆莖 (AWS Elastic Beanstalk)"}, "correct_answer": "A", "explanation": "Amazon AppStream 2.0 能把應用程式運算全部放在雲端，使用者端只需要能跑串流畫面的基本裝置就能操作，完全不用在學生的筆電上安裝或跑重度運算，公司也不用另外建置後端主機，答案是 A。AppSync 是用來同步 API 資料的服務、WorkLink（題目寫成工作連結）是安全瀏覽企
