 180, "question": "哪種技術涉及在標記資料集上訓練AI 模型，以使模型適應特定的行業術語和要求？", "options": {"A": "資料擴充", "B": "微調", "C": "模型量化", "D": "連續預培訓"}, "correct_answer": "B", "explanation": "微調採用預先訓練的模型，並繼續在帶標籤的特定於領域的資料集上對其進行訓練，以便模型直接從該專業資料中學習行業術語和任務細微差別。"}, {"id": 181, "question": "一家公司正在使用Amazon Bedrock代理 (Agents for Amazon Bedrock)為其應用程式建立一個代理。代理表現不錯，但是公司想透過提供一些具體的例子來提高代理的準確率。哪種解決方案符合這些要求？", "options": {"A": "修改代理的高階提示以包括示例。", "B": "為代理建立一個包含示例的護欄。", "C": "使用亞馬遜SageMaker Ground Truth 來標記示例。", "D": "在AWS Lambda 中執行一個指令碼，將示例新增到訓練資料集中。"}, "correct_answer": "A", "explanation": "將特定的輸入-輸出示例直接嵌入到代理的高階提示(少量提示)中，可以引導模型走向更準確的行為，而無需重新培訓或額外的工具。"}, {"id": 182, "question": "在機器學習操作(MLOps)中使用基礎設施作為程式碼(IaC)的好處是什麼？", "options": {"A": "IaC 消除了超引數調諧的需要。", "B": "IaC 總是提供強大的計算例項，有助於訓練更精確的模型。", "C": "IaC 簡化了雲環境中可擴充套件且一致的ML 工作負載的部署。", "D": "IaC 透過只部署低成本的例項來最小化總開支。"}, "correct_answer": "C", "explanation": "透過用程式碼描述基礎設施，團隊可以對資源進行版本化、自動化和可重複供應，確保ML 訓練和推理環境在開發、測試和生產中是一致的、可擴充套件的和易於再現的。"}, {"id": 183, "question": "一家公司希望對基礎模型(FM)進行微調，以回答特定領域的問題。該公司希望使用基於指令的微調。公司應該如何準備培訓資料？", "options": {"A": "收集公司內部檔案和特定行業的材料。將檔案和材料合併成一個檔案。", "B": "從各種線上來源收集外部公司評論。手動將每個評論標記為正面或負面。", "C": "建立專門針對與公司行業領域相關的主題的問答。", "D": "建立少量提示，指示模型只回答領域知識。"}, "correct_answer": "C", "explanation": "基於指令的微調需要一組指令響應示例。透過管理關注公司領域的問答對，您可以準確地教會模型如何解釋特定領域的查詢，並在推理過程中生成正確的響應。"}, {"id": 184, "question": "在AWS 上訓練AI 模型時，哪種ML 技術可以確保資料合規性和隱私性？", "options": {"A": "強化學習", "B": "遷移學習", "C": "聯合學習", "D": "無監督學習"}, "correct_answer": "C", "explanation": "聯合學習使您可以跨多個資料持有者(例如，不同的AWS 帳戶或邊緣裝置)訓練一個全域性模型，而無需將原始資料移動到一箇中心位置。每個參與者在自己的私有資料集上進行本地訓練，並且僅共享模型更新，從而保護資料隱私並確保合規性。"}, {"id": 186, "question": "一家制造公司有一個應用程式，它從公開的來源獲取消費者的投訴。應用程式使用複雜的硬編碼邏輯來處理投訴。該公司希望將這一邏輯擴充套件到所有市場和產品線。對於這種情況，生成式人工智慧模型提供了什麼優勢？", "options": {"A": "產出的可預測性", "B": "適應性", "C": "對輸入的變化不太敏感", "D": "可解釋性"}, "correct_answer": "B", "explanation": "生成式人工智慧模型可以將學習到的模式歸納為新的領域和格式，只需最少的手動重新配置。這種適應性使您能夠跨不同的市場和產品線擴充套件投訴處理邏輯，而無需重寫複雜的硬編碼規則。"}, {"id": 187, "question": "一家金融公司希望根據交易資料將所有信用卡活動標記為可能欺詐或非欺詐。哪種型別的ML 模型符合這些要求？", "options": {"A": "迴歸", "B": "傳播", "C": "二元分類", "D": "多類分類"}, "correct_answer": "C", "explanation": "二進位制分類模型旨在區分兩類交易——欺詐性交易和非欺詐性交易——使它們成為此用例的合適選擇。"}, {"id": 189, "question": "一家醫院希望使用具有語音轉文字功能的生成式人工智慧解決方案來幫助提高員工口述臨床記錄的技能。哪種AWS 服務符合這些要求？", "options": {"A": "亞馬遜Q 開發者 (Amazon Q Developer)", "B": "亞馬遜波利 (Amazon Polly)", "C": "亞馬遜認知 (Amazon Cognito)", "D": "AWS HealthScribe"}, "correct_answer": "D", "explanation": "AWS HealthScribe 專為醫療保健工作流程而設計，提供準確的臨床對話語音到文字轉換，並生成結構化的臨床記錄，滿足醫院改善員工臨床文件口述的需求。"}, {"id": 190, "question": "哪種型別的人工智慧模型進行數值預測？", "options": {"A": "傳播", "B": "迴歸", "C": "變壓器", "D": "多模態"}, "correct_answer": "B", "explanation": "迴歸模型旨在預測連續數值(例如，預測銷售額或估計房價)，使其成為數值預測的合適選擇。"}, {"id": 192, "question": "大型語言模型(LLM)中向量嵌入的目的是什麼？", "options": {"A": "將文字拆分成易於管理的資料片段", "B": "將一組字元組合成一個整體", "C": "提供對文字進行數學比較的能力", "D": "提供輸入中每個單詞的計數"}, "correct_answer": "C", "explanation": "嵌入將文字轉換為捕捉語義關係的高維向量，允許您計算文字片段之間的距離或相似性，以執行檢索或聚類等任務。"}, {"id": 193, "question": "一家公司希望透過使用AWS 服務來微調基礎模型(FM)。該公司需要確保其資料在儲存資料的源AWS 區域保持私密、安全和可靠。哪種步驟組合將最經濟高效地滿足這些要求？(選兩個。)", "options": {"A": "透過使用AWS 前哨站 (AWS Outposts)在本地託管模型。", "B": "使用Amazon BedrockAPI。", "C": "使用AWS PrivateLink 和VPC。", "D": "在本地託管Amazon BedrockAPI。", "E": "使用Amazon CloudWatch 日誌和指標。"}, "correct_answer": "BC", "explanation": "使用Amazon BedrockAPI:您將在AWS 區域中直接呼叫Bedrock的託管微調端點，因此您的資料永遠不會離開該區域。透過PrivateLink 使用AWS PrivateLink 和透過VPC 端點的VPC: Front Bedrock API 流量，將所有網路流量保持在AWS 主幹網上和您帳戶的專用網路內。"}, {"id": 194, "question": "一家金融公司使用AWS 託管其生成式人工智慧模型。公司必須生成報告，以表明遵守了處理敏感客戶資料的國際法規。哪種AWS 服務符合這些要求？", "options": {"A": "亞馬遜Macie", "B": "AWS 工件 (AWS Artifact)", "C": "AWS 機密管理器 (AWS Secrets Manager)", "D": "AWS 配置 (AWS Config)"}, "correct_answer": "B", "explanation": "AWS Artifact 提供對AWS 合規性報告和認證(例如，ISO、SOC、GDPR)的按需訪問，使公司能夠證明其生成式人工智慧工作負載和資料處理實踐符合國際監管要求。"}, {"id": 195, "question": "一家醫療公司希望實現其現場資訊處理應用程式的現代化。該公司希望利用生成式人工智慧來回答患者的醫療問題。公司應該使用哪種AWS 服務來確保對應用負責任的AI？", "options": {"A": "亞馬遜岩床 (Amazon Bedrock)的護欄", "B": "亞馬遜檢查員 (Amazon Inspector)", "C": "亞馬遜認知 (Amazon Cognito)", "D": "AWS 值得信賴的顧問 (AWS Trusted Advisor)"}, "correct_answer": "A", "explanation": "透過Guardrails for Amazon Bedrock，您可以在生成式人工智慧工作負載上定義和實施安全性、合規性和偏差控制。透過將這些護欄嵌入到您的應用中，您可以確保面向患者的響應滿足醫療準確性、隱私和監管要求，而無需自己構建定製的監控或過濾管道。"}, {"id": 196, "question": "哪種指標用於評估文字摘要任務的基礎模型(FMs)的效能？", "options": {"A": "F1 分數", "B": "雙語評估替角(BLEU)評分", "C": "準確(性)", "D": "均方誤差"}, "correct_answer": "A", "explanation": "文字摘要質量最常用的評估方法是ROUGE metrics，它報告召回率、精確度以及平衡這兩者的F1 值。ROUGE-F1(在這種情況下通常簡稱為F1 分數)衡量模型摘要與參考摘要的重疊程度，使其成為評估基礎模型摘要任務的標準選擇。"}, {"id": 197, "question": "微調基礎模型(FM)有什麼好處？", "options": {"A": "微調減少了FM 的大小和複雜性，並支援更慢的推斷。", "B": "微調使用特定的訓練資料從頭開始重新訓練FM，以適應特定的用例。", "C": "微調透過根據最新資料對FM 進行預訓練來保持FM 的知識是最新的。", "D": "微調透過在新標記的資料上進一步訓練FM 來提高FM 在特定任務上的效能。"}, "correct_answer": "D", "explanation": "透過用與任務相關的例子更新模型的權重，微調加深了它對特定領域語言和目標的理解，從而在特定任務上產生更高的準確性和相關性。"}, {"id": 198, "question": "一家公司希望改進其聊天機器人的響應，以符合該公司期望的語氣。該公司有100 個客戶服務代理和客戶之間高質量對話的例子。該公司希望使用這些資料將公司語氣納入聊天機器人的響應中。哪種解決方案符合這些要求？", "options": {"A": "使用Amazon Personalize 生成回覆。", "B": "建立一個亞馬遜SageMaker HyperPod 預培訓工作。", "C": "使用Amazon SageMaker 託管模型。使用TensorRT 進行大型語言模型(LLM)部署。", "D": "建立一個Amazon Bedrock微調工作。"}, "correct_answer": "D", "explanation": "Bedrock的微調可以讓你根據自己的對話例項調整基礎模型，在這種情況下，100 份高質量的抄本可以將你公司的語氣直接灌輸到模型的響應生成中。"}, {"id": 199, "question": "一家電子商務公司正在使用聊天機器人來自動化客戶訂單提交流程。聊天機器人由人工智慧驅動，客戶可以每週7 天、每天24 小時直接從該公司的網站上獲得。在聊天機器人可用之前，公司需要解決哪個選項是人工智慧系統輸入漏洞？", "options": {"A": "資料洩露", "B": "即時注射", "C": "大型語言模型(LLM)幻覺", "D": "概念漂移"}, "correct_answer": "B", "explanation": "即時注入是一種輸入級攻擊，使用者透過手工惡意輸入來覆蓋或操縱聊天機器人的指令或行為。透過淨化和限制使用者提示來解決這一漏洞，可以確保聊天機器人在上線時不會執行意外或有害的指令。"}, {"id": 200, "question": "一家社交媒體公司希望阻止使用者在該公司的應用程式上釋出歧視性內容。該公司希望使用Amazon Bedrock作為解決方案的一部分。該公司如何使用Amazon Bedrock來滿足這些要求？", "options": {"A": "給予使用者基於使用者偏好的互動能力。", "B": "阻止與預定義主題相關的互動。", "C": "將使用者對話限制在預定義的主題。", "D": "為使用者參與提供多種回答供選擇。"}, "correct_answer": "B", "explanation": "Amazon Bedrock的內建內容稽核允許您定義類別或關鍵字(例如，仇恨言論、歧視性語言)，並自動阻止或過濾任何屬於這些主題的使用者輸入或輸出。透過配置Bedrock的安全過濾器與您的預定義的“禁止”類別，該應用程式將防止歧視性的內容被張貼。"}, {"id": 201, "question": "一家教育公司。該應用程式將讓使用者能夠輸入文字或提供一個問題的圖片。應用程式將以書面回答和對書面回答的解釋來響應。哪種型號符合這些要求？", "options": {"A": "計算機視覺模型", "B": "大型多模態語言模型", "C": "擴散模型", "D": "文字到語音模型"}, "correct_answer": "B", "explanation": "一個大型的多模態語言模型可以原生地接收文字和影象作為輸入，並生成文字輸出，這使得它非常適合於接受鍵入的問題或問題的照片並返回帶有解釋的書面答案的系統。"}, {"id": 202, "question": "在生成式人工智慧模型生命週期的哪個階段進行測試以檢查模型的準確性？", "options": {"A": "部署", "B": "資料選擇", "C": "微調", "D": "評估"}, "correct_answer": "D", "explanation": "評估階段是您執行測試和基準(如準確度、精確度和其他效能指標)來測量生成式人工智慧模型在繼續部署之前對保留或驗證資料的執行情況。"}, {"id": 203, "question": "哪項陳述正確描述了生成式人工智慧的嵌入？", "options": {"A": "嵌入將資料表示為捕捉語義關係的高維向量。", "B": "嵌入是一種搜尋資料以找到最有助於回答自然語言問題的資訊的技術。", "C": "嵌入透過對權重和啟用使用不太精確的資料型別來減少模型的硬體需求。", "D": "嵌入為生成式人工智慧應用程式提供了儲存和檢索資料的能力。"}, "correct_answer": "A", "explanation": "嵌入將單詞、句子或文件等輸入對映到連續的向量空間，其中語義相似性對應於幾何鄰近性，使模型能夠以數學方式推理意義和關係。"}, {"id": 204, "question": "一家公司希望透過整合大型語言模型(LLM)將生成式人工智慧功能新增到其應用程式中。來自LLM 的響應必須儘可能地確定和穩定。哪種解決方案符合這些要求？", "options": {"A": "將應用程式配置為在向LLM 提交提示時自動將溫度引數設定為0。", "B": "將應用程式配置為在將提示提交給LLM 之前，在提示的末尾自動新增“使您的響應具有確定性”。", "C": "將應用程式配置為在將提示提交給LLM 之前，在提示的開頭自動新增“使您的響應具有確定性”。", "D": "將應用程式配置為在向LLM 提交提示時自動將溫度引數設定為1。"}, "correct_answer": "A", "explanation": "溫度超引數直接控制LLM 令牌取樣的隨機性:將其設定為0 會強制執行貪婪解碼，每次都會產生最有可能的下一個令牌，從而產生完全確定的穩定輸出。"}, {"id": 205, "question": "一家公司需要選擇一個生成式人工智慧模型來構建應用程式。應用程式必須實時向使用者提供響應。公司應該考慮哪種模式特徵來滿足這些要求？", "options": {"A": "模型複雜性", "B": "創新速度", "C": "推理速度", "D": "訓練時間"}, "correct_answer": "C", "explanation": "對於實時應用程式，模型的推理速度(生成低延遲響應的能力)是確保使用者及時收到答案的關鍵特徵。"}, {"id": 206, "question": "哪個術語是指給予基礎模型(FMs)的說明，以便FMs 對問題提供更準確的響應？", "options": {"A": "提示", "B": "方向", "C": "對話", "D": "翻譯"}, "correct_answer": "A", "explanation": "提示是您向基礎模型提供的輸入指令或查詢，用於指導其響應，確保模型理解任務並提供更準確的答案。"}, {"id": 207, "question": "一家零售公司希望建立一個ML 模型來向客戶推薦產品。該公司希望在負責任的實踐基礎上建立模型。公司在收集資料時應採用哪種做法來減少模型偏差？", "options": {"A": "僅使用與公司整體客戶群的人口統計資料相匹配的客戶的資料。", "B": "從有購買歷史的客戶那裡收集資料。", "C": "確保資料是平衡的，並且是從不同的群體中收集的。", "D": "確保資料來自公開可用的資料集。"}, "correct_answer": "C", "explanation": "透過收集反映全部客戶群體的訓練資料(包括人口統計、行為和偏好)，您可以減少對任何一個子群體的偏見，並幫助推薦者公平對待所有使用者。"}, {"id": 208, "question": "一家公司正在開發一個ML 模型來預測客戶流失。哪種評估指標將評估模型在二元分類任務(如預測客戶流失)中的效能？", "options": {"A": "F1 分數", "B": "均方誤差", "C": "r 平方", "D": "用於訓練模型的時間"}, "correct_answer": "A", "explanation": "對於像流失預測這樣的二進位制分類任務，F1 分數將精確度和召回率平衡到一個單一的指標中，這使得它非常適合於評估模型在沒有過度或過度的情況下識別流失者的情況預測不足。"}, {"id": 209, "question": "一名人工智慧從業者正在評估亞馬遜SageMaker 模型的效能。人工智慧從業者必須選擇一個效能指標。該指標必須顯示正確分類專案數與正確和錯誤分類專案總數的比率。哪個指標符合這些要求？", "options": {"A": "準確(性)", "B": "精確", "C": "F1 分數", "D": "回憶"}, "correct_answer": "A", "explanation": "準確性定義為正確分類的專案數(包括真陽性和真陰性)除以評估的專案總數(真陽性、真陰性、假陽性和假陰性的總和)，與描述的比率完全匹配。"}, {"id": 210, "question": "一家電子商務公司每天接收數千兆位元組的客戶資料。該公司使用這些資料訓練一個ML 模型來預測未來的產品需求。該公司需要一個每天執行一次推理的解決方案。哪種推理型別符合這些要求？", "options": {"A": "批次推斷", "B": "非同步推理", "C": "實時推理", "D": "無伺服器推理"}, "correct_answer": "A", "explanation": "批次推斷是為大容量的預定預測而設計的:您可以將它指向當天的千兆位元組資料，每天執行一次作業，並一次性生成所有預測，而不需要持久端點。"}, {"id": 211, "question": "一家公司開發了一個客戶細分的生成式人工智慧模型。該模型已經在公司的生產環境中部署了很長時間。該公司最近注意到模型的反應有些不一致。該公司希望評估模型偏差和漂移。哪個AWS 服務或功能符合這些要求？", "options": {"A": "亞馬遜SageMaker 模型監視器", "B": "亞馬遜SageMaker Clarify", "C": "亞馬遜SageMaker 模型卡", "D": "亞馬遜SageMaker 特色店 (Amazon SageMaker Feature Store)"}, "correct_answer": "A", "explanation": "SageMaker Model Monitor 持續收集推理和基本事實資料，以自動檢測生產模型中的資料漂移、概念漂移和偏差轉移。透過配置基線指標和閾值，公司可以隨著時間的推移跟蹤響應的不一致性，並在偏差或漂移超過可接受的限制時收到警報。"}, {"id": 212, "question": "一家公司已經簽署了Amazon Bedrock訪問來構建應用程式。該公司希望限制員工訪問Amazon Bedrock上的特定型號。哪種解決方案符合這些要求？", "options": {"A": "使用AWS 身份和訪問管理(IAM)策略來限制模型訪問。", "B": "使用AWS 安全令牌服務(AWS STS)生成供模型使用的臨時憑據。", "C": "使用AWS 身份和訪問管理(IAM)服務角色來限制模型訂閱。", "D": "使用Amazon Inspector 監控模型訪問。"}, "correct_answer": "A", "explanation": "使用IAM 策略，您可以授權或拒絕特定模型ARNs 範圍內的基礎API 操作，確保員工只能呼叫您授權的確切模型。"}, {"id": 213, "question": "哪種ML 技術使用標有正確輸出值的訓練資料？", "options": {"A": "監督學習", "B": "無監督學習", "C": "強化學習", "D": "遷移學習"}, "correct_answer": "A", "explanation": "監督學習在資料集上訓練模型，其中每個示例都包括輸入要素和正確的輸出標籤，允許演算法學習從輸入到已知目標的對映。"}, {"id": 214, "question": "哪個大型語言模型(LLM)引數控制在文字生成過程的每個步驟中可能出現的下一個單詞或標記的數量？", "options": {"A": "最大令牌數", "B": "頂級K", "C": "溫度", "D": "批次"}, "correct_answer": "B", "explanation": "Top K 引數將每個生成步驟的令牌取樣限制為K 個最可能的下一個令牌。透過選擇要考慮的最高機率候選項的數量，Top K 直接控制了模型在生成每個令牌時評估的選項的範圍。"}, {"id": 215, "question": "一家公司正在製造聊天機器人。聊天機器人使用亞馬遜Lex 和亞馬遜OpenSearch 服務。聊天機器人使用該公司的私人資料來回答問題。在將資料儲存到資料庫之前，公司需要將資料轉換成向量表示。哪種基礎模型(FM)符合這些要求？", "options": {"A": "文字完成模型", "B": "指令跟隨模型", "C": "文字嵌入模型", "D": "影象生成模型"}, "correct_answer": "C", "explanation": "文字嵌入模型將輸入文字轉換為高維向量表示，這使得它們非常適合於在聊天機器人的向量資料庫中儲存和檢索您的私人資料。"}, {"id": 216, "question": "一家公司希望使用大型語言模型(LLM)來生成產品描述。該公司希望給出符合格式的模型示例描述。哪種提示工程技術將生成與格式匹配的描述？", "options": {"A": "零射擊提示", "B": "思維鏈提示", "C": "一次性提示", "D": "少數鏡頭提示"}, "correct_answer": "D", "explanation": "少量提示為模型提供了幾個符合所需格式的示例產品描述，使其能夠學習模式並以相同的風格生成新的描述，而無需進一步的培訓。"}, {"id": 217, "question": "一家銀行正在對Amazon Bedrock上的大型語言模型(LLM)進行微調，以幫助客戶解決有關貸款的問題。該銀行希望確保該模型不會洩露任何私人客戶資料。哪種解決方案符合這些要求？", "options": {"A": "使用Amazon Bedrock護欄 (Guardrails for Amazon Bedrock)。", "B": "在微調LLM 之前，從客戶資料中刪除個人身份資訊(PII)。", "C": "增加LLM 的Top-K 引數。", "D": "在亞馬遜S3 儲存客戶資料。在微調LLM 之前加密資料。"}, "correct_answer": "B", "explanation": "對您的微調資料集進行預處理以剔除姓名、賬號和其他PII，可以防止模型攝取(或以後再吐出)私人客戶資訊。這個資料清理步驟是保證敏感細節不會嵌入到模型中的最可靠的方法。"}, {"id": 218, "question": "一家雜貨店希望建立一個聊天機器人來幫助客戶在店裡找到產品。聊天機器人必須實時檢查庫存，並提供產品在商店中的位置。商店應該使用哪種快速工程技術來構建聊天機器人？", "options": {"A": "零射擊提示", "B": "少數鏡頭提示", "C": "最少到最多的提示", "D": "推理和行動(反應)提示"}, "correct_answer": "D", "explanation": "ReAct 提示將模型的思維鏈推理與顯式“動作”(如呼叫您的實時庫存API)交錯，然後使用API 響應通知其最終答案。透過構建您的提示，讓LLM 思考，選擇帶有產品名稱的“CheckInventory”操作，接收實時位置資料，然後回覆使用者，您可以將實時查詢和精確的產品位置無縫整合到聊天機器人的回覆中。"}, {"id": 219, "question": "一家公司使用Amazon Bedrock上的第三方模型來分析機密檔案。該公司擔心資料隱私。哪項陳述描述了Amazon Bedrock如何保護資料隱私？", "options": {"A": "使用者輸入和模型輸出被匿名化，並與第三方模型提供商共享。", "B": "使用者輸入和模型輸出不與任何第三方模型提供者共享。", "C": "使用者輸入是保密的，但是模型輸出與第三方模型提供商共享。", "D": "使用者輸入和模型輸出在與第三方模型提供者共享之前被編輯。"}, "correct_answer": "B", "explanation": "Amazon Bedrock完全在AWS 的安全環境中處理您的資料，不會將您的輸入或生成的輸出轉發回模型供應商，從而確保您的機密文件保持私密。"}, {"id": 220, "question": "一家動畫公司希望為其內容提供字幕。哪個AWS 服務符合這一要求？", "options": {"A": "亞馬遜理解 (Amazon Comprehend)", "B": "亞馬遜波利 (Amazon Polly)", "C": "亞馬遜轉錄 (Amazon Transcribe)", "D": "亞馬遜翻譯 (Amazon Translate)"}, "correct_answer": "C", "explanation": "Amazon Transcribe 將語音音訊轉換為精確的帶時間戳的文字轉錄，使其成為從動畫音軌生成字幕的理想服務。"}, {"id": 221, "question": "一家電子商務公司希望根據客戶的購買歷史和偏好對客戶進行分組，以個性化公司應用程式的使用者體驗。公司應該使用哪種ML 技術？", "options": {"A": "分類", "B": "使聚集", "C": "迴歸", "D": "內容生成"}, "correct_answer": "B", "explanation": "聚類是一種無監督的學習技術，它可以自動將資料點(在這種情況下，是具有相似購買歷史和偏好的客戶)分組為細分市場，而不需要預定義的標籤，從而實現個性化體驗。"}, {"id": 222, "question": "一家公司希望控制員工對公開基礎模型(FMs)的訪問。哪種解決方案符合這些要求？", "options": {"A": "在AWS 成本瀏覽器中分析成本和使用情況報告。", "B": "從AWS Artifact 下載AWS 安全性和合規性文件。", "C": "配置Amazon SageMaker JumpStart 以限制可發現的FMs。", "D": "使用Amazon OpenSearch 服務構建混合搜尋解決方案。"}, "correct_answer": "C", "explanation": "SageMaker JumpStart 允許您管理哪些公開可用的基礎模型出現在您帳戶的模型目錄中。透過使用JumpStart 的模型目錄設定(與IAM 結合使用)，您可以防止員工發現或部署任何您未明確允許的FMs。"}, {"id": 223, "question": "一家公司建立了一個翻譯工具來幫助其客戶服務團隊處理來自世界各地客戶的問題。該公司希望評估翻譯工具的效能。該公司建立了一個並行的資料流程，將工具的反應與真實人類的反應進行比較。兩組響應都是在同一組文件上生成的。公司應該使用哪種策略來評估翻譯工具？", "options": {"A": "使用雙語評估替角(BLEU)分數來評估兩種方法的絕對翻譯質量。", "B": "使用雙語評估替角(BLEU)分數來估計兩種方法的相對翻譯質量。", "C": "使用BERTScore 評估兩種方法的絕對翻譯質量。", "D": "使用BERTScore 評估兩種方法的相對翻譯質量。"}, "correct_answer": "B", "explanation": "BLEU 測量候選翻譯和一個或多個參考翻譯之間的n 元語法重疊。當您將它應用於工具的輸出和相同源文件上的人工輸出時，您會得到可比較的分數，讓您直接評估哪種方法產生更好的翻譯。"}, {"id": 224, "question": "一個人工智慧從業者希望從大型語言模型(LLM)中生成更多樣化和更具創造性的輸出。AI 從業者應該如何調整推理引數？", "options": {"A": "增加溫度值。", "B": "減小頂部K 值。", "C": "增加響應長度。", "D": "縮短提示長度。"}, "correct_answer": "A", "explanation": "提高溫度會軟化模型的機率分佈，增加取樣不太可能的令牌的機會，從而產生更多樣和更有創意的響應。"}, {"id": 225, "question": "一家公司開發了定製的計算機視覺模型。該公司需要一個使用者友好的資料標註介面，以最大限度地減少新的現實世界資料中的模型錯誤。哪個AWS 服務、功能或工具符合這些要求？", "options": {"A": "亞馬遜SageMaker 地面真相 (Amazon SageMaker Ground Truth)", "B": "亞馬遜SageMaker 畫布 (Amazon SageMaker Canvas)", "C": "Amazon Bedrock遊樂場 (Amazon Bedrock Playground)", "D": "Amazon Bedrock代理 (Agents for Amazon Bedrock)"}, "correct_answer": "A", "explanation": "SageMaker Ground Truth 提供了一個內建的、 const QMAP = Object.fromEntries(QUIZ_DATA.map(q => [q.id, q]));
let wrongIds = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY + "_wrong") || "[]"));

let session = null; // { queue: [id,...], idx, selected: Set, submitted: bool, correctCount, wrongThisRound: Set }

const BATCH_SIZE = 65;

function save() {
  localStorage.setItem(STORAGE_KEY + "_wrong", JSON.stringify([...wrongIds]));
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function escapeHtml(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── 發牌機制：同一輪（把 idPool 全部練過一次）保證不重複，練完整輪才重新洗牌開下一輪 ──
function deckKey(mode) { return STORAGE_KEY + "_deck_" + mode; }

function loadDeckState(mode, idPool) {
  const poolSnapshot = [...idPool].sort((a,b)=>a-b).join(",");
  let deck = JSON.parse(localStorage.getItem(deckKey(mode)) || "null");
  if (!deck || deck.poolSnapshot !== poolSnapshot) {
    deck = { order: shuffle(idPool), cursor: 0, poolSnapshot, round: 1 };
  } else if (deck.cursor >= deck.order.length) {
    deck = { order: shuffle(idPool), cursor: 0, poolSnapshot, round: (deck.round || 1) + 1 };
  }
  return deck;
}
function saveDeckState(mode, deck) {
  localStorage.setItem(deckKey(mode), JSON.stringify(deck));
}
// 取下一批（同一輪內保證跟之前批次不重複）。若該輪剩餘不足 BATCH_SIZE，且題庫總數 >= BATCH_SIZE，
// 從「這一輪已經練過的題目」隨機補滿到 BATCH_SIZE，讓每一輪的作答量與計分基準一致。
function drawNextBatch(mode, idPool) {
  if (!idPool.length) return { batch: [], round: 1, doneInRound: 0, totalInRound: 0, topUp: 0 };
  const deck = loadDeckState(mode, idPool);
  const doneInRoundBefore = deck.cursor;
  let batch = deck.order.slice(deck.cursor, deck.cursor + BATCH_SIZE);
  let topUp = 0;

  if (batch.length < BATCH_SIZE && deck.order.length >= BATCH_SIZE) {
    const need = BATCH_SIZE - batch.length;
    const usedPool = deck.order.slice(0, deck.cursor);
    const fill = shuffle(usedPool).slice(0, need);
    topUp = fill.length;
    batch = shuffle([...batch, ...fill]);
    deck.cursor = deck.order.length; // 這一輪剩餘的都已經在這批出完了，直接視為輪次結束
  } else {
    deck.cursor += batch.length;
  }
  saveDeckState(mode, deck);
  return { batch, round: deck.round, doneInRound: doneInRoundBefore, totalInRound: deck.order.length, topUp };
}
function deckProgress(mode, idPool) {
  if (!idPool.length) return null;
  const poolSnapshot = [...idPool].sort((a,b)=>a-b).join(",");
  let deck = JSON.parse(localStorage.getItem(deckKey(mode)) || "null");
  if (!deck || deck.poolSnapshot !== poolSnapshot) return { round: 1, done: 0, total: idPool.length, finished: false };
  return { round: deck.round || 1, done: Math.min(deck.cursor, deck.order.length), total: deck.order.length, finished: deck.cursor >= deck.order.length };
}

function renderStart() {
  const total = QUIZ_DATA.length;
  const wrongCount = wrongIds.size;
  const allIds = QUIZ_DATA.map(q => q.id);
  const prog = deckProgress("all", allIds);
  const progText = prog
    ? (prog.finished
        ? `第 ${prog.round} 輪已練完，下一次會重新洗牌開始新一輪`
        : `第 ${prog.round} 輪進行中・已練 ${prog.done} / ${prog.total} 題（同一輪不會重複出題）`)
    : `每次出 ${Math.min(BATCH_SIZE, total)} 題，練完一整輪（共 ${total} 題）才會重新洗牌`;
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="badge">AWS 證照題庫</div>
      <div class="title">${escapeHtml(QUIZ_TITLE)}</div>
      <div class="subtitle">${escapeHtml(QUIZ_SUBTITLE)}</div>
      <div class="stat-row">
        <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-label">總題數</div></div>
        <div class="stat-box"><div class="stat-num" style="color:${wrongCount ? '#e05555' : '#30b86c'}">${wrongCount}</div><div class="stat-label">待複習錯題</div></div>
      </div>
      <div class="q-hint" style="margin-bottom:14px">${escapeHtml(progText)}</div>
      <button class="btn btn-primary" onclick="startQuiz('all')">開始測驗（本次 ${Math.min(BATCH_SIZE, total)} 題）</button>
      <button class="btn btn-outline" ${wrongCount ? '' : 'disabled'} onclick="startQuiz('wrong')">只重考錯題（${wrongCount} 題）</button>
      <button class="btn btn-outline" ${wrongCount ? '' : 'disabled'} style="border-color:#f0d060;color:#a07020" onclick="exportWrongQuestions()">📥 匯出錯題（給 Claude 整理概念筆記用）</button>
    </div>
  `;
}

// 把目前答錯的題目（題目/選項/正確答案/詳解）匯出成檔案，下載到瀏覽器預設下載資料夾，
// 檔名固定，方便之後直接請 Claude 讀取分析、整理成概念筆記。
function exportWrongQuestions() {
  const items = [...wrongIds].map(id => QMAP[id]).filter(Boolean);
  if (!items.length) return;
  const payload = {
    quiz: QUIZ_TITLE,
    exportedAt: new Date().toISOString(),
    wrongCount: items.length,
    questions: items.map(q => ({
      id: q.id, question: q.question, options: q.options,
      correct_answer: q.correct_answer, explanation: q.explanation,
    })),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${STORAGE_KEY}_wrong_export.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function startQuiz(mode) {
  const idPool = mode === "wrong" ? [...wrongIds] : QUIZ_DATA.map(q => q.id);
  if (!idPool.length) return;
  const { batch, round, doneInRound, totalInRound, topUp } = drawNextBatch(mode, idPool);
  if (!batch.length) return;
  session = { mode, queue: batch, idx: 0, selected: new Set(), submitted: false, correctCount: 0, wrongThisRound: new Set(), round, roundDoneBefore: doneInRound, roundTotal: totalInRound, topUp };
  session.optionOrder = buildOptionOrder(currentQ());
  renderQuestion();
}

function currentQ() { return QMAP[session.queue[session.idx]]; }

// 每次進入一題時，把選項內容重新洗牌（顯示標籤仍是 A/B/C/D...，但底下塞的內容順序會變），
// 避免練到後面變成背「答案是第幾個」而不是真的搞懂概念。同一題作答過程中（送出前後）順序不會再變。
function buildOptionOrder(q) {
  const origLetters = Object.keys(q.options);
  const shuffledOrig = shuffle(origLetters);
  return shuffledOrig.map((orig, i) => ({ display: origLetters[i], orig, text: q.options[orig] }));
}

function toggleOption(letter) {
  if (session.submitted) return;
  const q = currentQ();
  const multi = q.correct_answer.length > 1;
  if (multi) {
    if (session.selected.has(letter)) session.selected.delete(letter);
    else session.selected.add(letter);
  } else {
    session.selected = new Set([letter]);
  }
  renderQuestion();
}

function renderQuestion() {
  const q = currentQ();
  const total = session.queue.length;
  const multi = q.correct_answer.length > 1;
  const correctOrigSet = new Set(q.correct_answer.split(""));
  const optionOrder = session.optionOrder; // [{display, orig, text}, ...]（每題洗牌過一次）

  const optsHtml = optionOrder.map(({ display, orig, text }) => {
    const isSelected = session.selected.has(display);
    let cls = "opt";
    let mark = "";
    if (session.submitted) {
      if (correctOrigSet.has(orig)) { cls += " correct"; mark = "✓"; }
      else if (isSelected) { cls += " wrong"; mark = "✗"; }
    } else if (isSelected) {
      cls += " selected";
    }
    const inputType = multi ? "checkbox" : "radio";
    return `<div class="${cls}" onclick="toggleOption('${display}')">
      <input type="${inputType}" ${isSelected ? "checked" : ""} ${session.submitted ? "disabled" : ""} onclick="event.stopPropagation()">
      <span class="opt-letter">${display}.</span>
      <span class="opt-text">${escapeHtml(text)}</span>
      ${mark ? `<span class="opt-mark">${mark}</span>` : ""}
    </div>`;
  }).join("");

  const selectedOrigSorted = [...session.selected].map(d => optionOrder.find(o => o.display === d).orig).sort().join("");
  const wasCorrect = session.submitted && selectedOrigSorted === q.correct_answer.split("").sort().join("");
  const correctDisplayLetters = optionOrder.filter(o => correctOrigSet.has(o.orig)).map(o => o.display).sort().join("、");

  const feedbackHtml = session.submitted ? `
    <div class="feedback-banner ${wasCorrect ? 'correct' : 'wrong'}">
      ${wasCorrect ? '✓ 答對了' : `✗ 答錯了・正確答案：${correctDisplayLetters}`}
    </div>
    ${q.explanation ? `<div class="explanation"><div class="explanation-label">詳解</div>${escapeHtml(q.explanation)}</div>` : ""}
  ` : "";

  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(session.idx / total) * 100}%"></div></div>
        <div class="progress-text">${session.idx + 1} / ${total}</div>
      </div>
      <div class="q-text">${escapeHtml(q.question)}</div>
      ${multi ? `<div class="q-hint">請選擇 ${q.correct_answer.length} 個答案</div>` : ""}
      <div style="margin-top:14px">${optsHtml}</div>
      ${feedbackHtml}
      ${session.submitted
        ? `<button class="btn btn-primary" onclick="nextQuestion()">${session.idx + 1 < total ? "下一題" : "查看結果"}</button>`
        : `<button class="btn btn-primary" ${session.selected.size ? "" : "disabled"} onclick="submitAnswer()">送出答案</button>`
      }
    </div>
  `;
}

function submitAnswer() {
  const q = currentQ();
  const optionOrder = session.optionOrder;
  const correctSet = q.correct_answer.split("").sort().join("");
  const selSet = [...session.selected].map(d => optionOrder.find(o => o.display === d).orig).sort().join("");
  const isCorrect = selSet === correctSet;
  session.submitted = true;
  if (isCorrect) {
    session.correctCount++;
    if (wrongIds.has(q.id)) { wrongIds.delete(q.id); save(); }
  } else {
    session.wrongThisRound.add(q.id);
    wrongIds.add(q.id);
    save();
  }
  renderQuestion();
}

function nextQuestion() {
  if (session.idx + 1 < session.queue.length) {
    session.idx++;
    session.selected = new Set();
    session.submitted = false;
    session.optionOrder = buildOptionOrder(currentQ());
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult() {
  const total = session.queue.length;
  const correct = session.correctCount;
  const pct = Math.round((correct / total) * 100);
  const wrongList = [...session.wrongThisRound].map(id => QMAP[id]);

  const roundDoneAfter = Math.min(session.roundDoneBefore + total, session.roundTotal);
  const roundFinished = roundDoneAfter >= session.roundTotal;
  const roundProgText = session.mode === "all"
    ? (roundFinished
        ? `第 ${session.round} 輪已全部練完（${session.roundTotal} 題），下一次開始新一輪`
        : `第 ${session.round} 輪進度：已練 ${roundDoneAfter} / ${session.roundTotal} 題`)
    : "";
  const nextAllLabel = session.mode === "all"
    ? (roundFinished ? "開始下一輪" : `繼續本輪（下 ${Math.min(BATCH_SIZE, session.roundTotal - roundDoneAfter)} 題）`)
    : "開始測驗";

  const passed = pct >= PASS_THRESHOLD;
  const passBadge = `
    <div style="display:inline-block;margin-top:10px;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:800;background:${passed ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.2)'}">
      ${passed ? '✓ 通過' : '✗ 未通過'}（及格門檻 ${PASS_THRESHOLD} 分）
    </div>`;

  document.getElementById("app").innerHTML = `
    <div class="score-hero">
      <div class="score-big">${correct} / ${total}</div>
      <div class="score-sub">答對率 ${pct} 分${session.mode === 'wrong' ? '（錯題複習模式）' : ''}</div>
      ${passBadge}
    </div>
    ${roundProgText ? `<div class="card center" style="padding:12px 16px;color:#4f7be8;font-weight:600;font-size:13px">${escapeHtml(roundProgText)}</div>` : ""}
    ${wrongList.length ? `
    <div class="card">
      <div class="explanation-label" style="margin-bottom:10px">本輪答錯的題目（${wrongList.length} 題，已加入錯題本）</div>
      ${wrongList.map(q => `<div class="wrong-list-item"><span><span class="wrong-q-num">#${q.id}</span>${escapeHtml(q.question.slice(0, 40))}${q.question.length > 40 ? '…' : ''}</span></div>`).join("")}
    </div>` : `<div class="card center" style="color:#30b86c;font-weight:700">🎉 全對，太強了！</div>`}
    <div class="card">
      <button class="btn btn-primary" onclick="startQuiz('all')">${escapeHtml(nextAllLabel)}</button>
      <button class="btn btn-outline" ${wrongIds.size ? '' : 'disabled'} onclick="startQuiz('wrong')">只考錯題（${wrongIds.size} 題）</button>
      <button class="btn btn-outline" onclick="renderStart()" style="border-color:#e4e8ef;color:#888">回首頁</button>
    </div>
  `;
}

renderStart();
</script>
</body>
</html>
