<title>AWS Certified AI Practitioner (AIF-C01) 測驗</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; min-height: 100vh; }
  .container { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; }

  .card { background: white; border-radius: 12px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 14px; }
  .title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 18px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; transition: all 0.15s; font-family: inherit; width: 100%; margin-bottom: 10px; }
  .btn-primary { background: #4f7be8; color: white; }
  .btn-primary:hover { background: #3d67d0; }
  .btn-primary:disabled { background: #c3d0f5; cursor: not-allowed; }
  .btn-outline { background: white; color: #4f7be8; border: 1.5px solid #4f7be8; }
  .btn-outline:hover { background: #f0f4ff; }
  .btn-outline:disabled { color: #bbb; border-color: #e4e8ef; cursor: not-allowed; }
  .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; margin-bottom: 0; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat-box { flex: 1; background: #f8f9fe; border-radius: 10px; padding: 14px 10px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 800; color: #4f7be8; }
  .stat-label { font-size: 11px; color: #888; margin-top: 2px; }

  .progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .progress-bar-bg { flex: 1; height: 6px; background: #e4e8ef; border-radius: 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #4f7be8; transition: width 0.25s; }
  .progress-text { font-size: 12px; color: #888; white-space: nowrap; }

  .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 4px; }
  .q-hint { font-size: 12px; color: #4f7be8; font-weight: 600; margin-bottom: 14px; }

  .opt { display: flex; align-items: flex-start; gap: 10px; border: 1.5px solid #e4e8ef; border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .opt:hover { border-color: #c3d0f5; }
  .opt.selected { border-color: #4f7be8; background: #f0f4ff; }
  .opt.correct { border-color: #30b86c; background: #f6fdf9; }
  .opt.wrong { border-color: #e05555; background: #fff5f5; }
  .opt input { margin-top: 3px; flex-shrink: 0; width: 16px; height: 16px; accent-color: #4f7be8; }
  .opt-letter { font-weight: 800; color: #4f7be8; flex-shrink: 0; }
  .opt.correct .opt-letter { color: #30b86c; }
  .opt.wrong .opt-letter { color: #e05555; }
  .opt-text { font-size: 14.5px; line-height: 1.5; }
  .opt-mark { margin-left: auto; font-weight: 800; flex-shrink: 0; }

  .feedback-banner { border-radius: 10px; padding: 14px 16px; margin: 14px 0; font-size: 14px; font-weight: 700; }
  .feedback-banner.correct { background: #e6f4ec; color: #1e8f52; }
  .feedback-banner.wrong { background: #fdeaea; color: #c0392b; }
  .explanation { background: #f8f9fe; border-radius: 10px; padding: 14px 16px; font-size: 13.5px; line-height: 1.7; color: #444; margin-bottom: 14px; white-space: pre-wrap; }
  .explanation-label { font-size: 11px; font-weight: 700; color: #888; margin-bottom: 6px; letter-spacing: 0.03em; }

  .empty-state { text-align: center; color: #bbb; padding: 30px 0; font-size: 14px; line-height: 1.8; }
  .hidden { display: none !important; }
  .center { text-align: center; }
  .badge { display: inline-block; background: #eef2ff; color: #4f7be8; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; margin-bottom: 10px; }

  .score-hero { text-align: center; padding: 26px 20px; border-radius: 12px; background: linear-gradient(135deg, #4f7be8, #7b5ce8); color: white; margin-bottom: 16px; }
  .score-big { font-size: 40px; font-weight: 800; }
  .score-sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .wrong-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13.5px; }
  .wrong-list-item:last-child { border-bottom: none; }
  .wrong-q-num { color: #888; flex-shrink: 0; margin-right: 10px; }
</style>

<script>
const QUIZ_TITLE = "AWS Certified AI Practitioner (AIF-C01) 測驗";
const QUIZ_SUBTITLE = "223 題全真考古題．專有名詞附英文原文．每輪 65 題，70 分通過．選項每次隨機排列．可匯出錯題（另有 10 題配對型 HOTSPOT 題型不相容已排除）";
const STORAGE_KEY = "aws_aif_c01_quiz";
const QUIZ_DATA = [{"id": 1, "question": "一家公司每季都會做預測，藉此決定如何優化營運以滿足預期需求。該公司使用 ML 模型來進行這些預測。一位 AI practitioner 正在撰寫一份關於已訓練 ML 模型的報告，目的是向公司利害關係人提供透明度與可解釋性。這位 AI practitioner 應該在報告中納入什麼內容，才能符合透明度與可解釋性的要求？", "options": {"A": "模型訓練的程式碼", "B": "部分依賴圖（Partial Dependence Plots, PDPs）", "C": "訓練用的樣本資料", "D": "模型收斂表"}, "correct_answer": "B", "explanation": "部分依賴圖（Partial Dependence Plots, PDPs）是一項強大的工具，能用來理解與解釋機器學習模型中的特徵如何影響預測結果，因此經常被用來滿足對利害關係人的透明度與可解釋性要求。以下說明為什麼這是正確答案，以及為什麼其他選項較不適合：PDP 的目的：PDP 顯示的是一個特徵（或多個特徵）與模型預測輸出之間的關係，有助於解釋每個特徵對模型預測結果的影響。可解釋性：透過視覺化呈現每個特徵如何影響預測，利害關係人可以更清楚理解模型的運作方式，以及為什麼會做出特定的預測。這種程度的可解釋性，對於取得非技術背景利害關係人的信任來說至關重要。透明度：PDP 提供了一種直覺的方式來分析與呈現個別特徵的影響，藉此提升透明度。"}, {"id": 2, "question": "一間法律事務所想要使用大型語言模型（LLM）打造一個 AI 應用程式。這個應用程式要能讀取法律文件，並從中擷取重點。哪個解決方案符合這項需求？", "options": {"A": "建立自動化的命名實體辨識（named entity recognition）系統。", "B": "建立一個推薦引擎。", "C": "開發一個摘要聊天機器人。", "D": "開發一個多語言翻譯系統。"}, "correct_answer": "C", "explanation": "摘要聊天機器人能有效讀取法律文件，並產出精簡版本、凸顯重點內容，直接對應到「擷取關鍵資訊」這項需求；其他選項則是針對不同的任務。"}, {"id": 3, "question": "一家公司想根據基因特徵，將人類基因分類成 20 個類別。該公司需要一種 ML 演算法，能記錄模型的內部運作機制如何影響輸出結果。哪一種 ML 演算法符合這項需求？", "options": {"A": "決策樹（Decision trees）", "B": "線性迴歸（Linear regression）", "C": "邏輯迴歸（Logistic regression）", "D": "神經網路（Neural networks）"}, "correct_answer": "A", "explanation": "決策樹能清楚呈現模型是如何做出決策的，讓「內部機制如何影響輸出」這件事很容易被記錄下來；其他選項則不具備這種程度的可解釋性。"}, {"id": 4, "question": "一家公司建立了一個影像分類模型，用來從植物葉片照片預測植物疾病。該公司想評估模型正確分類了多少張影像。該公司應該使用哪一種評估指標，來衡量模型的表現？", "options": {"A": "R 平方分數（R-squared score）", "B": "準確率（Accuracy）", "C": "均方根誤差（Root mean squared error, RMSE）", "D": "學習率（Learning rate）"}, "correct_answer": "B", "explanation": "準確率（Accuracy）衡量的是在全部影像中，有多少比例被正確分類，因此是評估影像分類模型表現最適合的指標；其他指標不是不適用於分類任務，就是不用於效能評估。"}, {"id": 5, "question": "一家公司正在使用預訓練的大型語言模型（LLM）打造一個產品推薦聊天機器人。該公司需要 LLM 的輸出內容簡短，並以特定語言撰寫。哪個解決方案能讓 LLM 的回應品質符合公司的期望？", "options": {"A": "調整 prompt。", "B": "選擇不同大小的 LLM。", "C": "提高 temperature 值。", "D": "提高 Top K 值。"}, "correct_answer": "A", "explanation": "調整 prompt 可以明確指定 LLM 回應所需的長度與語言，適合用來根據公司需求客製化輸出內容；其他選項都無法直接控制回應的長度或語言。"}, {"id": 6, "question": "一家公司在正式環境中使用 Amazon SageMaker 建置 ML pipeline。該公司的輸入資料量最大可達 1 GB，處理時間最長可達 1 小時，且需要接近即時（near real-time）的延遲。哪一種 SageMaker 推論選項符合這項需求？", "options": {"A": "即時推論（Real-time inference）", "B": "無伺服器推論（Serverless inference）", "C": "非同步推論（Asynchronous inference）", "D": "批次轉換（Batch transform）"}, "correct_answer": "C", "explanation": "非同步推論（Asynchronous inference）適合用來處理大量輸入資料與長時間的處理程序，同時仍能在不阻塞其他請求的情況下回傳結果，可提供接近即時的延遲；相較之下，考量到輸入資料大小與處理時間的限制，其他選項都較不適合。"}, {"id": 7, "question": "一家公司正在使用特定領域的模型，且不想從頭建立新模型，而是希望改用調整預訓練模型的方式，來為新的相關任務建立模型。哪一種 ML 策略符合這項需求？", "options": {"A": "增加 epoch 數量。", "B": "使用遷移學習（transfer learning）。", "C": "減少 epoch 數量。", "D": "使用非監督式學習（unsupervised learning）。"}, "correct_answer": "B", "explanation": "遷移學習（transfer learning）能讓公司把預訓練模型調整套用到新的相關任務上，相較於從頭訓練模型，可以節省時間與資源；其他選項都沒有處理到「重複利用既有模型」這個目標。"}, {"id": 8, "question": "一家公司正在建置一個用來生成護目鏡影像的解決方案，這個解決方案必須具備高準確度，並將標註錯誤的風險降到最低。哪個解決方案符合這項需求？", "options": {"A": "使用 Amazon SageMaker Ground Truth Plus 進行人機協作驗證（human-in-the-loop validation）。", "B": "使用 Amazon Bedrock 知識庫（knowledge base）進行資料增強（data augmentation）。", "C": "使用 Amazon Rekognition 進行影像辨識。", "D": "使用 Amazon QuickSight Q 進行資料摘要。"}, "correct_answer": "A", "explanation": "人機協作驗證（human-in-the-loop validation）透過讓真人審核者參與確認與修正標註結果，確保高準確度，並將生成影像中的標註錯誤風險降到最低；其他選項則與確保影像生成標註準確度沒有直接關聯。"}, {"id": 9, "question": "一家公司想使用 Amazon Bedrock 上的基礎模型（FM）打造聊天機器人。該 FM 需要存取儲存在 Amazon S3 儲存貯體（bucket）中的加密資料，資料是以 Amazon S3 受管金鑰（SSE-S3）加密的。這個 FM 在嘗試存取 S3 儲存貯體資料時發生了錯誤。哪個解決方案符合這項需求？", "options": {"A": "確保 Amazon Bedrock 所承擔（assume）的角色，具備使用正確加密金鑰解密資料的權限。", "B": "將 S3 儲存貯體的存取權限設為公開，讓資料可以透過網際網路存取。", "C": "使用 prompt engineering 技巧，告訴模型要去 Amazon S3 尋找資訊。", "D": "確保 S3 資料中不包含敏感資訊。"}, "correct_answer": "A", "explanation": "基礎模型需要有適當的權限，才能解密 S3 儲存貯體中的加密資料。確保 Amazon Bedrock 使用的角色具備存取與解密資料的權限，就能解決這個存取失敗的問題；其他選項都無法對應到加密與權限這個核心問題。"}, {"id": 10, "question": "一家公司想使用語言模型打造一個在邊緣裝置（edge devices）上進行推論的應用程式，且推論延遲必須盡可能低。哪個解決方案符合這項需求？", "options": {"A": "在邊緣裝置上部署經過優化的小型語言模型（small language models, SLMs）。", "B": "在邊緣裝置上部署經過優化的大型語言模型（large language models, LLMs）。", "C": "採用集中式的小型語言模型（SLM）API，與邊緣裝置進行非同步通訊。", "D": "採用集中式的大型語言模型（LLM）API，與邊緣裝置進行非同步通訊。"}, "correct_answer": "A", "explanation": "直接在邊緣裝置上部署經過優化的小型語言模型（SLMs），能讓運算在本機端進行，避免網路通訊帶來的延遲，因此可提供低延遲的推論；其他選項要不是會增加延遲，就是不適合邊緣裝置部署的情境。"}, {"id": 11, "question": "一家公司想使用 Amazon SageMaker 建置 ML 模型，且需要讓多個團隊共享並管理用於模型開發的變數。哪個 SageMaker 功能符合這項需求？", "options": {"A": "Amazon SageMaker Feature Store", "B": "Amazon SageMaker Data Wrangler", "C": "Amazon SageMaker Clarify", "D": "Amazon SageMaker Model Cards"}, "correct_answer": "A", "explanation": "Amazon SageMaker Feature Store 是一個集中式儲存庫，用來儲存與管理特徵（features），讓多個團隊能共享並重複利用這些變數（特徵）進行模型開發；其他選項則是服務於不同用途，例如資料前處理或模型文件記錄。"}, {"id": 12, "question": "一家公司想使用生成式 AI 來提升開發人員的生產力與軟體開發效率，並打算使用 Amazon Q Developer。Amazon Q Developer 能提供哪些功能，幫助這家公司達成這項需求？", "options": {"A": "產生程式碼片段、追蹤參考來源，以及追蹤開源授權。", "B": "在不需要佈建或管理伺服器的情況下執行應用程式。", "C": "啟用程式撰寫的語音指令，並提供自然語言搜尋功能。", "D": "使用 ML 模型將音訊檔案轉換成文字文件。"}, "correct_answer": "A", "explanation": "Amazon Q Developer 的設計目的，是透過產生程式碼片段、追蹤參考來源，以及管理開源授權來協助開發人員，這符合該公司想提升軟體開發生產力的目標；其他選項都不符合 Amazon Q Developer 的預期用途。"}, {"id": 13, "question": "一家金融機構正在使用 Amazon Bedrock 開發一個 AI 應用程式，這個應用程式部署在一個 VPC 中。為了符合法規遵循標準，這個 VPC 不允許存取任何網際網路流量。哪一項 AWS 服務或功能符合這項需求？", "options": {"A": "AWS PrivateLink", "B": "Amazon Macie", "C": "Amazon CloudFront", "D": "Internet gateway"}, "correct_answer": "A", "explanation": "AWS PrivateLink 能讓 VPC 與 AWS 服務之間建立安全的私有連線，不需要存取網際網路，因此適合用來符合法規遵循標準；其他選項要不是無法提供私有連線，就是需要網際網路存取。"}, {"id": 14, "question": "一家公司想開發一款教育遊戲，讓使用者回答像這樣的題目：「一個罐子裡有 6 顆紅色、4 顆綠色、3 顆黃色彈珠，從罐子裡抽出綠色彈珠的機率是多少？」哪個解決方案能以最少的維運負擔（LEAST operational overhead）滿足這項需求？", "options": {"A": "使用監督式學習建立一個迴歸模型來預測機率。", "B": "使用強化學習訓練一個模型來回傳機率。", "C": "使用程式碼透過簡單的規則與計算來計算機率。", "D": "使用非監督式學習建立一個模型來估算機率密度。"}, "correct_answer": "C", "explanation": "在這個情境中計算機率，只需要簡單的算術運算，因此使用簡單的規則與計算是最有效率的做法。相較於使用複雜的 ML 模型（對這類基本任務而言並不必要），這個做法的維運負擔最低。"}, {"id": 15, "question": "哪一項指標用來衡量 AI 模型運作時的效率（runtime efficiency）？", "options": {"A": "顧客滿意度分數（CSAT）", "B": "每個 epoch 的訓練時間", "C": "平均回應時間", "D": "訓練實例（instance）數量"}, "correct_answer": "C", "explanation": "平均回應時間衡量的是 AI 模型產出結果的速度，能反映出模型在運作時的效率；其他選項都無法直接衡量 AI 模型的運作效率。"}, {"id": 16, "question": "一家公司正在建置一個客服中心應用程式，想從客戶對話中獲得洞察，需要分析並從客服電話錄音中擷取關鍵資訊。哪個解決方案符合這項需求？", "options": {"A": "使用 Amazon Lex 建置對話式聊天機器人。", "B": "使用 Amazon Transcribe 將通話錄音轉成文字。", "C": "使用 Amazon SageMaker Model Monitor 從通話錄音中擷取資訊。", "D": "使用 Amazon Comprehend 建立分類標籤。"}, "correct_answer": "B", "explanation": "Amazon Transcribe 能將音訊錄音轉換成文字，讓後續能進一步分析並從客戶對話中擷取關鍵資訊；其他選項都無法直接處理音訊轉錄或從音訊中擷取資訊。"}, {"id": 17, "question": "一家公司擁有數 PB（petabytes）未標記的客戶資料，想用於廣告行銷活動。該公司想把客戶分成不同等級（tiers），以便針對性地推廣公司的產品。該公司應該採用哪種方法來符合這項需求？", "options": {"A": "監督式學習（Supervised learning）", "B": "非監督式學習（Unsupervised learning）", "C": "強化學習（Reinforcement learning）", "D": "以人類回饋進行的強化學習（RLHF）"}, "correct_answer": "B", "explanation": "非監督式學習（unsupervised learning）適合用來分析未標記的資料，並將其分群成不同的群組或等級，符合該公司想將客戶分類的目標；其他方法則需要標記資料，或是用於解決不同類型的問題。"}, {"id": 18, "question": "一位 AI practitioner 想使用基礎模型（FM）設計一個搜尋應用程式，這個搜尋應用程式必須能處理同時包含文字與影像的查詢。這位 AI practitioner 應該使用哪一種類型的 FM，來驅動這個搜尋應用程式？", "options": {"A": "多模態嵌入模型（Multi-modal embedding model）", "B": "文字嵌入模型（Text embedding model）", "C": "多模態生成模型（Multi-modal generation model）", "D": "影像生成模型（Image generation model）"}, "correct_answer": "A", "explanation": "多模態嵌入模型（multi-modal embedding model）能將文字與影像查詢都嵌入到同一個共享空間中，讓搜尋應用程式能處理並關聯不同類型的資料；其他選項都無法有效同時處理文字與影像輸入。"}, {"id": 19, "question": "一家公司在其 AI 搜尋工具中，使用來自 Amazon Bedrock 的基礎模型（FM），並想利用公司的資料對模型進行微調（fine-tune），以提高準確度。哪一種策略能成功微調這個模型？", "options": {"A": "提供含有 prompt 欄位與 completion 欄位的標記資料。", "B": "透過建立一個內容為多行 .csv 格式的 .txt 檔案來準備訓練資料集。", "C": "購買 Amazon Bedrock 的佈建輸送量（Provisioned Throughput）。", "D": "使用期刊與教科書訓練模型。"}, "correct_answer": "A", "explanation": "微調基礎模型的做法，是使用含有輸入 prompt 與對應預期 completion 的標記資料來訓練模型，藉此調整模型的行為，使其符合公司的需求；其他選項都與「使用特定標記資料進行微調」這個流程沒有直接關聯。"}, {"id": 20, "question": "一家公司想使用 AI 保護其應用程式免受威脅攻擊，這個 AI 解決方案需要判斷某個 IP 位址是否來自可疑來源。哪個解決方案符合這項需求？", "options": {"A": "建立一個語音辨識系統。", "B": "建立一個自然語言處理（NLP）命名實體辨識系統。", "C": "開發一個異常偵測（anomaly detection）系統。", "D": "建立一個詐欺預測系統。"}, "correct_answer": "C", "explanation": "異常偵測（anomaly detection）系統能辨識出可疑行為，例如偏離預期模式的 IP 位址，有助於保護應用程式免受威脅；其他選項的設計目的都不是用來偵測可疑 IP 位址。"}, {"id": 21, "question": "Amazon OpenSearch Service 的哪一項功能，讓公司能夠建置向量資料庫（vector database）應用程式？", "options": {"A": "與 Amazon S3 整合以進行物件儲存", "B": "支援地理空間索引（geospatial indexing）與查詢", "C": "可擴充的索引管理與最近鄰搜尋（nearest neighbor search）能力", "D": "能對串流資料進行即時分析"}, "correct_answer": "C", "explanation": "Amazon OpenSearch Service 中「可擴充的索引管理與最近鄰搜尋能力」這項功能，讓公司能夠建置向量資料庫應用程式，這對於 AI 模型中的相似度搜尋等任務至關重要；其他選項都沒有明確提供向量搜尋功能。"}, {"id": 22, "question": "以下哪一個選項是生成式 AI 模型的使用案例？", "options": {"A": "使用入侵偵測系統提升網路安全", "B": "根據文字描述生成擬真照片，用於數位行銷", "C": "使用優化索引提升資料庫效能", "D": "分析財務資料以預測股市趨勢"}, "correct_answer": "B", "explanation": "生成式 AI 模型用於創造新內容，例如根據文字描述生成擬真照片，這對數位行銷相當有用；其他選項所涉及的任務，更適合使用分析型或偵測型系統，而非生成式模型。"}, {"id": 23, "question": "一家公司想使用 Amazon Bedrock 建置一個生成式 AI 應用程式，需要選擇一個基礎模型（FM），並想了解一個 prompt 中能容納多少資訊量。哪一項考量因素會影響這家公司的決策？", "options": {"A": "Temperature", "B": "上下文視窗（Context window）", "C": "批次大小（Batch size）", "D": "模型大小"}, "correct_answer": "B", "explanation": "上下文視窗（context window）決定了單一 prompt 中能容納多少資訊，它指的是基礎模型一次能處理的 token 數量，會影響到可提供的輸入內容長度；其他選項都與 prompt 大小沒有直接關聯。"}, {"id": 24, "question": "一家公司想打造一個聊天機器人來協助客戶，這個聊天機器人要能在不需要人工介入的情況下解決技術問題。該公司選定了一個基礎模型（FM）作為聊天機器人的基礎，且聊天機器人的回應必須符合公司的語調風格。哪個解決方案符合這項需求？", "options": {"A": "對 FM 能產生的 token 數量設定較低的上限。", "B": "使用批次推論（batch inferencing）來處理詳細回應。", "C": "反覆調整並優化 prompt，直到 FM 能產出理想的回應。", "D": "為 temperature 參數設定較高的數值。"}, "correct_answer": "C", "explanation": "反覆調整並優化 prompt，能引導 FM 產出符合公司期望語調的回應，這種做法有助於塑造聊天機器人的行為表現；其他選項都無法直接確保回應符合公司的語調風格。"}, {"id": 25, "question": "一家公司想在 Amazon Bedrock 上使用大型語言模型（LLM）進行情感分析，將文字段落的情感分類為正面或負面。哪種 prompt engineering 策略符合這項需求？", "options": {"A": "在 prompt 中提供文字段落及其對應正面或負面標籤的範例，接著再放入要分類的新文字段落。", "B": "在 prompt 中詳細說明什麼是情感分析，以及 LLM 是如何運作的。", "C": "直接提供要分類的新文字段落，不附加任何額外的背景說明或範例。", "D": "提供新文字段落，並附上幾個與情感分析無關的任務範例，例如文字摘要或問答。"}, "correct_answer": "A", "explanation": "在 prompt 中提供附有標籤的範例，能幫助 LLM 理解情感分析的情境脈絡，進而提升其在分類新文字段落為正面或負面時的準確度；其他選項都無法有效引導 LLM 完成情感分析任務。"}, {"id": 26, "question": "一家資安公司正在使用 Amazon Bedrock 執行基礎模型（FM），該公司想確保只有經過授權的使用者能呼叫這些模型，並需要識別出任何未經授權的存取嘗試，以便為未來版本的 FM 設定適當的 AWS Identity and Access Management（IAM）政策與角色。該公司應使用哪一項 AWS 服務，來識別嘗試存取 Amazon Bedrock 的未授權使用者？", "options": {"A": "AWS Audit Manager", "B": "AWS CloudTrail", "C": "Amazon Fraud Detector", "D": "AWS Trusted Advisor"}, "correct_answer": "B", "explanation": "AWS CloudTrail 會記錄 API 活動，並提供存取嘗試的日誌記錄，有助於識別嘗試存取 Amazon Bedrock 的未授權使用者；其他服務在這個情境中，都不是專門用來追蹤未授權存取嘗試的。"}, {"id": 27, "question": "一家公司已開發出一個用於影像分類的 ML 模型，想將模型部署到正式環境，讓一個網頁應用程式能使用這個模型。該公司需要一個解決方案，能在不需要管理任何底層基礎架構的情況下，代管模型並提供預測服務。哪個解決方案符合這項需求？", "options": {"A": "使用 Amazon SageMaker Serverless Inference 部署模型。", "B": "使用 Amazon CloudFront 部署模型。", "C": "使用 Amazon API Gateway 代管模型並提供預測服務。", "D": "使用 AWS Batch 代管模型並提供預測服務。"}, "correct_answer": "A", "explanation": "Amazon SageMaker Serverless Inference 讓公司能在不需要管理任何底層基礎架構的情況下部署 ML 模型，適合用來代管模型並提供預測服務；其他選項都無法直接提供無伺服器的模型部署能力。"}, {"id": 28, "question": "一家 AI 公司會定期在獨立軟體供應商（ISV）的協助下，評估自身的系統與流程。該公司需要在 ISV 的合規報告產出時，收到電子郵件通知。該公司可以使用哪一項 AWS 服務來符合這項需求？", "options": {"A": "AWS Audit Manager", "B": "AWS Artifact", "C": "AWS Trusted Advisor", "D": "AWS Data Exchange"}, "correct_answer": "B", "explanation": "AWS Artifact 提供合規報告的存取權限，包括來自獨立軟體供應商（ISV）的報告。該公司可以使用 AWS Artifact，在有新的合規報告產出時收到通知；其他服務都不是用來存取合規報告並發出通知的。"}, {"id": 29, "question": "一家公司想使用大型語言模型（LLM）開發一個對話式代理人（conversational agent），需要防止 LLM 被常見的 prompt engineering 技巧操控，進而執行不當行為或洩露敏感資訊。哪種做法能降低這些風險？", "options": {"A": "建立一個 prompt 範本，教導 LLM 偵測攻擊模式。", "B": "在呼叫 LLM 的請求中，提高 temperature 參數。", "C": "避免使用未列在 Amazon SageMaker 中的 LLM。", "D": "減少呼叫 LLM 時的輸入 token 數量。"}, "correct_answer": "A", "explanation": "建立一個能幫助 LLM 偵測常見攻擊模式的 prompt 範本，可以降低 prompt injection 及其他不當操控行為的風險；其他選項都無法有效處理 prompt 被操控或未經授權使用的風險。"}, {"id": 30, "question": "一家公司正在使用生成式 AI 安全範圍矩陣（Generative AI Security Scoping Matrix），評估其解決方案的安全責任。該公司根據這個矩陣，識別出四種不同的解決方案範圍。哪一種解決方案範圍，會讓該公司承擔最多（MOST）的安全責任？", "options": {"A": "使用一個內嵌了生成式 AI 功能的第三方企業應用程式。", "B": "使用既有的第三方生成式 AI 基礎模型（FM）來建置應用程式。", "C": "使用該公司特定的業務資料，對既有的第三方生成式 AI 基礎模型（FM）進行微調（fine-tuning）加以優化。", "D": "使用客戶自有的特定資料，從零開始建置並訓練一個生成式 AI 模型。"}, "correct_answer": "D", "explanation": "從零開始建置並訓練一個生成式 AI 模型，會讓該公司承擔最多的安全責任，因為這涉及對資料、訓練、部署與安全措施的完整掌控；其他選項則涉及不同程度地依賴第三方工具與服務，這會降低該公司在安全方面的掌控程度。"}, {"id": 31, "question": "一位 AI practitioner 擁有一個動物照片資料庫，想在不需要人工投入的情況下，自動辨識並分類照片中的動物。哪種策略符合這項需求？", "options": {"A": "物件偵測（Object detection）", "B": "異常偵測（Anomaly detection）", "C": "命名實體辨識（Named entity recognition）", "D": "圖像修復（Inpainting）"}, "correct_answer": "A", "explanation": "物件偵測（object detection）用於自動辨識並分類照片中的物件（在此情境中是動物），它能偵測動物的存在，並對其進行相應的分類；其他策略都不適合用來辨識並分類影像中的動物。"}, {"id": 32, "question": "一家公司想使用 Amazon Bedrock 建立一個應用程式，該公司的預算有限，並希望在不需要長期承諾的情況下保有彈性。哪一種 Amazon Bedrock 定價模式符合這項需求？", "options": {"A": "隨用隨付（On-Demand）", "B": "模型自訂（Model customization）", "C": "佈建輸送量（Provisioned Throughput）", "D": "Spot 執行個體（Spot Instance）"}, "correct_answer": "A", "explanation": "隨用隨付（On-Demand）定價模式提供彈性、不需要長期承諾，讓公司只需為實際使用的資源付費，非常適合預算有限的情況；其他選項要不是與定價彈性無關，就是涉及特定的資源承諾。"}, {"id": 33, "question": "哪個 AWS 服務或功能可以協助 AI 開發團隊在團隊的 VPC 內快速部署並使用基礎模型（FM）？", "options": {"A": "Amazon Personalize", "B": "Amazon SageMaker JumpStart", "C": "PartyRock（Amazon Bedrock 的 Playground）", "D": "Amazon SageMaker endpoints"}, "correct_answer": "B", "explanation": "Amazon SageMaker JumpStart 提供預先建置好的模型（包含基礎模型），可以在 VPC 內快速部署並使用，協助團隊更快上手。其他選項在此情境下並非用來部署基礎模型而設計的。"}, {"id": 34, "question": "企業要如何在 Amazon Bedrock 上安全地使用大型語言模型（LLM）？", "options": {"A": "透過最小權限原則來設定 AWS Identity and Access Management（IAM）角色與政策。", "B": "啟用 AWS Audit Manager 來執行自動模型評估工作。", "C": "啟用 Amazon Bedrock 的自動模型評估工作。", "D": "使用 Amazon CloudWatch Logs 讓模型具備可解釋性，並監控是否有偏誤。"}, "correct_answer": "A", "explanation": "設計清楚的提示詞，並搭配最小權限原則的 IAM 角色 (IAM Role)，能降低存取風險並防止誤用，確保在 Amazon Bedrock 上安全地使用 LLM。其他選項都沒有直接針對 LLM 使用安全性的問題。"}, {"id": 35, "question": "一間公司的資料庫裡有數 TB 的資料可以用來做商業分析。這間公司想打造一個 AI 應用程式，能根據員工輸入的文字自動產生 SQL 查詢語句。這些員工的技術經驗都不多。哪個解決方案能滿足這個需求？", "options": {"A": "Generative pre-trained transformers（GPT）", "B": "殘差神經網路（Residual neural network）", "C": "支援向量機（Support vector machine）", "D": "WaveNet"}, "correct_answer": "A", "explanation": "GPT 模型很適合把自然語言輸入轉換成像 SQL 這樣的結構化查詢，因此很適合用來打造能把員工輸入文字轉成 SQL 查詢的 AI 應用程式。其他選項都不是為了自然語言理解與查詢產生任務而設計的。"}, {"id": 36, "question": "一間公司建立了一個用於物件偵測的深度學習模型，並將模型部署到正式環境中。當模型分析一張新的圖片來辨識物件時，這屬於哪一個 AI 流程？", "options": {"A": "訓練（Training）", "B": "推論（Inference）", "C": "模型部署（Model deployment）", "D": "偏誤校正（Bias correction）"}, "correct_answer": "B", "explanation": "推論（Inference）是模型分析新資料（在此指一張新圖片）以做出預測或辨識物件的流程。其他選項則屬於 AI 生命週期中不同的階段，例如建立或準備模型。"}, {"id": 37, "question": "一位 AI 從業人員正在建立一個模型，用來產生各種職業人物的圖片。這位從業人員發現輸入資料存在偏誤，且特定屬性會影響圖片生成，並在模型中造成偏誤。哪個技術可以解決這個問題？", "options": {"A": "針對類別不平衡進行資料增強（Data augmentation）", "B": "監控模型的類別分布（Model monitoring）", "C": "Retrieval Augmented Generation（RAG）", "D": "圖片浮水印偵測（Watermark detection）"}, "correct_answer": "A", "explanation": "針對類別不平衡進行資料增強，可以打造出更平衡的資料集，確保不同屬性都能被平均呈現，藉此解決偏誤問題，進而降低圖片生成上的偏誤。其他選項都沒有直接解決資料偏誤的問題。"}, {"id": 38, "question": "一間公司在 Amazon Bedrock 中使用 Amazon Titan 基礎模型（FM）。這間公司需要用公司內部私有資料來源中的相關資料來補充這個模型。哪個解決方案能滿足這個需求？", "options": {"A": "使用不同的 FM。", "B": "選擇較低的 temperature 值。", "C": "建立一個 Amazon Bedrock knowledge base。", "D": "啟用模型呼叫記錄（model invocation logging）。"}, "correct_answer": "C", "explanation": "建立 Amazon Bedrock knowledge base 可以讓公司用自家私有資料來源中的相關資料來補充基礎模型，確保模型能取得所需的額外情境資訊。其他選項都沒有直接解決用私有資料補充模型的問題。"}, {"id": 39, "question": "一間醫療公司正在為診斷用途客製化一個基礎模型（FM）。這間公司需要模型具備透明度與可解釋性，以符合法規要求。哪個解決方案能滿足這個需求？", "options": {"A": "使用 Amazon Inspector 來設定安全性與合規性。", "B": "使用 Amazon SageMaker Clarify 產生簡易的指標、報告與範例。", "C": "使用 Amazon Macie 對訓練資料進行加密與保護。", "D": "蒐集更多資料，並使用 Amazon Rekognition 為資料加上自訂標籤。"}, "correct_answer": "B", "explanation": "Amazon SageMaker Clarify 能產生指標、報告與範例，展示模型是如何做出決策，藉此協助提升透明度與可解釋性，這對符合法規要求相當重要。其他選項都沒有直接與提升模型透明度或可解釋性相關。"}, {"id": 40, "question": "一間公司想部署一個對話式聊天機器人來回答顧客問題。這個聊天機器人是基於一個經過微調的 Amazon SageMaker JumpStart 模型。這個應用程式必須符合多項法規框架。這間公司可以針對哪些能力展現合規性？（選擇兩項）", "options": {"A": "推論端點的自動擴展（Auto scaling inference endpoints）", "B": "威脅偵測（Threat detection）", "C": "資料保護（Data protection）", "D": "成本優化（Cost optimization）", "E": "低耦合的微服務架構（Loosely coupled microservices）"}, "correct_answer": "BC", "explanation": "威脅偵測：確保有安全措施能偵測威脅，這對符合法規框架來說相當重要。資料保護：妥善的資料處理與保護措施是合規的關鍵環節，尤其是在處理敏感顧客資訊的應用程式中更是如此。其他選項（自動擴展、成本優化、低耦合的微服務架構）比較偏向效能與架構層面，而非法規合規性。"}, {"id": 41, "question": "一間公司正在訓練一個基礎模型（FM），想把模型的準確度提升到特定的可接受水準。哪個解決方案能滿足這個需求？", "options": {"A": "減少 batch size。", "B": "增加 epoch 數。", "C": "減少 epoch 數。", "D": "提高 temperature 參數。"}, "correct_answer": "B", "explanation": "增加 epoch 數能讓模型進行更多輪的訓練迭代，逐步提升準確度，直到模型達到最佳水準。其他選項要不是效果較差，就是與提升準確度無關。"}, {"id": 42, "question": "一間公司正在建立一個大型語言模型（LLM）問答聊天機器人，想減少客服中心員工回答顧客問題所需採取的動作數量。這間公司應該用哪個商業目標來評估這個 LLM 聊天機器人的成效？", "options": {"A": "網站互動率（Website engagement rate）", "B": "平均通話時間（Average call duration）", "C": "企業社會責任（Corporate social responsibility）", "D": "法規遵循（Regulatory compliance）"}, "correct_answer": "B", "explanation": "縮短平均通話時間，能直接反映出 LLM 聊天機器人在協助客服中心員工回答顧客問題上的成效，進而減少所需的動作數量。其他選項都與客服中心聊天機器人的表現沒有直接關聯。"}, {"id": 43, "question": "Amazon SageMaker Clarify 提供哪項功能？", "options": {"A": "整合 Retrieval Augmented Generation（RAG）工作流程", "B": "監控正式環境中 ML 模型的品質", "C": "記錄 ML 模型的重要細節", "D": "在資料準備階段找出潛在的偏誤"}, "correct_answer": "D", "explanation": "Amazon SageMaker Clarify 能在資料準備、訓練與部署階段，協助偵測資料集與模型中潛在的偏誤，同時也提供可解釋性相關的工具。其他選項所描述的功能，都不是 SageMaker Clarify 的核心功能。"}, {"id": 44, "question": "一間公司正在開發一個新模型，用來預測特定商品的價格。這個模型在訓練資料集上表現良好，但當公司把模型部署到正式環境後，模型的表現大幅下降。這間公司應該怎麼做來緩解這個問題？", "options": {"A": "減少用於訓練的資料量。", "B": "為模型加上超參數（hyperparameters）。", "C": "增加用於訓練的資料量。", "D": "延長模型的訓練時間。"}, "correct_answer": "C", "explanation": "增加用於訓練的資料量，有助於模型對未曾見過的新資料做出更好的泛化，降低過擬合（overfitting）的情況，進而提升在正式環境中的表現。其他選項要不是沒有解決模型泛化的問題，就是不太可能有效解決這個問題。"}, {"id": 45, "question": "一間電商公司想建立一個解決方案，根據顧客針對商品撰寫的評論來判斷顧客情緒。哪些 AWS 服務能滿足這個需求？（選擇兩項）", "options": {"A": "Amazon Lex", "B": "Amazon Comprehend", "C": "Amazon Polly", "D": "Amazon Bedrock", "E": "Amazon Rekognition"}, "correct_answer": "BD", "explanation": "Amazon Comprehend：這個服務是專為自然語言處理（NLP）任務所設計的，其中就包含情緒分析，非常適合用來分析顧客評論。Amazon Bedrock：Bedrock 可以用來運用基礎模型，同樣也能執行情緒分析任務。其他選項都不適合用來分析顧客書面評論的情緒。"}, {"id": 46, "question": "一間公司想搭配 Amazon Bedrock 使用大型語言模型（LLM），為公司的產品手冊開發一個聊天介面。這些手冊都是以 PDF 檔案的形式儲存。哪個解決方案能以最符合成本效益的方式滿足這個需求？", "options": {"A": "使用提示詞工程（prompt engineering），在提交給 Amazon Bedrock 的使用者提示詞中，加入一份 PDF 檔案作為情境內容。", "B": "使用提示詞工程（prompt engineering），在提交給 Amazon Bedrock 的使用者提示詞中，加入所有 PDF 檔案作為情境內容。", "C": "使用所有 PDF 文件在 Amazon Bedrock 上微調（fine-tune）一個模型，再用這個微調後的模型來處理使用者提示詞。", "D": "將 PDF 文件上傳到 Amazon Bedrock knowledge base，當使用者向 Amazon Bedrock 提交提示詞時，用這個 knowledge base 來提供情境內容。"}, "correct_answer": "D", "explanation": "使用 Amazon Bedrock knowledge base，能讓模型在需要時有效率地從 PDF 手冊中取得相關資訊，相較於持續微調模型、或每次提示詞都帶入所有 PDF 作為情境內容，成本更低。這種做法能確保只提供必要的情境內容，因此更符合成本效益。"}, {"id": 47, "question": "一間社群媒體公司想用大型語言模型（LLM）來做內容審核，並想評估 LLM 的輸出結果是否對特定群體或個人存在偏誤與潛在歧視。這間公司應該使用哪個資料來源，才能用最少的行政作業來評估 LLM 的輸出結果？", "options": {"A": "使用者產生的內容（User-generated content）", "B": "審核紀錄（Moderation logs）", "C": "內容審核準則（Content moderation guidelines）", "D": "基準資料集（Benchmark datasets）"}, "correct_answer": "D", "explanation": "基準資料集（Benchmark datasets）是專門為評估模型偏誤與公平性所設計的標準化資料集，能以最少的行政作業有效進行評估。其他選項則需要更多人工處理，也不一定能提供一致的基準來評估偏誤與歧視。"}, {"id": 48, "question": "一間公司想用一個預先訓練好的生成式 AI 模型，為行銷活動產生內容，並需要確保產生出來的內容符合公司的品牌調性與訊息要求。哪個解決方案能滿足這個需求？", "options": {"A": "優化模型的架構與超參數（hyperparameters），以提升模型的整體表現。", "B": "在模型架構中加入更多層，以增加模型的複雜度。", "C": "設計有效的提示詞（prompt），提供清楚的指令與情境來引導模型生成內容。", "D": "選擇一個龐大且多元的資料集，來預先訓練一個新的生成式模型。"}, "correct_answer": "C", "explanation": "設計有效的提示詞，能引導預先訓練好的生成式 AI 模型產出符合公司品牌調性與訊息的內容。其他選項不是涉及模型架構的變更，就是需要大量訓練，而這些對於讓生成內容對齊 (Align)品牌調性來說並非必要。"}, {"id": 49, "question": "一間貸款公司正在打造一個以生成式 AI 為基礎的解決方案，根據特定商業條件為新申請人提供折扣。這間公司想以負責任的方式建立並使用 AI 模型，以降低可能對部分顧客造成負面影響的偏誤。這間公司應該採取哪些行動來滿足這個需求？（選擇兩項）", "options": {"A": "偵測資料中的不平衡或差異。", "B": "確保模型頻繁地運行。", "C": "評估模型的行為，讓公司能對利害關係人展現透明度。", "D": "使用 Recall-Oriented Understudy for Gisting Evaluation（ROUGE）技術來確保模型達到 100% 準確。", "E": "確保模型的推論（inference）時間在可接受的範圍內。"}, "correct_answer": "AC", "explanation": "偵測資料中的不平衡或差異：找出並處理資料中的不平衡狀況，有助於降低可能對顧客造成負面影響的偏誤。評估模型的行為，讓公司能對利害關係人展現透明度：評估模型並確保透明度，對負責任地使用 AI 相當重要，能幫助利害關係人理解決策是如何產生的。其他選項要不是與降低偏誤沒有直接關聯，就是無助於負責任的 AI 開發。"}, {"id": 50, "question": "一間公司使用 Amazon Bedrock 的基礎模型，為內部使用案例摘要文件。這間公司訓練了一個自訂模型，以提升摘要品質。這間公司必須採取哪個行動，才能透過 Amazon Bedrock 使用這個自訂模型？", "options": {"A": "為自訂模型購買 Provisioned Throughput。", "B": "將自訂模型部署到 Amazon SageMaker endpoint 上，以進行即時推論。", "C": "將模型註冊到 Amazon SageMaker Model Registry。", "D": "在 Amazon Bedrock 中授予這個自訂模型的存取權限。"}, "correct_answer": "A", "explanation": "Amazon Bedrock 上的自訂模型(不管是微調過的模型,還是用 Continued Pre-training 訓練出來的模型),不能像基礎模型一樣直接用 on-demand 方式呼叫。你必須先幫這個自訂模型購買 Provisioned Throughput(佈建輸送量),用固定的模型單元(model units)保留運算容量,才能透過 Bedrock 呼叫它做推論。B 選項的 SageMaker endpoint 部署跟 C 選項的 SageMaker Model Registry 都是 SageMaker 自己的模型管理機制,跟 Bedrock 自訂模型的呼叫方式無關;D 選項的「授予存取權限」是 IAM 層級的權限管理,不會讓模型變成可呼叫的狀態,重點還是要有 Provisioned Throughput。"}, {"id": 51, "question": "一間公司需要從 Amazon Bedrock 中選出一個模型供內部使用，並必須找出一個能以員工偏好風格產生回覆的模型。這間公司應該怎麼做來滿足這個需求？", "options": {"A": "使用內建的提示詞資料集（prompt datasets）來評估模型。", "B": "使用人工評估團隊搭配自訂提示詞資料集來評估模型。", "C": "使用公開的模型排行榜（leaderboards）來找出模型。", "D": "在試用模型時，使用 Amazon CloudWatch 中的模型 InvocationLatency 執行期指標。"}, "correct_answer": "B", "explanation": "使用人工評估團隊搭配自訂提示詞資料集來評估模型，能確保模型產生的回覆風格符合公司的偏好。其他選項要不是無法直接提供風格偏好的回饋，就是不夠精確，難以根據員工偏好判斷模型是否合適。"}, {"id": 52, "question": "一位大學學生把生成式 AI 產生的內容拿去抄寫論文。這個情境代表負責任生成式 AI 的哪一項挑戰？", "options": {"A": "毒性內容（Toxicity）", "B": "幻覺（Hallucinations）", "C": "抄襲（Plagiarism）", "D": "隱私（Privacy）"}, "correct_answer": "C", "explanation": "在沒有適當引註的情況下，把生成式 AI 產生的內容拿去抄寫論文，屬於抄襲行為，這正是負責任生成式 AI 的一項重要挑戰。其他選項都與這個特定問題無關。"}, {"id": 53, "question": "一間公司需要僅根據公司內部的私有資料，建立自己專屬的大型語言模型（LLM），並很在意訓練過程對環境造成的影響。在訓練 LLM 時，哪種 Amazon EC2 執行個體類型對環境的影響最小？", "options": {"A": "Amazon EC2 C 系列", "B": "Amazon EC2 G 系列", "C": "Amazon EC2 P 系列", "D": "Amazon EC2 Trn 系列"}, "correct_answer": "D", "explanation": "Amazon EC2 Trn 系列執行個體（採用 AWS Trainium 晶片）的設計目標，就是要提供高效且對環境友善的大型機器學習模型訓練方式。這類執行個體針對能源效率做了優化，能降低訓練過程對環境的影響。其他執行個體類型都沒有特別針對降低訓練過程的環境影響做優化。"}, {"id": 54, "question": "一間公司想打造一個給兒童使用的互動應用程式，能根據經典故事產生新故事。這間公司想使用 Amazon Bedrock，並需要確保產生的結果與主題都適合兒童。哪個 AWS 服務或功能能滿足這個需求？", "options": {"A": "Amazon Rekognition", "B": "Amazon Bedrock playgrounds", "C": "Guardrails for Amazon Bedrock", "D": "Agents for Amazon Bedrock"}, "correct_answer": "C", "explanation": "Guardrails for Amazon Bedrock 能協助確保 Amazon Bedrock 產生的輸出內容適合兒童。Guardrails 可以套用內容審核與準則，並透過過濾潛在有害或不適當的內容來確保安全，這在打造給兒童使用的互動應用程式時相當重要。"}, {"id": 55, "question": "一間公司正在打造一個需要根據現有資料產生合成資料（synthetic data）的應用程式。這間公司可以使用哪種類型的模型來滿足這個需求？", "options": {"A": "生成對抗網路（Generative adversarial network，GAN）", "B": "XGBoost", "C": "殘差神經網路（Residual neural network）", "D": "WaveNet"}, "correct_answer": "A", "explanation": "生成對抗網路(GAN)由生成器(Generator)和判別器(Discriminator)兩個網路互相對抗訓練,生成器負責產生跟真實資料分布相似的新樣本,判別器負責分辨真假,這正是「根據既有資料生成合成資料」最經典的模型架構,常用在合成圖片、表格資料、感測器資料等場景。B 選項 XGBoost 是梯度提升樹,用於分類/迴歸預測,不具生成能力;C 選項殘差神經網路(ResNet)是影像分類/特徵萃取用的深度學習架構,同樣不是生成模型;D 選項 WaveNet 雖然也是生成式模型,但專門用來生成音訊波形,不是通用的合成資料生成方案,題目沒有限定音訊情境,所以不是最佳選擇。"}, {"id": 56, "question": "一間數位裝置公司想預測顧客對記憶體硬體的需求。這間公司沒有寫程式的經驗，也不懂 ML 演算法，需要開發一個以資料為基礎的預測模型，並需要同時分析內部資料與外部資料。哪個解決方案能滿足這個需求？", "options": {"A": "將資料儲存在 Amazon S3 中，並使用 Amazon SageMaker 內建演算法讀取 Amazon S3 的資料，建立 ML 模型並產生需求預測。", "B": "將資料匯入 Amazon SageMaker Data Wrangler，並使用 SageMaker 內建演算法建立 ML 模型並產生需求預測。", "C": "將資料匯入 Amazon SageMaker Data Wrangler，並使用 Amazon Personalize 的 Trending-Now recipe 建立 ML 模型並產生需求預測。", "D": "將資料匯入 Amazon SageMaker Canvas，並在 SageMaker Canvas 中選取資料欄位數值，建立 ML 模型並產生需求預測。"}, "correct_answer": "D", "explanation": "Amazon SageMaker Canvas 是一個免寫程式（no-code）工具，讓使用者不需要程式知識就能建立 ML 模型並產生預測。它很適合沒有寫程式經驗的使用者，提供簡易的介面來匯入資料並產生預測模型。其他選項都需要更多技術背景，或並非為免寫程式建模而設計。"}, {"id": 57, "question": "一間公司安裝了監視攝影機，並使用 ML 模型分析監視器畫面，判斷是否有潛在竊盜行為。這間公司發現，模型不成比例地標記出屬於特定族群的人。哪種類型的偏誤正在影響模型的輸出結果？", "options": {"A": "測量偏誤（Measurement bias）", "B": "取樣偏誤（Sampling bias）", "C": "觀察者偏誤（Observer bias）", "D": "確認偏誤（Confirmation bias）"}, "correct_answer": "B", "explanation": "當訓練資料無法代表整體母體時，就會產生取樣偏誤，導致特定群體被不成比例地標記出來。在這個情境中，模型可能是用未能充分代表所有族群的偏誤資料訓練而成，因而產生失衡的預測結果。其他類型的偏誤都與訓練資料的選取或代表性沒有直接關聯。"}, {"id": 58, "question": "一間公司正在打造一個客服聊天機器人，希望這個聊天機器人能透過學習過去的互動記錄與線上資源，來持續改善回覆內容。哪種 AI 學習策略能提供這種自我改進的能力？", "options": {"A": "使用人工整理的好回覆與壞回覆資料集進行監督式學習（Supervised learning）", "B": "根據正面顧客回饋給予獎勵的強化學習（Reinforcement learning）", "C": "使用非監督式學習（Unsupervised learning）找出相似顧客詢問的分群", "D": "搭配持續更新的常見問答資料庫進行監督式學習（Supervised learning）"}, "correct_answer": "B", "explanation": "強化學習（Reinforcement learning）能讓聊天機器人透過正面顧客回饋所給予的獎勵，從互動中學習，隨著時間逐步自我改進。其他選項都沒有提供根據互動持續自我改進的直接機制。"}, {"id": 59, "question": "一位 AI 從業人員建立了一個深度學習模型，用來分類圖片中的材質類型，現在想衡量模型的表現。哪個指標能幫助這位從業人員評估模型的表現？", "options": {"A": "混淆矩陣（Confusion matrix）", "B": "相關矩陣（Correlation matrix）", "C": "R2 分數（R2 score）", "D": "均方誤差（Mean squared error，MSE）"}, "correct_answer": "A", "explanation": "混淆矩陣（Confusion matrix）能透過呈現 true positive、false positive、true negative 與 false negative 的數量，提供分類模型表現的詳細洞察。這個指標有助於評估模型分類圖片中不同材質類型的準確程度。其他指標都不太適合用來評估分類模型。"}, {"id": 60, "question": "一間公司打造了一個能用圖片回答自然語言問題的聊天機器人，並想確保這個聊天機器人不會回傳不適當或不想要的圖片。哪個解決方案能滿足這個需求？", "options": {"A": "導入審核 API（moderation APIs）。", "B": "使用一般公開資料集重新訓練模型。", "C": "執行模型驗證。", "D": "自動化整合使用者回饋。"}, "correct_answer": "A", "explanation": "導入審核 API，能在聊天機器人回傳圖片之前，先過濾並阻擋不適當或不想要的圖片。其他選項都沒有直接解決確保聊天機器人不回傳不適當圖片的問題。"}, {"id": 61, "question": "一位 AI 從業人員使用 Amazon Bedrock 的基礎模型，摘要客服部門的對話紀錄，並想儲存呼叫記錄（invocation logs），以監控模型的輸入與輸出資料。這位從業人員應該採用哪種策略？", "options": {"A": "將 AWS CloudTrail 設定為模型的記錄目的地。", "B": "在 Amazon Bedrock 中啟用模型呼叫記錄（model invocation logging）。", "C": "將 AWS Audit Manager 設定為模型的記錄目的地。", "D": "在 Amazon EventBridge 中設定模型呼叫記錄。"}, "correct_answer": "B", "explanation": "在 Amazon Bedrock 中啟用呼叫記錄功能，能讓這位從業人員監控並儲存模型呼叫的輸入與輸出資料。其他選項都不是直接用來記錄 Amazon Bedrock 模型呼叫的方式。"}, {"id": 62, "question": "一間公司正在建立一個 ML 模型來分析歸檔資料，必須對數 GB 大小的大型資料集執行推論（inference），且不需要立即取得模型的預測結果。哪個 Amazon SageMaker 推論選項能滿足這個需求？", "options": {"A": "Batch transform", "B": "即時推論（Real-time inference）", "C": "無伺服器推論（Serverless inference）", "D": "非同步推論（Asynchronous inference）"}, "correct_answer": "A", "explanation": "Batch transform 很適合處理不需要即時預測的大型資料集，能讓公司有效率地對數 GB 的資料執行推論，而不需要立即取得結果。其他選項則更適合需要即時或接近即時存取結果的情境。"}, {"id": 63, "question": "哪個名詞描述的是 AI 與自然語言處理（NLP）模型用來提升對文字資訊理解程度的、真實世界物件與概念的數值表示法？", "options": {"A": "Embeddings（詞嵌入）", "B": "Tokens（詞元）", "C": "模型（Models）", "D": "二進位檔（Binaries）"}, "correct_answer": "A", "explanation": "Embeddings 是真實世界物件與概念的數值表示法，能透過捕捉字詞或詞組之間的關係與相似性，幫助 AI 與 NLP 模型更有效地理解並處理文字資訊。其他選項都沒有描述這個概念。"}, {"id": 64, "question": "一間研究公司使用 Amazon Bedrock 的基礎模型（FM）建置了一個聊天機器人，這個聊天機器人會從大量研究論文資料庫中搜尋問題的答案。經過多次提示詞工程（prompt engineering）嘗試後，這間公司發現由於研究論文中含有複雜的科學術語，FM 的表現不佳。這間公司該如何提升聊天機器人的表現？", "options": {"A": "使用 few-shot prompting 來定義 FM 該如何回答問題。", "B": "使用 domain adaptation fine-tuning，讓 FM 適應複雜的科學術語。", "C": "變更 FM 的推論參數。", "D": "清理研究論文資料，移除複雜的科學術語。"}, "correct_answer": "B", "explanation": "Domain adaptation fine-tuning 能透過用特定領域的資料來訓練 FM，讓 FM 更能理解複雜的科學術語，進而提升它在這類專業內容上的表現。其他選項要不是效果不足，就是與有效處理複雜術語沒有直接關聯。"}, {"id": 65, "question": "某家公司想在 Amazon Bedrock 上使用大型語言模型（LLM）進行情感分析。該公司希望這個 LLM 對相同的輸入提示產生更一致的回應。公司應該調整哪個推論參數，才能滿足這個需求？", "options": {"A": "調降 temperature 值。", "B": "調升 temperature 值。", "C": "縮短輸出 token 的長度。", "D": "增加最大生成長度。"}, "correct_answer": "A", "explanation": "調降 temperature 值可以降低回應生成過程中的隨機性，讓模型輸出更具確定性、更一致。其他調整方式都無法直接確保回應的一致性。"}, {"id": 66, "question": "某家公司想利用 Amazon Bedrock 和上傳到 Amazon S3 的客戶資料，開發一個大型語言模型（LLM）應用程式。該公司的安全政策規定，每個團隊只能存取自己客戶的資料。哪個解決方案能滿足這個需求？", "options": {"A": "為每個團隊建立專屬的 Amazon Bedrock 自訂服務角色，讓各團隊只能存取自己團隊的客戶資料。", "B": "建立一個具備 Amazon S3 存取權的自訂服務角色，要求各團隊在每次 Amazon Bedrock 請求中指定客戶名稱。", "C": "先在 Amazon S3 中將個人資料去識別化，再更新 S3 儲存貯體（bucket）政策以允許團隊存取客戶資料。", "D": "建立一個具備完整 Amazon S3 存取權的 Amazon Bedrock 角色，並為每個團隊建立只能存取各自客戶資料夾的 IAM 角色 (IAM Role)。"}, "correct_answer": "A", "explanation": "為每個團隊建立專屬的 Amazon Bedrock 自訂服務角色、並限制其只能存取該團隊自己的客戶資料，能確保符合安全政策的要求，提供必要的資料隔離與存取控管。其他選項都無法有效落實各團隊專屬的存取限制，甚至可能帶來超出政策允許範圍的存取風險。"}, {"id": 67, "question": "某家醫療公司在 Amazon Bedrock 上部署了一個疾病偵測模型。為了符合隱私政策，該公司希望防止模型在回應中包含病患的個人資訊，同時希望在發生政策違規時能收到通知。哪個解決方案能滿足這些需求？", "options": {"A": "使用 Amazon Macie 掃描模型輸出中的敏感資料，並針對潛在的違規情況設定警示。", "B": "設定 AWS CloudTrail 監控模型的回應內容，並針對偵測到的個人資訊建立警示。", "C": "使用 Guardrails for Amazon Bedrock 過濾內容，並設定 Amazon CloudWatch 警示以通知政策違規情況。", "D": "實作 Amazon SageMaker Model Monitor 來偵測資料飄移，並在模型品質下降時收到警示。"}, "correct_answer": "C", "explanation": "Guardrails for Amazon Bedrock 可用來過濾內容，確保模型回應中不會包含病患的個人資訊。搭配設定 Amazon CloudWatch 警示，則能讓公司在發生政策違規時即時收到通知。其他選項都不是專門設計來過濾模型輸出、並監控政策合規性的工具。"}, {"id": 68, "question": "某家公司目前以人工方式審閱所有以 PDF 格式提交的履歷。隨著公司規模成長，預期履歷數量將超出人工審閱能負荷的範圍。公司需要一套自動化系統，將 PDF 履歷轉換成純文字格式以便進一步處理。哪個 AWS 服務能滿足這個需求？", "options": {"A": "Amazon Textract", "B": "Amazon Personalize", "C": "Amazon Lex", "D": "Amazon Transcribe"}, "correct_answer": "A", "explanation": "Amazon Textract 能從 PDF 文件中擷取文字，適合用來將履歷轉換成純文字以便後續處理。其他服務都不具備從 PDF 擷取文字的功能。"}, {"id": 69, "question": "某家教育機構正在建置一個問答應用程式，使用生成式 AI 模型來解說複雜的概念。該機構希望能依提問者的身分，自動調整模型回應的風格；機構會將提問使用者的年齡範圍提供給模型。哪個解決方案能以最少的實作工作量滿足這個需求？", "options": {"A": "使用能代表應用程式所支援各年齡範圍的額外訓練資料，對模型進行微調（fine-tune）。", "B": "在提示（prompt）情境中加入角色描述，指示模型回應應鎖定的目標年齡範圍。", "C": "使用思維鏈（chain-of-thought）推理，推導出適合該使用者的正確風格與複雜程度。", "D": "依使用者年齡摘要回應內容的長度，讓較年輕的使用者收到較短的回應。"}, "correct_answer": "B", "explanation": "在提示中加入角色描述，是根據使用者年齡範圍調整模型回應風格最簡單、也最有效的做法，只需極少的實作工作量就能有效客製化輸出結果。其他選項都涉及更複雜的流程，例如微調或額外的推理步驟。"}, {"id": 70, "question": "哪種策略可以用來評估一個應用於影像分類任務的基礎模型（FM）的準確度？", "options": {"A": "計算模型所使用資源的總成本。", "B": "將模型的表現與預先定義的基準資料集（benchmark dataset）進行比對，衡量其準確度。", "C": "計算神經網路中的層數。", "D": "評估模型處理影像時的色彩準確度。"}, "correct_answer": "B", "explanation": "透過將基礎模型的表現與預先定義的基準資料集進行比對來評估其準確度，是評估影像分類任務準確度的標準做法。其他選項都無法提供適當的分類準確度衡量方式。"}, {"id": 71, "question": "某家會計師事務所想導入大型語言模型（LLM）來自動化文件處理流程。事務所必須以負責任的方式推進，以避免潛在的危害。在開發與部署這個 LLM 時，事務所應該採取哪些做法？（選擇兩項。）", "options": {"A": "在模型評估中納入公平性指標。", "B": "調整模型的 temperature 參數。", "C": "修改訓練資料以降低偏誤。", "D": "避免訓練資料發生過度擬合（overfitting）。", "E": "運用提示工程（prompt engineering）技巧。"}, "correct_answer": "AC", "explanation": "在模型評估中納入公平性指標：公平性指標有助於確保 LLM 不帶偏見、能公平對待各種情況，這對負責任地使用 AI 至關重要。修改訓練資料以降低偏誤：調整訓練資料有助於減少可能存在的固有偏誤，讓 LLM 更公平、更負責任。其他選項雖然與一般的模型優化有關，但並未直接處理偏誤與公平性等負責任 AI 實踐所關注的潛在危害議題。"}, {"id": 72, "question": "某家公司正在建置一個 ML 模型。該公司蒐集了新資料，並透過建立相關性矩陣、計算統計量、將資料視覺化的方式進行分析。這家公司目前處於 ML 流程（pipeline）中的哪個階段？", "options": {"A": "資料前處理", "B": "特徵工程", "C": "探索性資料分析", "D": "超參數調校"}, "correct_answer": "C", "explanation": "這家公司目前處於探索性資料分析（EDA）階段，這個階段的工作包含透過統計量、視覺化圖表與相關性矩陣來整理歸納資料，以便在進入建模之前先了解資料集的樣貌。其他選項都是 ML 流程中後續才會進行的步驟。"}, {"id": 73, "question": "某家公司的文件因為資料庫發生錯誤而遺失了部分文字。該公司想建置一個 ML 模型，能針對缺失的文字提出可能的填補建議詞。哪種類型的模型能滿足這個需求？", "options": {"A": "主題建模（topic modeling）", "B": "分群模型（clustering models）", "C": "指示型 ML 模型（prescriptive ML models）", "D": "基於 BERT 的模型"}, "correct_answer": "D", "explanation": "基於 BERT 的模型非常適合用於自然語言理解任務，包括填補缺失文字，因為它們會運用上下文資訊來預測文字中缺失的 token。其他類型的模型都不是為了這種文字填補任務而設計。"}, {"id": 74, "question": "某家公司想呈現旗下暢銷產品在過去 12 個月內於各零售據點的總銷售額。這家公司應該使用哪個 AWS 解決方案，來自動產生圖表？", "options": {"A": "Amazon EC2 中的 Amazon Q", "B": "Amazon Q Developer", "C": "Amazon QuickSight 中的 Amazon Q", "D": "AWS Chatbot 中的 Amazon Q"}, "correct_answer": "C", "explanation": "Amazon QuickSight 中的 Amazon Q 讓使用者能以自然語言提問，並自動產生圖表與視覺化內容來呈現洞察，例如暢銷產品的總銷售額。其他選項都無法提供相同的視覺化分析產生功能。"}, {"id": 75, "question": "某家公司正在建置一個聊天機器人（chatbot）以提升使用者體驗，並使用 Amazon Bedrock 上的大型語言模型（LLM）進行意圖偵測。該公司想運用少樣本學習（few-shot learning）來提升意圖偵測的準確度。公司需要哪一種額外的資料才能滿足這個需求？", "options": {"A": "聊天機器人回應與正確使用者意圖的配對資料", "B": "使用者訊息與正確聊天機器人回應的配對資料", "C": "使用者訊息與正確使用者意圖的配對資料", "D": "使用者意圖與正確聊天機器人回應的配對資料"}, "correct_answer": "C", "explanation": "少樣本學習是透過提供模型少量範例，協助它理解該如何執行任務。以意圖偵測來說，公司需要的是「使用者訊息」與「正確使用者意圖」的配對資料，這能幫助 LLM 提升偵測使用者意圖的準確度。其他選項都無法提供改善意圖偵測所需要的正確配對資料。"}, {"id": 76, "question": "某家公司在 Amazon Bedrock 上代管的基礎模型上使用少樣本提示（few-shot prompting），目前提示中使用了 10 個範例。這個模型每天呼叫一次，表現良好。該公司想降低每月成本。哪個解決方案能滿足這個需求？", "options": {"A": "透過微調（fine-tuning）客製化模型。", "B": "減少提示中的 token 數量。", "C": "增加提示中的 token 數量。", "D": "使用 Provisioned Throughput（預置輸出量）。"}, "correct_answer": "B", "explanation": "減少提示中的 token 數量，能降低需要處理的資料量，進而降低使用模型的成本。既然模型表現已經良好，縮小提示大小是一種能在維持效能的同時降低費用的划算做法。其他選項不是會增加成本，就是與提示大小無關。"}, {"id": 77, "question": "一位 AI 從業人員正在使用大型語言模型（LLM）產生行銷活動的內容。生成的內容聽起來合理、也像是事實，但實際上是錯誤的。這個 LLM 出現的是什麼問題？", "options": {"A": "資料洩漏（data leakage）", "B": "幻覺（hallucination）", "C": "過度擬合（overfitting）", "D": "擬合不足（underfitting）"}, "correct_answer": "B", "explanation": "幻覺（hallucination）指的是大型語言模型生成的內容看起來合理、像是事實，但實際上卻是錯誤或憑空捏造的。這是 LLM 常見的問題之一。其他選項都無法描述這種特定的行為。"}, {"id": 78, "question": "一位 AI 從業人員使用包含機密資料的訓練資料集，在 Amazon Bedrock 上訓練了一個自訂模型。這位 AI 從業人員想確保這個自訂模型在推論回應時，不會根據機密資料產生內容。這位 AI 從業人員應該如何防止模型根據機密資料產生回應？", "options": {"A": "刪除該自訂模型，從訓練資料集中移除機密資料，然後重新訓練這個自訂模型。", "B": "使用動態資料遮罩（dynamic data masking），在推論回應中遮蓋機密資料。", "C": "使用 Amazon SageMaker，將推論回應中的機密資料加密。", "D": "使用 AWS Key Management Service（AWS KMS），將自訂模型中的機密資料加密。"}, "correct_answer": "A", "explanation": "若要確保自訂模型不會根據機密資料產生回應，最好的做法是在不包含機密資料的情況下重新訓練模型。這麼做可以防止模型學到與該敏感資訊相關的模式，從而避免這些資訊在推論階段被使用。其他選項都沒有處理到問題的根本原因，也就是必須先從訓練流程中移除機密資料。"}, {"id": 79, "question": "某家公司運用生成式 AI 建置了一套解決方案，使用大型語言模型（LLM）將教育訓練手冊從英文翻譯成其他語言。該公司想透過檢視手冊生成的文字內容，評估這套解決方案的準確度。哪種模型評估策略能滿足這個需求？", "options": {"A": "BLEU（Bilingual Evaluation Understudy）", "B": "均方根誤差（RMSE，Root Mean Squared Error）", "C": "ROUGE（Recall-Oriented Understudy for Gisting Evaluation）", "D": "F1 分數"}, "correct_answer": "A", "explanation": "BLEU（Bilingual Evaluation Understudy）分數是一種常用的指標，透過比對生成的翻譯結果與參考翻譯，來評估機器翻譯的準確度。它是專門為翻譯任務設計的評估方式，而其他指標都不適合用來評估翻譯品質。"}, {"id": 80, "question": "某大型零售商每天都會收到大量關於產品的客服詢問，這些客服詢問需要快速被處理。該公司想導入 Agents for Amazon Bedrock。使用 Amazon Bedrock agents 對這家零售商能帶來哪些關鍵好處？", "options": {"A": "生成自訂基礎模型（FM）以預測客戶需求", "B": "自動化重複性任務，並協調複雜的工作流程", "C": "自動呼叫多個基礎模型（FM）並彙整結果", "D": "依照預先定義的準則與指標選擇基礎模型（FM）"}, "correct_answer": "B", "explanation": "Amazon Bedrock agents 有助於自動化重複性任務，並協調複雜的工作流程，非常適合用來有效率地處理大量客服詢問，藉此縮短回應時間、提升生產力。其他選項都沒有直接針對客服任務的自動化與流程協調需求。"}, {"id": 81, "question": "在對基礎模型（FM）進行微調（fine-tune）時，持續進行預訓練（ongoing pre-training）的好處是什麼？", "options": {"A": "有助於降低模型的複雜度", "B": "隨著時間推移逐步提升模型效能", "C": "縮短訓練時間需求", "D": "優化模型的推論時間"}, "correct_answer": "B", "explanation": "持續進行預訓練有助於透過不斷用新資料更新基礎模型，來提升其效能，進而增強模型在不同任務上的泛化能力與表現。其他選項都與持續預訓練的好處沒有直接關係。"}, {"id": 82, "question": "在生成式 AI 模型的情境中，token 指的是什麼？", "options": {"A": "Token 是生成式 AI 模型處理輸入與輸出時所使用的基本單位，代表詞彙、次詞（subwords）或其他語言學上的最小單元。", "B": "Token 是生成式 AI 模型中，用來表示詞彙或概念的數學表徵。", "C": "Token 是生成式 AI 模型中，經過針對特定任務微調的預訓練權重。", "D": "Token 是提供給生成式 AI 模型、用以引導其產生輸出的特定提示或指令。"}, "correct_answer": "A", "explanation": "Token 是生成式 AI 模型用來處理文字的最小單位（例如詞彙、次詞或字元），它們構成了模型輸入與輸出的基礎。其他選項都無法準確描述這個情境下 token 的意義。"}, {"id": 83, "question": "某家公司想評估使用大型語言模型（LLM）產生推論結果所需的相關成本，並打算使用 Amazon Bedrock 建置生成式 AI 應用程式。哪個因素會影響推論成本？", "options": {"A": "消耗的 token 數量", "B": "Temperature 值", "C": "用來訓練 LLM 的資料量", "D": "總訓練時間"}, "correct_answer": "A", "explanation": "大型語言模型的推論成本，通常取決於輸入與輸出過程中處理的 token 數量，因為每個 token 都會耗用運算資源。其他因素（temperature 值、訓練資料量、訓練時間）都不會直接影響推論成本。"}, {"id": 84, "question": "某家公司使用 Amazon SageMaker Studio notebook 來建置與訓練 ML 模型，並將資料儲存在 Amazon S3 儲存貯體（bucket）中。該公司需要管理資料從 Amazon S3 流向 SageMaker Studio notebook 的流程。哪個解決方案能滿足這個需求？", "options": {"A": "使用 Amazon Inspector 監控 SageMaker Studio。", "B": "使用 Amazon Macie 監控 SageMaker Studio。", "C": "將 SageMaker 設定為使用具備 S3 端點（endpoint）的 VPC。", "D": "將 SageMaker 設定為使用 S3 Glacier Deep Archive。"}, "correct_answer": "C", "explanation": "將 Amazon SageMaker 設定為使用具備 S3 端點的 VPC，能確保 Amazon S3 與 SageMaker Studio notebook 之間的資料流動安全、直接且受控管理。這樣的設定能避免資料暴露在公開網際網路上，並在傳輸過程中維持資料完整性。其他選項都無法解決在這個情境下管理資料流的需求。"}, {"id": 85, "question": "某家公司透過 Amazon Bedrock 客製化了一個基礎模型（FM），用來回答客戶對於產品的詢問。該公司想針對新類型的查詢，驗證這個模型的回應品質，需要上傳一份新的資料集供 Amazon Bedrock 用於驗證。哪個 AWS 服務能滿足這個需求？", "options": {"A": "Amazon S3", "B": "Amazon Elastic Block Store（Amazon EBS）", "C": "Amazon Elastic File System（Amazon EFS）", "D": "AWS Snowcone"}, "correct_answer": "A", "explanation": "Amazon S3 是最適合用來上傳與儲存驗證用資料集的 AWS 服務，它具備高度擴充性，並且與 Amazon Bedrock 整合良好，方便存取資料進行模型驗證。其他選項在這個情境下，都無法提供同等程度的整合性與適用性來管理資料集。"}, {"id": 86, "question": "哪種提示攻擊（prompting attack）會直接暴露大型語言模型（LLM）已設定好的行為方式？", "options": {"A": "提示誘導角色切換（prompted persona switches）", "B": "利用模型的友善與信任傾向（exploiting friendliness and trust）", "C": "忽略提示範本（ignoring the prompt template）", "D": "萃取提示範本（extracting the prompt template）"}, "correct_answer": "D", "explanation": "「萃取提示範本」是一種提示攻擊手法，會直接暴露大型語言模型（LLM）已設定好的行為方式、或其底層的系統提示（system prompt）。這種攻擊可能會揭露模型運作方式的敏感細節，包括其內部指令或限制條件，而這些內容通常不應該對使用者揭露。這樣的暴露會讓 LLM 更容易遭到進一步的利用或濫用，進而危及模型的安全性與可靠性。"}, {"id": 87, "question": "某家公司想使用 Amazon Bedrock，需要釐清在使用 Amazon Bedrock 的過程中，公司自己需要負責哪些安全面向。這家公司需要負責的安全面向是什麼？", "options": {"A": "修補（patching）並更新 Amazon Bedrock 的版本", "B": "保護代管 Amazon Bedrock 的基礎架構", "C": "確保公司資料在傳輸中與靜態儲存時的安全性", "D": "在公司網路內佈建（provisioning）Amazon Bedrock"}, "correct_answer": "C", "explanation": "依據 AWS 責任共擔模型（AWS Shared Responsibility Model），AWS 負責雲端本身的安全，包括基礎架構以及 Amazon Bedrock 這類服務。客戶則負責雲端「內」的安全，涵蓋保護自身資料、管理存取控管，以及為自己的應用程式設定安全性選項。參考資料：https://aws.amazon.com/compliance/shared-responsibility-model/?nc1=h_ls"}, {"id": 88, "question": "某家社群媒體公司想使用大型語言模型（LLM）來摘要訊息內容。該公司已從 Amazon SageMaker JumpStart 上挑選出幾個候選的 LLM，並想比較這些模型生成內容的毒性（toxicity）表現。哪種策略能讓公司以最低的營運負擔評估這些 LLM？", "options": {"A": "群眾外包評估（crowd-sourced evaluation）", "B": "自動化模型評估（automatic model evaluation）", "C": "由人工進行的模型評估（model evaluation with human workers）", "D": "基於人類回饋的強化學習（RLHF，Reinforcement Learning from Human Feedback）"}, "correct_answer": "B", "explanation": "自動化模型評估是能讓這家公司以最低營運負擔評估這些 LLM 的策略。這種方法運用自動化工具與流程來評估生成內容的毒性或品質，不需要人工介入或群眾外包協助。透過使用預先建置好的評估指標或毒性偵測模型，公司能快速且有效率地評估多個模型，而不必承擔人工評估所需要的複雜度與時間成本。"}, {"id": 89, "question": "某家公司正在測試一個基礎模型（FM）的安全性。在測試過程中，該公司想繞過模型的安全防護機制，讓它產生有害內容。這是哪種安全技術手法的範例？", "options": {"A": "對訓練資料進行模糊測試（fuzzing）以找出漏洞", "B": "阻斷服務攻擊（DoS，denial of service）", "C": "經授權的滲透測試（penetration testing with authorization）", "D": "越獄（jailbreak）"}, "correct_answer": "D", "explanation": "「越獄（jailbreaking）」指的是嘗試繞過或停用系統內建的安全防護機制與限制，在這裡指的就是基礎模型（FM）。這種手法會試圖規避防止模型產生有害或不安全內容的防護措施。越獄行為通常是為了利用模型過濾機制或安全協定中的漏洞，是一種直接試圖破壞模型防護能力的手段。"}, {"id": 90, "question": "某家公司需要使用 Amazon SageMaker 進行模型訓練與推論，並且必須符合法規要求，在完全沒有網際網路連線的隔離環境中執行 SageMaker 作業。哪個解決方案能滿足這個需求？", "options": {"A": "使用 SageMaker Experiments 執行 SageMaker 訓練與推論作業。", "B": "使用網路隔離（network isolation）執行 SageMaker 訓練與推論作業。", "C": "使用 SageMaker geospatial 功能的加密機制，對靜態資料進行加密。", "D": "為 SageMaker 作業關聯適當的 AWS Identity and Access Management（IAM）角色。"}, "correct_answer": "B", "explanation": "Amazon SageMaker 的網路隔離功能，能讓訓練與推論作業在無法連上網際網路的環境中執行。這有助於確保資料與模型不會意外存取到外部資源，進而符合隔離環境的法規合規要求。"}, {"id": 91, "question": "某個 ML 研究團隊開發自訂 ML 模型，並將模型成品（model artifacts）分享給其他團隊，整合進他們的產品與服務中；ML 團隊則保留模型的訓練程式碼與資料。該 ML 團隊想建立一套機制，讓自己能用來稽核這些模型。在發布這些自訂 ML 模型時，該 ML 團隊應該使用哪個解決方案？", "options": {"A": "建立包含相關資訊的文件，並將這些文件儲存在 Amazon S3。", "B": "使用 AWS AI Service Cards 來提升模型的透明度與可理解性。", "C": "建立 Amazon SageMaker Model Cards，記錄模型的預期用途、訓練與推論相關細節。", "D": "建立模型訓練腳本，並將這些訓練腳本提交（commit）到 Git 儲存庫。"}, "correct_answer": "C", "explanation": "Amazon SageMaker Model Cards 是專門用來記錄機器學習模型重要資訊的工具，內容涵蓋模型的預期用途、訓練資料集、訓練參數、評估指標，以及推論環境等細節。這提供了一個集中化的機制，能儲存並稽核模型的中繼資料（metadata），非常適合這個 ML 團隊分享並有效稽核模型的需求。Amazon SageMaker Model Cards 的主要好處：對模型特性與預期使用情境提供標準化的文件記錄；為稽核目的提供透明度與可追溯性；能與其他 AWS 服務整合，支援模型生命週期管理。"}, {"id": 92, "question": "某家軟體公司為客戶開發各種工具，並想運用 AI 來提升軟體開發的生產力。哪個解決方案能滿足這個需求？", "options": {"A": "使用二元分類（binary classification）模型來產生程式碼審查（code review）意見。", "B": "在公司的開發者工具中安裝程式碼建議（code recommendation）軟體。", "C": "安裝程式碼預測工具，用以預先預測潛在的程式碼問題。", "D": "使用自然語言處理（NLP）工具來生成程式碼。"}, "correct_answer": "D", "explanation": "自然語言處理（NLP）工具可以根據高階描述或建議來生成程式碼，這能大幅提升軟體開發的生產力。藉由運用 NLP 模型，開發人員可以自動化重複性的程式撰寫工作、生成程式碼片段，甚至根據自然語言輸入完成整段程式碼，藉此加快開發速度並減少錯誤。"}, {"id": 93, "question": "某家零售商想使用 Amazon SageMaker DeepAR 預測演算法，來預測某項特定產品未來幾週的需求量。哪一種類型的資料能滿足這個需求？", "options": {"A": "文字資料", "B": "影像資料", "C": "時間序列資料", "D": "二進位資料"}, "correct_answer": "C", "explanation": "Amazon SageMaker DeepAR 預測演算法專門設計用來運用遞迴神經網路（RNN，recurrent neural networks），對純量（一維）時間序列資料進行預測。當訓練資料集包含數百組相關的時間序列時，這個演算法的表現特別出色，因為它能學習多組序列之間的模式，進而提供準確的預測結果。參考資料："}, {"id": 94, "question": "某家大型零售銀行想開發一套 ML 系統，協助風險管理團隊決定不同族群的貸款分配。這家銀行必須怎麼做，才能開發出一個不帶偏見的 ML 模型？", "options": {"A": "縮小訓練資料集的規模。", "B": "確保 ML 模型的預測結果與歷史結果保持一致。", "C": "為每個人口族群各自建立一個獨立的 ML 模型。", "D": "衡量訓練資料集中的類別不平衡（class imbalance）程度，並依此調整訓練流程。"}, "correct_answer": "D", "explanation": "在機器學習中，當訓練資料集中某些類別的樣本數偏少時，就會發生類別不平衡的情況，進而導致模型預測結果出現偏誤。為了開發出不帶偏見的模型，關鍵在於先評估類別的分布狀況，並依此調整訓練流程以處理任何不平衡的情形。這可以透過過採樣（oversampling）少數類別、欠採樣（undersampling）多數類別，或套用類別權重（class weights）等技巧來達成，確保模型能公平對待所有類別。"}, {"id": 95, "question": "哪種提示技巧可以防範提示注入攻擊（prompt injection attacks）？", "options": {"A": "對抗性提示（adversarial prompting）", "B": "零樣本提示（zero-shot prompting）", "C": "由簡入繁提示（least-to-most prompting）", "D": "思維鏈提示（chain-of-thought prompting）"}, "correct_answer": "A", "explanation": "對抗性提示是一種用來防範提示注入攻擊的技巧，做法是刻意設計出能識別並中和惡意提示的輸入內容。這種做法會產生能偵測並降低對抗性輸入影響的提示，藉此提升語言模型面對此類攻擊時的穩健性。"}, {"id": 96, "question": "某家公司針對一個大型語言模型（LLM）進行微調（fine-tune），讓它能回答服務台（help desk）相關問題。該公司想確認這次微調是否提升了模型的準確度，應該使用哪個指標來進行評估？", "options": {"A": "精確率（precision）", "B": "首個 token 產生時間（time to first token）", "C": "F1 分數", "D": "字詞錯誤率（word error rate）"}, "correct_answer": "C", "explanation": "F1 分數是將精確率（precision）與召回率（recall）結合成單一數值的指標，用來平衡衡量這兩者的表現。在類別分布不均的情況下，F1 分數格外有用，因為它同時考量了偽陽性（false positives）與偽陰性（false negatives）。F1 分數的計算方式是精確率與召回率的調和平均數，數值範圍介於 0 到 1 之間，1 代表精確率與召回率都達到完美。在評估一個經過微調、用於服務台應用情境的大型語言模型（LLM）時，F1 分數是合適的指標，因為它能評估模型提供準確且相關回應的能力，同時平衡精確率（回應的正確性）與召回率（相關回應的完整性）之間的取捨。參考資料："}, {"id": 97, "question": "某公司使用 Amazon Bedrock 搭配 Stable Diffusion 的 Retrieval Augmented Generation(RAG)技術,根據文字描述生成產品圖片。但生成結果經常隨機且缺乏具體細節。該公司想提高生成圖片的細節具體程度。哪個解決方案能滿足這項需求?", "options": {"A": "增加生成步驟數量。", "B": "使用 MASK_IMAGE_BLACK 遮罩來源選項。", "C": "提高 classifier-free guidance(CFG)比例值。", "D": "提高 prompt 強度。"}, "correct_answer": "C", "explanation": "在 Stable Diffusion 中,classifier-free guidance(CFG)比例參數控制生成圖片與提供的文字 prompt 之間的貼合程度。提高 CFG 比例值,模型會更著重於 prompt 內容,使生成的圖片更準確反映指定的細節。不過這個設定需要拿捏平衡,因為數值過高可能導致圖片多樣性降低,甚至品質變差。"}, {"id": 98, "question": "某公司想建置一個以大型語言模型(LLM)為基礎的聊天機器人,讓客服人員能針對顧客的詢問即時給出符合情境的回應。該公司會以公司政策作為知識庫。哪個解決方案最能符合成本效益地滿足這項需求?", "options": {"A": "用公司政策資料重新訓練 LLM。", "B": "用公司政策資料微調(fine-tune)LLM。", "C": "實作 Retrieval Augmented Generation(RAG)以產生具情境的回應。", "D": "對公司政策資料進行預訓練(pre-training)與資料增強(data augmentation)。"}, "correct_answer": "C", "explanation": "Retrieval Augmented Generation(RAG)將外部資料來源與 LLM 整合,不需要大量重新訓練就能產生準確且符合情境的輸出。透過將聊天機器人連接到公司的政策文件,RAG 讓模型能即時檢索相關資訊,確保回應既準確又即時更新。這個做法具成本效益,因為它直接運用既有資料,不需要負擔重新訓練或微調大型模型所產生的運算成本。"}, {"id": 99, "question": "某公司想使用 AWS Glue 建立新的解決方案,但公司在 AWS Glue 方面的程式撰寫經驗有限。哪個 AWS 服務能協助該公司使用 AWS Glue?", "options": {"A": "Amazon Q Developer", "B": "AWS Config", "C": "Amazon Personalize", "D": "Amazon Comprehend"}, "correct_answer": "A", "explanation": "Amazon Q Developer 是設計來協助程式撰寫經驗有限的使用者操作 AWS Glue 的工具。它提供圖形化使用者介面,簡化資料轉換與擷取工作流程的建立,讓使用者不需要深厚的程式技能,也能執行查詢與處理資料等工作。"}, {"id": 100, "question": "某公司正在開發一款行動 ML 應用程式,利用手機相機來診斷並處理蟲咬傷。該公司想用一個多元的資料集訓練圖片分類模型,資料集涵蓋來自世界各地不同性別、種族與地理位置的蟲咬照片。這個情境展現了哪一項負責任 AI(responsible AI)原則?", "options": {"A": "公平性(Fairness)", "B": "可解釋性(Explainability)", "C": "治理(Governance)", "D": "透明度(Transparency)"}, "correct_answer": "A", "explanation": "該公司積極確保圖片分類模型是用多元資料集訓練的,資料集涵蓋不同性別、種族與地理位置的蟲咬照片。這正體現了負責任 AI 的公平性(Fairness)原則,強調模型應對所有族群做出不偏頗的判斷。透過納入多元資料,該公司希望避免偏誤導致特定族群得到不準確的診斷或處置。公平性確保 AI 系統不會因種族、性別、地理位置或其他特徵而產生歧視。"}, {"id": 101, "question": "某公司正在開發一個用於核准貸款的 ML 模型。該公司必須實作一套解決方案來偵測模型中的偏誤(bias),同時也必須能解釋模型的預測結果。哪個解決方案能滿足這些需求?", "options": {"A": "Amazon SageMaker Clarify", "B": "Amazon SageMaker Data Wrangler", "C": "Amazon SageMaker Model Cards", "D": "AWS AI Service Cards"}, "correct_answer": "A", "explanation": "Amazon SageMaker Clarify 是一項工具,能協助偵測機器學習模型中的偏誤,並為模型預測提供可解釋性。它讓使用者了解影響模型預測的因素,並評估模型在不同族群之間是否公平。這正是該公司在偵測偏誤與解釋模型決策上所需要的,特別是像貸款核准這類高風險應用。偏誤偵測:SageMaker Clarify 能分析訓練資料與模型預測結果,找出並降低偏誤。可解釋性:它提供解釋模型預測結果的功能,協助使用者理解模型做出決策背後的原因。"}, {"id": 102, "question": "某公司已使用 Amazon Bedrock 開發出一個生成式文字摘要模型,並會使用 Amazon Bedrock 的自動模型評估功能。該公司該用哪個指標來評估模型的準確度?", "options": {"A": "ROC 曲線下面積(AUC)分數", "B": "F1 分數", "C": "BERTScore", "D": "真實世界知識(RWK)分數"}, "correct_answer": "C", "explanation": "BERTScore 是專門為評估模型生成文字品質而設計的指標,特別適用於文字摘要與機器翻譯等任務。它運用預訓練 BERT 模型的上下文嵌入(contextual embeddings),在單字層級比較生成文字與參考文字,非常適合用來評估生成式文字摘要模型的準確度。BERTScore 評估生成文字與參考文字之間的語意相似度,相較於著重完全比對的傳統方法,能提供更細緻的評估結果。"}, {"id": 103, "question": "某位 AI 從業人員想根據花瓣長度、花瓣寬度、花萼長度與花萼寬度來預測花朵的分類。哪個演算法能滿足這項需求?", "options": {"A": "K-nearest neighbors(k-NN,K 最近鄰演算法)", "B": "K-means", "C": "自我迴歸整合移動平均模型(ARIMA)", "D": "線性迴歸(Linear regression)"}, "correct_answer": "A", "explanation": "K-nearest neighbors(k-NN)是一種用於分類任務的監督式學習演算法。它的運作方式是根據資料點的特徵(在本例中即花瓣長度、花瓣寬度、花萼長度與花萼寬度)與訓練集中資料點的相似程度來進行分類。對於這個要依特徵將花朵分類的問題,k-NN 是合適的選擇。k-NN 簡單且有效,適用於決策邊界不一定是線性的分類問題,因為它是透過觀察最接近的鄰居來做出預測。"}, {"id": 104, "question": "某公司在生成式 AI 應用程式中使用 Amazon Bedrock 的自訂模型。該公司想使用公司自行管理的加密金鑰,來加密模型自訂化工作(model customization jobs)所產生的模型成品(model artifacts)。哪個 AWS 服務能滿足這項需求?", "options": {"A": "AWS Key Management Service(AWS KMS)", "B": "Amazon Inspector", "C": "Amazon Macie", "D": "AWS Secrets Manager"}, "correct_answer": "A", "explanation": "AWS Key Management Service(AWS KMS)是一項完全託管的服務,讓使用者能建立並控管用來加密資料的加密金鑰。這正適合像本題這樣的情境,公司想使用自訂、由公司自行管理的加密金鑰來保護模型成品。AWS KMS 讓使用者能安全地管理用於加密與解密資料的金鑰,並可與包括 Amazon Bedrock 在內的多項 AWS 服務整合。AWS KMS 提供集中式金鑰管理,適用於需要加密資料與成品的使用情境,例如模型自訂化工作。"}, {"id": 105, "question": "某公司想利用大型語言模型(LLM)根據自然語言的程式碼註解來產生程式碼。哪一項 LLM 功能能滿足這項需求?", "options": {"A": "文字摘要(Text summarization)", "B": "文字生成(Text generation)", "C": "文字補全(Text completion)", "D": "文字分類(Text classification)"}, "correct_answer": "B", "explanation": "文字生成(Text generation)是大型語言模型(LLM)的一項功能,讓模型能根據給定的 prompt 或輸入內容產生文字。在這個情境中,輸入內容會是自然語言的程式碼註解,LLM 則會根據這些註解生成對應的程式碼。這個過程涉及理解註解的上下文並生成相對應的程式碼,這正是文字生成的核心功能。"}, {"id": 106, "question": "某公司正在推出一款協助使用者學習外語的行動應用程式。該應用程式透過呼叫大型語言模型(LLM),讓文字內容變得更通順連貫。該公司蒐集了多元的文字資料集,並補充了較易讀版本的範例來強化資料集。該公司希望 LLM 的輸出結果能貼近所提供的範例。該公司該用哪個指標來評估 LLM 是否符合這項需求?", "options": {"A": "損失函數(loss function)數值", "B": "語意穩健性(Semantic robustness)", "C": "Recall-Oriented Understudy for Gisting Evaluation(ROUGE)分數", "D": "文字生成的延遲時間(latency)"}, "correct_answer": "C", "explanation": "ROUGE 是一組評估摘要品質的指標,方法是比較模型輸出與參考範例之間 n-gram、詞序與詞對的重疊程度。由於該公司開發的語言模型是要提升文字的連貫性,並希望輸出結果貼近所提供的範例(也就是原始文字的較易讀版本),ROUGE 是最合適的指標。它評估生成文字在內容與易讀性上與參考文字的貼合程度。ROUGE 分數常用於評估摘要等任務中模型的表現,這類任務的目標就是確保生成文字盡量貼近人工提供的範例。"}, {"id": 107, "question": "某公司注意到其基礎模型(FM)生成的圖片經常與 prompt 內容無關。該公司想調整 prompt 技巧,以減少不相關圖片的產生。哪個解決方案能滿足這項需求?", "options": {"A": "使用 zero-shot prompt。", "B": "使用 negative prompt(負向提示)。", "C": "使用 positive prompt(正向提示)。", "D": "使用模糊不清的 prompt。"}, "correct_answer": "B", "explanation": "Negative prompt(負向提示)是用來明確告訴模型該避免或不要生成什麼內容。透過向模型提供關於哪些內容不該出現的具體指引(例如,加入圖片中不應出現的字詞或概念),模型就能更專注於生成相關且切題的內容。這項技巧能透過限制模型的創意生成過程,協助減少不相關或無關的圖片。"}, {"id": 108, "question": "某公司想利用大型語言模型(LLM)為公司產品生成簡潔且聚焦於特定功能的描述文字。哪一項 prompt engineering 技巧能滿足這項需求?", "options": {"A": "建立一個涵蓋所有產品的 prompt,再編輯回應內容,使回應更具體、簡潔,並針對各產品客製化。", "B": "為每個產品類別建立能凸顯關鍵功能的 prompt,並在每個 prompt 中納入期望的輸出格式與長度。", "C": "在每個 prompt 中納入多元的產品功能,以生成有創意且獨特的描述文字。", "D": "提供詳細、針對特定產品的 prompt,以確保描述文字精準且客製化。"}, "correct_answer": "B", "explanation": "為了替每項產品生成簡潔且聚焦特定功能的描述文字,該公司應為特定產品類別建立客製化的 prompt。透過在 prompt 中凸顯每個產品類別的關鍵功能,模型就能專注於生成與該類別獨特屬性相關且一致的描述文字。此外,指定期望的輸出格式與長度,可確保回應結果符合公司對簡潔與清晰的要求。客製化的 prompt 有助於確保模型聚焦於每個產品類別最重要的功能,進而生成相關且準確的描述。期望的輸出格式與長度則能確保回應如要求般一致且簡潔。"}, {"id": 109, "question": "某公司正在開發一個用來預測顧客流失(churn)的 ML 模型。該模型在訓練資料集上表現良好,但無法準確預測新資料的流失情形。哪個解決方案能解決這個問題?", "options": {"A": "降低正規化(regularization)參數,以增加模型複雜度。", "B": "提高正規化(regularization)參數,以降低模型複雜度。", "C": "在輸入資料中新增更多特徵(features)。", "D": "用更多 epoch 訓練模型。"}, "correct_answer": "B", "explanation": "題目描述的問題是常見的過度擬合(overfitting)情況,模型在訓練資料上表現良好,卻無法泛化到新的、未見過的資料。這表示模型過於複雜,學到的是死記訓練資料,而非找出可泛化的規律。提高正規化參數有助於降低模型複雜度,方法是對過大的權重加以懲罰,進而鼓勵較簡單、較不容易過度擬合的模型。這樣能改善模型對新資料的泛化能力,有機會提升在未見過顧客資料上的表現。"}, {"id": 110, "question": "某公司正在導入智慧代理人(intelligent agents),為顧客提供對話式搜尋體驗。該公司需要一項資料庫服務,能以向量(vector)形式儲存並查詢生成式 AI 模型產生的嵌入(embeddings)。哪個 AWS 服務能滿足這項需求?", "options": {"A": "Amazon Athena", "B": "Amazon Aurora PostgreSQL", "C": "Amazon Redshift", "D": "Amazon EMR"}, "correct_answer": "B", "explanation": "Amazon Aurora PostgreSQL 是一項關聯式資料庫服務,支援包括需要向量運算在內的各種應用。具體來說,Aurora PostgreSQL 可透過 pgvector 等擴充套件(extension)延伸出向量搜尋能力。這個擴充套件讓使用者能儲存、索引並查詢來自生成式 AI 模型的向量嵌入,非常符合該公司需要以向量形式儲存並查詢嵌入的需求。pgvector 是 PostgreSQL 的擴充套件,提供高效的向量資料相似度搜尋,非常適合用來儲存與查詢嵌入。"}, {"id": 111, "question": "某金融機構正在建置一套 AI 解決方案,利用基礎模型(FM)做出貸款核准決策。基於安全與稽核考量,該公司需要這套 AI 解決方案的決策具備可解釋性。以下哪個因素與這套 AI 解決方案決策的可解釋性有關?", "options": {"A": "模型複雜度(Model complexity)", "B": "訓練時間(Training time)", "C": "超參數(hyperparameter)數量", "D": "部署時間(Deployment time)"}, "correct_answer": "A", "explanation": "模型複雜度對 AI 解決方案決策的可解釋性有重大影響。較簡單的模型通常更具可解釋性,因為比較容易理解它們做出決策的方式。舉例來說,線性迴歸或決策樹一般比深度神經網路等更複雜的模型更容易解讀。相對地,高度複雜的模型,例如深度學習模型,雖然能提供非常準確的結果,卻常被視為「黑箱」,意即其決策過程難以被輕易解讀。這種缺乏透明度的特性,使得要以滿足法規要求或讓顧客理解的方式來解釋其決策變得困難。"}, {"id": 112, "question": "某製藥公司想分析新藥的使用者評論,並為每種藥物提供簡潔的概述。哪個解決方案能滿足這項需求?", "options": {"A": "使用 Amazon Personalize 建立時間序列(time-series)預測模型來分析藥物評論。", "B": "使用 Amazon Bedrock 的大型語言模型(LLM)產生藥物評論摘要。", "C": "使用 Amazon SageMaker 建立分類模型,將藥物分成不同群組。", "D": "使用 Amazon Rekognition 產生藥物評論摘要。"}, "correct_answer": "B", "explanation": "Amazon Bedrock 提供多種大型語言模型(LLM)的存取管道,非常適合處理文字摘要等任務。透過使用 LLM,這家製藥公司能自動為每種藥物的使用者評論生成簡潔且連貫的摘要。這些模型專為理解與處理大量文字而設計,非常適合以清晰且有效率的方式為使用者評論產生摘要。Amazon Bedrock 讓該公司能運用可生成摘要的 LLM,正好符合本情境的需求。"}, {"id": 113, "question": "某公司想建置一套線索優先排序(lead prioritization)應用程式,供員工用來聯繫潛在客戶。這套應用程式必須讓員工能根據領域知識與專業經驗,檢視並調整模型中不同變數所配置的權重。哪一種 ML 模型類型能滿足這項需求?", "options": {"A": "邏輯迴歸(Logistic regression)模型", "B": "建立在主成分(principal components)上的深度學習模型", "C": "K-nearest neighbors(k-NN)模型", "D": "神經網路(Neural network)"}, "correct_answer": "A", "explanation": "邏輯迴歸(logistic regression)模型是一種簡單、可解釋的機器學習模型,讓使用者能根據領域知識與專業經驗調整不同變數的權重。由於邏輯迴歸是建立在輸入特徵與預測結果之間的線性關係上,每個特徵都對應一個可輕易檢視與調整的權重(係數)。這使它成為線索優先排序應用程式的合適選擇,因為領域專家需要能依自身知識修改模型。"}, {"id": 115, "question": "哪種策略能判斷基礎模型(FM)是否有效達成商業目標?", "options": {"A": "評估模型在基準資料集(benchmark dataset)上的表現。", "B": "分析模型的架構與超參數(hyperparameter)。", "C": "評估模型與特定使用情境(use case)的契合程度。", "D": "衡量部署模型所需的運算資源。"}, "correct_answer": "C", "explanation": "要判斷基礎模型(FM)是否有效達成商業目標,關鍵在於評估模型與其欲處理的特定使用情境或商業目標之間的契合程度。這包括評估模型能否提供與企業需求相關、有意義且準確的輸出,確保它能解決公司想處理的實際問題。與特定使用情境對齊 (Align),能確保模型的能力是針對手邊任務量身打造,例如提升客戶支援品質、強化決策品質,或自動化特定流程。"}, {"id": 116, "question": "某公司需要訓練一個 ML 模型,用來分類不同種類動物的圖片。該公司擁有大量已標記的圖片資料集,且不會再標記更多資料。該公司應使用哪種學習方式來訓練這個模型?", "options": {"A": "監督式學習(Supervised learning)", "B": "非監督式學習(Unsupervised learning)", "C": "強化學習(Reinforcement learning)", "D": "主動學習(Active learning)"}, "correct_answer": "A", "explanation": "在監督式學習(supervised learning)中,模型是用已標記的資料集來訓練,每張圖片(輸入)都對應一個標籤(在本例中即動物種類)。由於該公司已擁有大量已標記的圖片資料集,監督式學習是最合適的做法。模型會根據訓練資料中的特徵與標籤來學習如何分類圖片。"}, {"id": 117, "question": "ML 生命週期中的哪個階段會決定合規與法規要求?", "options": {"A": "特徵工程(Feature engineering)", "B": "模型訓練(Model training)", "C": "資料蒐集(Data collection)", "D": "商業目標界定(Business goal identification)"}, "correct_answer": "C", "explanation": "在 ML 生命週期中,資料蒐集(data collection)階段與判定合規及法規要求最為相關。在這個階段,組織必須確保用來訓練模型所蒐集與使用的資料符合法律與法規標準,例如資料隱私法規(如 GDPR、HIPAA)、產業特定法規與倫理考量。組織也必須確認自己擁有合法使用該資料的同意授權,且資料不含任何偏誤或違反任何法規。"}, {"id": 118, "question": "某餐飲服務公司想開發一個 ML 模型,協助減少每日食物浪費並提升銷售營收。該公司需要持續提升模型的準確度。哪個解決方案能滿足這項需求?", "options": {"A": "使用 Amazon SageMaker,並持續以較新的資料進行迭代優化。", "B": "使用 Amazon Personalize,並持續以歷史資料進行迭代優化。", "C": "使用 Amazon CloudWatch 分析顧客訂單。", "D": "使用 Amazon Rekognition 來優化模型。"}, "correct_answer": "A", "explanation": "要持續提升機器學習模型的準確度,Amazon SageMaker 是合適的解決方案。SageMaker 讓模型訓練、部署與迭代能有效率地進行。該公司可以使用 SageMaker 定期以較新的資料重新訓練模型,以反映顧客行為、市場趨勢等可能影響食物浪費與銷售營收的動態因素變化。以較新的資料持續迭代,有助於長期提升模型表現,確保模型維持準確且切合實際情況。"}, {"id": 119, "question": "某公司已開發出一個用來預測不動產銷售價格的 ML 模型。該公司想在不需管理伺服器或基礎設施的情況下部署這個模型來進行預測。哪個解決方案能滿足這項需求?", "options": {"A": "將模型部署在 Amazon EC2 執行個體(instance)上。", "B": "將模型部署在 Amazon Elastic Kubernetes Service(Amazon EKS)叢集上。", "C": "使用 Amazon CloudFront 搭配 Amazon S3 整合來部署模型。", "D": "使用 Amazon SageMaker endpoint 來部署模型。"}, "correct_answer": "D", "explanation": "Amazon SageMaker 提供完全託管的服務,能大規模部署機器學習模型,不需要管理伺服器或基礎設施。當使用 Amazon SageMaker endpoint 部署模型時,SageMaker 會處理所有基礎設施、擴展與維護相關事務。這讓該公司能專注於進行預測,並將模型整合進應用程式,不必擔心管理伺服器或叢集的問題。Amazon SageMaker 透過提供可擴展、安全且無伺服器(serverless)的 endpoint,簡化了 ML 模型的部署流程,非常適合用於即時提供預測服務。"}, {"id": 120, "question": "某公司想開發一款 AI 應用程式,協助員工查詢未結案的顧客理賠案件、確認特定案件的細節,並取得該理賠案件的相關文件。哪個解決方案能滿足這項需求?", "options": {"A": "使用 Agents for Amazon Bedrock 搭配 Amazon Fraud Detector 來建置這個應用程式。", "B": "使用 Agents for Amazon Bedrock 搭配 Amazon Bedrock knowledge base 來建置這個應用程式。", "C": "使用 Amazon Personalize 搭配 Amazon Bedrock knowledge base 來建置這個應用程式。", "D": "使用 Amazon SageMaker,透過訓練一個新的 ML 模型來建置這個應用程式。"}, "correct_answer": "B", "explanation": "Amazon Bedrock 是一項服務,讓使用者能在不需管理基礎設施的情況下,運用基礎模型(FM)建置 AI 應用程式。Agents for Amazon Bedrock 讓使用者能建立智慧代理人(intelligent agent),協助使用者與資料互動,並執行諸如查詢未結案顧客理賠案件、確認理賠細節、取得相關文件等工作。透過使用 Amazon Bedrock knowledge base,這個 AI 代理人能即時存取相關資訊(例如理賠案件細節、文件或顧客資料),並根據 knowledge base 中儲存的理賠相關資料,提供精準且以情境為基礎的答案。Agents for Amazon Bedrock 能理解並回應自然語言查詢,協助自動化互動流程,非常適合這個使用情境。Amazon Bedrock knowledge base 讓系統能有效率地存取儲存的資訊、文件與特定理賠案件的細節。"}, {"id": 121, "question": "某製造業公司運用 AI 來檢驗產品,找出任何損壞或瑕疵。這家公司使用的是哪一種 AI 應用類型?", "options": {"A": "推薦系統(Recommendation system)", "B": "自然語言處理(NLP)", "C": "電腦視覺(Computer vision)", "D": "影像處理(Image processing)"}, "correct_answer": "C", "explanation": "電腦視覺(computer vision)是 AI 的一個領域,讓機器能解讀並理解來自現實世界的視覺資訊,例如圖片與影片。就這家製造業公司而言,AI 是用來檢驗產品是否有損壞或瑕疵,這涉及分析視覺資料(例如產品圖片或影片)。這正是電腦視覺的典型應用,AI 系統會辨識並分類圖片中的物件或瑕疵。"}, {"id": 122, "question": "某公司想建立一個 ML 模型來預測顧客滿意度。該公司需要完全自動化的模型調校(model tuning)。哪個 AWS 服務能滿足這項需求?", "options": {"A": "Amazon Personalize", "B": "Amazon SageMaker", "C": "Amazon Athena", "D": "Amazon Comprehend"}, "correct_answer": "B", "explanation": "Amazon SageMaker 提供一個完全託管的環境,用於建置、訓練與部署機器學習模型,並包含自動模型調校功能。具體來說,SageMaker 內建一項名為 Automatic Model Tuning(自動模型調校,又稱超參數最佳化,Hyperparameter Optimization)的功能,能自動化尋找機器學習模型最佳超參數的過程。當使用者想在不需人工介入的情況下優化模型表現時,這項功能就非常重要。Amazon SageMaker 讓使用者能自動化訓練流程與超參數調校,完全符合該公司對完全自動化模型調校的需求。"}, {"id": 123, "question": "在生成式 AI 應用程式的後處理(post-processing)ML 生命週期階段,公司可以使用哪種技巧來降低偏誤(bias)與毒性內容(toxicity)?", "options": {"A": "人為監督迴圈(Human-in-the-loop)", "B": "資料增強(Data augmentation)", "C": "特徵工程(Feature engineering)", "D": "對抗式訓練(Adversarial training)"}, "correct_answer": "A", "explanation": "人為監督迴圈(Human-in-the-loop,HITL)是一種在 AI 系統決策過程中納入人為監督的技巧。在生成式 AI 應用程式的情境中,HITL 可以在後處理(post-processing)階段用來找出並降低偏誤或有毒性的輸出內容。當模型生成不當或帶有偏誤的內容時,人員可以進行審查與介入,提供修正或調整,協助降低毒性與偏誤發生的可能性。這個回饋迴圈有助於隨著時間逐步精煉並改善模型的輸出結果。"}, {"id": 124, "question": "某銀行為加快貸款核准流程,對一個大型語言模型(LLM)進行了微調(fine-tune)。在一次外部稽核中,該公司發現這個模型對某個特定族群的貸款核准速度,明顯快於其他族群。銀行該用最具成本效益的方式,如何修正這個問題?", "options": {"A": "納入更多元的訓練資料,並使用新資料重新微調(fine-tune)模型。", "B": "在已微調的模型上搭配使用 Retrieval Augmented Generation(RAG)。", "C": "使用 AWS Trusted Advisor 檢查來消除偏誤。", "D": "用更多元的訓練資料重新預訓練(pre-train)一個新的 LLM。"}, "correct_answer": "A", "explanation": "題目描述的問題是模型決策過程中出現偏誤(bias)的案例,模型對特定族群展現出偏好。要解決這個問題,最具成本效益的做法是納入更多元的訓練資料,更完整地代表所有族群。透過用這些更多元的資料微調模型,能協助確保模型公平對待所有族群,不再出現偏頗行為。用更新後的資料微調模型,能確保模型從更具代表性的樣本中學習,在不需要從頭完全重新訓練模型的情況下,提升預測結果的公平性。"}, {"id": 126, "question": "某公司需要記錄所有對其 Amazon Bedrock API 發出的請求。該公司必須以最低成本安全保存這些紀錄 5 年。哪個 AWS 服務與儲存類別(storage class)的組合能滿足這項需求?(選擇兩項。)", "options": {"A": "AWS CloudTrail", "B": "Amazon CloudWatch", "C": "AWS Audit Manager", "D": "Amazon S3 Intelligent-Tiering", "E": "Amazon S3 Standard"}, "correct_answer": "AD", "explanation": "AWS CloudTrail 是專門設計用來記錄並監控對 AWS 服務(包括 Amazon Bedrock)發出的 API 呼叫的 AWS 服務。CloudTrail 會記錄 API 請求的詳細資訊,包括請求者的身分、請求時間與來源 IP 位址。這項服務非常適合用來記錄所有對 Amazon Bedrock API 發出的請求,並能滿足記錄需求。Amazon S3 Intelligent-Tiering 是一種儲存類別,專為存取模式難以預測的資料儲存而設計。它會根據使用情況,自動在兩種存取層級(常用與非常用)之間搬移資料,有助於降低成本,同時確保資料在需要時仍可取用。對於要以最低成本安全保存紀錄 5 年的需求而言,這個儲存類別提供了一種有效率的方式,能處理長期儲存需求,而不會產生不必要的成本。"}, {"id": 127, "question": "一家電商公司想要透過為公司電商平台的每位使用者客製化搜尋結果，來改善搜尋引擎推薦效果。哪個 AWS 服務符合這個需求？", "options": {"A": "Amazon Personalize", "B": "Amazon Kendra", "C": "Amazon Rekognition", "D": "Amazon Transcribe"}, "correct_answer": "A", "explanation": "Amazon Personalize 是 AWS 專為建立與部署個人化推薦而設計的服務。它讓你能夠打造客製化的機器學習模型，用於個人化使用者體驗，例如商品推薦、搜尋結果或內容建議。對於想要為每位使用者客製化搜尋引擎推薦結果的電商公司來說，Amazon Personalize 是理想選擇，因為它運用使用者行為資料與機器學習，提供高度相關的推薦結果。"}, {"id": 128, "question": "一家醫院正在開發一套 AI 系統，協助醫師根據病歷紀錄與醫學影像進行疾病診斷。為了符合法規要求，敏感的病患資料不得離開資料所在的國家。哪種資料治理 (Governance)策略能確保法規遵循並保護病患隱私？", "options": {"A": "資料落地 (Data Residency)", "B": "資料品質", "C": "資料可探索性", "D": "資料豐富化"}, "correct_answer": "A", "explanation": "資料落地 (Data Residency)是指為了遵守法規或政策，確保在特定地理位置儲存與處理資料的做法。在這個情境中，敏感的病患資料不得離開其來源國，實施資料落地 (Data Residency)策略可以確保法規遵循，同時保護病患隱私。這種做法對於在 HIPAA 或 GDPR 等嚴格資料治理 (Governance)框架下營運的醫院等組織而言至關重要。"}, {"id": 129, "question": "一家公司需要使用高度可擴充套件的AWS 服務來監控其ML 系統的效能。哪種AWS 服務符合這些要求？", "options": {"A": "亞馬遜雲觀察 (Amazon CloudWatch)", "B": "AWS 雲跡 (AWS CloudTrail)", "C": "AWS 值得信賴的顧問 (AWS Trusted Advisor)", "D": "AWS 配置 (AWS Config)"}, "correct_answer": "A", "explanation": "Amazon CloudWatch 是一個高度可擴充套件的AWS 服務，旨在進行監控和觀察。它提供對系統指標的實時監控，包括ML 系統的效能資料，如資源利用率(CPU、記憶體等)。)、模型推理延遲、請求計數和錯誤。CloudWatch使使用者能夠設定警報、視覺化指標，並根據效能閾值自動執行操作，非常適合監控ML 系統的效能。"}, {"id": 130, "question": "一名人工智慧從業者正在開發一個亞馬遜泰坦模型的提示。該模型託管在Amazon Bedrock上。人工智慧從業者正在使用該模型來解決數字推理的挑戰。人工智慧從業者在提示的末尾新增了以下短語:“請模型透過一步一步地解釋其推理來展示其工作。”人工智慧從業者使用的是哪種提示工程技術？", "options": {"A": "思維鏈提示", "B": "即時注射", "C": "少數鏡頭提示", "D": "即時模板化"}, "correct_answer": "A", "explanation": "思維鏈提示是提示工程中的一種技術，其中鼓勵AI 模型逐步分解其推理過程來解決問題，例如數字推理挑戰。透過明確地指示模型“透過一步一步地解釋其推理來展示其工作”，從業者確保模型提供了通向解決方案的中間步驟的邏輯序列。這提高了模型輸出的準確性和透明度，特別是對於複雜的推理任務。"}, {"id": 131, "question": "哪項AWS 服務使基礎模型(FMs)可用於幫助使用者構建和擴充套件生成式人工智慧應用程式？", "options": {"A": "亞馬遜Q 開發者 (Amazon Q Developer)", "B": "亞馬遜岩床 (Amazon Bedrock)", "C": "亞馬遜肯德拉 (Amazon Kendra)", "D": "亞馬遜理解 (Amazon Comprehend)"}, "correct_answer": "B", "explanation": "亞馬遜基石是一項AWS 服務，允許使用者使用基礎模型(FMs)構建和擴充套件生成式人工智慧應用程式，而無需管理基礎設施。它提供對來自AWS 和第三方提供商的預訓練模型的訪問，使開發人員能夠將文字生成、摘要和問答等生成式人工智慧功能整合到他們的應用程式中。這使得Amazon Bedrock成為構建和擴充套件生成式人工智慧解決方案的理想選擇。"}, {"id": 132, "question": "一家公司正在為有視覺障礙的使用者開發一款手機應用。該應用程式必須能夠聽到使用者說什麼，並提供語音響應。哪種解決方案能夠滿足這些要求？", "options": {"A": "使用深度學習神經網路進行語音識別。", "B": "構建ML 模型來搜尋數字資料中的模式。", "C": "使用生成式人工智慧摘要生成類似人類的文字。", "D": "為影象分類和識別構建自定義模型。"}, "correct_answer": "A", "explanation": "為了滿足使應用程式能夠“聽到使用者說什麼並提供語音響應”的要求，該解決方案必須包括語音識別和文字到語音轉換功能。使用深度學習神經網路進行語音識別，可以讓應用程式將口語轉換為文字。一旦輸入被理解，文字到語音轉換系統就可以向使用者提供語音響應。這種方法在透過口語實現互動來幫助有視覺障礙的使用者的應用程式中是基本的。"}, {"id": 133, "question": "一家公司希望提高大型語言模型(LLM)對複雜問題解決任務的響應質量。這些任務需要詳細的推理和逐步的解釋過程。哪種提示工程技術符合這些要求？", "options": {"A": "少數鏡頭提示", "B": "零射擊提示", "C": "定向刺激提示", "D": "思維鏈提示"}, "correct_answer": "D", "explanation": "思維鏈提示是專門為增強大型語言模型(LLM)的推理能力而設計的，它鼓勵大型語言模型為複雜的問題解決任務提供一步一步的解釋。這種方法有助於模型將問題分解成更小的邏輯步驟，確保響應詳細、準確且易於理解。"}, {"id": 134, "question": "一家公司希望透過使用最新資料來保持其基礎模型(FM)的相關性。該公司希望實施一個包括定期更新FM 的模型培訓策略。哪種解決方案符合這些要求？", "options": {"A": "批次學習", "B": "連續預培訓", "C": "靜止性訓練", "D": "潛在訓練"}, "correct_answer": "B", "explanation": "持續預訓練包括定期更新基礎模型(FM ),在新資料可用時對其進行訓練。這種方法透過納入最新資訊來確保模型保持相關性和準確性。這對於最新知識至關重要的應用程式尤其重要，例如新聞聚合、客戶行為分析或實時市場趨勢。"}, {"id": 136, "question": "哪個選項是建立信任和部署以人為中心的人工智慧技術的人工智慧治理 (Governance)框架的特徵？", "options": {"A": "跨業務單位擴充套件計劃以創造長期業務價值", "B": "確保符合業務標準、收入目標和利益相關方的期望", "C": "克服挑戰，推動業務轉型和增長", "D": "為資料、透明度、負責任的人工智慧和合規性制定政策和指導方針"}, "correct_answer": "D", "explanation": "人工智慧治理 (Governance)框架側重於建立信任和確保負責任地部署人工智慧技術。他們建立了明確的政策和指導方針，以解決關鍵問題，如資料管理、透明度、道德考慮、負責任的人工智慧實踐和法規遵從性。這些框架有助於組織減輕風險，促進公平，並培養公眾對人工智慧系統的信任，使其成為創造以人為中心的人工智慧技術的關鍵。"}, {"id": 137, "question": "一家電子商務公司正在使用生成式人工智慧聊天機器人來回復客戶的詢問。該公司希望衡量聊天機器人對公司運營的財務影響。公司應該使用哪個指標？", "options": {"A": "處理的客戶查詢數量", "B": "人工智慧模型的訓練成本", "C": "每次客戶對話的成本", "D": "平均處理時間(AHT)"}, "correct_answer": "C", "explanation": "為了衡量生成式人工智慧聊天機器人對公司運營的財務影響，每個客戶對話的成本是最相關的指標。它直接量化了與使用聊天機器人處理客戶查詢相關的運營費用。透過分析這一指標，該公司可以評估每次對話的花費，並將其與替代方法(如人工代理)的成本進行比較，從而深入瞭解聊天機器人的財務效率和投資回報。"}, {"id": 138, "question": "一家公司希望根據客戶的人口統計資料和購買模式為其客戶找到群體。公司應該用哪種演算法來滿足這個要求？", "options": {"A": "k-最近鄰", "B": "k 均值", "C": "決策圖表", "D": "支援向量機"}, "correct_answer": "B", "explanation": "K-means 是一種在無監督學習中使用的聚類演算法，用於根據相似性將資料點分組到聚類中。它非常適合於發現客戶人口統計和購買行為的模式。該演算法識別具有相似特徵的客戶群(叢集),然後可用於目標營銷、個性化推薦或細分。"}, {"id": 139, "question": "某公司大語言模型(LLM)正在經歷幻覺。公司如何減少幻覺？", "options": {"A": "為Amazon Bedrock設定代理來監督模型訓練。", "B": "使用資料預處理，刪除任何導致幻覺的資料。", "C": "減少模型的溫度推斷引數。", "D": "使用經過訓練不會產生幻覺的粉底模型(FM)。"}, "correct_answer": "C", "explanation": "在大型語言模型(LLM)的上下文中，溫度推斷引數控制模型輸出的隨機性。降低溫度減少了隨機性，使模型的回答更具確定性，並專注於最有可能的預測。透過降低溫度，幻覺（當模型生成不正確或無意義的資訊時）的可能性就會降低，因為模型更多地依賴於高機率輸出，而不是探索可能性較低的可能性。"}, {"id": 140, "question": "一家公司正在Amazon Bedrock上使用大型語言模型（LLM）來構建聊天機器人。聊天機器人處理客戶支援請求。為了解決請求，客戶和聊天機器人必須進行幾次互動。哪種解決方案使LLM 能夠使用以前客戶資訊中的內容？", "options": {"A": "開啟模型呼叫日誌記錄來收集訊息。", "B": "向模型提示新增訊息。", "C": "使用亞馬遜個性化 (Amazon Personalize)儲存對話歷史。", "D": "使用為LLM 提供的吞吐量。"}, "correct_answer": "B", "explanation": "為了使大型語言模型（LLM）能夠在對話中使用以前客戶訊息中的內容，以前的訊息必須包含在模型提示中。這種技術被稱為提示工程，它允許LLM 透過在提示中加入互動歷史來保留上下文。透過將之前的交流新增到提示中，該模型可以在整個多回合對話中生成上下文相關且連貫的響應。"}, {"id": 141, "question": "當客戶致電客戶服務中心時，公司員工會向客戶提供產品說明和推薦。這些建議基於客戶所在的位置。該公司希望使用基礎模型（FMs）來自動化這一過程。哪項AWS 服務符合這些要求？", "options": {"A": "亞馬遜Macie", "B": "亞馬遜轉錄 (Amazon Transcribe)", "C": "Amazon Bedrock", "D": "亞馬遜文字摘要"}, "correct_answer": "C", "explanation": "Amazon Bedrock使公司能夠使用基礎模型（FMs）來構建和自動化生成產品描述和推薦等任務。它允許將預先訓練的FMs 整合到應用程式中，而無需管理基礎架構，使其成為自動化客戶服務任務的理想選擇。藉助Amazon Bedrock，該公司可以利用FMs 根據客戶位置生成量身定製的建議，從而實現動態高效的客戶互動。"}, {"id": 142, "question": "一家公司希望將客戶服務電子郵件上傳到亞馬遜S3，以開發一個商業分析應用程式。這些訊息有時包含敏感資料。該公司希望每次發現敏感資訊時都能收到警報。哪種解決方案以最少的開發工作量完全自動化了敏感資訊檢測流程？", "options": {"A": "配置Amazon Macie 以檢測上傳到亞馬遜S3 的文件中的敏感資訊。", "B": "使用Amazon SageMaker 端點部署大型語言模型（LLM）來編輯敏感資料。", "C": "開發多個正規表示式模式來檢測敏感資料。在Amazon SageMaker 筆記本上公開正規表示式模式。", "D": "要求客戶避免在電子郵件中分享敏感資訊。"}, "correct_answer": "A", "explanation": "Amazon Macie 是一項全面管理的資料安全和隱私服務，使用機器學習來發現和保護亞馬遜S3 的敏感資料。它可以自動檢測敏感資訊，如個人身份資訊（PII）或財務資料，並在發現此類資料時傳送警報。這種方法最大限度地減少了開發工作，因為它不需要定製的正規表示式模式或模型開發，並且它是專門為處理所描述的場景而設計的。"}, {"id": 145, "question": "使用亞馬遜SageMaker 模型卡記錄AI 模型的好處是什麼？", "options": {"A": "為模式的功能提供了一個視覺上吸引人的摘要。", "B": "標準化關於模型的目的、效能和限制的資訊。", "C": "降低模型的總體計算要求。", "D": "出於存檔目的物理儲存模型。"}, "correct_answer": "B", "explanation": "Amazon SageMaker 模型卡提供了一種結構化的方法來記錄關於AI 模型的關鍵細節，包括它們的預期用途、效能指標和限制。這有助於組織在AI 模型開發中保持透明度、合規性和治理 (Governance)，從而更容易隨著時間的推移跟蹤和管理模型。"}, {"id": 146, "question": "F1 分數在基礎模型(FM)績效方面衡量什麼？", "options": {"A": "模型精度和召回率", "B": "生成響應的模型速度", "C": "運營模型的財務成本", "D": "模型計算的能量效率"}, "correct_answer": "A", "explanation": "F1 分數是一種用於評估分類模型效能的指標，它同時考慮了精確度(所有預測陽性中正確預測陽性案例的比例)和召回率(所有實際陽性中正確預測陽性案例的比例)。這是精度和召回率的調和平均值，確保它們之間的平衡，尤其是在處理不平衡資料集時。"}, {"id": 147, "question": "一家公司部署了AI/ML 解決方案來幫助客戶服務代理回答常見問題。問題會隨著時間的推移而變化。該公司希望為客戶服務代理提供提問和接收自動生成的常見客戶問題答案的能力。哪種策略最經濟高效地滿足這些要求？", "options": {"A": "定期微調模型。", "B": "使用上下文資料訓練模型。", "C": "使用上下文資料對模型進行預訓練和基準測試。", "D": "使用檢索增強生成(RAG)和提示工程技術。"}, "correct_answer": "D", "explanation": "檢索增強生成(RAG)是一種具有成本效益的方法，透過從外部知識來源檢索相關資訊來增強人工智慧生成的響應。RAG 不是對模型進行微調或重新訓練，而是在查詢時動態提取最新的相關資料。這在問題隨時間變化的情況下特別有用，確保AI/ML 解決方案提供準確和最新的響應，而不需要昂貴和耗時的模型再訓練。Prompt 工程技術進一步最佳化了模型處理和生成響應的方式，提高了準確性和相關性。"}, {"id": 148, "question": "一家公司建立了一個人工智慧簡歷篩選系統。該公司使用大型資料集來訓練模型。資料集包含的簡歷不能代表所有的人口統計資料。這個場景呈現了負責任的人工智慧的哪個核心維度？", "options": {"A": "公平", "B": "可解釋性", "C": "隱私和安全", "D": "透明度"}, "correct_answer": "A", "explanation": "該方案描述了一個不能代表所有人口統計資料的資料集，這可能會導致有偏差的模型預測。這與公平直接相關，公平是負責任的人工智慧的核心維度，確保人工智慧系統在不同的人口統計群體中做出公正和公平的決定。解決公平性涉及平衡資料集監管、偏差檢測和緩解策略等技術，以確保AI 系統不會歧視任何群體。"}, {"id": 149, "question": "一家全球金融公司開發了一個ML 應用程式來分析股票市場資料並提供股票市場趨勢。該公司希望持續監控應用程式開發階段，並確保遵守公司政策和行業法規。哪些AWS 服務將幫助公司評估合規性要求？(選兩個。)", "options": {"A": "AWS 審計經理 (AWS Audit Manager)", "B": "AWS 配置 (AWS Config)", "C": "亞馬遜檢查員 (Amazon Inspector)", "D": "亞馬遜雲觀察 (Amazon CloudWatch)", "E": "AWS 雲跡 (AWS CloudTrail)"}, "correct_answer": "AB", "explanation": "AWS Audit Manager 透過自動收集證據和生成稽核報告，幫助組織持續評估和稽核對行業法規和內部政策的遵從性。這對於確保ML 應用程式符合監管要求至關重要。AWS Config 透過跟蹤AWS 資源中的配置更改來實現持續的監控和合規性檢查。它有助於公司確保基礎設施設定符合安全政策和行業標準。"}, {"id": 150, "question": "一家公司希望提高生成式人工智慧應用程式響應的準確性。該應用程式在Amazon Bedrock上使用基礎模型(FM)。哪種解決方案最經濟高效地滿足了這些要求？", "options": {"A": "微調FM。", "B": "重新培訓FM。", "C": "訓練一個新的FM。", "D": "使用提示工程。"}, "correct_answer": "D", "explanation": "使用prompt engineering 是提高生成式人工智慧應用程式響應準確性的最具成本效益的方法，無需重新培訓或微調基礎模型(FM)。提示工程包括仔細設計輸入提示以引導模型產生更好的響應，提高相關性和準確性。"}, {"id": 151, "question": "一家公司希望透過使用ML 模型來識別社交媒體帖子的評論部分中的有害語言。該公司不會使用標記的資料來訓練模型。公司應該使用哪種策略來識別有害語言？", "options": {"A": "使用亞馬遜Rekognition moderation。", "B": "使用亞馬遜理解 (Amazon Comprehend)毒性檢測。", "C": "使用亞馬遜SageMaker 內建演算法來訓練模型。", "D": "使用亞馬遜Polly 監控評論。"}, "correct_answer": "B", "explanation": "Amazon understand 提供預訓練的NLP 模型，包括毒性檢測，以分析文字中的有害語言。由於該公司不打算使用已標記的資料進行訓練，亞馬遜理解 (Amazon Comprehend)是一個合適的選擇，因為它不需要定製訓練，可以自動檢測評論中的有毒或有害內容。"}, {"id": 152, "question": "一家媒體公司希望分析觀眾行為和人口統計資料，以推薦個性化內容。該公司希望在其生產環境中部署定製的ML 模型。該公司還想觀察模型質量是否會隨著時間的推移而漂移。哪個AWS 服務或功能符合這些要求？", "options": {"A": "亞馬遜認知 (Amazon Cognito)", "B": "亞馬遜SageMaker Clarify", "C": "亞馬遜理解 (Amazon Comprehend)", "D": "亞馬遜SageMaker 模型監視器"}, "correct_answer": "D", "explanation": "Amazon SageMaker Model Monitor 持續跟蹤生產中部署的ML 模型，以檢測資料漂移、模型漂移和質量下降。這對於確保推薦模型在觀眾行為和人口統計變化時保持準確是至關重要的。Model Monitor 有助於檢測異常情況，並在模型效能偏離預期趨勢時發出警報，使公司能夠採取糾正措施。"}, {"id": 153, "question": "一家公司正在使用AWS 服務部署AI/ML 模型。該公司希望為模型的決策過程提供透明度，併為模型輸出提供解釋。哪個AWS 服務或功能符合這些要求？", "options": {"A": "亞馬遜SageMaker 模型卡", "B": "亞馬遜認知 (Amazon Cognito)", "C": "亞馬遜理解 (Amazon Comprehend)", "D": "亞馬遜Lex"}, "correct_answer": "A", "explanation": "亞馬遜SageMaker 模型卡透過記錄關鍵細節，如模型目的、訓練資料、效能指標和限制，幫助提供AI/ML 模型的透明度。該文件使組織能夠解釋模型輸出和決策過程，確保責任和遵守負責任的人工智慧原則。"}, {"id": 154, "question": "一家制造公司希望建立多種語言的產品描述。哪個AWS 服務將自動完成這項任務？", "options": {"A": "亞馬遜翻譯 (Amazon Translate)", "B": "亞馬遜轉錄 (Amazon Transcribe)", "C": "亞馬遜肯德拉 (Amazon Kendra)", "D": "亞馬遜波利 (Amazon Polly)"}, "correct_answer": "A", "explanation": "亞馬遜翻譯 (Amazon Translate)是一項AWS 服務，使用神經機器翻譯(NMT)自動化語言翻譯。它使企業能夠快速準確地生成多種語言的產品描述，使其成為這項任務的最佳選擇。"}, {"id": 156, "question": "哪個AWS 特性記錄了用於治理 (Governance)和報告的ML 例項資料的詳細資訊？", "options": {"A": "亞馬遜SageMaker 模型卡", "B": "Amazon SageMaker 偵錯程式", "C": "亞馬遜SageMaker 模型監視器", "D": "亞馬遜SageMaker JumpStart"}, "correct_answer": "A", "explanation": "亞馬遜SageMaker 模型卡記錄了關於機器學習模型的關鍵細節，包括預期用途、訓練資料、評估指標和合規資訊。它們透過在模型資訊的整個生命週期中提供一種標準化的方法來記錄模型資訊，從而支援治理 (Governance)和報告。"}, {"id": 157, "question": "一家金融公司正在使用ML 來幫助完成公司的一些任務。哪個選項使用了生成式人工智慧模型？", "options": {"A": "總結客戶投訴", "B": "根據產品用途對客戶進行分類", "C": "根據投資型別對客戶進行細分", "D": "預測某些產品的收入"}, "correct_answer": "A", "explanation": "生成式人工智慧模型旨在生成新的內容，如文字、影象或音訊。總結客戶投訴包括生成較長文字的簡明版本，這是一項非常適合大型語言模型等生成式人工智慧模型的任務。"}, {"id": 158, "question": "一家醫療公司希望開發一種可以訪問結構化患者記錄、提取相關資訊並生成簡明摘要的AI 應用程式。哪種解決方案能夠滿足這些要求？", "options": {"A": "使用Amazon understand Medical 提取相關的醫療實體和關係。將基於規則的邏輯應用於摘要的結構和格式。", "B": "使用Amazon Personalize 分析患者參與模式。將輸出與通用文字摘要工具整合。", "C": "使用Amazon Textract 將掃描文件轉換為數字文字。設計一個關鍵詞提取系統來生成摘要。", "D": "實現Amazon Kendra，為醫療記錄提供可搜尋的索引。使用基於模板的系統來格式化摘要。"}, "correct_answer": "A", "explanation": "Amazon understand Medical 專門用於從非結構化文字中提取結構化醫療資訊(如藥物、病情、測試結果)。透過隨後應用基於規則的邏輯，可以將相關資料格式化為簡明的摘要，滿足提取和摘要的需要。"}, {"id": 159, "question": "哪個選項描述了人工智慧環境中的嵌入？", "options": {"A": "一種壓縮大資料集的方法", "B": "一種保護敏感資料的加密方法", "C": "一種視覺化高維資料的方法", "D": "降維空間中資料表示的數值方法"}, "correct_answer": "D", "explanation": "嵌入是在低維向量空間中資料的數字表示，如單詞、影象或專案。它們捕獲資料中的語義關係和模式，使模型能夠有效地處理和比較輸入。"}, {"id": 160, "question": "一家公司正在構建一個人工智慧應用程式，以彙總不同長度的書籍。在測試過程中，應用程式無法總結一些書籍。為什麼應用程式無法對一些書籍進行總結？", "options": {"A": "溫度設定得太高。", "B": "所選模型不支援微調。", "C": "頂P 值太高。", "D": "輸入標記超過了模型的上下文大小。"}, "correct_answer": "D", "explanation": "語言模型有一個最大上下文大小，這限制了它們一次可以處理的輸入標記的數量。如果一本書的長度超過這個限制，模型就不能處理全部輸入，導致摘要失敗。"}, {"id": 161, "question": "一家航空公司希望開發一種對話式人工智慧助手，來回答客戶關於航班時刻表、預訂和支付的問題。該公司希望使用大型語言模型(LLM)和知識庫來建立基於文字的聊天機器人介面。哪種解決方案能夠以最少的開發工作量滿足這些要求？", "options": {"A": "亞馬遜SageMaker 自動駕駛儀上的火車模型。", "B": "使用Amazon Bedrock開發一個檢索增強生成(RAG)代理。", "C": "使用Amazon Q Developer 建立一個Python 應用程式。", "D": "微調亞馬遜SageMaker Jumpstart 上的模型。"}, "correct_answer": "B", "explanation": "Amazon Bedrock允許使用RAG 架構將大型語言模型與知識庫快速整合，從而實現基於最新資訊的準確和動態響應。這種方法需要最少的開發工作，同時利用強大的生成功能。"}, {"id": 162, "question": "標記化在自然語言處理(NLP)中有什麼用？", "options": {"A": "加密文字資料", "B": "壓縮文字檔案", "C": "將文字分成更小的單元進行處理", "D": "在不同語言之間翻譯文字"}, "correct_answer": "C", "explanation": "標記化是將文字劃分成更小單元的過程，例如單詞、子單詞或字元，然後可以由NLP 模型進行分析或處理。這是為機器學習準備文字資料的基礎步驟。"}, {"id": 163, "question": "哪個選項是基於轉換器的語言模型的特徵？", "options": {"A": "基於Transformer 的語言模型使用卷積層對輸入進行過濾，透過過濾後的檢視捕獲區域性模式。", "B": "基於轉換器的語言模型只能處理文字資料。", "C": "基於轉換器的語言模型使用自我關注機制來捕捉上下文關係。", "D": "基於轉換器的語言模型在迴圈迭代中一次一個元素地處理資料序列。"}, "correct_answer": "C", "explanation": "transformer 模型的一個關鍵特徵是使用了自我關注機制，該機制允許模型衡量序列中不同單詞相對於彼此的重要性，從而能夠深入理解整個輸入的上下文和含義。"}, {"id": 164, "question": "一家金融公司正在使用人工智慧系統獲取客戶信用評分，作為貸款申請流程的一部分。該公司希望在不同的地理區域拓展新市場。該公司必須確保能夠在該地理區域內運營。公司應該審查哪些合規法律？", "options": {"A": "當地健康資料保護法", "B": "當地支付卡資料保護法", "C": "當地教育隱私法", "D": "區域性演算法責任法"}, "correct_answer": "D", "explanation": "在部署影響個人的人工智慧系統(如信用評分)時，公司必須遵守當地的演算法問責法律。這些法律規範了自動化決策的公平性、透明度和影響，確保人工智慧在新地理區域的道德使用。"}, {"id": 165, "question": "一家公司將Amazon Bedrock用於其生成式人工智慧應用程式。該公司希望使用Amazon Bedrock護欄 (Guardrails for Amazon Bedrock)來檢測和過濾有害的使用者輸入和模型生成的輸出。護欄可以過濾哪些內容類別？(選兩個。)", "options": {"A": "討厭", "B": "政治", "C": "暴力", "D": "投機", "E": "宗教"}, "correct_answer": "AC", "explanation": "Amazon Bedrock護欄 (Guardrails for Amazon Bedrock)提供可配置的內容過濾器，以檢測和阻止生成式人工智慧應用程式中的有害內容。具體來說，它們包括針對仇恨和暴力等類別的過濾器。這些過濾器可以應用於使用者輸入和模型生成的輸出，以確保AI 應用程式遵守負責任的AI 實踐和組織策略。"}, {"id": 166, "question": "哪種情況描述了生成式人工智慧模型中提示工程的潛在風險和侷限性？", "options": {"A": "提示工程不能確保模型總是產生一致的和確定的輸出，從而消除了驗證的需要。", "B": "提示工程可能會使模型暴露於漏洞，如即時注入攻擊。", "C": "正確設計的提示會降低但不會消除資料中毒或模型劫持的風險。", "D": "Prompt engineering 不能確保模型在處理真實資料時始終生成高度可靠的輸出。"}, "correct_answer": "B", "explanation": "提示工程中的一個關鍵風險是提示注入，攻擊者操縱輸入提示來改變模型的行為或產生非預期的輸出。該漏洞源於模型對輸入結構和內容的敏感性，這使得它成為安全提示設計中的一個關鍵限制。"}, {"id": 167, "question": "一家出版公司構建了一個基於檢索增強生成(RAG)的解決方案，使其使用者能夠與釋出的內容進行互動。每天都有新內容釋出。該公司希望為使用者提供近乎實時的體驗。公司應該透過使用離線批處理來實現RAG 管道中的哪些步驟，以滿足這些要求？(選兩個。)", "options": {"A": "內容嵌入的生成", "B": "為使用者查詢生成嵌入", "C": "搜尋索引的建立", "D": "相關內容的檢索", "E": "為使用者生成響應"}, "correct_answer": "A", "explanation": "在RAG 管道中，生成內容嵌入和建立搜尋索引可以在批處理中離線完成，因為它們涉及靜態釋出的內容。這使得系統能夠定期更新，而不影響實時使用者互動。另一方面，使用者查詢和響應生成必須實時進行。"}, {"id": 168, "question": "哪種技術將一個複雜的任務分解成更小的子任務，然後按順序傳送給大型語言模型(LLM)？", "options": {"A": "一次性提示", "B": "提示連結", "C": "思想之樹", "D": "檢索擴充生成"}, "correct_answer": "B", "explanation": "提示連結包括將一個複雜的任務分解成更小的、可管理的子任務，然後將它們依次傳遞給一個大型語言模型。每一步都建立在前一步的基礎上，支援更結構化的推理和改進的任務執行。"}, {"id": 169, "question": "一個AI 從業者需要提高自然語言生成模型的準確性。該模型使用快速變化的庫存資料。哪種技術將提高模型的準確性？", "options": {"A": "遷移學習", "B": "聯合學習", "C": "檢索擴充生成", "D": "一次性提示"}, "correct_answer": "C", "explanation": "RAG 透過在推理時獲取最新的特定領域資料(例如，當前庫存)並根據這些事實調整生成，確保輸出反映最新資訊並提高準確性，而無需重新訓練核心模型，從而增強了語言模型。"}, {"id": 170, "question": "一家公司希望與幾家研究機構合作開發一種人工智慧模型。公司需要模型版本跟蹤的標準化文件和模型開發的記錄。哪種解決方案符合這些要求？", "options": {"A": "使用Git 跟蹤模型變更。", "B": "使用亞馬遜欺詐檢測器 (Amazon Fraud Detector)跟蹤模型變化。", "C": "使用Amazon SageMaker 型號卡跟蹤型號變化。", "D": "使用Amazon understand 跟蹤模型變化。"}, "correct_answer": "C", "explanation": "SageMaker 模型卡為每個模型迭代提供了一個用於捕獲和版本化關鍵後設資料的內建框架，例如訓練資料細節、效能度量、血統和預期用途。這種標準化的文件和開發歷史滿足了模型版本跟蹤和可審計記錄的需求。"}, {"id": 171, "question": "一個使用多個ML 模型的公司想要識別原始模型質量的變化，以便公司可以解決任何問題。哪個AWS 服務或功能符合這些要求？", "options": {"A": "亞馬遜SageMaker JumpStart", "B": "亞馬遜SageMaker 超級腳墊 (Amazon SageMaker HyperPod)", "C": "亞馬遜SageMaker 資料辯論者 (Amazon SageMaker Data Wrangler)", "D": "亞馬遜SageMaker 模型監視器"}, "correct_answer": "D", "explanation": "SageMaker Model Monitor 持續測量生產中的資料和預測質量，檢測與模型基線的偏差(如資料漂移或精度下降)，並向您發出警報，以便您可以及時調查和解決問題。"}, {"id": 172, "question": "在檢索增強生成(RAG)中，組塊的目的是什麼？", "options": {"A": "透過儲存部分或大塊文字來避免大型文字文件的資料庫儲存限制", "B": "透過避免將大文字轉換成向量嵌入來提高效率", "C": "為了提高從向量索引中檢索的結果的上下文相關性", "D": "透過儲存部分或大塊文字來降低儲存成本"}, "correct_answer": "C", "explanation": "透過將大文件分割成更小的、語義一致的塊，檢索系統可以針對給定查詢僅匹配並返回最上下文相關的片段，從而提高生成的響應的精確度和準確性。"}, {"id": 173, "question": "一家公司正在開發使用生成式人工智慧的編輯助手應用程式。在試驗階段，使用率很低，應用程式效能不是問題。該公司無法預測應用程式完全部署後的使用情況，並希望最大限度地降低應用程式成本。哪種解決方案能夠滿足這些要求？", "options": {"A": "使用GPU 支援的Amazon EC2 例項。", "B": "使用具有調配吞吐量的Amazon Bedrock。", "C": "使用按需吞吐量的Amazon Bedrock。", "D": "使用亞馬遜SageMaker JumpStart。"}, "correct_answer": "C", "explanation": "Bedrock中的按需吞吐量只對您實際進行的推理呼叫收費，沒有前期容量承諾。這使您可以從最少的飛行員使用開始，靈活地處理不可預測的未來負載，同時保持儘可能低的成本。"}, {"id": 174, "question": "一家公司在Amazon Bedrock上部署了一個檢索增強生成(RAG)應用程式，用於收集金融新聞並在每日新聞通訊中釋出。使用者最近在時事通訊中報告了受政治影響的觀點。哪個Amazon Bedrock護欄 (Guardrails for Amazon Bedrock)可以識別過濾這個內容？", "options": {"A": "單詞過濾器", "B": "拒絕的主題", "C": "敏感資訊過濾器", "D": "內容過濾器"}, "correct_answer": "B", "explanation": "“拒絕的主題”護欄允許您定義模型必須避免的高階類別(如政治)。Bedrock在生成過程中執行這些規則，過濾掉任何與受政治影響的想法相關的內容。"}, {"id": 175, "question": "一家金融公司正在開發一種欺詐檢測系統，該系統可以標記信用卡交易中的潛在欺詐案例。員工將評估標記的欺詐案例。該公司希望最大限度地減少員工花在審查實際上並非欺詐的已標記欺詐案例上的時間。哪個評估指標符合這些要求？", "options": {"A": "回憶", "B": "準確(性)", "C": "精確", "D": "電梯圖表"}, "correct_answer": "C", "explanation": "Precision 衡量被標記為真正欺詐的案例的比例(TP / [TP + FP])。最大限度地提高精確度減少了員工必須審查的誤報數量，從而減少了在非欺詐案件上浪費的精力。"}, {"id": 176, "question": "一家公司設計了一個人工智慧代理，根據產品手冊回答客戶的詢問。哪種策略可以提高客戶對人工智慧代理響應的信心水平？", "options": {"A": "在回答中寫下置信度", "B": "在回覆中包含引用的產品手冊連結", "C": "設計一個看起來像電腦的代理化身", "D": "培訓代理以公司的語言風格做出回應"}, "correct_answer": "B", "explanation": "提供支援每個答案的產品手冊的確切部分的直接連結，讓客戶驗證和信任資訊，增強對人工智慧代理的響應的信心。"}, {"id": 177, "question": "一家醫院開發了一個人工智慧系統，為患者提供個性化的治療建議。人工智慧系統必須提供建議背後的基本原理，並使醫生和患者能夠獲得這些見解。這個場景體現了哪種以人為中心的設計原則？", "options": {"A": "可解釋性", "B": "隱私和安全", "C": "公平", "D": "資料治理 (Governance)"}, "correct_answer": "A", "explanation": "可解釋性確保人工智慧系統以一種可理解的方式揭示其建議背後的推理，使見解對醫生和患者都是透明和可訪問的。"}, {"id": 178, "question": "下列哪項陳述說明了使用檢索增強生成(RAG)進行自然語言處理(NLP)任務的優勢？", "options": {"A": "RAG 可以使用外部知識源來生成更準確、更豐富的響應。", "B": "RAG 旨在提高語言模型訓練的速度。", "C": "RAG 主要用於語音識別任務。", "D": "RAG 是一種用於計算機視覺任務中的資料擴充的技術。"}, "correct_answer": "A", "explanation": "透過在推理時檢索相關文件或資料，並根據外部知識調整生成，RAG 用最新的特定領域資訊豐富了模型輸出，提高了準確性和資訊量，而無需重新訓練核心模型。"}, {"id": 179, "question": "一家公司透過微調Amazon Bedrock的現有大型語言模型(LLM)建立了一個定製模型。該公司希望將該模型部署到生產中，並使用該模型來處理每分鐘穩定的請求率。哪種解決方案最經濟高效地滿足了這些要求？", "options": {"A": "透過使用Amazon EC2 計算最佳化例項來部署模型。", "B": "在Amazon Bedrock上使用按需吞吐量模型。", "C": "將模型儲存在亞馬遜S3 中，並使用AWS Lambda 託管模型。", "D": "在Amazon Bedrock上購買該模型的供應吞吐量。"}, "correct_answer": "D", "explanation": "當您有一個可預測的、穩定的呼叫量時，每個請求的調配吞吐量價格較低。透過承諾固定的吞吐量水平，您可以以比按需更低的單位成本獲得必要的容量，使其成為穩定使用的最具成本效益的選擇。"}, {"id":
